<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Spielesammlung</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    background: radial-gradient(ellipse at top, #2a1a5e 0%, #0a0a2e 60%) fixed, #0a0a2e;
    color: #fff;
    font-family: system-ui, -apple-system, sans-serif;
    padding: max(32px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
  }
  h1 {
    text-align: center;
    font-size: clamp(2rem, 8vw, 3.5rem);
    letter-spacing: 0.02em;
    background: linear-gradient(90deg, #ffd34d, #ff6bb5, #6bd5ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub { text-align: center; opacity: 0.7; margin: 8px 0 32px; }
  .games {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    max-width: 960px;
    margin: 0 auto;
  }
  a.game {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 28px 20px;
    border-radius: 20px;
    color: #fff;
    text-decoration: none;
    background: var(--bg);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  a.game:hover, a.game:focus-visible {
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 14px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    outline: none;
  }
  a.game:active { transform: scale(0.97); }
  .icon { font-size: 4rem; line-height: 1; margin-bottom: 14px; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.4)); }
  .name { font-size: 1.5rem; font-weight: 800; }
  .desc { margin-top: 6px; opacity: 0.85; font-size: 0.95rem; }
  .fussball  { --bg: linear-gradient(160deg, #2e9e48, #135e26); }
  .cosmic    { --bg: linear-gradient(160deg, #5b3bd6, #1d1063); }
  .abenteuer { --bg: linear-gradient(160deg, #d6633b, #6e1d3a); }
  .flug      { --bg: linear-gradient(160deg, #3b9ad6, #1f4fd1); }
</style>
</head>
<body>
  <h1>Unsere Spiele</h1>
  <p class="sub">Such dir ein Spiel aus!</p>
  <main class="games">
    <a class="game fussball" href="fussball.html">
      <div class="icon">⚽</div>
      <div class="name">Kick it!</div>
      <div class="desc">Fußball mit deinem Lieblingsverein</div>
    </a>
    <a class="game cosmic" href="cosmic-breaker.html">
      <div class="icon">🚀</div>
      <div class="name">Cosmic Breaker</div>
      <div class="desc">Zerschlag alle Steine im Weltall</div>
    </a>
    <a class="game abenteuer" href="abenteuer.html">
      <div class="icon">🎁</div>
      <div class="name">Das Geheimnis der Geburtstagsparty</div>
      <div class="desc">Ein Abenteuer zum Rätseln</div>
    </a>
    <a class="game flug" href="flugsimulator.html">
      <div class="icon">✈️</div>
      <div class="name">A380 Flugsimulator</div>
      <div class="desc">Flieg mit Henrik Airlines um die Welt</div>
    </a>
  </main>
</body>
</html>
