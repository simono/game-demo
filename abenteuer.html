// --- Helper functions ---
function getCurName() { return characters[selectedChar].name; }

function removeItem(id) {
    const idx = inventory.indexOf(id);
    if (idx >= 0) inventory.splice(idx, 1);
}

function showDialog(speaker, text, callback) {
    state = State.DIALOG;
    dialogSpeaker = speaker;
    dialogLines = wrapText(text, 60);
    dialogIdx = 0;
    dialogCallback = callback || null;
}

function wrapText(text, maxLen) {
    // Wrap based on pixel width using the current dialog font
    const f = FS();
    ctx.font = `${15 * f}px system-ui, -apple-system, sans-serif`;
    const maxW = W() - 50 * f; // dialog box inner width
    const words = text.split(' ');
    const lines = [];
    let line = '';
    for (const w of words) {
        const test = (line + ' ' + w).trim();
        if (ctx.measureText(test).width > maxW && line) {
            lines.push(line.trim());
            line = w;
        } else {
            line = test;
        }
    }
    if (line) lines.push(line);
    return lines;
}

function floatText(text, x, y, color) {
    floatingTexts.push({ text, x, y, color, life: 180 });
}

function getSpeakerColor(name) {
    const ch = characters.find(c => c.name === name);
    if (ch) return ch.color;
    if (name === 'Opa Günther') return '#c0c0c0';
    return '#ffffff';
}

// --- Drawing functions ---
function drawPixelChar(x, y, scale, color, hair) {
    const s = scale;
    // Body
    ctx.fillStyle = color;
    ctx.fillRect(x - 6*s, y - 20*s, 12*s, 20*s);
    // Head
    ctx.fillStyle = '#ffcc99';
    ctx.fillRect(x - 5*s, y - 32*s, 10*s, 12*s);
    // Hair
    ctx.fillStyle = hair;
    ctx.fillRect(x - 6*s, y - 35*s, 12*s, 5*s);
    // Eyes
    ctx.fillStyle = '#000';
    ctx.fillRect(x - 3*s, y - 28*s, 2*s, 2*s);
    ctx.fillRect(x + 1*s, y - 28*s, 2*s, 2*s);
    // Legs
    ctx.fillStyle = '#333';
    ctx.fillRect(x - 5*s, y, 4*s, 8*s);
    ctx.fillRect(x + 1*s, y, 4*s, 8*s);
}

function drawRoom() {
    const room = rooms[currentRoom];
    const s = S();
    const f = FS();

    // Sky / bg
    const grad = ctx.createLinearGradient(0, 0, 0, H());
    grad.addColorStop(0, room.bg);
    grad.addColorStop(1, room.floor);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W(), H());

    // Floor line
    const floorY = H() * 0.72;
    ctx.fillStyle = room.floor;
    ctx.fillRect(0, floorY, W(), H() - floorY);
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, floorY);
    ctx.lineTo(W(), floorY);
    ctx.stroke();

    // Room name
    ctx.font = `bold ${16 * f}px system-ui, -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.9)';
    ctx.shadowBlur = 6;
    ctx.fillStyle = '#fff';
    ctx.fillText(`📍 ${room.name}`, W() / 2, 25 * f);
    ctx.shadowBlur = 0;

    // Draw room-specific decorations
    drawRoomDecor(room);

    // Draw objects
    for (const obj of room.objects) {
        drawObject(obj, s);
    }

    // Draw exits
    drawExits(room, s);

    // Draw active character
    const ch = characters[selectedChar];
    const cy = floorY - 8 * s;
    drawPixelChar(charX, cy, s * 2.5, ch.color, ch.hair);

    // Character name
    ctx.shadowColor = 'rgba(0,0,0,0.9)';
    ctx.shadowBlur = 6;
    ctx.fillStyle = ch.color;
    ctx.font = `bold ${14 * f}px system-ui, -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(ch.name, charX, cy + 24 * s);
    ctx.shadowBlur = 0;

    // Draw description bar — word-wrap into 1-2 lines
    const descFs = Math.min(13 * f, W() / 32);
    ctx.font = `${descFs}px system-ui, -apple-system, sans-serif`;
    const descMaxW = W() * 0.78;
    const descWords = room.description.split(' ');
    const descLines = [];
    let descLine = '';
    for (const dw of descWords) {
        const test = (descLine + ' ' + dw).trim();
        if (ctx.measureText(test).width > descMaxW && descLine) {
            descLines.push(descLine.trim());
            descLine = dw;
        } else {
            descLine = test;
        }
    }
    if (descLine) descLines.push(descLine.trim());
    const lineH = descFs * 1.3;
    const barH = Math.max(40 * f, descLines.length * lineH + 12 * f);
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(0, H() - barH, W(), barH);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, H() - barH);
    ctx.lineTo(W(), H() - barH);
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = `${descFs}px system-ui, -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    const descTopY = H() - barH / 2 - (descLines.length - 1) * lineH / 2;
    for (let dl = 0; dl < descLines.length; dl++) {
        ctx.fillText(descLines[dl], W() / 2, descTopY + dl * lineH + descFs * 0.35);
    }

    // Character selector
    drawCharSelector(f);

    // Inventory button
    drawInventoryButton(f);

    // Secrets counter
    ctx.shadowColor = 'rgba(0,0,0,0.9)';
    ctx.shadowBlur = 6;
    ctx.fillStyle = '#FFD700';
    ctx.font = `bold ${14 * f}px system-ui, -apple-system, sans-serif`;
    ctx.textAlign = 'right';
    ctx.fillText(`${discoveredSecrets.length}/5 ⭐`, W() - 10 * f, 25 * f);
    ctx.shadowBlur = 0;
}

function drawRoomDecor(room) {
    const s = S();
    const t = animTime;

    if (currentRoom === 'wohnzimmer') {
        // Balloons
        for (let i = 0; i < 8; i++) {
            const bx = 100 * s + i * 80 * s;
            const by = 80 * s + Math.sin(t * 0.03 + i) * 10 * s;
            const colors = ['#ff4444', '#44ff44', '#4444ff', '#ffff44', '#ff44ff', '#44ffff', '#ff8844', '#88ff44'];
            ctx.fillStyle = colors[i % colors.length];
            ctx.beginPath();
            ctx.ellipse(bx, by, 15 * s, 20 * s, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(bx, by + 20 * s);
            ctx.lineTo(bx + Math.sin(t * 0.05 + i) * 5, by + 50 * s);
            ctx.stroke();
        }
    } else if (currentRoom === 'kueche') {
        // Shelves
        for (let i = 0; i < 3; i++) {
            ctx.fillStyle = '#5a3d2e';
            ctx.fillRect(250 * s, (140 + i * 80) * s, 220 * s, 8 * s);
        }
    } else if (currentRoom === 'garten') {
        // Stars
        for (let i = 0; i < 30; i++) {
            const sx = (i * 137.5) % W();
            const sy = (i * 73.1) % (H() * 0.5);
            const bright = 0.3 + 0.7 * Math.abs(Math.sin(t * 0.02 + i));
            ctx.fillStyle = `rgba(255,255,255,${bright})`;
            ctx.fillRect(sx, sy, 2, 2);
        }
        // Lights string
        for (let i = 0; i < 12; i++) {
            const lx = 80 * s + i * 55 * s;
            const ly = 70 * s + Math.sin(i * 0.8) * 10 * s;
            const lcolors = ['#ffee44', '#ff4444', '#44ff44', '#4488ff'];
            ctx.fillStyle = lcolors[i % 4];
            ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 0.05 + i);
            ctx.beginPath();
            ctx.arc(lx, ly, 5 * s, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    } else if (currentRoom === 'flur') {
        // Wallpaper pattern
        for (let i = 0; i < 20; i++) {
            for (let j = 0; j < 8; j++) {
                ctx.fillStyle = 'rgba(255,255,255,0.03)';
                ctx.fillRect(i * 40 * s, j * 55 * s, 20 * s, 25 * s);
            }
        }
    }
}

function drawObject(obj, s) {
    const x = obj.x * s;
    const y = obj.y * s;
    const w = obj.w * s;
    const h = obj.h * s;
    const f = FS();

    // Object highlight — dark tint with bright border
    const pulse = 0.6 + 0.3 * Math.sin(animTime * 0.05 + obj.x);
    ctx.fillStyle = `rgba(255,255,200,0.08)`;
    ctx.strokeStyle = `rgba(255,255,100,${pulse})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 6);
    ctx.fill();
    ctx.stroke();

    // Object name with dark background pill
    ctx.font = `bold ${13 * f}px system-ui, -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    const nameW = ctx.measureText(obj.name).width + 12 * f;
    const nameX = x + w/2 - nameW/2;
    const nameY = y - 22 * f;
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.beginPath();
    ctx.roundRect(nameX, nameY, nameW, 20 * f, 4);
    ctx.fill();
    ctx.fillStyle = '#ffe066';
    ctx.fillText(obj.name, x + w/2, y - 7 * f);
}

function drawExits(room, s) {
    const f = FS();
    for (const [dir, target] of Object.entries(room.exits)) {
        const rn = rooms[target].name;
        let x, y, arrow;
        if (dir === 'links') { x = 25 * f; y = H() * 0.5; arrow = '◀'; }
        else if (dir === 'rechts') { x = W() - 25 * f; y = H() * 0.5; arrow = '▶'; }
        else if (dir === 'oben') { x = W() / 2; y = 50 * f; arrow = '▲'; }
        else if (dir === 'unten') { x = W() / 2; y = H() * 0.68; arrow = '▼'; }
        else continue;

        const pulse = 0.7 + 0.3 * Math.sin(animTime * 0.06);
        ctx.shadowColor = 'rgba(0,0,0,0.9)';
        ctx.shadowBlur = 8;
        ctx.fillStyle = `rgba(255,255,100,${pulse})`;
        ctx.font = `bold ${22 * f}px system-ui, -apple-system, sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(arrow, x, y);
        ctx.font = `bold ${12 * f}px system-ui, -apple-system, sans-serif`;
        ctx.fillStyle = '#fff';
        ctx.fillText(`→ ${rn}`, x, y + 20 * f);
        ctx.shadowBlur = 0;
    }
}

function drawCharSelector(f) {
    const startX = 8 * f;
    const startY = 42 * f;
    for (let i = 0; i < 4; i++) {
        const ch = characters[i];
        const y = startY + i * 28 * f;
        const isActive = i === selectedChar;
        ctx.fillStyle = isActive ? 'rgba(0,0,0,0.7)' : 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.roundRect(startX, y, 90 * f, 24 * f, 6);
        ctx.fill();
        ctx.strokeStyle = isActive ? ch.color : 'rgba(255,255,255,0.2)';
        ctx.lineWidth = isActive ? 2 : 1;
        ctx.stroke();
        ctx.fillStyle = isActive ? '#fff' : ch.color;
        ctx.font = `bold ${12 * f}px system-ui, -apple-system, sans-serif`;
        ctx.textAlign = 'left';
        ctx.fillText(`${ch.emoji} ${ch.name}`, startX + 6 * f, y + 17 * f);
    }
}

function drawInventoryButton(f) {
    const bw = 55 * f;
    const bx = W() - bw - 8 * f;
    const by = 8 * f;
    ctx.fillStyle = inventory.length > 0 ? 'rgba(20,80,40,0.8)' : 'rgba(30,30,30,0.7)';
    ctx.beginPath();
    ctx.roundRect(bx, by, bw, 24 * f, 6);
    ctx.fill();
    ctx.strokeStyle = inventory.length > 0 ? '#50c878' : '#666';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${12 * f}px system-ui, -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(`🎒 ${inventory.length}`, bx + bw / 2, by + 17 * f);
}

function drawInventoryScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(0, 0, W(), H());

    const f = FS();
    ctx.fillStyle = '#FFD700';
    ctx.font = `bold ${22 * f}px system-ui, -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('🎒 Inventar', W()/2, 45 * f);

    const itemNames = {
        'gabel': '🍴 Spitze Kuchengabel',
        'fernbedienung': '📺 Mysteriöse Fernbedienung',
        'katzenpass': '🐱 Katzenpass (Herr Schnurrbert)',
        'tagebuch': '📖 Papas geheimes Tagebuch'
    };

    if (inventory.length === 0) {
        ctx.fillStyle = '#888';
        ctx.font = `${15 * f}px system-ui, -apple-system, sans-serif`;
        ctx.fillText('Nichts im Inventar.', W()/2, H()/2);
    } else {
        for (let i = 0; i < inventory.length; i++) {
            const y = 80 * f + i * 40 * f;
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.beginPath();
            ctx.roundRect(20 * f, y, W() - 40 * f, 32 * f, 5);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = `${14 * f}px system-ui, -apple-system, sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText(itemNames[inventory[i]] || inventory[i], W()/2, y + 22 * f);
        }
    }

    ctx.fillStyle = '#aaa';
    ctx.font = `${13 * f}px system-ui, -apple-system, sans-serif`;
    ctx.fillText('[ Tippen zum Schließen ]', W()/2, H() - 30 * f);
}

function drawDialog() {
    const f = FS();

    // Dim background
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W(), H());

    // Dialog box
    const bh = 120 * f;
    const by = H() - bh - 10 * f;
    ctx.fillStyle = 'rgba(5,5,30,0.97)';
    ctx.beginPath();
    ctx.roundRect(10 * f, by, W() - 20 * f, bh, 10);
    ctx.fill();
    ctx.strokeStyle = getSpeakerColor(dialogSpeaker);
    ctx.lineWidth = 3;
    ctx.stroke();

    // Speaker name
    ctx.fillStyle = getSpeakerColor(dialogSpeaker);
    ctx.font = `bold ${17 * f}px system-ui, -apple-system, sans-serif`;
    ctx.textAlign = 'left';
    ctx.fillText(dialogSpeaker, 20 * f, by + 25 * f);

    // Separator line
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(20 * f, by + 32 * f);
    ctx.lineTo(W() - 30 * f, by + 32 * f);
    ctx.stroke();

    // Text
    ctx.fillStyle = '#fff';
    ctx.font = `${15 * f}px system-ui, -apple-system, sans-serif`;
    for (let i = 0; i < dialogLines.length; i++) {
        ctx.fillText(dialogLines[i], 20 * f, by + 50 * f + i * 20 * f);
    }

    // Continue hint
    const blink = Math.sin(animTime * 0.1) > 0;
    if (blink) {
        ctx.fillStyle = '#aaa';
        ctx.font = `bold ${11 * f}px system-ui, -apple-system, sans-serif`;
        ctx.textAlign = 'right';
        ctx.fillText('▶ Weiter', W() - 20 * f, by + bh - 10 * f);
    }
}

function drawMenu() {
    const s = FS();
    menuPulse += 0.03;

    // Background
    const grad = ctx.createLinearGradient(0, 0, 0, H());
    grad.addColorStop(0, '#1a0a2e');
    grad.addColorStop(0.5, '#2d1b4e');
    grad.addColorStop(1, '#0a2e1b');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W(), H());

    // Floating party items
    const emojis = ['🎈', '🎂', '🎉', '🎊', '🎁', '🎵', '🍰', '🧁'];
    for (let i = 0; i < emojis.length; i++) {
        const x = (i * 97 + animTime * 0.5) % (W() + 50) - 25;
        const y = 50 + (i * 73) % (H() * 0.6) + Math.sin(animTime * 0.02 + i) * 20;
        ctx.globalAlpha = 0.3;
        ctx.font = `${30 * s}px serif`;
        ctx.textAlign = 'center';
        ctx.fillText(emojis[i], x, y);
        ctx.globalAlpha = 1;
    }

    // Title — scale font to fit screen width
    const titleY = H() * 0.15;
    const titleSize = Math.min(28 * s, W() / 18);
    ctx.fillStyle = '#FFD700';
    ctx.font = `bold ${titleSize}px system-ui, -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('Das Geheimnis der', W()/2, titleY);
    ctx.fillText('Geburtstagsparty', W()/2, titleY + titleSize * 1.3);

    // Subtitle
    ctx.fillStyle = '#aaa';
    ctx.font = `${Math.min(14 * s, W() / 30)}px system-ui, -apple-system, sans-serif`;
    ctx.fillText('Ein Point-and-Click Abenteuer', W()/2, titleY + titleSize * 2.8);

    // Characters — spread based on actual screen width
    const charY = H() * 0.52;
    const charSpacing = Math.min(W() / 5, 100 * s);
    for (let i = 0; i < 4; i++) {
        const ch = characters[i];
        const cx = W()/2 + (i - 1.5) * charSpacing;
        const bob = Math.sin(animTime * 0.04 + i * 1.5) * 5 * s;
        const charScale = Math.min(s * 3, charSpacing / 35);
        drawPixelChar(cx, charY + bob, charScale, ch.color, ch.hair);
        ctx.fillStyle = ch.color;
        ctx.font = `bold ${Math.min(12 * s, charSpacing / 7)}px system-ui, -apple-system, sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(ch.name, cx, charY + bob + 30 * s);
        ctx.fillStyle = '#888';
        ctx.font = `${Math.min(10 * s, charSpacing / 9)}px system-ui, -apple-system, sans-serif`;
        ctx.fillText(ch.trait, cx, charY + bob + 44 * s);
    }

    // Start button
    const btnPulse = 0.85 + 0.15 * Math.sin(menuPulse * 3);
    const btnW = Math.min(260 * s, W() * 0.7) * btnPulse;
    const btnH = 50 * s * btnPulse;
    const btnX = W()/2 - btnW/2;
    const btnY = H() * 0.78 - btnH/2;

    ctx.fillStyle = '#4a9eff';
    ctx.beginPath();
    ctx.roundRect(btnX, btnY, btnW, btnH, 10);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.min(18 * s, W() / 25)}px system-ui, -apple-system, sans-serif`;
    ctx.fillText('▶ Abenteuer starten!', W()/2, H() * 0.78 + 6 * s);

    // Instructions
    ctx.fillStyle = '#666';
    const instrSize = Math.min(11 * s, W() / 42);
    ctx.font = `${instrSize}px system-ui, -apple-system, sans-serif`;
    ctx.fillText('Klicke auf Objekte • Finde alle 5 Geheimnisse!', W()/2, H() * 0.92);
}

function drawEnding() {
    const s = FS();
    animTime++;

    const grad = ctx.createLinearGradient(0, 0, 0, H());
    grad.addColorStop(0, '#2d1b4e');
    grad.addColorStop(1, '#1a0a2e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W(), H());

    // Confetti
    for (let i = 0; i < 50; i++) {
        const x = (i * 67 + animTime * (1 + i % 3)) % W();
        const y = (i * 43 + animTime * (2 + i % 2)) % H();
        const colors = ['#ff4444', '#44ff44', '#4444ff', '#ffff44', '#ff44ff', '#FFD700'];
        ctx.fillStyle = colors[i % colors.length];
        ctx.globalAlpha = 0.7;
        ctx.fillRect(x, y, 6 * s, 6 * s);
    }
    ctx.globalAlpha = 1;

    const fs = Math.min(13 * s, W() / 35);

    ctx.fillStyle = '#FFD700';
    ctx.font = `bold ${Math.min(24 * s, W() / 18)}px system-ui, -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('ALLE GEHEIMNISSE ENTDECKT!', W()/2, H() * 0.10);

    const secrets = [
        'Opa Günther schläft in der Torte',
        'Papa hortet 47 Puddings im Kühlschrank',
        'Hinter dem Familienbild ist ein Safe',
        'Mama hat eine geheime Enten-Sammlung',
        'Papa war Boyband-Sänger "Sexy Stefan"'
    ];

    ctx.font = `${fs}px system-ui, -apple-system, sans-serif`;
    for (let i = 0; i < secrets.length; i++) {
        ctx.fillStyle = '#fff';
        ctx.fillText(secrets[i], W()/2, H() * 0.20 + i * 26 * s);
    }

    // Final scene
    ctx.fillStyle = '#4a9eff';
    ctx.font = `bold ${Math.min(15 * s, W() / 28)}px system-ui, -apple-system, sans-serif`;
    ctx.fillText('Die vier Freunde nach der Party:', W()/2, H() * 0.53);

    const epilogFs = Math.min(12 * s, W() / 38);
    ctx.font = `${epilogFs}px system-ui, -apple-system, sans-serif`;
    const epilog = [
        'Henrik: "Ab jetzt heißt Papa Sexy Stefan."',
        'Anna: "Wenn das die Nachbarn erfahren..."',
        'Jonas: "Herr Schnurrbert weiß alles."',
        'Emil: "Beste Geburtstagsparty aller Zeiten."',
        '',
        'Papa: "HAT JEMAND MEINEN PUDDING ANGEFASST?!"',
    ];
    for (let i = 0; i < epilog.length; i++) {
        ctx.fillStyle = i === epilog.length - 1 ? '#ffcc44' : '#ddd';
        ctx.fillText(epilog[i], W()/2, H() * 0.60 + i * 22 * s);
    }

    ctx.fillStyle = '#888';
    ctx.font = `${Math.min(14 * s, W() / 30)}px system-ui, -apple-system, sans-serif`;
    ctx.fillText('ENDE', W()/2, H() * 0.90);
    ctx.font = `${Math.min(11 * s, W() / 38)}px system-ui, -apple-system, sans-serif`;
    ctx.fillText('[ Klicken für Neustart ]', W()/2, H() * 0.95);
}

function drawFloatingTexts() {
    const s = S();
    const f = FS();
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y -= 0.5;
        ft.life--;
        const alpha = Math.min(1, ft.life / 60);
        ctx.globalAlpha = alpha;
        ctx.shadowColor = 'rgba(0,0,0,0.95)';
        ctx.shadowBlur = 10;
        ctx.fillStyle = ft.color;
        ctx.font = `bold ${Math.min(16 * f, W() / 24)}px system-ui, -apple-system, sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x * s, ft.y * s);
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
    }
}

// --- Input handling ---
function handleClick(mx, my) {
    const s = S();
    const f = FS();

    if (state === State.MENU) {
        // Check start button — use font scale to match drawMenu
        const btnW = Math.min(260 * f, W() * 0.7);
        const btnH = 50 * f;
        const btnX = W()/2 - btnW/2;
        const btnY = H() * 0.78 - btnH/2;
        if (mx >= btnX && mx <= btnX + btnW && my >= btnY && my <= btnY + btnH) {
            state = State.PLAYING;
            currentRoom = 'wohnzimmer';
            charX = W() / 2;
        }
        return;
    }

    if (state === State.ENDING) {
        state = State.MENU;
        inventory = [];
        discoveredSecrets = [];
        partyFlags = {};
        return;
    }

    if (state === State.DIALOG) {
        if (dialogCallback) {
            const cb = dialogCallback;
            dialogCallback = null;
            state = State.PLAYING;
            cb();
        } else {
            state = State.PLAYING;
        }
        return;
    }

    if (showInventory) {
        showInventory = false;
        return;
    }

    // Check character selector (uses font scale)
    const startX = 8 * f;
    const startY = 42 * f;
    for (let i = 0; i < 4; i++) {
        const y = startY + i * 28 * f;
        if (mx >= startX && mx <= startX + 90 * f && my >= y && my <= y + 24 * f) {
            selectedChar = i;
            return;
        }
    }

    // Check inventory button (uses font scale)
    const ibw = 55 * f;
    const ibx = W() - ibw - 8 * f;
    const iby = 8 * f;
    if (mx >= ibx && mx <= ibx + ibw && my >= iby && my <= iby + 24 * f) {
        showInventory = true;
        return;
    }

    // Check exits (uses font scale for positions to match drawExits)
    const room = rooms[currentRoom];
    for (const [dir, target] of Object.entries(room.exits)) {
        let ex, ey, ew = 60 * f, eh = 50 * f;
        if (dir === 'links') { ex = 0; ey = H() * 0.5 - 30 * f; ew = 50 * f; eh = 60 * f; }
        else if (dir === 'rechts') { ex = W() - 50 * f; ey = H() * 0.5 - 30 * f; ew = 50 * f; eh = 60 * f; }
        else if (dir === 'oben') { ex = W()/2 - 60 * f; ey = 30 * f; ew = 120 * f; eh = 50 * f; }
        else if (dir === 'unten') { ex = W()/2 - 60 * f; ey = H() * 0.63; ew = 120 * f; eh = 50 * f; }
        else continue;
        if (mx >= ex && mx <= ex + ew && my >= ey && my <= ey + eh) {
            currentRoom = target;
            charX = W() / 2;
            return;
        }
    }

    // Check objects
    for (const obj of room.objects) {
        const ox = obj.x * s, oy = obj.y * s, ow = obj.w * s, oh = obj.h * s;
        if (mx >= ox && mx <= ox + ow && my >= oy && my <= oy + oh) {
            // Walk towards object
            charX = ox + ow / 2;
            obj.use();
            return;
        }
    }

    // Walk to clicked position
    if (my > H() * 0.5 && my < H() * 0.75) {
        charX = mx;
    }
}

canvas.addEventListener('click', (e) => {
    e.preventDefault();
    handleClick(e.clientX, e.clientY);
});
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (e.touches.length > 0) {
        handleClick(e.touches[0].clientX, e.touches[0].clientY);
    }
}, { passive: false });

// --- Game Loop ---
function gameLoop() {
    // Re-check size every frame for the first second to fix timing issues
    if (animTime < 60) resize();
    animTime++;
    ctx.clearRect(0, 0, W(), H());

    if (state === State.MENU) {
        drawMenu();
    } else if (state === State.ENDING) {
        drawEnding();
    } else {
        drawRoom();
        drawFloatingTexts();
        if (showInventory) drawInventoryScreen();
        if (state === State.DIALOG) drawDialog();
    }

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
