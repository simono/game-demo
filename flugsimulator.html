<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Flugsimulator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #5aa9ee;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #home {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 10px);
    left: calc(env(safe-area-inset-left) + 10px);
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; text-decoration: none;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 12px;
  }
  #home[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<a id="home" href="index.html" aria-label="Zur Spielauswahl">🏠</a>
<script>
const homeBtn = document.getElementById('home');
const canvas = document.getElementById('game');
let ctx = canvas.getContext('2d');

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('load', resize);
document.addEventListener('DOMContentLoaded', resize);
resize();
let resizeFrames = 0;

const W = () => window.innerWidth;
const H = () => window.innerHeight;
const DEG = Math.PI / 180;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// ── Strecke ────────────────────────────────────────────────────────
// Die Spielwelt ist kleiner als die echte Welt, damit ein Flug nur ein paar Minuten dauert.
const RWY_A = { x0: 0, x1: 2800, num: '07' };    // Startbahn Frankfurt
const ALT_SCALE = 10;     // 1 m im Spiel = 10 m Anzeige
const GEAR_H = 8.2;       // von den Rädern bis zur Rumpfmitte
const CEILING = 1300;
const GLIDE = 4 * DEG;    // Winkel der grünen Landehilfe
const GLIDE_LEN = 13000;

const BLUE = '#1f4fd1', GREEN = '#1fb84f';

// ── Spielzustand ───────────────────────────────────────────────────
let state = 'menu';       // menu, flying, crashed, done
let p, cam, pax, particles = [], contrail = [], result = null;
let rockets = [], balloons = [], hits = 0, fireCd = 0, crates = [], zones = [], drops = 0;
let resultT = 0, welcomeT = 0, shake = 0, farX = 0, time = 0;

let VR = 75;
const MACH1 = 343;        // Schallgeschwindigkeit in m/s, 1235 km/h              // Abhebetempo in m/s, hängt vom Flugzeug ab
const ROPE = 45, TOW_TOP = 220;
function newFlight() {
  stopMusic();
  stopSirens();
  VR = PT().vr;
  p = { x: 120, y: 0, z: 0, hdg: 0, roll: 0, v: 0, vy: 0, pitch: 0, throttle: 0, gear: 1, gearDown: true,
        onGround: true, flown: false, rwy: RWY_A, touchSink: 0, sinkAnim: 0, tilt: 0, drop: 0, flaps: 0.4, spoil: 0, rev: 0 };
  cam = { a: 0, init: false };
  pax = newPax();
  if (PT().glider) {
    // das Schleppflugzeug steht vorne am Seil
    p.tow = { x: p.x + ROPE, y: 0, free: false, t: 0, v: 0 };
    p.throttle = 0; p.airbrake = false; p.varioT = 0;
  }
  particles = []; contrail = []; result = null;
  rockets = []; hits = 0; fireCd = 0; balloons = PT().weapon ? makeBalloons() : [];
  crates = []; drops = 0; zones = PT().cargo ? makeZones() : []; p.ramp = 0; p.rampT = 0;
  state = 'flying'; welcomeT = 4; shake = 0; flash = 0; bolt = null; nextBolt = 5;
  pointers.clear();
  startEngine();
  chime();
}

function toMenu() {
  state = 'menu';
  stopEngine();
  stopSirens();
  pointers.clear();
}

// ── Steuerung ──────────────────────────────────────────────────────
const pointers = new Map();   // Finger -> Knopf
const keys = {};
const KEYMAP = {
  ArrowUp: 'up', ArrowDown: 'dn',
  ArrowLeft: 'left', a: 'left', A: 'left',
  ArrowRight: 'right', d: 'right', D: 'right',
  w: 'thrUp', W: 'thrUp', '+': 'thrUp',
  s: 'thrDn', S: 'thrDn', '-': 'thrDn',
  ' ': 'brake', b: 'brake', B: 'brake',
  x: 'fire', X: 'fire',
};
function held(k) {
  if (keys[k]) return true;
  for (const v of pointers.values()) if (v === k) return true;
  return false;
}
function toggleGear() {
  if (PT().glider) {
    if (p.tow && !p.tow.free) { if (!p.onGround) releaseTow('Ausgeklinkt! Jetzt fliegst du ganz ohne Motor. 🪂'); return; }
    p.airbrake = !p.airbrake;
    clunk();
    return;
  }
  if (p.onGround) return;
  p.gearDown = !p.gearDown;
  clunk();
}

function buttons() {
  const b = clamp(Math.min(W(), H()) * 0.16, 54, 84);
  const m = 14;
  const gw = b * 1.25, gh = b * 0.72;
  const top = H() - m - 2 * b - 10, bottom = H() - m - b, middle = (top + bottom) / 2;
  const padX = W() - m - 2 * b - 10;
  const bs = {
    thrUp: { x: m, y: top, w: b, h: b },
    thrDn: { x: m, y: bottom, w: b, h: b },
    up:    { x: padX, y: top, w: b, h: b },
    dn:    { x: padX, y: bottom, w: b, h: b },
    left:  { x: padX - b - 10, y: middle, w: b, h: b },
    right: { x: W() - m - b, y: middle, w: b, h: b },
    view:  { x: W() - m - b, y: middle - gh - 10, w: b, h: gh },
  };
  if (PT().weapon || PT().cargo) bs.fire = { x: padX - b - 10, y: middle - b - 10, w: b, h: b };
  // Fahrwerk und Bremse unten in der Mitte; wenn dort kein Platz ist, über dem Schub
  if (W() / 2 + 16 + gw <= bs.left.x && W() / 2 - 16 - gw >= m + b + 60) {
    bs.gear = { x: W() / 2 - gw - 6, y: H() - m - gh, w: gw, h: gh };
    bs.brake = { x: W() / 2 + 6, y: H() - m - gh, w: gw, h: gh };
  } else {
    bs.gear = { x: m, y: top - gh - 10, w: gw, h: gh };
    bs.brake = { x: m + gw + 8, y: top - gh - 10, w: gw, h: gh };
  }
  return bs;
}
const hit = (r, x, y) => r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
function buttonAt(x, y) {
  const bs = buttons();
  for (const k in bs) if (hit(bs[k], x, y) && !(PT().glider && (k === 'thrUp' || k === 'thrDn'))) return k;
  return null;
}

let menuBtn = null, menuPrev = null, menuNext = null, musicBtn = null, nightBtn = null, weatherBtn = null, planeBtns = [], resBtns = {};
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  getAC();
  const x = e.clientX, y = e.clientY;
  if (state === 'menu') {
    if (hit(musicBtn, x, y)) toggleMusic();
    else if (hit(nightBtn, x, y)) setNight(!night);
    else if (hit(weatherBtn, x, y)) nextWeather();
    else for (const r of planeBtns) if (hit(r, x, y)) setPlane(r.k);
    else if (hit(menuBtn, x, y)) newFlight();
    else if (hit(menuPrev, x, y)) changeRoute(-1);
    else if (hit(menuNext, x, y)) changeRoute(1);
    return;
  }
  if (result && resultT > 0 && (state === 'crashed' || state === 'done')) { resultT = Math.min(resultT, 0); return; }
  if (result && resultT <= 0) {
    if (hit(resBtns.again, x, y)) newFlight();
    else if (hit(resBtns.menu, x, y)) toMenu();
    return;
  }
  if (state !== 'flying') return;
  const k = buttonAt(x, y);
  if (!k) return;
  pointers.set(e.pointerId, k);
  if (k === 'gear') toggleGear();
  if (k === 'view') toggleView();
}, { passive: false });
canvas.addEventListener('pointermove', e => {
  e.preventDefault();
  if (!pointers.has(e.pointerId)) return;
  const k = buttonAt(e.clientX, e.clientY);
  const taps = ['gear', 'view'];
  if (!taps.includes(k) && !taps.includes(pointers.get(e.pointerId))) pointers.set(e.pointerId, k);
}, { passive: false });
const release = e => pointers.delete(e.pointerId);
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

window.addEventListener('keydown', e => {
  if (KEYMAP[e.key]) { keys[KEYMAP[e.key]] = true; e.preventDefault(); }
  if (e.repeat) return;
  getAC();
  if ((e.key === 'g' || e.key === 'G') && state === 'flying') toggleGear();
  if (e.key === 'c' || e.key === 'C') toggleView();
  if (state === 'menu' && (e.key === 'm' || e.key === 'M')) toggleMusic();
  if (state === 'menu' && (e.key === 'n' || e.key === 'N')) setNight(!night);
  if (state === 'menu' && (e.key === 'r' || e.key === 'R')) nextWeather();
  if (state === 'menu' && (e.key === 'f' || e.key === 'F')) setPlane(PLANE_KEYS[(PLANE_KEYS.indexOf(planeKey) + 1) % PLANE_KEYS.length]);
  if (state === 'menu' && e.key === 'ArrowLeft') changeRoute(-1);
  if (state === 'menu' && e.key === 'ArrowRight') changeRoute(1);
  if (e.key === 'Enter' && (state === 'menu' || (result && resultT <= 0))) newFlight();
  if (e.key === 'Escape' && state !== 'menu') toMenu();
});
window.addEventListener('keyup', e => { if (KEYMAP[e.key]) keys[KEYMAP[e.key]] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; pointers.clear(); });

// ── Töne ───────────────────────────────────────────────────────────
let AC = null, eng = null, noiseBuf = null;
function getAC() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function noise() {
  const ac = getAC();
  if (noiseBuf) return noiseBuf;
  const len = ac.sampleRate * 2;
  noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
  const d = noiseBuf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) {
    last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02;
    d[i] = last * 3.5;
  }
  return noiseBuf;
}
function startEngine() {
  const ac = getAC();
  if (eng) return;
  const src = ac.createBufferSource(); src.buffer = noise(); src.loop = true;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 250;
  const g = ac.createGain(); g.gain.value = 0;
  src.connect(lp).connect(g).connect(ac.destination);
  const whine = ac.createOscillator(); whine.type = 'sine'; whine.frequency.value = 700;
  const wg = ac.createGain(); wg.gain.value = 0;
  whine.connect(wg).connect(ac.destination);
  src.start(); whine.start();
  eng = { src, lp, g, whine, wg };
}
function updateEngine() {
  if (!eng) return;
  if (PT().glider) {
    // kein Motor: nur Fahrtwind, und solange das Seil hängt, brummt vorne der Propeller
    const t = AC.currentTime, towing = p.tow && !p.tow.free;
    eng.lp.frequency.setTargetAtTime(200 + p.v * 18, t, 0.3);
    eng.g.gain.setTargetAtTime(0.03 + p.v / 40 * 0.12, t, 0.3);
    eng.whine.frequency.setTargetAtTime(towing ? 150 + p.v * 1.5 : 150, t, 0.3);
    eng.wg.gain.setTargetAtTime(towing ? 0.05 : 0, t, 0.4);
    return;
  }
  const t = AC.currentTime, th = p.throttle, ab = PT().supersonic ? clamp((th - 0.75) * 4, 0, 1) : 0;
  eng.lp.frequency.setTargetAtTime(250 + th * 1100 + ab * 1500, t, 0.3);
  eng.g.gain.setTargetAtTime(0.15 + th * 0.35 + ab * 0.15, t, 0.3);
  eng.whine.frequency.setTargetAtTime(700 + th * 1600, t, 0.5);
  eng.wg.gain.setTargetAtTime(0.006 + th * 0.016, t, 0.3);
}
function stopEngine() {
  if (!eng) return;
  const t = AC.currentTime, e = eng;
  e.g.gain.setTargetAtTime(0, t, 0.25);
  e.wg.gain.setTargetAtTime(0, t, 0.25);
  eng = null;
  setTimeout(() => { e.src.stop(); e.whine.stop(); }, 1500);
}
function tone(freq, start, dur, vol, type = 'sine') {
  const ac = getAC(), t = ac.currentTime + start;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function chime() { tone(880, 0, 1.2, 0.18); tone(698, 0.45, 1.6, 0.18); }
function noiseBurst(start, dur, vol, freq, type = 'lowpass') {
  const ac = getAC(), t = ac.currentTime + start;
  const src = ac.createBufferSource(); src.buffer = noise();
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = ac.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f).connect(g).connect(ac.destination);
  src.start(t, Math.random()); src.stop(t + dur + 0.05);
}
function clunk() { noiseBurst(0, 0.25, 0.6, 300); tone(90, 0, 0.2, 0.2, 'triangle'); }
function thump() { noiseBurst(0, 0.4, 0.9, 200); tone(60, 0, 0.3, 0.3, 'triangle'); }
function whoosh() { noiseBurst(0, 0.6, 0.5, 1800, 'bandpass'); }
function pop() { noiseBurst(0, 0.15, 0.9, 3000, 'highpass'); tone(900, 0, 0.1, 0.25, 'square'); }
function boom() { noiseBurst(0, 2.2, 1.6, 500); tone(45, 0, 1, 0.4, 'triangle'); }
function splash() { noiseBurst(0, 1.6, 1.2, 1200, 'bandpass'); noiseBurst(0.1, 1.2, 0.6, 400); }
function applause() {
  for (let i = 0; i < 70; i++) noiseBurst(Math.random() * 3, 0.06, 0.5 + Math.random() * 0.5, 1500 + Math.random() * 1500, 'bandpass');
}

// ── Musik im Menü ──────────────────────────────────────────────────
// 8 Takte in C-Dur, Achtelnoten: C – G – Am – F, je zwei Takte
const BPM = 104, EIGHTH = 60 / BPM / 2, LOOP = 64;
const CHORDS = [[48, 52, 55], [43, 47, 50], [45, 48, 52], [41, 45, 48]];
// [Achtel, Note, Länge in Achteln]
const MELODY = [
  [0, 72, 2], [2, 76, 2], [4, 79, 3], [7, 77, 1], [8, 76, 2], [10, 74, 2], [12, 72, 4],
  [16, 71, 2], [18, 74, 2], [20, 79, 3], [23, 77, 1], [24, 76, 2], [26, 74, 2], [28, 71, 4],
  [32, 72, 2], [34, 76, 2], [36, 81, 3], [39, 79, 1], [40, 77, 2], [42, 76, 2], [44, 74, 2], [46, 76, 2],
  [48, 77, 2], [50, 76, 2], [52, 74, 2], [54, 72, 2], [56, 74, 4], [60, 79, 4],
];
let music = null, whiteBuf = null;
let musicOff = false;
try { musicOff = localStorage.getItem('flug-musik') === 'aus'; } catch (e) {}

const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);
function white() {
  if (whiteBuf) return whiteBuf;
  const ac = getAC();
  whiteBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = whiteBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return whiteBuf;
}
function mNote(freq, t, dur, type, vol, attack = 0.01, cutoff = 0) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + attack);
  g.gain.setTargetAtTime(0, t + Math.max(attack, dur - 0.05), dur * 0.3);
  let node = o;
  if (cutoff) { const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff; o.connect(f); node = f; }
  node.connect(g).connect(music.g);
  o.start(t); o.stop(t + dur * 2 + 0.3);
}
function mNoise(t, dur, vol, type, freq) {
  const src = AC.createBufferSource(); src.buffer = white();
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f).connect(g).connect(music.g);
  src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
}
function kick(t) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.frequency.setValueAtTime(130, t);
  o.frequency.exponentialRampToValueAtTime(45, t + 0.15);
  g.gain.setValueAtTime(0.7, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
  o.connect(g).connect(music.g);
  o.start(t); o.stop(t + 0.35);
}

function playStep(step, t) {
  const bar = Math.floor(step / 8), beat = step % 8;
  const chord = CHORDS[Math.floor(step / 16)];
  // Klangteppich: ein Akkord für zwei Takte
  if (step % 16 === 0) for (const n of chord) {
    mNote(midiHz(n + 12), t, EIGHTH * 16, 'sawtooth', 0.035, 0.4, 900);
    mNote(midiHz(n + 12) * 1.004, t, EIGHTH * 16, 'sawtooth', 0.035, 0.4, 900);
  }
  // Bass
  if (beat === 0 || beat === 4) mNote(midiHz(chord[0] - 12), t, EIGHTH * 1.8, 'triangle', 0.32);
  if (beat === 6) mNote(midiHz(chord[0]), t, EIGHTH * 0.9, 'triangle', 0.22);
  // Glöckchen, die durch den Akkord laufen
  const arp = chord[[0, 1, 2, 1][step % 4]] + 24;
  mNote(midiHz(arp), t, EIGHTH * 0.9, 'sine', 0.05);
  // Melodie
  for (const [s, n, len] of MELODY) if (s === step) {
    mNote(midiHz(n), t, EIGHTH * len, 'triangle', 0.16, 0.02);
    mNote(midiHz(n + 12), t, EIGHTH * len, 'sine', 0.04, 0.02);
  }
  // Schlagzeug, im ersten Durchlauf erst ab Takt 3
  if (music.loops > 0 || bar >= 2) {
    if (beat === 0 || beat === 4) kick(t);
    if (beat === 2 || beat === 6) { mNoise(t, 0.15, 0.25, 'bandpass', 1800); mNote(190, t, 0.08, 'triangle', 0.1); }
    if (beat % 2 === 1) mNoise(t, 0.04, 0.12, 'highpass', 7000);
  }
}

function scheduleMusic() {
  if (!music) return;
  // nach einer Pause (Tab im Hintergrund) nicht alle verpassten Noten auf einmal spielen
  if (music.next < AC.currentTime - 0.1) music.next = AC.currentTime + 0.05;
  while (music.next < AC.currentTime + 0.2) {
    playStep(music.step, music.next);
    music.step++;
    if (music.step === LOOP) { music.step = 0; music.loops++; }
    music.next += EIGHTH;
  }
}
function startMusic() {
  if (music || musicOff || !AC || AC.state !== 'running') return;
  const g = AC.createGain();
  g.gain.value = 0;
  g.gain.setTargetAtTime(0.55, AC.currentTime, 0.4);
  g.connect(AC.destination);
  music = { g, step: 0, loops: 0, next: AC.currentTime + 0.1 };
  music.timer = setInterval(scheduleMusic, 50);
  scheduleMusic();
}
function stopMusic() {
  if (!music) return;
  const m = music;
  music = null;
  clearInterval(m.timer);
  m.g.gain.setTargetAtTime(0, AC.currentTime, 0.25);
  setTimeout(() => m.g.disconnect(), 2000);
}
let night = false;
try { night = localStorage.getItem('flug-nacht') === 'an'; } catch (e) {}

// Wetter: Seitenwind in m/s, Wackeln, wie gut die Bremse greift
const WEATHER = {
  sun:   { icon: '🌤️', name: 'Schönes Wetter', wind: 0, turb: 0, brake: 7, tint: 0, rain: 0, snow: 0 },
  rain:  { icon: '🌧️', name: 'Regen', wind: 2, turb: 1.5, brake: 5, tint: 0.3, rain: 140, snow: 0 },
  storm: { icon: '⛈️', name: 'Gewitter', wind: 4, turb: 3.5, brake: 5, tint: 0.5, rain: 260, snow: 0 },
  snow:  { icon: '🌨️', name: 'Schnee', wind: 1.5, turb: 1, brake: 3.5, tint: 0.25, rain: 0, snow: 160 },
};
const WEATHER_KEYS = Object.keys(WEATHER);
let weather = 'sun', flash = 0, nextBolt = 6, bolt = null;
try { if (WEATHER[localStorage.getItem('flug-wetter')]) weather = localStorage.getItem('flug-wetter'); } catch (e) {}
const WX = () => WEATHER[weather];
function nextWeather() {
  weather = WEATHER_KEYS[(WEATHER_KEYS.indexOf(weather) + 1) % WEATHER_KEYS.length];
  try { localStorage.setItem('flug-wetter', weather); } catch (e) {}
  tone(520 + WEATHER_KEYS.indexOf(weather) * 90, 0, 0.12, 0.1);
}
function thunder() { noiseBurst(0.5, 2.8, 1.3, 160); tone(38, 0.5, 1.4, 0.3, 'triangle'); }
function setNight(on) {
  night = on;
  try { localStorage.setItem('flug-nacht', night ? 'an' : 'aus'); } catch (e) {}
  tone(night ? 440 : 880, 0, 0.15, 0.1);
}
function toggleMusic() {
  musicOff = !musicOff;
  try { localStorage.setItem('flug-musik', musicOff ? 'aus' : 'an'); } catch (e) {}
  if (musicOff) stopMusic();
}

// ── Ziele ──────────────────────────────────────────────────────────
// x der Bauwerke ist relativ zum Anfang der Landebahn, z ist seitlich (minus = links)
const ROUTES = [

let R, routeIdx = 0, DEST, RWY_B, SEA_FROM, SEA_TO, DEST_FROM, THERMALS = [];

}
try { routeIdx = clamp(parseInt(localStorage.getItem('flug-ziel'), 10) || 0, 0, ROUTES.length - 1); } catch (e) {}

const kmLeft = () => Math.max(0, Math.round((DEST - p.x) / DEST * R.km));
function treeKind(x, n) {

// ── Physik ─────────────────────────────────────────────────────────
const inside = (x, r) => x >= r.x0 && x <= r.x1;

function localToWorld(lx, ly) {
  const k = PT().k, dx = (lx + 4) * k, up = (PT().gearH - ly) * k, c = Math.cos(p.pitch * DEG), s = Math.sin(p.pitch * DEG);
  return [p.x + dx * c - up * s, p.y + dx * s + up * c];
}

function update(dt) {
  updatePax(dt);
  const up = held('up'), dn = held('dn');
  p.throttle = clamp(p.throttle + ((held('thrUp') ? 1 : 0) - (held('thrDn') ? 1 : 0)) * 0.45 * dt, 0, 1);
  p.gear += clamp((p.gearDown ? 1 : 0) - p.gear, -0.4 * dt, 0.4 * dt);
  // Klappen: halb zum Starten, ganz zum Landen; nach dem Aufsetzen Störklappen hoch und Schubumkehr
  const landing = p.onGround && p.flown;
  const flapGoal = PT().glider ? 0 : !p.flown ? 0.4 : p.gearDown ? 1 : 0;
  p.flaps += clamp(flapGoal - p.flaps, -0.25 * dt, 0.25 * dt);
  p.spoil += clamp((landing || p.airbrake ? 1 : 0) - p.spoil, -2 * dt, 3 * dt);
  p.rev += clamp((landing && p.v > 15 && !PT().glider ? 1 : 0) - p.rev, -1 * dt, 1.5 * dt);

  // Auftrieb: erst ab 55 m/s trägt der Flügel, ab Abhebetempo ganz
  const lift = clamp((p.v - (VR - 20)) / 20, 0, 1);
  const pr = (up ? 1 : 0) - (dn ? 1 : 0);
  if (p.onGround) {
    if (pr > 0 && p.v >= VR * 0.93) p.pitch += 8 * PT().agile * dt;
    else p.pitch -= 5 * dt;
    p.pitch = clamp(p.pitch, 0, 14);
  } else {
    p.pitch += pr * 12 * PT().agile * dt;
    if (p.v < VR - 13) p.pitch -= (VR - 13 - p.v) * 0.8 * dt;   // zu langsam: die Nase sackt weg
    const mp = PT().maxPitch || 20;
    p.pitch = clamp(p.pitch, -mp, mp);
  }

  // Kurven: in der Luft legt sich der Flieger schräg, am Boden lenkt das Bugrad
  const lr = (held('right') ? 1 : 0) - (held('left') ? 1 : 0);
  if (p.onGround) {
    p.roll = 0;
    p.hdg += lr * 4 * DEG * clamp(p.v / 10, 0, 1) * dt;
  } else {
    if (lr) p.roll += lr * 35 * PT().agile * dt;
    else p.roll -= Math.sign(p.roll) * Math.min(Math.abs(p.roll), 25 * dt);   // richtet sich von selbst wieder gerade
    p.roll = clamp(p.roll, -35, 35);
    p.hdg += 9.81 * Math.tan(p.roll * DEG) / Math.max(p.v, 40) * 1.5 * dt;
  }
  p.hdg = clamp(p.hdg, -60 * DEG, 60 * DEG);

  const drag = (PT().drag || 7.4e-5) * (1 + p.gear * 0.5) * (p.airbrake ? 3 : 1);
  let acc = p.throttle * PT().thrust - drag * p.v * p.v - 9.81 * Math.sin(p.pitch * DEG) * 0.6;
  if (p.tow && !p.tow.free) acc += 3.2 * clamp((40 - p.v) / 8, 0, 1);   // das Seil zieht dich auf 144 km/h
  if (p.onGround) acc -= 0.15 + (held('brake') ? WX().brake : 0) + p.rev * 1.5 + (p.rwy.field ? 2.5 : 0);
  p.v = Math.max(0, p.v + acc * dt);

  // langsam sinkt er auch mit waagerechter Nase, damit man beim Landen aufsetzt
  const sag = clamp((VR + 25 - p.v) / 25, 0, 1) * (PT().sag || 3) + (p.airbrake ? 4 : 0);
  const vy = p.v * Math.sin(p.pitch * DEG) * lift - sag - (1 - lift) * 18 - (1 - Math.cos(p.roll * DEG)) * 10 + (PT().glider ? thermalLift() : 0);
  if (p.onGround) {
    p.vy = 0;
    if (vy > 0.5) p.onGround = false;
  }
  if (!p.onGround) {
    p.vy = vy;
    p.y = Math.min(CEILING, p.y + p.vy * dt);
    if (p.y > 10) p.flown = true;
  }
  const vh = p.v * Math.cos(p.pitch * DEG);
  p.x += vh * Math.cos(p.hdg) * dt;
  p.z += vh * Math.sin(p.hdg) * dt;

  if (!p.onGround) {
    // Seitenwind schiebt dich weg, Böen schubsen dich hoch und runter; dicht am Boden weniger
    const w = WX();
    p.z += w.wind * dt;
    p.y += w.turb * (Math.sin(time * 1.7) + 0.6 * Math.sin(time * 3.3 + 1)) * clamp(p.y / 150, 0, 1) * dt;
    if (w.turb > 2) shake = Math.max(shake, 1.5);
  }
  if (PT().glider) updateGlider(dt);
  if (PT().weapon) updateWeapon(dt);
  if (PT().cargo) updateCargo(dt);
  if (PT().supersonic && !p.boomed && p.v > MACH1) {
    p.boomed = true; p.boomT = 0;
    boom(); shake = 7;
    pax.t = 0; say('💥 Überschall! Wir sind schneller als der Schall!');
  }
  if (p.boomT !== undefined) p.boomT += dt;
  if (p.rev > 0.5 && p.v > 15 && PT().engines.length && Math.random() < 0.6) {
    // Schubumkehr wirbelt Wasser, Schnee oder Staub nach vorne
    const [x] = localToWorld(PT().engines[0][0] + 4, 0);
    const wet = weather === 'rain' || weather === 'storm', snowy = weather === 'snow';
    particles.push({ x, a: 1, vx: p.v * 0.4 + Math.random() * 10, va: 2 + Math.random() * 4, life: 0.9, max: 0.9, r: 1.2, grow: 3,
                     color: wet ? '225,235,245' : snowy ? '250,250,255' : '200,190,170' });
  }
  if (!p.onGround && p.y <= 0) { touchdown(); return; }

  if (p.onGround && p.x > p.rwy.x1) {
    if (!p.flown) return crash('field', `Die Startbahn war zu Ende! Gib mehr Schub und zieh die Nase hoch, sobald du ${Math.round(VR * 3.6)} km/h schnell bist.`);
    return crash('field', 'Über die Landebahn hinaus gerollt! Halte nach dem Aufsetzen die Bremse gedrückt.');
  }
  if (p.onGround && !p.rwy.field && Math.abs(p.z) > 32) return crash('field', 'Von der Bahn abgekommen! Lenk mit ◀ ▶, damit du in der Mitte bleibst.');
  if (p.onGround && p.flown && p.v < 1.5) return landed();
  if (!p.onGround && p.x > RWY_B.x1 + 3000) {
    return finish({ ok: false, title: 'Vorbeigeflogen!', text: `${R.name} liegt schon hinter dir. Folge beim nächsten Mal den grünen Punkten runter zur Landebahn.` });
  }

  // Kondensstreifen hoch oben
  if (p.y > 600) {
    PT().engines.forEach(([lx, ly], e) => {
      const [x, a] = localToWorld(lx, ly);
      contrail.push({ x, a, t: 0, e });
    });
  }
}

function touchdown() {
  const sink = -p.vy;
  p.y = 0;
  if (p.x > SEA_FROM && p.x < SEA_TO) return crash('sea', `Du bist im Meer gelandet. Flieg weiter bis nach ${R.name}!`);
  if (p.gear < 0.9) return crash('belly', 'Bauchlandung! Das Fahrwerk war nicht ausgefahren. Drück vor der Landung auf „Fahrwerk“.');
  if (p.pitch < -2) return crash('nose', 'Mit der Nase zuerst aufgesetzt! Zieh kurz vor dem Boden die Nase etwas hoch.');
  if (p.pitch > 12) return crash('tail', 'Heckaufsetzer! Die Nase war viel zu weit oben.');
  if (sink > 8) return crash('hard', 'Viel zu hart aufgesetzt! Sink langsamer und zieh kurz vor dem Boden die Nase hoch.');
  const onStrip = Math.abs(p.z) <= 30;
  let rwy = !onStrip ? null : inside(p.x, RWY_A) ? RWY_A : inside(p.x, RWY_B) ? RWY_B : null;
  if (!rwy && PT().glider && p.x > 3000) {
    // Segelflieger dürfen auf einem Feld landen, wenn sie es nicht mehr bis zum Flugplatz schaffen
    rwy = { x0: p.x - 1, x1: p.x + 900, field: true };
  }
  if (!rwy) return crash('field', onStrip ? 'Daneben! Du bist vor oder hinter der Landebahn aufgesetzt.' : 'Daneben! Du bist neben der Landebahn aufgesetzt. Schau aufs Radar und lenk mit ◀ ▶.');
  p.onGround = true; p.vy = 0; p.rwy = rwy; p.touchSink = sink;
  paxTouchdown(sink);
  if (p.flown) p.throttle = 0;   // nach der Landung geht der Schub automatisch auf Leerlauf
  shake = Math.min(8, 2 + sink * 1.5);
  thump();
  for (let i = 0; i < 18; i++) {
    particles.push({ x: p.x - 4 + Math.random() * 6, a: 0.5, vx: -p.v * 0.15 * Math.random(), va: 1 + Math.random() * 3,
                     life: 1.4, max: 1.4, r: 1.5 + Math.random() * 2, grow: 4, color: '220,220,220' });
  }
}

function landed() {
  if (p.rwy.field) {
    return finish({ ok: true, stars: 1, title: 'Außenlandung!', text: 'Sicher auf einem Feld gelandet. Das machen echte Segelflieger auch! Gleich holt dich das Auto mit dem Anhänger ab. 🚗' });
  }
  if (p.rwy === RWY_A) {
    return finish({ ok: true, stars: 0, title: 'Zurück in Frankfurt', text: `Sicher gelandet! Aber ${R.name} wartet noch auf dich. ${R.icon}` });
  }
  const s = p.touchSink;
  const stars = s < 3 ? 3 : s < 5 ? 2 : 1;
  const text = stars === 3 ? 'Butterweich aufgesetzt!'
             : stars === 2 ? `Gute Landung! Willkommen ${R.in}. ${R.icon}`
             : 'Etwas hart, aber alle sind heil angekommen!';
  finish({ ok: true, stars, title: `Gelandet ${R.in}!`, text });
  if (pax.mood > 45) applause();
}

function balloonScore() {
  if (PT().bombs) return ` 🎯 Übungsziele getroffen: ${drops} von ${zones.length}!`;
  if (PT().cargo) return ` 📦 Pakete im Ziel: ${drops} von ${zones.length}!`;
  return PT().weapon ? ` 🎈 Ballons getroffen: ${hits} von ${balloons.length}!` : '';
}
function finish(r) {
  r.pax = paxVerdict(r) + balloonScore();
  result = r;
  state = 'done';
  resultT = 0.6;
  if ((PT().swing || PT().noseDoor) && r.ok && r.stars > 0) {
    // erst zuschauen, wie ausgeladen wird
    p.doneAt = time; resultT = PT().noseDoor ? 5 : 3.5;
    r.text += PT().noseDoor ? ' Die Nase klappt hoch: Die Container werden ausgeladen! 📦' : ' Das Heck geht auf: Die Flugzeugteile werden ausgeladen! 🔧';
  }
  stopEngine();
}

function crash(kind, text) {
  result = { ok: false, title: kind === 'sea' ? 'Platsch!' : 'Bumm!', text };
  result.pax = pax.n === 1 ? '🙋 Dein Passagier ist zum Glück heil rausgeklettert. Puh!'
             : kind === 'sea' ? `🛟 Alle ${pax.n} Passagiere sind mit Schwimmwesten an Land geschwommen.`
                              : `🛝 Alle ${pax.n} Passagiere sind über die Notrutsche raus. Puh!`;
  result.pax += balloonScore();
  state = 'crashed';
  resultT = 8;   // erst zuschauen, wie die Feuerwehr kommt; Tippen überspringt
  p.crash = kind;
  const T = PT();
  const onRwy = Math.abs(p.z) < 30 && (inside(p.x, RWY_A) || inside(p.x, RWY_B));
  // langsam von der Bahn gerollt: nur steckengeblieben, sonst bricht das Fahrwerk weg
  const soft = kind === 'field' && p.v < 25;
  const broken = ['nose', 'hard', 'tail'].includes(kind) || (kind === 'field' && p.v > 45);
  const fire = kind !== 'sea' && kind !== 'belly' && !soft && !PT().glider;   // ohne Treibstoff brennt nichts
  p.wreck = { t: 0, onRwy, soft, broken, fire: fire ? 0.2 : 0, burning: fire, smoky: fire || kind === 'belly', gap: 0, rot: 0, stopT: null,
              trucks: [], people: [], boat: null, sirenT: 0, foam: 0 };
  if (!soft) p.gear = 0;
  p.drop = soft ? 1 : (T.gearH - 4.4) * T.k;
  p.tilt = kind === 'nose' ? -4 : kind === 'tail' ? 5 : kind === 'sea' ? 2 : soft ? -2 : -1;
  p.pitch = 0;
  shake = soft ? 6 : 14;
  stopEngine();
  if (!soft && kind !== 'sea') scrape(Math.min(4, p.v / 15));
  if (kind === 'sea') {
    splash();
    for (let i = 0; i < 60; i++) {
      particles.push({ x: p.x - 30 + Math.random() * 70, a: 1, vx: (Math.random() - 0.3) * 30, va: 10 + Math.random() * 30,
                       life: 1.6, max: 1.6, r: 0.8 + Math.random() * 1.6, grow: 0, color: '235,245,255', g: 30 });
    }
  } else if (!fire) {
    thump();
  } else {
    boom();
    // Trümmerteile fliegen herum
    for (let i = 0; i < 14; i++) {
      particles.push({ x: p.x + (Math.random() - 0.5) * 30 * T.k, a: 3, vx: p.v * (0.2 + Math.random() * 0.6) + (Math.random() - 0.5) * 20,
                       va: 8 + Math.random() * 22, life: 2.5, max: 2.5, r: 0.5 + Math.random() * 0.8, grow: 0, color: '120,125,135', g: 30, bounce: true });
    }
    for (let i = 0; i < 50; i++) {
      const fire = i < 20;
      particles.push({ x: p.x - 30 + Math.random() * 70, a: 2 + Math.random() * 8, vx: (Math.random() - 0.5) * 8, va: 3 + Math.random() * 8,
                       life: fire ? 1 : 5, max: fire ? 1 : 5, r: fire ? 3 : 4 + Math.random() * 4, grow: fire ? 3 : 6,
                       color: fire ? '255,150,40' : '90,90,95' });
    }
  }
}

function scrape(dur) {
  noiseBurst(0, dur, 0.5, 2600, 'bandpass');
  noiseBurst(0, dur * 0.8, 0.4, 900, 'bandpass');
}
// Martinshorn: tiefer und hoher Ton im Abstand einer Quarte, wie bei der deutschen Feuerwehr
const SIREN_LO = 440, SIREN_HI = 587, SIREN_STEP = 0.65;
let hornWave = null;
function startSiren(k, i) {
  const ac = getAC();
  // Obertöne wie bei einem Drucklufthorn: kräftig in der Mitte, oben leiser
  if (!hornWave) {
    const n = 16, re = new Float32Array(n), im = new Float32Array(n);
    for (let h = 1; h < n; h++) im[h] = (h % 2 ? 1 : 0.55) / Math.pow(h, 0.9) * (h >= 2 && h <= 5 ? 1.4 : 1);
    hornWave = ac.createPeriodicWave(re, im);
  }
  // weit weg klingt es dumpfer, die Luft schluckt die hohen Töne
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
  const horn = ac.createBiquadFilter(); horn.type = 'peaking'; horn.frequency.value = 1300; horn.gain.value = 5;
  const g = ac.createGain(); g.gain.value = 0;
  const pan = ac.createStereoPanner ? ac.createStereoPanner() : null;
  lp.connect(horn).connect(g);
  const out = pan ? (g.connect(pan), pan) : g;
  out.connect(ac.destination);
  // Echo vom Flughafengebäude
  const echo = ac.createDelay(1); echo.delayTime.value = 0.23;
  const fb = ac.createGain(); fb.gain.value = 0.3;
  const wet = ac.createGain(); wet.gain.value = 0.35;
  out.connect(echo); echo.connect(fb).connect(echo); echo.connect(wet).connect(ac.destination);
  // jedes Auto hat ein etwas anderes Horn, das zweite klingt einen Ton höher
  const tune = i ? 1.06 : 1;
  const oscs = [[1, 0.8], [1.003, 0.4]].map(([mul, vol]) => {
    const o = ac.createOscillator(), og = ac.createGain();
    o.setPeriodicWave(hornWave); o.frequency.value = SIREN_LO * mul * tune; og.gain.value = vol;
    o.connect(og).connect(lp); o.start();
    return { o, mul: mul * tune };
  });
  // ein leichtes Zittern im Ton
  const vib = ac.createOscillator(), vg = ac.createGain();
  vib.frequency.value = 5.5; vg.gain.value = 3;
  vib.connect(vg); oscs.forEach(({ o }) => vg.connect(o.frequency)); vib.start();
  // Dieselmotor brummt mit
  const dsl = ac.createBufferSource(); dsl.buffer = noise(); dsl.loop = true;
  const dlp = ac.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 120;
  const dg = ac.createGain(); dg.gain.value = 0;
  dsl.connect(dlp).connect(dg).connect(out); dsl.start();
  k.siren = { oscs, g, lp, pan, dg, stops: [vib, dsl, ...oscs.map(x => x.o)], t0: ac.currentTime + Math.random() * SIREN_STEP };
}
function updateSiren(k) {
  const sr = k.siren;
  if (!sr) return;
  const now = AC.currentTime;

function thermalLift(x = p.x, y = p.y) {
  let up = 0;
  for (const t of THERMALS) {
    const d = Math.abs(x - t.x);
    if (d < t.w) up = Math.max(up, t.lift * (1 - d / t.w) * clamp((330 - y) / 60, 0, 1));
  }
  return up;
}

function updateGlider(dt) {
  const tw = p.tow, steer = held('up') || held('dn');
  if (tw && !tw.free && !steer) {
    // am Seil fliegt der Segler von allein hinter dem Schleppflugzeug her
    if (p.onGround && p.v >= VR * 0.93) p.pitch += 8 * dt;
    if (!p.onGround) p.pitch += clamp(clamp((tw.y - p.y) * 0.6 + 4, -4, 12) - p.pitch, -10 * dt, 10 * dt);
  } else if (!p.onGround && !steer) {
    // getrimmt: lässt du los, sucht er sich von selbst die beste Geschwindigkeit
    const best = thermalLift() > 0.5 ? 27 : 31;
    p.pitch += clamp(clamp((p.v - best) * 0.8, -6, 6) - p.pitch, -4 * dt, 4 * dt);
  }
  if (tw) {
    tw.t += dt;
    if (!tw.free) {
      // das Schleppflugzeug fliegt vorne und steigt gleichmäßig
      tw.x = p.x + ROPE;
      // es wartet auf dich, wenn du zu weit unten hängst
      if (p.v > 28 && p.y > tw.y - 8) tw.y = Math.min(TOW_TOP + 5, tw.y + 6 * dt);
      if (p.flown && p.y - tw.y > 25) releaseTow('Das Seil ist gerissen! 😮 Bleib beim nächsten Mal hinter dem Schleppflugzeug.');
      else if (tw.y >= TOW_TOP) releaseTow('Ausgeklinkt auf 2200 m! Jetzt such dir Aufwind unter den Wolken. ☁️');
    } else {
      // nach dem Ausklinken fliegt es zurück nach Frankfurt
      tw.x += (tw.v - 6 * tw.t) * dt; tw.y = Math.max(0, tw.y - 7 * dt);
    }
  }
  // drückt man den blinkenden Knopf nicht, hilft der Fluglehrer nach ein paar Sekunden
  const ask = !p.onGround && p.tow && p.tow.free && hint()[0].includes('blinkenden');
  p.helpT = ask ? (p.helpT || 0) + dt : 0;
  if (p.helpT > 3) {
    p.helpT = 0;
    p.airbrake = !p.airbrake; clunk();
    pax.t = 0; say(p.airbrake ? '👨‍✈️ Fluglehrer: Ich mach mal die Bremsklappen raus!' : '👨‍✈️ Fluglehrer: Und wieder rein!');
  }
  // Variometer: piepst immer schneller und höher, je mehr du steigst
  p.varioT -= dt;
  if (!p.onGround && p.vy > 0.4 && p.varioT <= 0) {
    tone(600 + p.vy * 110, 0, 0.08, 0.05, 'square');
    p.varioT = Math.max(0.14, 0.5 - p.vy * 0.07);
  }
}

                   '2️⃣ Flieg durch die dicken Wolken ☁️ Dort steigst du ⬆', '3️⃣ Bei der Wasserkuppe: drück den Knopf, wenn er blinkt'];
    const wrapped = lines.flatMap((l, i) => wrap(l, cw - 24, (i ? 14 : 16) * u).map(w => [w, i]));
    const ch = wrapped.length * lh + 18 * u, x = W() / 2 - cw / 2, y = H() * 0.42 - ch / 2;
    ctx.fillStyle = 'rgba(20,60,140,0.9)';
    ctx.beginPath(); ctx.roundRect(x, y, cw, ch, 14); ctx.fill();
    wrapped.forEach(([w, i], n) => txt(w, W() / 2, y + 9 * u + lh * (n + 0.5), (i ? 14 : 16) * u, i ? '#fff' : '#ffd34d'));
    return;
  }
  // ein hüpfender Pfeil zeigt zum nächsten Aufwind
  if (view === 'cockpit' || !p.tow || !p.tow.free || p.onGround || thermalLift() > 0.5) return;
  const next = THERMALS.find(t => t.x - t.w > p.x);
  if (!next || next.x > DEST) return;
  const X = Math.min(sx(next.x), W() - 60), Y = sy(p.y) - 30 + Math.sin(time * 5) * 6;
  if (X - sx(p.x) < 60) return;
  txt(sx(next.x) > W() - 60 ? '➡️ Aufwind' : '⬇️ Aufwind', X, Y - (sx(next.x) > W() - 60 ? 0 : 40), 18, '#fff', 'center', 'rgba(0,0,0,0.5)');
}

function gliderHint() {
  const tw = p.tow, dist = DEST - p.x;
  if (welcomeT > 0) return ['🔔 Segelflug! Das Schleppflugzeug zieht dich am Seil hoch.', false];
  if (p.onGround && !p.flown) return ['Das Schleppflugzeug zieht dich … gleich hebst du ab!', false];
  if (p.onGround) return ['Bremse halten! 🛑', true];
  if (tw && !tw.free) {
    if (p.y > tw.y + 12) return ['Etwas tiefer! Sonst reißt das Seil ▼', true];
    return ['Das Schleppflugzeug zieht dich hoch 👍', false];
  }
  if (p.v < VR - 4) return ['⚠️ Zu langsam! Nase runter!', true];
  if (p.vy > 0.4) return ['Juhu, Aufwind! Du steigst ⬆ Piep piep!', false];
  // ohne Klappen gleitet er viel zu weit; mit Klappen etwa 1 m runter auf 16 m nach vorne
  const high = dist > 600 && dist < 5000 && p.y > dist / 16 + 25, low = p.y < dist / 22 + 10;
  if (high && !p.airbrake) return ['Zu hoch! Drück den blinkenden Knopf 👇', true];
  if (p.airbrake && low) return ['Genug! Nochmal den blinkenden Knopf 👇', true];
  const next = THERMALS.find(t => t.x > p.x - t.w * 0.5);
  if (dist > 0 && p.y * 32 < dist) {
    if (next && next.x < DEST) return ['Flieg weiter zur dicken Wolke ☁️ ⬆', false];
    return ['Zu tief für die Wasserkuppe: such dir ein Feld zum Landen 🌾', true];
  }
  if (dist < 1500 && p.y < 30) return ['Gleich am Boden: Nase ganz leicht hoch ▲', false];
  if (dist > 0) return ['Alles gut! Der Segler fliegt von allein 👍', false];
  return ['Lande auf der Bahn! Bremsklappen helfen beim Sinken', false];
}

// ── Nach dem Absturz ───────────────────────────────────────────────
function updateCrash(dt) {
  const c = p.wreck;
  if (!c) return;
  c.t += dt;
  const T = PT();
  if (p.v > 0) {
    const fr = p.crash === 'sea' ? 22 : c.onRwy ? 13 : 18;
    p.v = Math.max(0, p.v - fr * dt);
    p.x += p.v * dt;
    if (c.broken) { c.gap += p.v * dt * 0.1; c.rot = Math.min(6, c.rot + dt * 5); }   // das Heck bleibt zurück
    shake = Math.max(shake, Math.min(6, p.v / 10));
    const n = Math.ceil(p.v / 8);
    for (let i = 0; i < n; i++) {
      const bx = p.x + (Math.random() * 30 - 12) * T.k;
      if (p.crash === 'sea') {
        particles.push({ x: bx, a: 0.5, vx: p.v * 0.5 + (Math.random() - 0.5) * 10, va: 6 + Math.random() * 12,
                         life: 1, max: 1, r: 0.8 + Math.random(), grow: 1, color: '235,245,255', g: 25 });
      } else if (c.onRwy && !c.soft) {
        // Funken, wenn Metall über den Asphalt schrammt
        particles.push({ x: bx, a: 0.3, vx: -p.v * (0.3 + Math.random() * 0.5), va: 2 + Math.random() * 8,
                         life: 0.5, max: 0.5, r: 0.35, grow: 0, color: Math.random() < 0.5 ? '255,230,120' : '255,170,40', g: 20, spark: true });
      } else {
        // Erde und Gras fliegen hoch
        particles.push({ x: bx, a: 0.5, vx: p.v * (0.2 + Math.random() * 0.4), va: 4 + Math.random() * 10,
                         life: 1.2, max: 1.2, r: 0.6 + Math.random() * 0.9, grow: 0.5, color: Math.random() < 0.6 ? '110,80,45' : '80,130,50', g: 22 });
      }
    }
    if (p.v === 0) c.stopT = c.t;
  }
  if (p.crash === 'sea') {
    // erst schwimmt er, dann geht er langsam unter
    if (c.stopT !== null && c.t > c.stopT + 2.5) p.sinkAnim = Math.min(10, p.sinkAnim + dt * 0.8);
    if (c.stopT !== null && !c.boat) c.boat = { x: p.x + Math.min((W() * 0.65) / S + 20, 160), rafts: 0 };
    if (c.boat) {
      const goal = p.x + 45 * T.k + 20;
      c.boat.x = Math.max(goal, c.boat.x - 50 * dt);
      c.boat.rafts = Math.min(3, (c.t - c.stopT) * 0.8);
    }
    return;
  }
  // Feuer wird größer, bis die Feuerwehr löscht
  const spraying = c.trucks.some(k => k.at);
  if (c.burning) {
    c.fire = spraying ? Math.max(0, c.fire - dt * 0.12) : Math.min(1, c.fire + dt * 0.6);
    if (c.fire === 0) c.burning = false;
  }
  for (const fx of c.smoky ? fires() : []) {
    if (Math.random() < dt * (c.burning ? 7 * c.fire : 3)) {
      particles.push({ x: fx + (Math.random() - 0.5) * 4, a: 4 + Math.random() * 4, vx: 3 + WX().wind * 2, va: 6 + Math.random() * 4,
                       life: 5, max: 5, r: 1.5, grow: 2.6, color: c.burning ? '45,45,50' : '215,215,220' });
    }
  }
  // Feuerwehr kommt von beiden Seiten
  if (c.t > 0.8 && !c.trucks.length) {
    const edge = W() / S;
    c.trucks.push({ x: p.x - Math.min(edge * 0.4 + 30, 220), dir: 1, at: false, atT: 0 });
    c.trucks.push({ x: p.x + Math.min(edge * 0.7 + 30, 320), dir: -1, at: false, atT: 0 });
    c.trucks.forEach((k, i) => startSiren(k, i));
  }
  for (const k of c.trucks) {
    // das Wrack rutscht vielleicht noch, also hält die Feuerwehr neben seiner jetzigen Stelle
    k.goal = k.dir > 0 ? p.x - 40 * T.k - c.gap - 14 : p.x + 40 * T.k + 14;
    k.speed = k.at ? 0 : 35 + (k.dir > 0 ? p.v : 0);
    k.x += k.dir * k.speed * dt;
    if ((k.goal - k.x) * k.dir <= 0) { k.x = k.goal; k.at = true; }
    if (k.at) k.atT += dt;
    if (k.atT > 3) stopSiren(k); else updateSiren(k);   // nach dem Ankommen noch kurz weiter
    if (k.at && (c.burning || Math.random() < 0.3)) {
      // Flughafenfeuerwehr löscht mit Schaum: im Bogen aus dem Werfer auf dem Dach
      const tx = fires()[k.dir > 0 ? 0 : fires().length - 1];
      const d = tx - (k.x + k.dir * 2.3);
      particles.push({ x: k.x + k.dir * 2.3, a: 4.5, vx: d / 1.1 + (Math.random() - 0.5) * 3, va: 12 + Math.random() * 2,
                       life: 1.1, max: 1.1, r: 0.5, grow: 0.7, color: '245,248,252', g: 22 });
      // nach dem Aussteigen spritzt auch die Mannschaft mit dem Schlauch
      if (k.atT > 2.5 && Math.random() < 0.6) {
        const hx = crewX(k, 0) + k.dir * 0.8, hd = tx - hx;
        particles.push({ x: hx, a: 1.4, vx: hd / 0.8 + (Math.random() - 0.5) * 2, va: 7 + Math.random(),
                         life: 0.8, max: 0.8, r: 0.3, grow: 0.5, color: '245,248,252', g: 18 });
      }
    }
  }
  if (spraying) c.foam = Math.min(1, c.foam + dt * 0.12);
  // die Passagiere rutschen raus und rennen weg vom Flugzeug
  if (c.stopT !== null && c.t > c.stopT + 0.8 && c.people.length < Math.min(pax.n, 24) && Math.random() < dt * 6) {
    const front = c.people.length % 2 === 0;
    c.people.push({ x: front ? doorX(true) : doorX(false), dir: front ? 1 : -1, v: 3 + Math.random() * 2,
                    goal: (front ? 1 : -1) * (25 + Math.random() * 20) * Math.max(T.k, 0.5), col: PEOPLE_COLORS[c.people.length % PEOPLE_COLORS.length], ph: Math.random() * 6 });
  }
  for (const q of c.people) {
    const home = q.dir > 0 ? doorX(true) : doorX(false);
    if ((home + q.goal - q.x) * q.dir > 0) q.x += q.dir * q.v * dt; else q.stop = true;
  }
}
const PEOPLE_COLORS = ['#e74c3c', '#3498db', '#f1c40f', '#9b59b6', '#2ecc71', '#e67e22', '#ff6fb5'];

function fires() {
  const k = PT().k, c = p.wreck;
  const list = [p.x - 2 * k, p.x + 8 * k];
  if (c.broken) list.unshift(p.x - 10 * k - c.gap);
  return list;
}
function doorX(front) {
  const k = PT().k;
  return front ? p.x + (PT().nose[0] - 2) * k : p.x - 16 * k - (p.wreck.broken ? p.wreck.gap : 0);
}

function drawFire(X, Y, size) {
  for (let i = 0; i < 5; i++) {
    const fl = 0.7 + 0.3 * Math.sin(time * 13 + i * 2.1) + 0.15 * Math.sin(time * 23 + i);
    const w = size * (0.5 + 0.12 * i), hgt = size * (1.4 - i * 0.18) * fl;
    const x = X + (i - 2) * size * 0.28;
    const g = ctx.createLinearGradient(0, Y, 0, Y - hgt);
    g.addColorStop(0, 'rgba(255,240,150,0.95)'); g.addColorStop(0.4, 'rgba(255,140,30,0.9)'); g.addColorStop(1, 'rgba(200,40,10,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x - w / 2, Y);
    ctx.quadraticCurveTo(x - w * 0.4, Y - hgt * 0.5, x, Y - hgt);
    ctx.quadraticCurveTo(x + w * 0.4, Y - hgt * 0.5, x + w / 2, Y);
    ctx.closePath(); ctx.fill();
  }
}

// Flughafen-Löschfahrzeug mit drei Achsen, Rollläden und Schaumwerfer auf dem Dach
function crewX(k, i) { return k.x + k.dir * (4 + Math.min(Math.max(k.atT - 0.8, 0), 1.6) * 2 - i * 1.6); }
function drawTruck(k) {
  const X = sx(k.x), Y = sy(0) - 3, s = S, d = k.dir;
  const moving = !k.at, bob = moving ? Math.sin(time * 18 + k.x) * 0.04 : 0;
  ctx.save(); ctx.translate(X, Y); ctx.scale(d * s, s);
  // Schatten und Fahrgestell
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(-0.4, 0, 6.4, 0.35, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2b2d31'; ctx.fillRect(-6.1, -1.6, 11.6, 0.7);
  ctx.translate(0, bob);
  // Aufbau
  ctx.fillStyle = '#d61f1a';
  ctx.beginPath(); ctx.roundRect(-6.4, -3.6, 8.9, 2.3, 0.25); ctx.fill();
  // Rollläden mit Lamellen
  for (const x0 of [-6.0, -3.5, -1.0]) {
    ctx.fillStyle = '#b9bec5'; ctx.fillRect(x0, -3.35, 2.2, 1.3);
    ctx.strokeStyle = 'rgba(80,85,95,0.6)'; ctx.lineWidth = 0.05;
    ctx.beginPath();
    for (let y = -3.2; y < -2.05; y += 0.16) { ctx.moveTo(x0, y); ctx.lineTo(x0 + 2.2, y); }
    ctx.stroke();
    ctx.fillStyle = '#6b7079'; ctx.fillRect(x0 + 0.9, -2.15, 0.4, 0.08);   // Griff
  }
  // Leuchtstreifen: weiß mit Schriftzug, hinten rot-weiß schraffiert
  ctx.fillStyle = '#ffffff'; ctx.fillRect(-6.4, -1.95, 11.9, 0.5);
  ctx.save(); ctx.beginPath(); ctx.rect(-6.4, -1.95, 1.4, 0.5); ctx.clip();
  ctx.fillStyle = '#d61f1a';
  for (let x = -7; x < -4.8; x += 0.5) { ctx.beginPath(); ctx.moveTo(x, -1.45); ctx.lineTo(x + 0.25, -1.45); ctx.lineTo(x + 0.75, -1.95); ctx.lineTo(x + 0.5, -1.95); ctx.fill(); }
  ctx.restore();
  ctx.save(); ctx.translate(-1.5, -1.68); ctx.scale(d, 1);   // Schrift nicht spiegeln
  ctx.fillStyle = '#d61f1a'; ctx.font = 'bold 0.42px system-ui, -apple-system, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('FEUERWEHR', 0, 0);
  ctx.restore();
  // Fahrerhaus mit schräger Front
  ctx.fillStyle = '#d61f1a';
  poly([[2.5, -3.7], [4.5, -3.7], [5.6, -2.4], [5.6, -1.3], [2.5, -1.3]]); ctx.fill();
  ctx.fillStyle = '#1d2a3a';
  poly([[4.45, -3.5], [5.35, -2.45], [4.6, -2.45], [4.05, -3.5]]); ctx.fill();         // Frontscheibe
  ctx.fillStyle = '#9fd3ff';
  ctx.beginPath(); ctx.roundRect(2.8, -3.45, 1.05, 0.95, 0.1); ctx.fill();               // Seitenfenster
  ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillRect(2.9, -3.35, 0.3, 0.75);
  ctx.strokeStyle = 'rgba(90,10,10,0.6)'; ctx.lineWidth = 0.06;
  ctx.beginPath(); ctx.roundRect(2.7, -3.55, 1.3, 2.2, 0.1); ctx.stroke();                // Tür
  ctx.fillStyle = '#2b2d31'; ctx.fillRect(4.1, -3.1, 0.12, 0.6);                           // Spiegel
  ctx.fillStyle = '#ffeaa0'; ctx.fillRect(5.42, -1.85, 0.2, 0.3);                          // Scheinwerfer
  ctx.fillStyle = '#9aa0a8'; ctx.fillRect(5.3, -1.45, 0.6, 0.3);                           // Stoßstange
  // Werfer auf dem Dach, zielt beim Löschen hoch aufs Feuer
  const aim = k.at ? -35 * DEG + Math.sin(time * 1.5) * 4 * DEG : 0;
  ctx.fillStyle = '#9aa0a8'; ctx.fillRect(0.7, -3.95, 0.6, 0.35);
  ctx.save(); ctx.translate(1, -3.9); ctx.rotate(aim);
  ctx.fillStyle = '#c9ced5'; ctx.fillRect(0, -0.14, 1.6, 0.28);
  ctx.fillStyle = '#6b7079'; ctx.fillRect(1.45, -0.18, 0.2, 0.36);
  ctx.restore();
  // Blaulicht: vorne auf dem Fahrerhaus und hinten auf dem Aufbau, abwechselnd
  const ph = (time * 5) % 1, onA = ph < 0.25 || (ph > 0.5 && ph < 0.6), onB = !onA && ph < 0.75;
  ctx.fillStyle = '#2b2d31'; ctx.fillRect(2.9, -3.85, 1.4, 0.15);
  ctx.fillStyle = onA ? '#4d8bff' : '#123a99'; ctx.fillRect(2.95, -4.05, 0.55, 0.22);
  ctx.fillStyle = onB ? '#4d8bff' : '#123a99'; ctx.fillRect(3.7, -4.05, 0.55, 0.22);
  ctx.fillStyle = onB ? '#4d8bff' : '#123a99'; ctx.fillRect(-6.2, -3.85, 0.5, 0.25);
  ctx.restore();
  // Räder drehen sich beim Fahren
  for (const x of [-4.6, -3.0, 3.4]) {
    const wx = X + d * x * s, wy = Y - 0.72 * s, r = 0.72 * s, a = k.x / 0.72 * d;
    ctx.fillStyle = '#1b1b1f'; ctx.beginPath(); ctx.arc(wx, wy, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#a7adb5'; ctx.beginPath(); ctx.arc(wx, wy, r * 0.45, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5b626d';
    for (let i = 0; i < 5; i++) { const b = a + i * Math.PI * 0.4; ctx.beginPath(); ctx.arc(wx + Math.cos(b) * r * 0.28, wy + Math.sin(b) * r * 0.28, r * 0.07, 0, Math.PI * 2); ctx.fill(); }
  }
  for (const [x, y, on] of [[3.22, -3.95, onA], [3.97, -3.95, onB], [-5.95, -3.75, onB]]) if (on) glowDot(X + d * x * s, Y + (y + bob) * s, 4 * s, '#5a8cff');
  if (moving) glowDot(X + d * 5.6 * s, Y - 1.7 * s, 2.5 * s, '#fff3c0');
  // Mannschaft in silbernen Schutzanzügen steigt aus, einer hält den Schlauch
  if (k.atT > 0.8) for (let i = 0; i < 2; i++) drawFirefighter(k, i);
}

function drawFirefighter(k, i) {
  const x = crewX(k, i), X = sx(x), Y = sy(0) - 3, s = Math.max(1.4, S * 0.55), d = k.dir;
  const walking = k.atT < 2.4, step = walking ? Math.sin(time * 12 + i * 2) * 0.5 : 0;
  if (i === 0) {
    // Schlauch vom Auto zur Hand
    ctx.strokeStyle = '#c8a04a'; ctx.lineWidth = Math.max(1, s * 0.25);
    ctx.beginPath(); ctx.moveTo(sx(k.x + d * 1.5), Y - 1.2 * S); ctx.quadraticCurveTo((sx(k.x + d * 1.5) + X) / 2, Y, X + d * 0.6 * s, Y - 2.4 * s); ctx.stroke();
  }
  ctx.strokeStyle = '#8e949c'; ctx.lineWidth = Math.max(1, s * 0.35);
  ctx.beginPath();
  ctx.moveTo(X, Y - 1.6 * s); ctx.lineTo(X - step * s, Y);
  ctx.moveTo(X, Y - 1.6 * s); ctx.lineTo(X + step * s, Y);
  ctx.stroke();
  ctx.fillStyle = '#c9ced5'; ctx.fillRect(X - 0.5 * s, Y - 3.3 * s, 1 * s, 1.8 * s);
  ctx.fillStyle = '#ffd34d'; ctx.fillRect(X - 0.5 * s, Y - 2.2 * s, 1 * s, 0.25 * s);      // Leuchtstreifen
  ctx.fillStyle = '#ffd34d'; ctx.beginPath(); ctx.arc(X, Y - 3.75 * s, 0.55 * s, Math.PI, 0); ctx.fill();   // Helm
  ctx.fillStyle = '#f1c9a5'; ctx.fillRect(X - 0.35 * s, Y - 3.75 * s, 0.7 * s, 0.45 * s);
  if (i === 0) { ctx.fillStyle = '#6b7079'; ctx.fillRect(X + (d > 0 ? 0.3 : -1.1) * s, Y - 2.6 * s, 0.8 * s, 0.25 * s); }   // Strahlrohr
}

function drawPerson(q) {
  const X = sx(q.x), Y = sy(0) - 3, s = Math.max(1.4, S * 0.55);
  const step = q.stop ? 0 : Math.sin(time * 14 + q.ph) * 0.6;
  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = Math.max(1, s * 0.3);
  ctx.beginPath();
  ctx.moveTo(X, Y - 1.6 * s); ctx.lineTo(X - step * s, Y);
  ctx.moveTo(X, Y - 1.6 * s); ctx.lineTo(X + step * s, Y);
  ctx.stroke();
  ctx.fillStyle = q.col; ctx.fillRect(X - 0.45 * s, Y - 3.2 * s, 0.9 * s, 1.7 * s);
  ctx.fillStyle = '#f1c9a5'; ctx.beginPath(); ctx.arc(X, Y - 3.7 * s, 0.5 * s, 0, Math.PI * 2); ctx.fill();
  if (!q.stop) return;
  ctx.strokeStyle = '#f1c9a5';   // winken
  ctx.beginPath(); ctx.moveTo(X, Y - 3 * s); ctx.lineTo(X + 0.8 * s, Y - 4.2 * s + Math.sin(time * 8 + q.ph) * 0.4 * s); ctx.stroke();
}

function drawSlide(front) {
  const X = sx(doorX(front)), Y = sy(PT().gearH * PT().k * 0.9 - p.drop), G = sy(0) - 3;
  const d = front ? 1 : -1;
  ctx.fillStyle = '#ffcc1f';
  ctx.beginPath(); ctx.moveTo(X - 1.2 * S, Y); ctx.lineTo(X + 1.2 * S, Y); ctx.lineTo(X + d * 10 * S * Math.max(PT().k, 0.5), G); ctx.lineTo(X + d * 7 * S * Math.max(PT().k, 0.5), G); ctx.closePath(); ctx.fill();
}

function drawBoat(b) {
  const X = sx(b.x), Y = sy(0), s = S;
  ctx.save(); ctx.translate(X, Y); ctx.scale(s, s);
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.moveTo(-7, -1.5); ctx.lineTo(6, -1.5); ctx.lineTo(4, 1); ctx.lineTo(-6, 1); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e8541c'; ctx.fillRect(-6.6, -0.6, 12, 0.6);
  ctx.fillStyle = '#e8541c'; ctx.fillRect(-3, -4, 4, 2.5);
  ctx.fillStyle = '#9fd3ff'; ctx.fillRect(-2.5, -3.5, 3, 1);
  ctx.fillStyle = (time * 4) % 1 < 0.5 ? '#3d7bff' : '#123a99'; ctx.fillRect(-1.5, -4.6, 1, 0.6);
  ctx.restore();
  // Rettungsinseln
  for (let i = 0; i < Math.floor(b.rafts); i++) {
    const rx = sx(p.x + (-14 + i * 12) * PT().k), ry = sy(0) + 1 + Math.sin(time * 2 + i) * 1.2;
    ctx.fillStyle = '#ff7a1a';
    ctx.beginPath(); ctx.ellipse(rx, ry, 3.5 * S * 0.6, 1.1 * S * 0.6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f1c9a5';
    for (let j = -1; j <= 1; j++) { ctx.beginPath(); ctx.arc(rx + j * S * 0.9, ry - S * 0.8, S * 0.35, 0, Math.PI * 2); ctx.fill(); }
  }
}

function drawWreckFx() {
  const c = state === 'crashed' && p.wreck;
  if (!c) return;
  if (p.crash === 'sea') { if (c.boat) drawBoat(c.boat); return; }
  const G = sy(0) - 3;

// ── Passagiere ─────────────────────────────────────────────────────

function newPax() {
  const [lo, hi] = PT().pax;
  return { n: lo + Math.floor(Math.random() * (hi - lo + 1)), mood: 80, text: '', who: '', t: 0, wait: 5, said: new Set(), ouch: 0 };

function say(text, key) {
  if (key && pax.said.has(key)) return;
  if (pax.t > 0.8) return;   // erst ausreden lassen
  if (key) pax.said.add(key);
  pax.text = text;
  pax.who = PEOPLE[Math.floor(Math.random() * PEOPLE.length)];
  pax.t = 3.5;
  pax.wait = 7 + Math.random() * 6;
}

function updatePax(dt) {
  pax.t -= dt; pax.wait -= dt; pax.ouch -= dt;

  let bad = 0, why = '';
  if (!p.onGround) {
    if (Math.abs(p.pitch) > 15) { bad += (Math.abs(p.pitch) - 15) * 1.5; why = p.pitch > 0 ? 'Huiii, nicht so steil! 😱' : 'Mir wird schlecht! 🤢'; }
    if (Math.abs(p.roll) > 28) { bad += Math.abs(p.roll) - 28; why = 'Uiii, alles kippt um! 😵'; }
    if (p.vy < -25) { bad += (-p.vy - 25) * 0.6; why = 'Mein Saft fliegt durch die Luft! 🧃'; }
    if (p.v < VR - 9) { bad += 6; why = 'Warum ist es so leise? 😨'; }
  }
  if (bad > 0) {
    pax.mood -= bad * dt;
    if (pax.ouch <= 0) { pax.t = 0; say(why); pax.ouch = 4; }
  } else if (p.flown && !p.onGround) {
    pax.mood += 1.2 * dt;   // ruhiger Flug: langsam wieder gute Laune
  }
  pax.mood = clamp(pax.mood, 0, 100);

  const dist = DEST - p.x;
  if (welcomeT < 2.5) say(`Juhu, wir fliegen nach ${R.name}! ${R.icon}`, 'start');
  if (p.flown) say('Wir heben ab! 🎉', 'lift');
  if (p.flown && p.y > 150) {
    if (weather === 'rain') say('Es regnet ja! ☔', 'wx');
    if (weather === 'storm') say('Huch, es wackelt ganz schön! 😬', 'wx');
    if (weather === 'snow') say('Guck mal, es schneit! ☃️', 'wx');
  }
  if (p.y > 600) say(night ? 'Guck mal, die vielen Sterne! ✨' : 'Schau mal, wir sind über den Wolken! ☁️', 'high');
  if (p.x > SEA_FROM && p.x < SEA_TO) say(`Da unten ist ${R.seaName}! 🌊`, 'sea');
  if (R.desert && p.x > DEST_FROM) say('Ich sehe Kamele! 🐪', 'desert');
  if (dist < 9000 && dist > 0) say(`Ich kann schon ${R.name} sehen! ${R.icon}`, 'see');
  if (p.flown && p.gearDown && p.gear > 0.95 && dist < 9000) say('Was hat da so gerumpelt? Ach, das Fahrwerk!', 'gear');

function paxTouchdown(sink) {

}

const paxWord = () => pax.n === 1 ? 'Passagier' : 'Passagiere';
function paxFace(m) {
  return m > 85 ? '😍' : m > 65 ? '😀' : m > 45 ? '🙂' : m > 25 ? '😟' : '😱';
}

function paxVerdict(r) {
  if (!r.ok) return pax.n === 1 ? `😤 Dein Passagier wollte doch zur ${R.name}!` : `😤 Die ${pax.n} Passagiere wollten doch nach ${R.name}!`;

  if (pax.n === 1) return `${paxFace(m)} Dein Passagier ${how.replace('sind', 'ist').replace('hatten', 'hatte')}!`;

function drawBubble() {
  if (pax.t <= 0) return;
  const u = clamp(Math.min(W(), H()) / 400, 0.8, 1.4);
  const fs = 14 * u;
  const str = `${pax.who} ${pax.text}`;
  ctx.font = `bold ${fs}px system-ui, -apple-system, sans-serif`;
  const bw = Math.min(W() - 24, ctx.measureText(str).width + 22), bh = fs * 2;
  let tx, ty, bx, by;
  if (view === 'cockpit') {
    // im Cockpit hört man die Passagiere durch die Tür
    bx = W() / 2 - bw / 2; by = H() * 0.2;
  } else {
    tx = sx(p.x) + 6 * S; ty = sy(p.y) - 6 * S;
    bx = clamp(tx - bw * 0.3, 12, W() - 12 - bw);
    by = clamp(ty - bh - 14 * u, 12, H() - bh - 12);

  ctx.globalAlpha = clamp(pax.t * 3, 0, 1);
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 12); ctx.fill();

    ctx.beginPath(); ctx.moveTo(fx - 7, by + bh - 1); ctx.lineTo(fx + 7, by + bh - 1); ctx.lineTo(tx, Math.min(ty, by + bh + 14 * u)); ctx.fill();

  txt(str, bx + bw / 2, by + bh / 2, fs, '#1d2433');
  ctx.globalAlpha = 1;
}

function updateParticles(dt) {
  for (const q of particles) {
    q.life -= dt;
    q.x += q.vx * dt;
    q.a += q.va * dt;
    if (q.g) q.va -= q.g * dt;
    if (q.bounce && q.a < 0) { q.a = 0; q.va *= -0.35; q.vx *= 0.6; }
    q.r += q.grow * dt;
  }
  particles = particles.filter(q => q.life > 0);
  for (const c of contrail) c.t += dt;
  contrail = contrail.filter(c => c.t < 2.5);
}

// ── Hinweise für den Piloten ───────────────────────────────────────
function glideAlt(x) { return (DEST - x) * Math.tan(GLIDE); }

function hint() {
  if (PT().glider) return gliderHint();
  const dist = DEST - p.x;
  if (welcomeT > 0) return [weather === 'sun' ? `🔔 Bitte anschnallen! Wir fliegen nach ${R.name}.` : `🔔 Anschnallen! Heute: ${WX().icon} ${WX().name} und Seitenwind`, false];
  const side = p.z > 0 ? 'links ◀' : 'rechts ▶';
  if (p.onGround && Math.abs(p.z) > 12) return [`Bleib in der Mitte der Bahn! Lenk nach ${side}`, true];
  if (p.onGround && !p.flown) {
    if (p.throttle < 0.7) return ['Gib Schub! Halte „Schub +“ gedrückt.', false];
    if (p.v < VR * 0.93) return [`Schneller werden … bei ${Math.round(VR * 3.6)} km/h abheben!`, false];
    return ['Jetzt die Nase hoch! ▲', false];
  }
  if (p.onGround) return [p.throttle > 0.05 ? 'Schub ganz weg! Und bremsen! 🛑' : 'Bremse halten! 🛑', true];
  if (p.v < VR - 9) return ['⚠️ Zu langsam! Mehr Schub und Nase runter!', true];
  if (p.gear > 0.5 && p.v > 110 && dist > 5000) return ['Fahrwerk einfahren! Sonst bremst es dich.', true];
  if (dist < 5000 && !p.gearDown) return ['Fahrwerk ausfahren! ⚙️', true];
  if (dist < 25000 && p.v > (PT().cargo ? 250 : 160)) return ['Langsamer werden! Schub weg, bald kommt die Landung.', true];
  if (PT().supersonic && p.v > 200 && p.v < MACH1 && !p.boomed && dist > 30000) return ['Volle Kraft für den Nachbrenner! 🔥 Schaffst du Überschall?', false];
  if (dist < 8000 && p.v > VR + 30) return ['Zu schnell für die Landung! Schub weg.', true];
  if (PT().weapon && !p.onGround && dist > GLIDE_LEN + 3000) { const bh = balloonHint(); if (bh) return bh; }
  if (PT().cargo && !p.onGround && dist > GLIDE_LEN + 3000) { const ch = cargoHint(); if (ch) return ch; }
  if (dist < GLIDE_LEN + 3000 && Math.abs(p.z) > 40) return [`Die Landebahn ist ${side} – schau aufs Radar`, true];
  if (dist >= GLIDE_LEN + 3000 && Math.abs(p.hdg) > 25 * DEG) return [`${R.name} liegt ${p.hdg > 0 ? 'links ◀' : 'rechts ▶'}`, false];
  if (dist < 1500 && p.y < 30) return ['Gleich am Boden: Nase ganz leicht hoch ▲', false];
  if (dist < GLIDE_LEN + 1500 && p.y > glideAlt(p.x) + 60) return ['Zeit für den Sinkflug! Folge den grünen Punkten ▼', false];
  if (dist < GLIDE_LEN && p.y < glideAlt(p.x) - 60) return ['Zu tief! Etwas höher ▲', true];
  if (dist < GLIDE_LEN) return ['Super, genau auf den grünen Punkten! 👍', false];
  if (p.y < 600) return ['Steig auf Reiseflughöhe: über 6000 m ▲', false];
  if (p.x > SEA_FROM && p.x < SEA_TO) return [`Unter dir ist ${R.seaName} 🌊`, false];
  if (R.desert && p.x > DEST_FROM) return ['Unter dir ist die Wüste 🐪', false];
  return ['Reiseflug! Genieß die Aussicht ☁️', false];
}

  ctx.beginPath(); ctx.arc(x, y, 0.32, 0, Math.PI * 2); ctx.fill();
  // Speichen drehen sich beim Rollen
  const a = state !== 'menu' && p && !PARKED ? p.x / 0.62 : 0;
  ctx.strokeStyle = '#4a4f57'; ctx.lineWidth = 0.08;
  ctx.beginPath();
  for (let i = 0; i < 3; i++) {
    const b = a + i * Math.PI / 3;
    ctx.moveTo(x - Math.cos(b) * 0.3, y - Math.sin(b) * 0.3); ctx.lineTo(x + Math.cos(b) * 0.3, y + Math.sin(b) * 0.3);
  }
  ctx.stroke();
}

const lerp2 = (A, B, t) => [A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t];

function drawWingExtras(T) {
  if (T.noFlaps) return;
  const [rf, tf, tb, rb] = T.wing;
  // Landeklappen klappen hinten am Flügel nach unten und hinten
  if (EXT.flaps > 0.02) {
    const f = EXT.flaps;
    for (const [a, b] of [[0.08, 0.42], [0.48, 0.82]]) {
      const P = lerp2(rb, tb, a), Q = lerp2(rb, tb, b);
      ctx.fillStyle = '#b9c2cc';
      ctx.beginPath(); ctx.moveTo(...P); ctx.lineTo(...Q);
      ctx.lineTo(Q[0] - 1.6 * f, Q[1] + 1.3 * f); ctx.lineTo(P[0] - 1.6 * f, P[1] + 1.3 * f);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(70,80,100,0.6)'; ctx.lineWidth = 0.1; ctx.stroke();
    }
  }
  // Störklappen oben auf dem Flügel
  if (EXT.spoil > 0.02) {
    ctx.fillStyle = '#aab3bd';
    for (let i = 0; i < 4; i++) {
      const P = lerp2(rf, tf, 0.3 + i * 0.12), Q = lerp2(rf, tf, 0.38 + i * 0.12);
      ctx.beginPath(); ctx.moveTo(...P); ctx.lineTo(...Q); ctx.lineTo(Q[0] - 0.4, Q[1] - 1.1 * EXT.spoil); ctx.lineTo(P[0] - 0.4, P[1] - 1.1 * EXT.spoil);
      ctx.closePath(); ctx.fill();
    }
  }
}

function panelLines(x0, x1) {
  ctx.strokeStyle = 'rgba(90,100,120,0.18)'; ctx.lineWidth = 0.08;
  ctx.beginPath();
  for (let x = x0; x < x1; x += 5.5) { ctx.moveTo(x, -8); ctx.lineTo(x, 8); }
  ctx.stroke();
  // Licht oben, Schatten unten am runden Rumpf
  const g = ctx.createLinearGradient(0, -5, 0, 5);
  g.addColorStop(0, 'rgba(255,255,255,0.25)'); g.addColorStop(0.35, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(40,50,70,0.22)');
  ctx.fillStyle = g; ctx.fillRect(-45, -8, 90, 16);
}

function cockpitPanes(pts) {
  const [tl, tr, br, bl] = pts;
  ctx.strokeStyle = 'rgba(230,235,240,0.85)'; ctx.lineWidth = 0.15;
  ctx.beginPath();
  for (const t of [0.36, 0.7]) { ctx.moveTo(...lerp2(tl, tr, t)); ctx.lineTo(...lerp2(bl, br, t)); }
  ctx.stroke();
}

function drawEngine(x0, cy, shade) {
  // Pylon
  ctx.fillStyle = '#b7c0ca';
  ctx.beginPath();
  ctx.moveTo(x0 + 1, cy - 1.2); ctx.lineTo(x0 + 6, cy - 1.2); ctx.lineTo(x0 + 4, cy - 3); ctx.lineTo(x0 - 1, cy - 3);
  ctx.closePath(); ctx.fill();
  // Gondel
  const g = ctx.createLinearGradient(0, cy - 1.5, 0, cy + 1.5);
  g.addColorStop(0, shade ? '#e9edf2' : '#ffffff');
  g.addColorStop(1, shade ? '#a9b2bd' : '#c3cad3');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.roundRect(x0, cy - 1.5, 7, 3, 1.3); ctx.fill();
  ctx.strokeStyle = 'rgba(60,70,90,0.5)'; ctx.lineWidth = 0.12; ctx.stroke();
  ctx.fillStyle = GREEN;
  ctx.fillRect(x0 + 1.2, cy - 1.5, 0.5, 3);
  ctx.strokeStyle = 'rgba(60,70,90,0.35)'; ctx.lineWidth = 0.08;
  ctx.beginPath(); ctx.moveTo(x0 + 4.3, cy - 1.5); ctx.lineTo(x0 + 4.3, cy + 1.5); ctx.stroke();
  if (EXT.rev > 0.05) {
    // Schubumkehr: die Hülle schiebt sich nach hinten auf
    ctx.fillStyle = '#3a3f48';
    ctx.fillRect(x0 + 3.2 - EXT.rev * 0.6, cy - 1.5, 1.1 * EXT.rev, 3);
  }
  // Einlass vorne, Düse hinten
  ctx.fillStyle = '#2a2f38';
  ctx.beginPath(); ctx.ellipse(x0 + 7, cy, 0.45, 1.35, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#6b7380';
  ctx.beginPath(); ctx.moveTo(x0, cy - 0.8); ctx.lineTo(x0 - 1.4, cy); ctx.lineTo(x0, cy + 0.8); ctx.closePath(); ctx.fill();
}
