  ctx.strokeStyle = 'rgba(70,80,100,0.6)'; ctx.lineWidth = 0.15; ctx.stroke();

  // Fenster: zwei Decks
  ctx.fillStyle = '#2b3a55';
  for (let x = -16; x < 26.5; x += 1.25) if (Math.abs(x - 2) > 1 && Math.abs(x - 14) > 1) ctx.fillRect(x, -2.7, 0.55, 0.75);
  for (let x = -19; x < 29.5; x += 1.25) if (Math.abs(x - 9.5) > 1 && Math.abs(x + 4) > 1) ctx.fillRect(x, 0.3, 0.55, 0.75);
  // Türen
  ctx.strokeStyle = 'rgba(80,90,110,0.7)'; ctx.lineWidth = 0.12;
  for (const x of [28.4, 9.4, -4.1, -18.6]) { ctx.beginPath(); ctx.roundRect(x, -0.3, 1.1, 2.1, 0.3); ctx.stroke(); }
  for (const x of [1.9, 13.9, -14.5]) { ctx.beginPath(); ctx.roundRect(x, -3.3, 1.0, 1.9, 0.3); ctx.stroke(); }
  // Cockpit
  ctx.fillStyle = '#1d2433';
  ctx.beginPath();
  ctx.moveTo(31.8, -1.7); ctx.lineTo(34.4, -1.7); ctx.lineTo(35.3, -0.6); ctx.lineTo(31.8, -0.7);
  ctx.closePath(); ctx.fill();
  cockpitPanes(PLANES.a380.cockpit);
  // Name
  ctx.fillStyle = BLUE;
  ctx.font = 'bold 1.45px system-ui, -apple-system, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('Henrik Airlines', -6, -0.85);

  // Höhenleitwerk
  ctx.fillStyle = '#dfe4ea';
  ctx.beginPath();
  ctx.moveTo(-28, -1.4); ctx.lineTo(-38.5, -3.6); ctx.lineTo(-40, -2.9); ctx.lineTo(-31.5, -0.5);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(70,80,100,0.5)'; ctx.stroke();

  // Fahrwerk (wird beim Einfahren kürzer)
  if (gear > 0.12) {
    const L = 3.4 * gear;
    ctx.strokeStyle = '#5b626d'; ctx.lineWidth = 0.45;
    ctx.beginPath();
    ctx.moveTo(30, 3.8); ctx.lineTo(30, 4.2 + L);
    ctx.moveTo(-5.5, 3.8); ctx.lineTo(-5.5, 4.2 + L);
    ctx.moveTo(0.3, 3.6); ctx.lineTo(0.3, 4.2 + L);
    ctx.stroke();
    ctx.lineWidth = 0.3;
    ctx.beginPath(); ctx.moveTo(-7.3, 4.2 + L); ctx.lineTo(-3.7, 4.2 + L); ctx.stroke();
    for (const x of [-7.3, -5.5, -3.7]) drawWheel(x, 4.2 + L);
    for (const x of [-0.6, 1.2]) drawWheel(x, 4.2 + L);
    drawWheel(30, 4.2 + L);
  }

  // Flügel und Triebwerke
  ctx.fillStyle = '#cfd6de';
  ctx.beginPath();
  ctx.moveTo(10, 3); ctx.lineTo(-20, 0.4); ctx.lineTo(-21.8, 1.1); ctx.lineTo(-5, 4.5);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(70,80,100,0.6)'; ctx.lineWidth = 0.15; ctx.stroke();
  ctx.fillStyle = GREEN;
  ctx.beginPath(); ctx.moveTo(-20.2, 0.5); ctx.lineTo(-21.6, -1.4); ctx.lineTo(-22.4, -1.2); ctx.lineTo(-21.8, 1.1); ctx.closePath(); ctx.fill();
  drawWingExtras(PLANES.a380);
  drawEngine(-8, 4.1, true);
  drawEngine(2, 5.6, false);

  // Blinklichter
  if (lights) {
    const blink = (time % 1.2) < 0.12;
    if (blink) {
      ctx.fillStyle = 'rgba(255,40,40,0.95)';
      ctx.beginPath(); ctx.arc(0, -4.5, 0.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,40,40,0.25)';
      ctx.beginPath(); ctx.arc(0, -4.5, 1.8, 0, Math.PI * 2); ctx.fill();
    }
    if ((time % 1.2) > 0.6 && (time % 1.2) < 0.68) {
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.arc(-21.8, -1, 1.2, 0, Math.PI * 2); ctx.fill();
    }
  }
}

// ── Zeichnen: Welt ─────────────────────────────────────────────────
const FIELDS = ['#5da84a', '#6bb04f', '#4f9a3f', '#8fbf5a', '#c9b85a', '#a8c060', '#7a9a3a', '#b98f5a'];

function landFactor(x) {
  if (x < SEA_FROM) return clamp((SEA_FROM - x) / 1500, 0, 1);
  if (x > SEA_TO) return clamp((x - SEA_TO) / 1500, 0, 1);
  return 0;
}

// Himmel färbt sich auf den letzten Kilometern wie am Ziel, oben wird er dunkler
function skyColors(t) {
  const k = clamp((p.x - (DEST - 20000)) / 12000, 0, 1);
  return [
    lerpRGB(lerpRGB(hex2rgb('#4a9be6'), hex2rgb(R.sky[0]), k), hex2rgb('#0b2a66'), t),
    lerpRGB(lerpRGB(hex2rgb('#cfe9ff'), hex2rgb(R.sky[1]), k), hex2rgb('#4f86cf'), t),
  ];
}

function drawSky() {
  const t = clamp(cam.a / 1100, 0, 1);
  const [top, low] = skyColors(t);
  const g = ctx.createLinearGradient(0, 0, 0, H());
  g.addColorStop(0, rgb(top));
  g.addColorStop(1, rgb(low));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W(), H());
  if (night || weather !== 'sun') return;   // Mond und Sterne kommen erst nach dem Abdunkeln
  // Sonne
  const sxp = W() * 0.82, syp = H() * 0.16;
  const sg = ctx.createRadialGradient(sxp, syp, 0, sxp, syp, 90);
  sg.addColorStop(0, 'rgba(255,250,220,0.95)');
  sg.addColorStop(0.25, 'rgba(255,240,180,0.6)');
  sg.addColorStop(1, 'rgba(255,240,180,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(sxp, syp, 90, 0, Math.PI * 2); ctx.fill();
}

function drawFarClouds(offset, vshift) {
  const span = W() + 400;
  for (let i = 0; i < 8; i++) {
    const x = ((rand(i) * span - offset) % span + span) % span - 200;
    const y = H() * (0.08 + rand(i + 20) * 0.55) + vshift;
    cloud(x, y, 14 + rand(i + 40) * 22, 0.45);
  }
}

function drawHills(gy) {
  if (gy > H() + 10 || gy < -200) return;
  const layers = [
    { par: 0.2, amp: 70, col: mix('#8fb0b8', '#6f9aa8', 0.5), shift: 0 },
    { par: 0.45, amp: 35, col: p.x > DEST_FROM - 3000 ? R.hill : '#6c9a6e', shift: 3 },
  ];
  for (const L of layers) {
    ctx.fillStyle = L.col;
    ctx.beginPath();
    ctx.moveTo(-10, gy);
    for (let x = -10; x <= W() + 10; x += 8) {
      const wx = p.x * L.par + (x - W() * 0.35) / S;
      const real = p.x + (x - W() * 0.35) / S / L.par;
      const big = real > DEST_FROM - 2000 ? R.hills : 1;   // am Ziel sind die Hügel anders hoch
      const h = (0.55 + 0.25 * Math.sin(wx / 530 + L.shift) + 0.15 * Math.sin(wx / 210 + 1.3) + 0.08 * Math.sin(wx / 90 + 2.1))
              * L.amp * landFactor(real) * big;
      ctx.lineTo(x, gy - h * S * 0.6);
    }
    ctx.lineTo(W() + 10, gy);
    ctx.closePath();
    ctx.fill();
  }
}

function drawSkyline(gy, lightsOnly = false) {
  // Frankfurter Hochhäuser in der Ferne
  for (let i = 0; i < 26; i++) {
    const bx = -900 + i * 140;
    const x = W() * 0.35 + (bx - p.x) * S * 0.3;
    const w = (30 + rand(i + 5) * 35) * S * 0.3;
    if (x + w < 0 || x > W()) continue;
    const h = (40 + rand(i + 9) * 130) * S * 0.3;
    if (lightsOnly) {
      // nachts ist nur jedes zweite Fenster an
      for (let wy = gy - h + 4, n = 0; wy < gy - 4; wy += 7, n++) {
        if (rand(i * 31 + n) < 0.5) continue;
        ctx.fillStyle = 'rgba(255,215,120,0.85)';
        ctx.fillRect(x + 2, wy, w - 4, 1.5);
      }
      ctx.fillStyle = (time + i * 0.3) % 1.5 < 0.75 ? '#ff3030' : '#801818';
      ctx.fillRect(x + w / 2 - 1, gy - h - 2, 2, 2);
      continue;
    }
    ctx.fillStyle = i % 3 === 0 ? '#7f93ae' : '#8ea1ba';
    ctx.fillRect(x, gy - h, w, h);
    if (i % 5 === 2) {
      ctx.beginPath(); ctx.moveTo(x, gy - h); ctx.lineTo(x + w / 2, gy - h - 20 * S * 0.3); ctx.lineTo(x + w, gy - h); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,240,180,0.35)';
    for (let wy = gy - h + 4; wy < gy - 4; wy += 7) ctx.fillRect(x + 2, wy, w - 4, 1.5);
  }
}

function drawLandmarksSide(gy) {
  for (const [kind, lx] of R.landmarks) {
    // weit hinten: bewegt sich langsam vorbei und ist schon von weitem zu sehen
    const X = W() * 0.35 + (DEST + lx - p.x) * S * 0.12;
    if (X < -500 * S || X > W() + 500 * S) continue;
    drawLandmark(kind, X, gy - 2, S * 0.4);
  }
}

function drawGround(gy) {
  if (gy > H()) return;
  const x0 = p.x - (W() * 0.35) / S, x1 = p.x + (W() * 0.65) / S;
  // Wiese mit Feldern in drei Reihen, die nach vorne größer werden
  ctx.fillStyle = '#5da84a';
  ctx.fillRect(0, gy, W(), H() - gy);
  if (x1 > DEST_FROM) { ctx.fillStyle = R.ground[0]; ctx.fillRect(Math.max(0, sx(DEST_FROM)), gy, W(), H() - gy); }
  const rows = [[0, 0.16, 90], [0.16, 0.42, 140], [0.42, 1, 220]];
  rows.forEach(([a, b, cw], ri) => {
    const ya = gy + (H() - gy) * a, yb = gy + (H() - gy) * b;
    const off = rand(ri + 0.5) * cw;
    for (let c = Math.floor((x0 - off) / cw); c * cw + off < x1; c++) {
      const cx0 = c * cw + off;
      if (landFactor(cx0) < 1 || landFactor(cx0 + cw) < 1) continue;
      const pal = cx0 > DEST_FROM ? R.fields : FIELDS;
      ctx.fillStyle = pal[Math.floor(rand(c * 3.1 + ri * 17) * pal.length)];
      ctx.fillRect(sx(cx0), ya, cw * S + 1, yb - ya + 1);
    }
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    ctx.fillRect(0, yb - 1, W(), 2);
  });
  // Strand und Meer
  const beach = 250;
  const s0 = Math.max(x0, SEA_FROM - beach), s1 = Math.min(x1, SEA_TO + beach);
  if (s0 < s1) { ctx.fillStyle = '#e8d49a'; ctx.fillRect(sx(s0), gy, (s1 - s0) * S, H() - gy); }
  const m0 = Math.max(x0, SEA_FROM), m1 = Math.min(x1, SEA_TO);
  if (m0 < m1) {
    const g = ctx.createLinearGradient(0, gy, 0, H());
    g.addColorStop(0, '#2f8fd0'); g.addColorStop(1, '#14507f');
    ctx.fillStyle = g;
    ctx.fillRect(sx(m0), gy - 2, (m1 - m0) * S, H() - gy + 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.5;
    for (let row = 0; row < 4; row++) {
      const yy = gy + 6 + row * 14;
      if (yy > H()) break;
      for (let x = Math.floor(m0 / 50) * 50; x < m1; x += 50) {
        const xx = sx(x + ((time * 8 + row * 17) % 50));
        ctx.beginPath(); ctx.moveTo(xx, yy); ctx.quadraticCurveTo(xx + 4, yy - 3, xx + 8, yy); ctx.stroke();
      }
    }
    // Glitzern der Sonne
    ctx.fillStyle = 'rgba(255,255,240,0.85)';
    for (let i = 0; i < 40; i++) {
      const xw = m0 + rand(i * 3.7 + Math.floor(time * 3)) * (m1 - m0);
      const yy = gy + 4 + rand(i * 5.3) * (H() - gy);
      if (rand(i + Math.floor(time * 8) * 0.37) < 0.5) ctx.fillRect(sx(xw), yy, 3, 1.5);
    }
    // Segelboot
    const bx = sx((SEA_FROM + SEA_TO) / 2);
    if (bx > -50 && bx < W() + 50) {
      const k = S;
      ctx.fillStyle = '#7a3b1e';
      ctx.beginPath(); ctx.moveTo(bx - 9 * k, gy + 2); ctx.lineTo(bx + 9 * k, gy + 2); ctx.lineTo(bx + 6 * k, gy + 5 * k); ctx.lineTo(bx - 6 * k, gy + 5 * k); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.moveTo(bx, gy + 1); ctx.lineTo(bx, gy - 16 * k); ctx.lineTo(bx + 8 * k, gy + 1); ctx.fill();
    }
  }
}

function drawTree(x, gy, h, palm) {
  if (palm) {
    ctx.strokeStyle = '#8a6a3c'; ctx.lineWidth = Math.max(1.5, 0.9 * S);
    ctx.beginPath(); ctx.moveTo(x, gy); ctx.quadraticCurveTo(x + h * 0.15, gy - h * 0.5, x + h * 0.1, gy - h); ctx.stroke();
    ctx.strokeStyle = '#2f8a3a'; ctx.lineWidth = Math.max(1.5, 0.8 * S);
    const tx = x + h * 0.1, ty = gy - h;
    for (const a of [-2.6, -1.9, -1.2, -0.5, 0.2]) {
      ctx.beginPath(); ctx.moveTo(tx, ty);
      ctx.quadraticCurveTo(tx + Math.cos(a) * h * 0.3, ty + Math.sin(a) * h * 0.3 - h * 0.1, tx + Math.cos(a) * h * 0.45, ty + h * 0.15);
      ctx.stroke();
    }
  } else {
    ctx.fillStyle = '#6b4a2b';
    ctx.fillRect(x - 0.6 * S, gy - h * 0.4, 1.2 * S, h * 0.4);
    ctx.fillStyle = '#3d8a3a';
    ctx.beginPath(); ctx.arc(x, gy - h * 0.65, h * 0.35, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.arc(x - h * 0.1, gy - h * 0.75, h * 0.15, 0, Math.PI * 2); ctx.fill();
  }
}

function drawTrees(gy) {
  const x0 = p.x - (W() * 0.35) / S - 30, x1 = p.x + (W() * 0.65) / S + 30;
  for (let c = Math.floor(x0 / 60); c <= x1 / 60; c++) {
    if (rand(c + 0.5) > 0.55) continue;
    const x = c * 60 + rand(c + 0.1) * 40;
    if (landFactor(x) < 1) continue;
    if (x > -1000 && x < RWY_A.x1 + 300) continue;
    if (x > RWY_B.x0 - 1200 && x < RWY_B.x0 + 1700) continue;
    const kind = treeKind(x, c);
    if (kind) drawTree(sx(x), gy - 3, (12 + rand(c + 0.3) * 10) * S, kind === 'palm');
  }
}

// ── Flughäfen ──────────────────────────────────────────────────────
// Beide Flughäfen sind gleich aufgebaut, alles in Metern ab ihrem Anfang (Frankfurt 0, am Ziel DEST + 300)
const AP = { term: [300, 680], gates: [370, 480, 590], tower: 1000, radar: 1220, hangar: [1350, 1560], fire: [1700, 1790] };
let PARKED = false;   // geparkte Flugzeuge drehen ihre Räder nicht
function wrect(x0, x1, h0, h1, color) {
  const gy = sy(0) - 3;
  ctx.fillStyle = color;
  ctx.fillRect(sx(x0), gy - h1 * S, (x1 - x0) * S, (h1 - h0) * S);
}
function wpoly(pts, color) {
  const gy = sy(0) - 3;
  ctx.fillStyle = color;
  ctx.beginPath();
  pts.forEach(([x, h], i) => i ? ctx.lineTo(sx(x), gy - h * S) : ctx.moveTo(sx(x), gy - h * S));
  ctx.closePath(); ctx.fill();
}

function drawTerminal(b, color, name) {
  const [t0, t1] = AP.term.map(x => b + x);
  wrect(t0, t1, 0, 10, color);                                   // unten Beton
  wrect(t0, t1, 10, 20, 'rgba(70,125,170,0.85)');                // oben Glasfront
  ctx.fillStyle = 'rgba(255,255,255,0.25)';                      // Spiegelung
  ctx.fillRect(sx(t0), sy(0) - 3 - 19 * S, (t1 - t0) * S, 2.5 * S);
  ctx.fillStyle = 'rgba(40,55,75,0.6)';
  for (let x = t0; x <= t1; x += 8) ctx.fillRect(sx(x), sy(0) - 3 - 20 * S, Math.max(1, 0.4 * S), 10 * S);
  ctx.fillStyle = 'rgba(40,55,75,0.35)';
  for (let x = t0 + 6; x < t1 - 6; x += 14) ctx.fillRect(sx(x), sy(0) - 3 - 8 * S, 6 * S, 5 * S);   // Fenster unten
  // geschwungenes Dach, das vorne übersteht
  const gy = sy(0) - 3;
  ctx.fillStyle = '#e6e9ed';
  ctx.beginPath();
  ctx.moveTo(sx(t0 - 10), gy - 20 * S);
  ctx.quadraticCurveTo(sx((t0 + t1) / 2), gy - 30 * S, sx(t1 + 10), gy - 20 * S);
  ctx.lineTo(sx(t1 + 10), gy - 21.5 * S);
  ctx.quadraticCurveTo(sx((t0 + t1) / 2), gy - 31.5 * S, sx(t0 - 10), gy - 21.5 * S);
  ctx.closePath(); ctx.fill();
  txt(name, sx((t0 + t1) / 2), gy - 15 * S, Math.max(9, 4.2 * S), '#ffffff', 'center', 'rgba(20,40,70,0.6)');
  // Fluggastbrücken mit Rotunde
  for (const g of AP.gates) {
    const x = b + g;
    wrect(x - 1.5, x + 1.5, 0, 4, '#8a9099');
    wrect(x - 3, x + 3, 4, 8, '#b8bec6');
    wrect(x + 3, x + 26, 4.6, 7.6, '#c9ced5');
    ctx.fillStyle = 'rgba(60,70,90,0.5)';
    for (let k = x + 5; k < x + 26; k += 4) ctx.fillRect(sx(k), gy - 7.4 * S, Math.max(1, 0.3 * S), 2.6 * S);
    wrect(x + 22, x + 23, 0, 4.6, '#6b7079');
  }
}

function drawParkedPlane(x, key) {
  const T = PLANES[key], k = T.k * 0.75;   // etwas weiter hinten, darum kleiner
  PARKED = true;
  ctx.save();
  ctx.translate(sx(x), sy(0) - 3 - 2);
  ctx.scale(S * k, S * k);
  ctx.translate(0, -T.gearH);
  drawPlaneType(T, 1, false);
  ctx.restore();
  PARKED = false;
}

function drawTower(x, color) {
  const gy = sy(0) - 3;
  wrect(x - 14, x + 14, 0, 8, '#c4cad1');                      // Betriebsgebäude unten
  ctx.fillStyle = 'rgba(60,90,120,0.5)';
  for (let k = x - 12; k < x + 12; k += 5) ctx.fillRect(sx(k), gy - 6 * S, 3 * S, 3 * S);
  wpoly([[x - 4.5, 8], [x + 4.5, 8], [x + 3, 50], [x - 3, 50]], color);   // Schaft wird nach oben schmaler
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  ctx.fillRect(sx(x + 1), gy - 50 * S, 2 * S, 42 * S);
  wrect(x - 9, x + 9, 50, 53, color);                          // Etage unter der Kanzel
  wpoly([[x - 8, 53], [x + 8, 53], [x + 10, 61], [x - 10, 61]], '#5fb8c9');   // schräge Fenster der Kanzel
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  for (let k = -8; k <= 8; k += 4) ctx.fillRect(sx(x + k), gy - 61 * S, Math.max(1, 0.35 * S), 8 * S);
  wrect(x - 10.5, x + 10.5, 61, 63, color);
  wrect(x - 3, x + 3, 63, 65, '#9aa0a8');
  ctx.strokeStyle = '#888'; ctx.lineWidth = Math.max(1, 0.4 * S);
  ctx.beginPath(); ctx.moveTo(sx(x - 1.5), gy - 65 * S); ctx.lineTo(sx(x - 1.5), gy - 74 * S);
  ctx.moveTo(sx(x + 2), gy - 65 * S); ctx.lineTo(sx(x + 2), gy - 70 * S); ctx.stroke();
  ctx.fillStyle = (time % 1.5) < 0.75 ? '#ff3030' : '#801818';
  ctx.beginPath(); ctx.arc(sx(x - 1.5), gy - 74 * S, Math.max(1.5, 0.6 * S), 0, Math.PI * 2); ctx.fill();
}

function drawRadarMast(x) {
  const gy = sy(0) - 3;
  // Gittermast
  ctx.strokeStyle = '#a7adb5'; ctx.lineWidth = Math.max(1, 0.35 * S);
  ctx.beginPath();
  ctx.moveTo(sx(x - 3), gy); ctx.lineTo(sx(x - 1), gy - 24 * S); ctx.moveTo(sx(x + 3), gy); ctx.lineTo(sx(x + 1), gy - 24 * S);
  for (let h = 0; h < 24; h += 4) { const w0 = 3 - h / 12, w1 = 3 - (h + 4) / 12; ctx.moveTo(sx(x - w0), gy - h * S); ctx.lineTo(sx(x + w1), gy - (h + 4) * S); }
  ctx.stroke();
  // die Antenne dreht sich
  const c = Math.cos(time * 2.5), w = 7 * Math.abs(c) + 0.6;
  ctx.fillStyle = c > 0 ? '#e9edf2' : '#b7bec7';
  ctx.beginPath(); ctx.ellipse(sx(x), gy - 27 * S, w * S, 2.2 * S, 0, 0, Math.PI * 2); ctx.fill();
  wrect(x - 0.6, x + 0.6, 24, 27, '#6b7079');
}

function drawHangar(b, label) {
  const [h0, h1] = AP.hangar.map(x => b + x), gy = sy(0) - 3, m = (h0 + h1) / 2;
  wrect(h0, h1, 0, 18, '#c7ccd3');
  ctx.fillStyle = '#d5d9df';                                   // gewölbtes Dach
  ctx.beginPath(); ctx.moveTo(sx(h0), gy - 18 * S); ctx.quadraticCurveTo(sx(m), gy - 34 * S, sx(h1), gy - 18 * S); ctx.closePath(); ctx.fill();
  wrect(h0 + 12, h1 - 12, 0, 16, '#9aa1aa');                   // großes Tor
  ctx.fillStyle = 'rgba(60,65,75,0.45)';
  for (let x = h0 + 12; x < h1 - 12; x += 15) ctx.fillRect(sx(x), gy - 16 * S, Math.max(1, 0.4 * S), 16 * S);
  txt(label, sx(m), gy - 22 * S, Math.max(8, 3.2 * S), BLUE);
}

function drawFireStation(b) {
  const [f0, f1] = AP.fire.map(x => b + x), gy = sy(0) - 3;
  wrect(f0, f1, 0, 9, '#e8e2d6');
  wrect(f0 - 1, f1 + 1, 9, 10, '#c4161c');
  for (let i = 0; i < 3; i++) {
    const x = f0 + 6 + i * 28;
    wrect(x, x + 20, 0, 7, i === 1 ? '#3a3f48' : '#d9dde2');   // ein Tor ist offen
    if (i !== 1) { ctx.fillStyle = 'rgba(80,85,95,0.4)'; for (let h = 1; h < 7; h += 1) ctx.fillRect(sx(x), gy - h * S, 20 * S, Math.max(1, 0.12 * S)); }
  }
  // im offenen Tor wartet ein Löschfahrzeug
  wrect(f0 + 37, f0 + 51, 0.8, 4.6, '#d61f1a');
  wrect(f0 + 37, f0 + 51, 2, 2.5, '#ffffff');
  txt('FEUERWACHE', sx((f0 + f1) / 2), gy - 8.2 * S, Math.max(7, 1.6 * S), '#c4161c');
}

function drawApron(b) {
  const gy = sy(0) - 3;
  // Gepäckwagen fahren zwischen den Flugzeugen hin und her
  const tx = b + 450 + Math.sin(time * 0.25 + b) * 140, dir = Math.cos(time * 0.25 + b) > 0 ? 1 : -1;
  wrect(tx - 2, tx + 2, 0.5, 2.3, '#f2c12e');
  wrect(tx - 1.6 * dir - 0.6, tx - 1.6 * dir + 0.6, 2.3, 3.3, '#f2c12e');
  for (let i = 1; i <= 3; i++) {
    const cx = tx - dir * i * 5;
    wrect(cx - 2, cx + 2, 0.6, 2.6, '#7d8590');
    wrect(cx - 1.6, cx + 1.6, 1, 2.4, ['#2f6db5', '#3d8b3d', '#b5542f'][i - 1]);
  }
  ctx.fillStyle = '#1b1b1f';
  for (let i = 0; i <= 3; i++) for (const o of [-1.3, 1.3]) { ctx.beginPath(); ctx.arc(sx(tx - dir * i * 5 + o), gy - 0.4 * S, Math.max(1, 0.4 * S), 0, Math.PI * 2); ctx.fill(); }
  // Tankwagen steht beim mittleren Flugzeug
  const fx = b + AP.gates[1] + 40;
  wrect(fx, fx + 9, 0.7, 3.8, '#e9edf2');
  wrect(fx + 9, fx + 12, 0.7, 3.4, '#2f6db5');
  wrect(fx + 9.8, fx + 11.5, 2.2, 3.1, '#9fd3ff');
  ctx.fillStyle = '#1b1b1f';
  for (const o of [1.5, 4, 10.5]) { ctx.beginPath(); ctx.arc(sx(fx + o), gy - 0.6 * S, Math.max(1, 0.6 * S), 0, Math.PI * 2); ctx.fill(); }
  txt('JET A-1', sx(fx + 4.5), gy - 2.3 * S, Math.max(6, 1.2 * S), '#c4161c');
}

// Rollbahnschilder: schwarz mit gelbem Buchstaben, daneben gelb mit schwarzem Pfeil
function drawTaxiSigns(b, len) {
  const gy = sy(0) - 3;
  ['A', 'B', 'C', 'D', 'E', 'F'].forEach((ch, i) => {
    const x = b + 250 + i * 500;
    if (x > b + len - 100) return;
    const X = sx(x);
    if (X < -40 || X > W() + 40) return;
    const h = 1.8 * S, w = 2.2 * S;
    ctx.fillStyle = '#555'; ctx.fillRect(X + w * 0.5, gy - 0.6 * S, Math.max(1, 0.2 * S), 0.6 * S);
    ctx.fillStyle = '#111'; ctx.fillRect(X, gy - 0.6 * S - h, w, h);
    txt(ch, X + w / 2, gy - 0.6 * S - h / 2, h * 0.75, '#ffd400');
    ctx.fillStyle = '#ffd400'; ctx.fillRect(X + w, gy - 0.6 * S - h, w * 1.3, h);
    txt(`←${ch}${i + 1}`, X + w * 1.65, gy - 0.6 * S - h / 2, h * 0.6, '#111');
  });
}

function drawAirport(b, color, name, len) {
  if (sx(b + 2000) < -50 || sx(b - 100) > W() + 50) return;
  drawHangar(b, 'HENRIK AIRLINES');
  drawRadarMast(b + AP.radar);
  drawTower(b + AP.tower, '#e3e7ec');
  drawTerminal(b, color, name);
  drawFireStation(b);
  drawParkedPlane(b + AP.gates[0] + 10, 'a320');
  drawParkedPlane(b + AP.gates[1] + 14, 'b747');
  drawParkedPlane(b + AP.gates[2] + 8, 'legacy');
  drawApron(b);
  drawTaxiSigns(b, len);
}

function drawAirports() {
  const gy = sy(0) - 3;
  if (p.x < 6000) drawAirport(0, '#9aa3ad', 'FRANKFURT', RWY_A.x1);
  if (p.x > DEST - 6000) {
    drawAirport(DEST + 300, R.terminal, R.name.toUpperCase(), RWY_B.x1 - DEST - 300);
    if (R.trees !== 'tree') for (let i = 0; i < 8; i++) drawTree(sx(DEST + 520 + i * 60), gy, (14 + rand(i) * 4) * S, true);
  }
}

// Nachts sieht man nur die Lichter der Gebäude
function airportNightLights(b) {
  const gy = sy(0) - 3, [t0, t1] = AP.term.map(x => b + x);
  ctx.fillStyle = 'rgba(255,215,130,0.85)';
  ctx.fillRect(sx(t0), gy - 20 * S, (t1 - t0) * S, 10 * S);
  ctx.fillStyle = 'rgba(255,215,130,0.6)';
  for (let x = t0 + 6; x < t1 - 6; x += 14) ctx.fillRect(sx(x), gy - 8 * S, 6 * S, 5 * S);
  for (const g of AP.gates) ctx.fillRect(sx(b + g + 4), gy - 7 * S, 21 * S, 1.6 * S);
  const x = b + AP.tower;
  ctx.fillStyle = 'rgba(150,240,220,0.9)';
  ctx.beginPath(); ctx.moveTo(sx(x - 8), gy - 53 * S); ctx.lineTo(sx(x + 8), gy - 53 * S); ctx.lineTo(sx(x + 10), gy - 61 * S); ctx.lineTo(sx(x - 10), gy - 61 * S); ctx.fill();
  ctx.fillStyle = (time % 1.5) < 0.75 ? '#ff3030' : '#801818';
  for (const [lx, lh] of [[x - 1.5, 74], [b + AP.radar, 28]]) { ctx.beginPath(); ctx.arc(sx(lx), gy - lh * S, 1.5, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,240,200,0.8)';                     // offenes Hangartor und Feuerwache
  ctx.fillRect(sx(b + AP.hangar[0] + 12), gy - 2 * S, (AP.hangar[1] - AP.hangar[0] - 24) * S, 2 * S);
  ctx.fillRect(sx(b + AP.fire[0] + 34), gy - 7 * S, 20 * S, 7 * S);
}

function drawRunway(r) {
  const gy = sy(0);
  const a = sx(r.x0), b = sx(r.x1);
  if (b < 0 || a > W() || gy > H() + 20) return;
  const depth = Math.max(8, 9 * S);
  const top = gy - 3;
  const wet = weather === 'rain' || weather === 'storm';
  // Seitenstreifen, dann die Bahn
  ctx.fillStyle = '#6b6f72';
  ctx.fillRect(a, top - 1.5, b - a, depth + 3);
  ctx.fillStyle = wet ? '#2c3036' : '#3b3f45';
  ctx.fillRect(a, top, b - a, depth);
  // dunkle Reifenspuren, wo die Flugzeuge aufsetzen
  ctx.fillStyle = 'rgba(15,15,18,0.45)';
  for (const y of [0.36, 0.6]) ctx.fillRect(sx(r.x0 + 250), top + depth * y, 650 * S, depth * 0.06);
  ctx.fillStyle = '#ffffff';
  const mid = top + depth * 0.5 - 1;
  for (let x = r.x0 + 120; x < r.x1 - 120; x += 50) {
    const xx = sx(x);
    if (xx > -40 * S && xx < W()) ctx.fillRect(xx, mid, 30 * S, 1.5);
  }
  // Randlinien
  ctx.fillRect(a, top + 0.5, b - a, 1); ctx.fillRect(a, top + depth - 1.5, b - a, 1);
  for (const end of [r.x0 + 10, r.x1 - 50]) {
    for (let i = 0; i < 4; i++) ctx.fillRect(sx(end), top + depth * (0.15 + i * 0.22), 40 * S, 1.5);
  }
  // Aufsetzzone: Balkenpaare und die dicken Zielpunkt-Markierungen
  for (let i = 1; i <= 6; i++) {
    const x = r.x0 + i * 150, big = i === 2;
    for (const y of [0.25, 0.7]) ctx.fillRect(sx(x), top + depth * y, (big ? 60 : 22) * S, big ? depth * 0.1 : 1.2);
  }
  runwayLights(r);
  // Schild mit der Bahnnummer: rot mit weißer Schrift
  const sxp = sx(r.x0 - 40), sb = top + depth + 2;
  ctx.fillStyle = '#555'; ctx.fillRect(sxp + 5 * S, sb - 1, 1, 4 * S);
  ctx.fillStyle = '#c4161c'; ctx.fillRect(sxp, sb - 1 - 6 * S + 4 * S, 12 * S, 5 * S);
  txt(r.num || '', sxp + 6 * S, sb - 1 + 0.5 * S, 3.6 * S, '#fff');
  drawPAPI(r, top + depth + 2);
  drawWindsock(r.x0 - 140, top);
}

// Die Bahnnummer groß auf den Asphalt gemalt, lesbar beim Anflug
const SEGS = { 0: 'abcdef', 1: 'bc', 2: 'abged', 3: 'abgcd', 4: 'fgbc', 5: 'afgcd', 6: 'afgedc', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg' };
function runwayNumber(num, x0, quad) {
  if (!num) return;
  const w = 11, h = 32, t = 2.6;
  // u geht quer über die Bahn, v in Flugrichtung; die Ziffer steht von vorne gesehen aufrecht
  const box = { a: [0, w, h - t, h], b: [w - t, w, h / 2, h], c: [w - t, w, 0, h / 2], d: [0, w, 0, t],
                e: [0, t, 0, h / 2], f: [0, t, h / 2, h], g: [0, w, h / 2 - t / 2, h / 2 + t / 2] };
  [...num].forEach((ch, i) => {
    const z0 = i === 0 ? -w - 2.5 : 2.5;
    for (const sgm of SEGS[ch]) {
      const [u0, u1, v0, v1] = box[sgm];
      quad(x0 + v0, x0 + v1, z0 + u0, z0 + u1, 0, '#ffffff');
    }
  });
}

// PAPI: vier Lampen neben der Bahn. Zwei weiß und zwei rot heißt genau richtig, mehr weiß zu hoch, mehr rot zu tief.
function papiColors(r) {
  const ang = Math.atan2(Math.max(0, p.y), Math.max(1, r.x0 + 20 - p.x)) / DEG;
  return [0.5, 0.17, -0.17, -0.5].map(o => ang > GLIDE / DEG + o ? '#ffffff' : '#ff2a2a');
}
function drawPAPI(r, y) {
  if (r !== RWY_B) return;
  papiColors(r).forEach((c, i) => {
    const X = sx(r.x0 + 20 - i * 10);
    ctx.fillStyle = '#333'; ctx.fillRect(X - 2, y - 1, 4, 3);
    if (night) glowDot(X, y, 6, c);
    ctx.fillStyle = c; ctx.beginPath(); ctx.arc(X, y, 1.6, 0, Math.PI * 2); ctx.fill();
  });
}

function drawWindsock(x, base) {
  const X = sx(x), h = 10 * S;
  if (X < -30 * S || X > W() + 30 * S) return;
  ctx.strokeStyle = '#aaa'; ctx.lineWidth = Math.max(1, 0.4 * S);
  ctx.beginPath(); ctx.moveTo(X, base); ctx.lineTo(X, base - h); ctx.stroke();
  // bei Wind steht der Sack waagerecht und flattert, sonst hängt er runter
  const w = clamp(WX().wind / 3, 0.15, 1);
  const ang = (80 - 75 * w) * DEG + Math.sin(time * 6) * 0.08 * w;
  for (let i = 0; i < 5; i++) {
    const r0 = i * 1.2 * S, r1 = (i + 1) * 1.2 * S, hw0 = (1 - i * 0.12) * S, hw1 = (1 - (i + 1) * 0.12) * S;
    const dx = -Math.cos(ang), dy = Math.sin(ang), Y = base - h;
    const pt = (r, hw, side) => [X + dx * r - dy * hw * side, Y + dy * r + dx * hw * side];
    ctx.fillStyle = i % 2 ? '#ffffff' : '#ff6a00';
    ctx.beginPath();
    ctx.moveTo(...pt(r0, hw0, 1)); ctx.lineTo(...pt(r1, hw1, 1)); ctx.lineTo(...pt(r1, hw1, -1)); ctx.lineTo(...pt(r0, hw0, -1));
    ctx.closePath(); ctx.fill();
  }
}

function runwayLights(r, glow = false) {
  const top = sy(0) - 3, depth = Math.max(8, 9 * S);
  // Mittellinienfeuer: weiß, am Ende rot-weiß und zuletzt rot
  for (let x = r.x0 + 15; x < r.x1; x += 30) {
    const xx = sx(x);
    if (xx < -5 || xx > W() + 5) continue;
    const left = r.x1 - x, c = left < 300 ? '#ff4040' : left < 900 && (x / 30) % 2 < 1 ? '#ff4040' : '#f4f8ff';
    if (glow) glowDot(xx, top + depth * 0.5, 4, c);
    ctx.fillStyle = c; ctx.fillRect(xx - 0.5, top + depth * 0.5 - 0.5, 1.5, 1.5);
  }
  for (let x = r.x0; x <= r.x1; x += 60) {
    const xx = sx(x);
    if (xx < -5 || xx > W() + 5) continue;
    const c = x === r.x0 ? '#3f3' : x + 60 > r.x1 ? '#f33' : '#fff7d0';
    for (const yy of [top, top + depth - 1]) {
      if (glow) glowDot(xx, yy, 7, c);
      ctx.fillStyle = c;
      ctx.fillRect(xx - 1, yy - 1, 3, 3);
    }
  }
}

function glowDot(x, y, r, color) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
}

function drawApproachLights(glow = false) {
  const gy = sy(0) - 3;
  const run = Math.floor((time * 2) % 1 * 15);   // Lauflicht Richtung Landebahn
  for (let i = 0; i < 15; i++) {
    const x = DEST - 60 - (14 - i) * 60;
    const xx = sx(x);
    if (xx < -10 || xx > W() + 10) continue;
    if (glow) glowDot(xx, gy - 4 * S, i === run ? 16 : 9, i === run ? '#ffffff' : '#ffe98a');
    else { ctx.fillStyle = '#555'; ctx.fillRect(xx - 0.5, gy - 4 * S, 1.5, 4 * S); }
    ctx.fillStyle = i === run ? '#ffffff' : '#ffe98a';
    ctx.beginPath(); ctx.arc(xx, gy - 4 * S, i === run ? 3 : 1.8, 0, Math.PI * 2); ctx.fill();
  }
}

function drawGlidePath() {
  if (PT().glider) return;
  const x0 = p.x - (W() * 0.35) / S - 50, x1 = Math.min(DEST, p.x + (W() * 0.65) / S + 50);
  const step = 120;
  for (let x = Math.max(DEST - GLIDE_LEN, Math.ceil(x0 / step) * step); x <= x1; x += step) {
    const a = glideAlt(x) + GEAR_H;
    const X = sx(x), Y = sy(a);
    if (Y < -10 || Y > H() + 10) continue;
    ctx.fillStyle = 'rgba(60,255,120,0.85)';
    ctx.beginPath(); ctx.arc(X, Y, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(60,255,120,0.25)';
    ctx.beginPath(); ctx.arc(X, Y, 8, 0, Math.PI * 2); ctx.fill();
  }
}

function worldClouds(front) {
  const cell = 110;
  const x0 = p.x - (W() * 0.35) / S - 200, x1 = p.x + (W() * 0.65) / S + 200;
  for (let c = Math.floor(x0 / cell); c <= x1 / cell; c++) {
    if (rand(c) > 0.5) continue;
    if ((rand(c + 0.9) < 0.35) !== front) continue;
    const alt = 70 + rand(c + 0.3) * 1250;
    const r = (14 + rand(c + 0.7) * 26) * S;
    const X = sx(c * cell + rand(c + 0.2) * 60), Y = sy(alt);
    if (Y < -r * 3 || Y > H() + r * 3) continue;
    cloud(X, Y, r, front ? 0.7 : 0.92);
  }
}

function drawContrails() {
  ctx.lineCap = 'round';
  for (let e = 0; e < PT().engines.length; e++) {
    let prev = null;
    for (const c of contrail) {
      if (c.e !== e) continue;
      if (prev) {
        const f = 1 - c.t / 2.5;
        ctx.strokeStyle = `rgba(255,255,255,${0.7 * f})`;
        ctx.lineWidth = (1.2 + c.t * 2) * S * 0.5 * Math.max(0.5, PT().k);
        ctx.beginPath(); ctx.moveTo(sx(prev.x), sy(prev.a)); ctx.lineTo(sx(c.x), sy(c.a)); ctx.stroke();
      }
      prev = c;
    }
  }
}

function drawParticles() {
  for (const q of particles) {
    const f = q.life / q.max;
    if (q.spark) {
      ctx.strokeStyle = `rgba(${q.color},${f})`; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(sx(q.x), sy(q.a)); ctx.lineTo(sx(q.x - q.vx * 0.04), sy(q.a - q.va * 0.04)); ctx.stroke();
      continue;
    }
    ctx.fillStyle = `rgba(${q.color},${0.8 * f})`;
    ctx.beginPath(); ctx.arc(sx(q.x), sy(q.a), q.r * S, 0, Math.PI * 2); ctx.fill();
  }
}

function drawShadow() {
  if (p.y > 250 || state === 'crashed' || p.x > SEA_FROM && p.x < SEA_TO && p.y > 0) return;
  const k = 1 - p.y / 250;
  ctx.fillStyle = `rgba(0,0,0,${0.28 * k})`;
  ctx.beginPath();
  ctx.ellipse(sx(p.x + 12 * PT().k), sy(0) + Math.max(8, 9 * S) * 0.3, 38 * S * PT().k * (0.6 + 0.4 * k), 2.5 * S, 0, 0, Math.PI * 2);
  ctx.fill();
}

function planeTransform(c) {
  c.translate(sx(p.x), sy(p.y - p.drop + (p.crash === 'sea' ? -p.sinkAnim : 0)));
  c.rotate(-(p.pitch + p.tilt) * DEG);
  c.scale(S * PT().k, S * PT().k);
  c.translate(4, -PT().gearH);
}

function drawPlane() {
  const X = sx(p.x);
  const c = state === 'crashed' && p.wreck;
  if (c && c.broken) {
    // vorne und hinten getrennt; das Heck bleibt zurück und kippt etwas
    const cut = -10, far = 200;
    ctx.save(); planeTransform(ctx);
    ctx.beginPath(); ctx.rect(cut, -far, far * 2, far * 2); ctx.clip();
    drawPlaneType(PT(), 0, false);
    ctx.restore();
    ctx.save(); planeTransform(ctx);
    ctx.translate(-c.gap / PT().k, 0);
    ctx.translate(cut, 4); ctx.rotate(-c.rot * DEG); ctx.translate(-cut, -4);
    ctx.beginPath(); ctx.rect(-far, -far, far + cut, far * 2); ctx.clip();
    drawPlaneType(PT(), 0, false);
    ctx.restore();
  } else {
    ctx.save();
    planeTransform(ctx);
    drawPlaneType(PT(), p.gear, state === 'flying', p);
    ctx.restore();
  }
  if (p.boomT < 1.5) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - p.boomT / 1.5)})`; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(X, sy(p.y), (20 + p.boomT * 300) * S * 0.3, 0, Math.PI * 2); ctx.stroke();
  }
  if (p.crash === 'sea') {
    // Wasser schwappt über den sinkenden Flieger
    const gy = sy(0);
    const g = ctx.createLinearGradient(0, gy, 0, H());
    g.addColorStop(0, '#2f8fd0'); g.addColorStop(1, '#14507f');
    ctx.fillStyle = g;
    ctx.globalAlpha = 0.9;
    ctx.fillRect(X - 50 * S, gy - 2, 100 * S, H() - gy + 2);
    ctx.globalAlpha = 1;
  }
}

// ── Wetter ─────────────────────────────────────────────────────────
function updateStorm(dt) {
  if (weather !== 'storm') return;
  nextBolt -= dt;
  if (nextBolt > 0) return;
  nextBolt = 5 + Math.random() * 7;
  flash = 1;
  bolt = { x: W() * (0.15 + Math.random() * 0.7), seed: Math.random() * 100 };
  thunder();
  pax.t = 0; say('Ein Blitz! ⚡ Hast du das gesehen?');
}

function drawWeatherTint() {
  const w = WX();
  if (!w.tint) return;
  ctx.fillStyle = night ? `rgba(0,0,8,${w.tint * 0.6})` : `rgba(70,80,95,${w.tint})`;
  ctx.fillRect(0, 0, W(), H());
}

function drawWeatherFx(cockpit) {
  const w = WX();
  const v = state === 'flying' || state === 'menu' ? (p && state !== 'menu' ? p.v : 60) : 0;
  if (w.rain) {
    // Regen wird schräg, je schneller du fliegst
    const lean = clamp(v / 4, 4, 30) * (cockpit ? 0 : 1);
    const len = cockpit ? 40 : 18;
    ctx.strokeStyle = night ? 'rgba(170,190,230,0.45)' : cockpit ? 'rgba(235,242,255,0.75)' : 'rgba(210,225,245,0.55)';
    ctx.lineWidth = cockpit ? 2 : 1.2;
    ctx.beginPath();
    for (let i = 0; i < w.rain; i++) {
      const sp = 700 + rand(i * 3.3) * 400;
      const y = (rand(i * 1.1) * H() + time * sp) % (H() + 40) - 20;
      const x = ((rand(i * 2.7) * W() - time * lean * 20) % W() + W()) % W();
      if (cockpit) {
        // Tropfen fliegen von der Mitte nach außen über die Scheibe
        const k = (time * (1.2 + rand(i) * 0.8) + rand(i * 5.1)) % 1;
        const a = rand(i * 7.7) * Math.PI * 2, r0 = Math.min(W(), H()) * 0.6 * k;
        const cx = W() / 2 + Math.cos(a) * r0, cy = H() * 0.33 + Math.sin(a) * r0 * 0.6;
        ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * len * k, cy + Math.sin(a) * len * 0.6 * k);
      } else {
        ctx.moveTo(x, y); ctx.lineTo(x - lean, y + len);
      }
    }
    ctx.stroke();
  }
  if (w.snow) {
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    for (let i = 0; i < w.snow; i++) {
      const sp = 50 + rand(i * 3.3) * 70, drift = cockpit ? 0 : v * 2.5;
      const y = (rand(i * 1.1) * H() + time * sp) % (H() + 20) - 10;
      const x = ((rand(i * 2.7) * W() + Math.sin(time * 1.5 + i) * 12 - time * drift) % W() + W()) % W();
      const r = 1.2 + rand(i * 4.4) * 2;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
  }
  if (bolt && flash > 0.4 && !cockpit) {
    // zackiger Blitz vom Himmel
    ctx.strokeStyle = `rgba(255,255,230,${flash})`; ctx.lineWidth = 3;
    ctx.beginPath();
    let x = bolt.x, y = 0;
    ctx.moveTo(x, y);
    for (let i = 1; i <= 8; i++) {
      x += (rand(bolt.seed + i) - 0.5) * 60; y = H() * 0.6 * i / 8;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  if (flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${flash * 0.55})`;
    ctx.fillRect(0, 0, W(), H());
  }
}

// ── Nacht ──────────────────────────────────────────────────────────
const NIGHT_SKY = 'rgba(6,10,34,0.8)';
let nightCanvas = null;

function drawStars(n, yMax, shift) {
  for (let i = 0; i < n; i++) {
    const x = ((rand(i * 1.7) * W() * 1.5 - shift) % (W() * 1.5) + W() * 1.5) % (W() * 1.5) - W() * 0.25;
    const y = rand(i * 2.9) * yMax;
    const tw = 0.5 + 0.5 * Math.sin(time * 2 + i * 1.3);
    ctx.fillStyle = `rgba(255,255,235,${0.35 + 0.55 * tw})`;
    const r = rand(i * 4.1) < 0.15 ? 2 : 1.3;
    ctx.fillRect(x, y, r, r);
  }
}

function drawMoon(x, y, r) {
  const g = ctx.createRadialGradient(x, y, r * 0.5, x, y, r * 4);
  g.addColorStop(0, 'rgba(230,235,255,0.35)'); g.addColorStop(1, 'rgba(230,235,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r * 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f4f1dc';
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(180,175,150,0.5)';
  for (const [dx, dy, k] of [[-0.3, -0.2, 0.22], [0.25, 0.3, 0.16], [0.35, -0.35, 0.1]]) {
    ctx.beginPath(); ctx.arc(x + dx * r, y + dy * r, k * r, 0, Math.PI * 2); ctx.fill();
  }
}

function drawNightOutside(gy) {
  ctx.fillStyle = NIGHT_SKY;
  ctx.fillRect(0, 0, W(), H());
  if (gy > 0 && weather === 'sun') {
    drawStars(110, Math.min(gy - 20, H()), farX * 0.05);
    drawMoon(W() * 0.62, H() * 0.3 - cam.a * S * 0.02, 18);
  }
  // Lichter von Dörfern und Städten
  if (gy < H()) {
    const x0 = p.x - (W() * 0.35) / S, x1 = p.x + (W() * 0.65) / S, cw = 30;
    for (let c = Math.floor(x0 / cw); c * cw < x1; c++) {
      const x = c * cw;
      if (landFactor(x) < 1) continue;
      const city = x < 7000 || Math.abs(x - DEST) < 7000;
      const n = city ? 3 : rand(Math.floor(x / 900)) < 0.4 ? 2 : 0;
      for (let k = 0; k < n; k++) {
        const q = c * 5 + k;
        if (rand(q + 0.11) < 0.35) continue;
        const yy = gy + 4 + Math.pow(rand(q + 0.47), 1.6) * (H() - gy);
        if (Math.abs(x - p.x) < 60 && yy < gy + 12) continue;
        const xx = sx(x + rand(q + 0.83) * cw);
        ctx.fillStyle = rand(q + 0.2) < 0.75 ? 'rgba(255,205,110,0.9)' : 'rgba(235,240,255,0.85)';
        ctx.fillRect(xx, yy, 1.5 + (yy - gy) * 0.01, 1.5);
      }
    }
  }
  if (p.x < 9000) drawSkyline(gy, true);
  airportNightLights(0);
  airportNightLights(DEST + 300);
  runwayLights(RWY_A, true);
  runwayLights(RWY_B, true);
  drawApproachLights(true);
  drawGlidePath();
}

function drawPlaneNight() {
  // der Flieger wird auf einer eigenen Fläche abgedunkelt, damit nur er dunkler wird und nicht der Himmel drumherum
  if (!nightCanvas) nightCanvas = document.createElement('canvas');
  if (nightCanvas.width !== canvas.width || nightCanvas.height !== canvas.height) {
    nightCanvas.width = canvas.width; nightCanvas.height = canvas.height;
  }
  const nc = nightCanvas.getContext('2d'), dpr = canvas.width / W();
  nc.setTransform(1, 0, 0, 1, 0, 0);
  nc.clearRect(0, 0, nightCanvas.width, nightCanvas.height);
  nc.setTransform(dpr, 0, 0, dpr, 0, 0);
  const keep = ctx;
  ctx = nc;
  drawPlane();
  ctx = keep;
  nc.globalCompositeOperation = 'source-atop';
  nc.fillStyle = 'rgba(6,10,34,0.55)';
  nc.fillRect(0, 0, W(), H());
  nc.globalCompositeOperation = 'source-over';
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(nightCanvas, 0, 0);
  ctx.restore();

  if (p.crash === 'sea' && p.sinkAnim > 6) return;
  ctx.save();
  planeTransform(ctx);
  const on = state === 'flying';
  const T = PT();
  if (on && p.gearDown) {
    // Landescheinwerfer
    const [nx, ny] = T.nose;
    const g = ctx.createLinearGradient(nx, ny, nx + 59, ny);
    g.addColorStop(0, 'rgba(255,250,220,0.55)'); g.addColorStop(1, 'rgba(255,250,220,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(nx, ny - 0.4); ctx.lineTo(nx + 59, ny - 6); ctx.lineTo(nx + 59, ny + 10); ctx.closePath(); ctx.fill();
  }
  drawWindows(T, 'rgba(255,225,140,0.95)');
  ctx.fillStyle = 'rgba(150,200,255,0.6)';
  poly(T.cockpit); ctx.fill();
  // Logo am Leitwerk wird angestrahlt
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.font = `bold ${T.logo[2]}px system-ui, -apple-system, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('H', T.logo[0], T.logo[1]);
  if (on) {
    // rotes Licht an der linken Flügelspitze, weißes am Heck
    const [rx, ry] = T.nav, [wx, wy] = T.tail;
    ctx.fillStyle = '#ff3030';
    ctx.beginPath(); ctx.arc(rx, ry, 0.45, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,48,48,0.3)';
    ctx.beginPath(); ctx.arc(rx, ry, 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(wx, wy, 0.4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// ── Zeichnen: Anzeigen ─────────────────────────────────────────────
function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(10,20,40,0.55)';
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 10); ctx.fill();
}

function drawButton(r, big, small, active, color) {
  ctx.fillStyle = active ? 'rgba(255,255,255,0.45)' : 'rgba(10,20,40,0.45)';
  ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2; ctx.stroke();
  const u = r.h;
  if (small) {
    txt(big, r.x + r.w / 2, r.y + r.h * 0.42, u * 0.36, color || '#fff');
    let fs = Math.max(10, u * 0.17);
    ctx.font = `bold ${fs}px system-ui, -apple-system, sans-serif`;
    fs *= Math.min(1, (r.w - 8) / ctx.measureText(small).width);
    txt(small, r.x + r.w / 2, r.y + r.h * 0.78, fs, 'rgba(255,255,255,0.85)');
  } else {
    txt(big, r.x + r.w / 2, r.y + r.h / 2, u * 0.28, color || '#fff');
  }
}

function drawHUD() {
  const u = clamp(Math.min(W(), H()) / 400, 0.8, 1.4);
  const m = 12;
  const fs = 14 * u;
  // links: Tempo, Höhe, Steigen
  const pw = 172 * u, ph = fs * 4.1;
  panel(m, m, pw, ph);
  const vs = Math.round(p.vy);
  const rows = [
    ['Tempo', `${Math.round(p.v * 3.6)} km/h`],
    ['Höhe', `${(Math.round(p.y * ALT_SCALE / 10) * 10).toLocaleString('de-DE')} m`],
    [vs >= 0 ? 'Steigen' : 'Sinken', `${Math.abs(vs)} m/s`],
  ];
  rows.forEach(([k, v], i) => {
    txt(k, m + 10 * u, m + fs * (0.95 + i * 1.1), fs * 0.85, 'rgba(255,255,255,0.75)', 'left');
    txt(v, m + pw - 10 * u, m + fs * (0.95 + i * 1.1), fs, '#fff', 'right');
  });
  // rechts: Ziel
  const dist = kmLeft();
  const rw = 150 * u;
  panel(W() - m - rw, m, rw, ph);
  txt(`${R.icon} ${R.name}`, W() - m - rw / 2, m + fs * 0.95, fs, '#fff');
  txt(`noch ${Math.round(dist)} km`, W() - m - rw / 2, m + fs * 2.05, fs * 1.05, '#ffd34d');
  txt(`👥 ${pax.n} ${paxFace(pax.mood)}`, W() - m - rw / 2, m + fs * 3.15, fs, '#fff');

  // Strecke als kleine Karte von der Seite
  const my = m + ph + 8, mw = W() - 2 * m, mh = 30 * u;
  panel(m, my, mw, mh);
  const total = RWY_B.x1 + 1000;
  const mx = x => m + 10 + (x / total) * (mw - 20);
  const base = my + mh - 6;
  ctx.fillStyle = '#5da84a'; ctx.fillRect(mx(0), base, mx(total) - mx(0), 3);
  ctx.fillStyle = '#2f8fd0'; ctx.fillRect(mx(SEA_FROM), base, mx(SEA_TO) - mx(SEA_FROM), 3);
  ctx.strokeStyle = 'rgba(60,255,120,0.8)'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]);
  const alt = a => base - (a / CEILING) * (mh - 12);
  if (!PT().glider) { ctx.beginPath(); ctx.moveTo(mx(DEST - GLIDE_LEN), alt(glideAlt(DEST - GLIDE_LEN))); ctx.lineTo(mx(DEST), base); ctx.stroke(); }
  ctx.setLineDash([]);
  for (const z of zones) if (!z.done) { ctx.fillStyle = PT().bombs ? '#d61f1a' : '#ff7a1a'; ctx.fillRect(mx(z.x) - 2, base - 3, 4, 3); }
  for (const b of balloons) if (!b.hit) { ctx.fillStyle = b.c; ctx.beginPath(); ctx.arc(mx(b.x), alt(b.a), 2.5, 0, Math.PI * 2); ctx.fill(); }
  txt('FRA', mx(0) + 2, my + 9 * u, 9 * u, 'rgba(255,255,255,0.8)', 'left');
  txt(R.code, mx(DEST) + 10, my + 9 * u, 9 * u, 'rgba(255,255,255,0.8)', 'left');
  ctx.save();
  ctx.translate(mx(Math.max(0, p.x)), alt(p.y));
  ctx.rotate(-p.pitch * DEG);
  txt('✈', 0, 0, 14 * u, '#fff');
  ctx.restore();

  // Hinweis
  const [h, warn] = hint();
  const hs = 15 * u;
  ctx.font = `bold ${hs}px system-ui, -apple-system, sans-serif`;
  const tw = Math.min(W() - 2 * m, ctx.measureText(h).width + 24);
  const hy = view === 'cockpit' ? H() * 0.62 - hs * 2 - 10 : my + mh + 8;
  ctx.fillStyle = warn ? 'rgba(200,30,30,0.85)' : 'rgba(10,20,40,0.6)';
  ctx.beginPath(); ctx.roundRect(W() / 2 - tw / 2, hy, tw, hs * 2, 10); ctx.fill();
  txt(h, W() / 2, hy + hs, hs, '#fff');

  // Knöpfe
  const bs = buttons();
  const glider = PT().glider;
  if (!glider) {
    drawButton(bs.thrUp, '+', 'Schub', held('thrUp'));
    drawButton(bs.thrDn, '−', 'Schub', held('thrDn'));
  }
  drawButton(bs.up, '▲', 'Nase hoch', held('up'));
  drawButton(bs.dn, '▼', 'Nase runter', held('dn'));
  if (glider && p.tow && !p.tow.free) drawButton(bs.gear, '🪝', 'Ausklinken', false, '#ffd34d');
  else if (glider) drawButton(bs.gear, p.airbrake ? '⬆ raus' : '⬆ drin', 'Bremsklappen', false, p.airbrake ? '#ffd34d' : '#7dff9a');
  if (glider && h.includes('blinkenden')) {
    const r = bs.gear, a = 0.5 + 0.5 * Math.sin(time * 10);
    ctx.strokeStyle = `rgba(255,211,77,${a})`; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.roundRect(r.x - 4, r.y - 4, r.w + 8, r.h + 8, 16); ctx.stroke();
    txt('👇', r.x + r.w / 2, r.y - 18 - 6 * a, 26, '#fff');
  }
  if (glider) drawGliderHelp();
  else drawButton(bs.gear, p.gearDown ? '⚙️ raus' : '⚙️ drin', 'Fahrwerk', false, p.gearDown ? '#7dff9a' : '#ffd34d');
  drawButton(bs.brake, '🛑', 'Bremse', held('brake'));
  drawButton(bs.view, '👁️', view === 'cockpit' ? 'Außen' : 'Cockpit', false);
  if (bs.fire && PT().bombs) drawButton(bs.fire, '💣', `Bomben · 🎯${drops}`, held('fire'), '#ff9a2a');
  else if (bs.fire && PT().cargo) drawButton(bs.fire, '📦', `Abwurf · ✅${drops}`, held('fire'), '#ffd34d');
  else if (bs.fire) drawButton(bs.fire, '🚀', `Feuer · 🎈${hits}`, held('fire'), '#ff9a2a');
  drawButton(bs.left, '◀', 'links', held('left'));
  drawButton(bs.right, '▶', 'rechts', held('right'));
  // Radar links über den Knöpfen
  const leftTop = Math.min(...[bs.thrUp, bs.gear].filter(r => r.x < W() * 0.3).map(r => r.y)) - 10;
  const radarTop = view === 'cockpit' ? my + mh + 8 : hy + hs * 2 + 8;
  const rs = Math.min(130 * u, leftTop - radarTop);
  if (rs >= 60 && view !== 'cockpit') drawRadar(m, leftTop - rs, rs);
  // Schubanzeige
  if (glider) { drawBubble(); return; }
  const bx = bs.thrUp.x + bs.thrUp.w + 8, by = bs.thrUp.y, bh = bs.thrDn.y + bs.thrDn.h - by, bw = 12 * u;
  panel(bx, by, bw, bh);
  const fh = (bh - 6) * p.throttle;
  const g = ctx.createLinearGradient(0, by + bh, 0, by);
  g.addColorStop(0, '#5fe07a'); g.addColorStop(1, '#ff8a1f');
  ctx.fillStyle = g;
  ctx.fillRect(bx + 3, by + bh - 3 - fh, bw - 6, fh);
  txt(`${Math.round(p.throttle * 100)}%`, bx + bw + 4, by + bh - 3 - fh, 11 * u, '#fff', 'left', 'rgba(0,0,0,0.6)');

  drawBubble();
}

function drawRadar(x, y, R, RH = R) {
  // Karte von oben: oben ist Richtung Ziel, das Flugzeug in der Mitte
  panel(x, y, R, RH);
  ctx.save();
  ctx.beginPath(); ctx.roundRect(x, y, R, RH, 10); ctx.clip();
  const cxr = x + R / 2, cyr = y + RH * 0.6;
  const range = clamp(Math.abs(DEST - p.x) * 1.1, 600, 9000);
  const k = R * 0.5 / range;
  // zur Seite viermal so groß, damit man auch kleine Abweichungen sieht
  const mp = (wx, wz) => [cxr + (wz - p.z) * k * 4, cyr - (wx - p.x) * k];
  ctx.strokeStyle = 'rgba(60,255,120,0.75)'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(...mp(DEST - GLIDE_LEN, 0)); ctx.lineTo(...mp(DEST, 0)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = '#e8e8e8'; ctx.lineCap = 'butt';
  for (const r of [RWY_A, RWY_B]) {
    ctx.lineWidth = Math.max(3, 60 * k);
    ctx.beginPath(); ctx.moveTo(...mp(r.x0, 0)); ctx.lineTo(...mp(r.x1, 0)); ctx.stroke();
  }
  if (PT().glider) for (const t of THERMALS) {
    const [X, Y] = mp(t.x, 0);
    if (Y > y && Y < y + RH) txt('⬆', X, Y, 12, 'rgba(120,220,255,0.95)');
  }
  ctx.translate(cxr, cyr); ctx.rotate(Math.atan(Math.tan(p.hdg) * 4));
  ctx.fillStyle = '#ffd34d';
  ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(7, 7); ctx.lineTo(0, 3); ctx.lineTo(-7, 7); ctx.closePath(); ctx.fill();
  ctx.restore();
  txt('Radar', x + R / 2, y + 9, 10, 'rgba(255,255,255,0.7)');
}

function drawResult() {
  if (!result || resultT > 0) return;
  ctx.fillStyle = 'rgba(5,10,25,0.55)';
  ctx.fillRect(0, 0, W(), H());
  const u = clamp(Math.min(W(), H()) / 400, 0.8, 1.4);
  const cw = Math.min(440, W() - 32);
  const lines = wrap(result.text, cw - 40, 16 * u);
  const hasStars = result.ok && result.stars > 0;
  const paxLines = result.pax ? wrap(result.pax, cw - 40, 16 * u) : [];
  const ch = 60 * u + (hasStars ? 48 * u : 0) + (lines.length + paxLines.length) * 22 * u + (paxLines.length ? 10 * u : 0) + 90 * u;
  const cx = W() / 2 - cw / 2, cy = H() / 2 - ch / 2;
  ctx.fillStyle = result.ok ? 'rgba(20,60,140,0.95)' : 'rgba(120,30,30,0.95)';
  ctx.beginPath(); ctx.roundRect(cx, cy, cw, ch, 18); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2; ctx.stroke();
  let y = cy + 34 * u;
  txt(result.title, W() / 2, y, 26 * u, '#fff');
  y += 32 * u;
  if (hasStars) {
    for (let i = 0; i < 3; i++) txt(i < result.stars ? '★' : '☆', W() / 2 + (i - 1) * 44 * u, y + 10 * u, 40 * u, i < result.stars ? '#ffd34d' : 'rgba(255,255,255,0.4)');
    y += 48 * u;
  }
  for (const l of lines) { txt(l, W() / 2, y, 16 * u, 'rgba(255,255,255,0.92)'); y += 22 * u; }
  y += 10 * u;
  for (const l of paxLines) { txt(l, W() / 2, y, 16 * u, '#ffd34d'); y += 22 * u; }
  const bh = 46 * u, bw = (cw - 52) / 2;
  resBtns.again = { x: cx + 20, y: cy + ch - bh - 18, w: bw, h: bh };
  resBtns.menu = { x: cx + 32 + bw, y: cy + ch - bh - 18, w: bw, h: bh };
  for (const [r, label, col] of [[resBtns.again, 'Nochmal fliegen', '#2bb24c'], [resBtns.menu, 'Menü', 'rgba(255,255,255,0.2)']]) {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 12); ctx.fill();
    txt(label, r.x + r.w / 2, r.y + r.h / 2, 16 * u, '#fff');
  }
}

// ── Menü ───────────────────────────────────────────────────────────
let menuX = 0;
function drawMenu(dt) {
  menuX += dt * 60;
  const g = ctx.createLinearGradient(0, 0, 0, H());
  g.addColorStop(0, night ? '#050a24' : '#3f8fdc'); g.addColorStop(1, night ? '#1f3466' : '#bfe2ff');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W(), H());
  if (night && weather === 'sun') { drawStars(120, H() * 0.8, menuX * 0.1); drawMoon(W() * 0.18, H() * 0.3, 20); }
  if (night) ctx.globalAlpha = 0.35;
  drawFarClouds(menuX * 0.5, 0);
  ctx.globalAlpha = 1;

  const u = clamp(Math.min(W(), H()) / 400, 0.8, 1.6);
  const s = Math.min(W() * 0.62 / 78, H() * 0.3 / 26);
  const px = W() / 2, py = H() * 0.47 + Math.sin(time * 1.3) * 6;

  // Kondensstreifen
  ctx.lineCap = 'round';
  for (const [ex, ey] of PT().engines.map(([x, y]) => [x - 1.4, y])) {
    const g2 = ctx.createLinearGradient(px + ex * s, 0, 0, 0);
    g2.addColorStop(0, 'rgba(255,255,255,0.8)'); g2.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = g2; ctx.lineWidth = 4 * u;
    ctx.beginPath(); ctx.moveTo(px + ex * s, py + ey * s); ctx.lineTo(0, py + ey * s + 6); ctx.stroke();
  }
  ctx.save();
  ctx.translate(px, py); ctx.rotate(-3 * DEG); ctx.scale(s, s);
  drawPlaneType(PT(), 0, true);
  ctx.restore();

  // Vordere Wolken
  for (let i = 0; i < 4; i++) {
    const span = W() + 400;
    const x = ((rand(i + 70) * span - menuX * 1.6) % span + span) % span - 200;
    cloud(x, H() * (0.62 + rand(i + 80) * 0.15), 26 + rand(i + 90) * 20, night ? 0.3 : 0.85);
  }

  drawWeatherTint();
  drawWeatherFx(false);

  const ts = Math.min(W() * 0.09, 56 * u);
  txt('Flugsimulator', W() / 2, H() * 0.13, ts, '#fff', 'center', 'rgba(20,40,90,0.7)');
  txt(`Henrik Airlines · ${PT().name} · Frankfurt ✈ ${R.name}`, W() / 2, H() * 0.13 + ts * 0.85, ts * 0.38, '#ffd34d', 'center', 'rgba(20,40,90,0.7)');

  const bh = 56 * u, bw = Math.min(320, W() - 2 * bh - 60);
  menuBtn = { x: W() / 2 - bw / 2, y: H() * 0.72, w: bw, h: bh };
  // Flugzeug aussuchen
  const rows = PLANE_KEYS.length > 6 ? 2 : 1, perRow = Math.ceil(PLANE_KEYS.length / rows);
  const sw = Math.min(W() - 24, 420), sh = (rows > 1 ? 28 : 34) * u, segW = sw / perRow;
  const sy0 = menuBtn.y - rows * sh - 10 * u;
  ctx.fillStyle = 'rgba(20,40,90,0.55)';
  ctx.beginPath(); ctx.roundRect(W() / 2 - sw / 2, sy0, sw, rows * sh, 12); ctx.fill();
  planeBtns = PLANE_KEYS.map((k, i) => {
    const row = Math.floor(i / perRow), inRow = Math.min(perRow, PLANE_KEYS.length - row * perRow);
    const r = { x: W() / 2 - (inRow * segW) / 2 + (i % perRow) * segW, y: sy0 + row * sh, w: segW, h: sh, k };
    if (k === planeKey) {
      ctx.fillStyle = '#ffd34d';
      ctx.beginPath(); ctx.roundRect(r.x + 3, r.y + 3, r.w - 6, r.h - 6, 10); ctx.fill();
    }
    let fs = 15 * u;
    ctx.font = `bold ${fs}px system-ui, -apple-system, sans-serif`;
    fs *= Math.min(1, (segW - 8) / ctx.measureText(PLANES[k].short).width);   // lange Namen kleiner, damit sie in den Knopf passen
    txt(PLANES[k].short, r.x + r.w / 2, r.y + sh / 2, fs, k === planeKey ? '#1d2433' : '#fff');
    return r;
  });
  // Pfeile, um das Ziel auszusuchen
  menuPrev = { x: menuBtn.x - bh - 12, y: menuBtn.y, w: bh, h: bh };
  menuNext = { x: menuBtn.x + bw + 12, y: menuBtn.y, w: bh, h: bh };
  if (PT().glider) ctx.globalAlpha = 0.3;
  for (const [r, label] of [[menuPrev, '◀'], [menuNext, '▶']]) {
    ctx.fillStyle = 'rgba(20,40,90,0.55)';
    ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 14); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2; ctx.stroke();
    txt(label, r.x + r.w / 2, r.y + r.h / 2, bh * 0.4, '#fff');
  }
  ctx.globalAlpha = 1;
  const pulse = 1 + Math.sin(time * 4) * 0.03;
  ctx.save();
  ctx.translate(W() / 2, menuBtn.y + bh / 2); ctx.scale(pulse, pulse);
  ctx.fillStyle = '#2bb24c';
  ctx.beginPath(); ctx.roundRect(-bw / 2, -bh / 2, bw, bh, 16); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 3; ctx.stroke();
  txt(`✈ ${R.icon} ${R.name}`, 0, -bh * 0.12, 22 * u, '#fff');
  txt(`${night ? '🌙 Nacht' : '☀️ Tag'} · ${WX().icon} ${WX().name} · ${R.km} km`, 0, bh * 0.3, 11 * u, 'rgba(255,255,255,0.85)');
  ctx.restore();

  musicBtn = { x: W() - 58, y: 10, w: 44, h: 44 };
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.roundRect(musicBtn.x, musicBtn.y, 44, 44, 12); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1; ctx.stroke();
  txt(musicOff ? '🔇' : '🔊', musicBtn.x + 22, musicBtn.y + 23, 22, '#fff');

  // Tag oder Nacht aussuchen
  nightBtn = { x: musicBtn.x - 54, y: 10, w: 44, h: 44 };
  ctx.fillStyle = night ? '#3b4f9a' : '#f0a020';
  ctx.beginPath(); ctx.roundRect(nightBtn.x, nightBtn.y, 44, 44, 12); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1; ctx.stroke();
  txt(night ? '🌙' : '☀️', nightBtn.x + 22, nightBtn.y + 23, 22, '#fff');
  weatherBtn = { x: nightBtn.x - 54, y: 10, w: 44, h: 44 };
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.roundRect(weatherBtn.x, weatherBtn.y, 44, 44, 12); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1; ctx.stroke();
  txt(WX().icon, weatherBtn.x + 22, weatherBtn.y + 23, 22, '#fff');

  const hs = 12 * u;
  let y = menuBtn.y + bh + 22 * u;
  for (const l of ['Knöpfe: Schub + / −, Nase ▲ ▼, Kurve ◀ ▶, Fahrwerk, Bremse, 👁️ Cockpit',
                   'Tastatur: W S Schub · ↑ ↓ Nase · ← → Kurve · G Fahrwerk · Leertaste Bremse · C Cockpit · F Flugzeug · N Nacht · R Wetter · M Musik']) {
    for (const w of wrap(l, W() - 32, hs)) { txt(w, W() / 2, y, hs, night ? 'rgba(220,230,255,0.85)' : 'rgba(20,40,90,0.85)'); y += hs * 1.4; }
  }
  if (H() > W()) txt('📱 Tipp: Handy quer halten!', W() / 2, y + hs, hs * 1.2, night ? '#dfe7ff' : '#1f2f4a');
}

// ── Blick aus dem Cockpit ──────────────────────────────────────────
let view = 'outside';
function toggleView() {
  view = view === 'outside' ? 'cockpit' : 'outside';
  tone(660, 0, 0.1, 0.08);
}

const lerpRGB = (A, B, t) => A.map((v, i) => v + (B[i] - v) * t);
const rgb = A => `rgb(${A.map(Math.round).join(',')})`;
const COL = {
  land: [hex2rgb('#5da84a'), hex2rgb('#54a043')],
  sea: [hex2rgb('#2f8fd0'), hex2rgb('#2a86c4')],
  sand: [hex2rgb('#e8d49a'), hex2rgb('#e2cc8f')],
};
function groundColor(x, odd) {
  if (x > SEA_FROM && x < SEA_TO) return COL.sea[odd];
  if (x > SEA_FROM - 250 && x < SEA_TO + 250) return COL.sand[odd];
  return x > DEST_FROM ? hex2rgb(R.ground[odd]) : COL.land[odd];
}

function drawCockpit() {
  const w = W(), h = H();
  const f = Math.max(w, h) * 0.7;
  const pc = Math.cos(p.pitch * DEG), ps = Math.sin(p.pitch * DEG);
  const ch = Math.cos(p.hdg), sh = Math.sin(p.hdg);
  const nose = 36 * PT().k;
  const eyeX = p.x + nose * pc * ch, eyeZ = p.z + nose * pc * sh;
  const eye = p.y + 7 * Math.max(0.6, PT().k) + nose * ps;
  const vib = p.onGround ? (Math.random() - 0.5) * p.v * 0.03 : 0;
  const cx = w / 2 + shX, cy = h * 0.36 + shY + vib;
  const hy = cy + f * Math.tan(p.pitch * DEG);
  const near = 8, DMAX = 25000;
  // Weltpunkt -> Blickrichtung: d nach vorne, l zur Seite
  const cam = (x, z) => { const dx = x - eyeX, dz = z - eyeZ; return [dx * ch + dz * sh, -dx * sh + dz * ch]; };
  const scr = (d, l, a) => [cx + f * l / d, hy + f * (eye - a) / d];
  // Vielecke werden vorne abgeschnitten, damit nichts hinter dir gezeichnet wird
  const polyW = (pts, color) => {
    const cp = pts.map(([x, z, a]) => [...cam(x, z), a]);
    const out = [];
    for (let i = 0; i < cp.length; i++) {
      const A = cp[i], B = cp[(i + 1) % cp.length];
      if (A[0] >= near) out.push(A);
      if ((A[0] >= near) !== (B[0] >= near)) {
        const t = (near - A[0]) / (B[0] - A[0]);
        out.push([near, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t]);
      }
    }
    if (out.length < 3) return;
    ctx.fillStyle = color;
    ctx.beginPath();
    out.forEach((q, i) => { const [X, Y] = scr(q[0], q[1], q[2]); i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); });
    ctx.closePath(); ctx.fill();
  };
  const quad = (x0, x1, z0, z1, a, color) => polyW([[x0, z0, a], [x1, z0, a], [x1, z1, a], [x0, z1, a]], color);
  const hazeAt = d => Math.pow(clamp(d / 18000, 0, 1), 0.6);
  const tanView = Math.hypot(w, h) / 2 / f;
  const visible = (d, l, pad) => d > near && Math.abs(l) < d * tanView + pad;

  // in der Kurve kippt die ganze Welt
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(-p.roll * DEG); ctx.translate(-cx, -cy);
  const big = Math.max(w, h) * 2;

  // Himmel und Sonne
  const t = clamp(p.y / 1100, 0, 1);
  const [topA, lowA] = skyColors(t);
  const g = ctx.createLinearGradient(0, hy - h, 0, hy);
  g.addColorStop(0, rgb(topA));
  g.addColorStop(1, rgb(lowA));
  ctx.fillStyle = g;
  ctx.fillRect(cx - big, cy - big, 2 * big, 2 * big);
  const sunA = 20 * DEG - p.hdg;
  const sxp = cx + f * Math.tan(sunA), syp = hy - f * 0.5;
  if (!night && weather === 'sun' && Math.abs(sunA) < 70 * DEG) {
    const sg = ctx.createRadialGradient(sxp, syp, 0, sxp, syp, 110);
    sg.addColorStop(0, 'rgba(255,250,220,0.95)');
    sg.addColorStop(0.25, 'rgba(255,240,180,0.6)');
    sg.addColorStop(1, 'rgba(255,240,180,0)');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(sxp, syp, 110, 0, Math.PI * 2); ctx.fill();
  }

  // Boden in Streifen; weit weg wird alles dunstig
  ctx.fillStyle = rgb(lowA);
  ctx.fillRect(cx - big, hy, 2 * big, big);
  for (let x = Math.floor((eyeX - 3000) / 100) * 100; x < eyeX + DMAX;) {
    const dist = Math.abs(x - eyeX);
    const step = dist < 1500 ? 100 : dist < 6000 ? 400 : 2000;
    const nx = (Math.floor(x / step) + 1) * step;
    const odd = Math.floor(x / step) & 1;
    quad(x, nx, eyeZ - 60000, eyeZ + 60000, 0, rgb(lerpRGB(groundColor((x + nx) / 2, odd), lowA, hazeAt(Math.max(0, x - eyeX)))));
    x = nx;
  }

  // Berge am Horizont: flache Hügel bei Frankfurt, am Ziel je nach Land
  const ranges = [[12000, -9000, -800, 60, '#7f9fb0']];
  if (R.mountains) ranges.push([DEST + R.mountains[0], ...R.mountains.slice(1)]);
  let fieldMax = 7000;
  for (const [mx, z0, z1, mh, col] of ranges) {
    const dm = mx - eyeX;
    if (dm < 600 || dm > 60000) continue;
    fieldMax = Math.min(fieldMax, dm);
    const pts = [];
    for (let z = z0; z <= z1; z += (z1 - z0) / 60) {
      const env = Math.sin(Math.PI * (z - z0) / (z1 - z0));
      pts.push([mx, z, mh * env * (0.55 + 0.3 * Math.sin(z / 900) + 0.15 * Math.sin(z / 330 + 1))]);
    }
    pts.push([mx, z1, 0], [mx, z0, 0]);
    polyW(pts, rgb(lerpRGB(hex2rgb(col), lowA, Math.pow(clamp(dm / 40000, 0, 1), 0.5) * 0.55)));
  }

  // Felder wie ein Flickenteppich
  const FW = 250;
  for (let row = Math.floor((eyeX - 1500) / FW); row * FW < eyeX + fieldMax; row++) {
    const x0 = row * FW, x1 = x0 + FW, xm = x0 + FW / 2;
    if (landFactor(x0) < 1 || landFactor(x1) < 1) continue;
    const pal = xm > DEST_FROM ? R.fields : FIELDS;
    const off = rand(row + 0.42) * FW;
    const airport = (xm > -800 && xm < RWY_A.x1 + 600) || (xm > RWY_B.x0 - 600 && xm < RWY_B.x1 + 600);
    for (let c = Math.floor((eyeZ - 6000 - off) / FW); c * FW + off < eyeZ + 6000; c++) {
      const za = c * FW + off, zb = za + FW;
      const [d, l] = cam(xm, za + FW / 2);
      if (d > fieldMax + 400 || !visible(Math.max(d + FW, near + 1), l, FW * 1.5)) continue;
      const base = airport && Math.abs(za + FW / 2) < 600 ? '#6aae55' : pal[Math.floor(rand(row * 7.3 + c * 1.7) * pal.length)];
      quad(x0, x1, za, zb, 0, rgb(lerpRGB(hex2rgb(base), lowA, hazeAt(Math.max(0, d)))));
    }
  }
  // Landstraßen
  for (const z of [-900, 1400]) {
    for (let x = Math.floor((eyeX - 1500) / FW) * FW; x < eyeX + fieldMax; x += FW) {
      if (landFactor(x) < 1 || landFactor(x + FW) < 1) continue;
      if (x > RWY_B.x0 - 1500 && x < RWY_B.x1 + 800 && z > 0) continue;
      quad(x, x + FW, z - 4, z + 4, 0, rgb(lerpRGB([140, 140, 135], lowA, hazeAt(Math.max(0, x - eyeX)))));
    }
  }
  // Glitzern der Sonne auf dem Meer
  for (let i = 0; i < 90; i++) {
    const yy = hy + 2 + Math.pow(rand(i * 1.3), 2) * h;
    const dd = f * eye / Math.max(1, yy - hy);
    const xw = eyeX + dd * ch;
    if (!(xw > SEA_FROM && xw < SEA_TO)) continue;
    if (rand(i * 2.1 + Math.floor(time * 7) * 0.13) < 0.45) continue;
    const spread = 20 + (yy - hy) * 0.5;
    const xx = sxp + (rand(i * 4.7 + Math.floor(time * 3)) - 0.5) * spread * 2;
    ctx.fillStyle = 'rgba(255,255,235,0.9)';
    ctx.fillRect(xx, yy, 2 + (yy - hy) * 0.02, 1 + (yy - hy) * 0.008);
  }

  // Landebahnen
  // nachts werden alle Lichter erst nach dem Abdunkeln gezeichnet
  const glows = [], late = [];
  const light = (x, z, a, r, color) => {
    if (night) { glows.push([x, z, a, r, color]); return; }
    const [d, l] = cam(x, z);
    if (!visible(d, l, 20) || d > 9000) return;
    const [X, Y] = scr(d, l, a);
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(X, Y, Math.max(1, f * r / d), 0, Math.PI * 2); ctx.fill();
  };
  const wet = weather === 'rain' || weather === 'storm';
  for (const r of [RWY_A, RWY_B]) {
    if (r.x1 < eyeX - 3000 || r.x0 > eyeX + DMAX) continue;
    const near = r.x0 < eyeX + 7000;
    quad(r.x0 - 60, r.x1 + 60, -38, 38, 0, '#6b6f72');                 // Seitenstreifen
    quad(r.x0, r.x1, -30, 30, 0, wet ? '#2c3036' : '#3b3f45');
    if (near) {
      // Asphaltplatten in leicht anderen Grautönen
      for (let x = r.x0; x < r.x1; x += 200) if (rand(x * 0.013) < 0.4) quad(x, x + 200, -30, 30, 0, wet ? '#30343a' : '#41454b');
      // Reifenspuren in der Aufsetzzone
      for (const z of [-7, 4]) quad(r.x0 + 250, r.x0 + 900, z, z + 3, 0, 'rgba(15,15,18,0.5)');
    }
    quad(r.x0, r.x1, -28.5, -27.5, 0, '#ffffff');                     // Randlinien
    quad(r.x0, r.x1, 27.5, 28.5, 0, '#ffffff');
    for (const e of [r.x0 + 10, r.x1 - 50]) {
      for (const z of [-26, -20, -14, -8, 5, 11, 17, 23]) quad(e, e + 40, z, z + 3, 0, '#ffffff');
    }
    if (near) {
      runwayNumber(r.num, r.x0 + 70, quad);
      for (let i = 1; i <= 6; i++) {
        const x = r.x0 + i * 150, big = i === 2;
        for (const side of [-1, 1]) {
          if (big) quad(x, x + 60, side * 18 - 4, side * 18 + 4, 0, '#ffffff');
          else for (const k of [0, 1, 2]) quad(x, x + 22, side * (9 + k * 4), side * (9 + k * 4) + side * 1.8, 0, '#ffffff');
        }
      }
    }
    for (let x = r.x0 + 120; x < r.x1 - 120; x += 50) {
      if (x + 30 < eyeX - 200 || x > eyeX + 6000) continue;
      quad(x, x + 30, -0.7, 0.7, 0, '#ffffff');
    }
    for (let x = r.x0; x <= r.x1; x += 60) {
      const color = x === r.x0 ? '#3f3' : x + 60 > r.x1 ? '#f33' : '#fff7d0';
      light(x, -31, 0.5, 0.5, color);
      light(x, 31, 0.5, 0.5, color);
    }
    // Mittellinienfeuer und Lichterreihen in der Aufsetzzone
    for (let x = r.x0 + 15; x < r.x1; x += 30) {
      const left = r.x1 - x;
      light(x, 0, 0.1, 0.35, left < 300 ? '#ff4040' : left < 900 && (x / 30) % 2 < 1 ? '#ff4040' : '#f4f8ff');
      if (x < r.x0 + 900 && night) for (const z of [-11, -9, 9, 11]) light(x, z, 0.1, 0.3, '#f4f8ff');
    }
    if (r === RWY_B) papiColors(r).forEach((c, i) => light(r.x0 + 20, -45 - i * 9, 1, 0.9, c));
  }
  // Anflugbefeuerung mit Lauflicht
  const run = Math.floor((time * 2) % 1 * 15);
  for (let i = 0; i < 15; i++) {
    for (const z of i % 5 === 0 ? [-12, -6, 0, 6, 12] : [0]) {
      light(DEST - 60 - (14 - i) * 60, z, 4, i === run ? 1.4 : 0.8, i === run ? '#ffffff' : '#ffe98a');
    }
  }

  // Alles, was in die Höhe ragt, von hinten nach vorne zeichnen
  const things = [];
  const box = (x0, x1, z0, z1, a0, a1, front, side, top) => {
    const [d] = cam((x0 + x1) / 2, (z0 + z1) / 2);
    if (d < -200 || d > DMAX) return;
    things.push({ d, draw() {
      if (eyeZ < z0) polyW([[x0, z0, a0], [x1, z0, a0], [x1, z0, a1], [x0, z0, a1]], side);
      if (eyeZ > z1) polyW([[x0, z1, a0], [x1, z1, a0], [x1, z1, a1], [x0, z1, a1]], side);
      if (eyeX < x0) polyW([[x0, z0, a0], [x0, z1, a0], [x0, z1, a1], [x0, z0, a1]], front);
      if (eyeX > x1) polyW([[x1, z0, a0], [x1, z1, a0], [x1, z1, a1], [x1, z0, a1]], front);
      if (eye > a1) polyW([[x0, z0, a1], [x1, z0, a1], [x1, z1, a1], [x0, z1, a1]], top);
    } });
  };
  const airport = (b, color) => {
    const [t0, t1] = AP.term.map(x => b + x), [h0, h1] = AP.hangar.map(x => b + x), [f0, f1] = AP.fire.map(x => b + x), x = b + AP.tower;
    box(t0, t1, -260, -180, 0, 10, color, color, color);
    box(t0, t1, -260, -180, 10, 20, '#5d8fb5', '#4f7ea3', '#e6e9ed');
    for (const g of AP.gates) box(b + g, b + g + 4, -180, -150, 4.6, 7.6, '#c9ced5', '#b8bec6', '#d5d9df');
    box(h0, h1, -250, -190, 0, 26, '#c7ccd3', '#b7bcc3', '#dadde2');
    box(f0, f1, -230, -200, 0, 9, '#e8e2d6', '#d8d2c6', '#c4161c');
    box(x - 14, x + 14, -144, -116, 0, 8, '#c4cad1', '#b4bac1', '#d0d5db');
    box(x - 4, x + 4, -134, -126, 8, 52, '#e3e7ec', '#cdd3da', '#f0f2f5');
    box(x - 9, x + 9, -139, -121, 52, 62, '#5fb8c9', '#4fa6b7', '#e3e7ec');
  };
  if (eyeX < RWY_A.x1 + 3000) airport(0, '#9aa3ad');
  if (eyeX > DEST - 20000) airport(DEST + 300, R.terminal);
  // Dörfer mit roten Dächern
  for (let k = Math.floor((eyeX - 2500) / 2500); k <= (eyeX + 5000) / 2500; k++) {
    const vx = k * 2500 + 800;
    if (rand(k + 0.33) > 0.65 || landFactor(vx - 200) < 1 || landFactor(vx + 600) < 1) continue;
    if ((vx > -1500 && vx < RWY_A.x1 + 1500) || (vx > RWY_B.x0 - 2500 && vx < RWY_B.x1 + 1500)) continue;
    const zc = (rand(k + 0.77) < 0.5 ? -1 : 1) * (400 + rand(k + 0.9) * 1200);
    const hc = vx > DEST_FROM ? R.houses : ['#eadfcb', '#d8ccb6', '#c0503a', '#a8443a'];
    for (let i = 0; i < 9; i++) {
      const hx = vx + rand(k * 9 + i) * 320, hz = zc + rand(k * 9 + i + 0.5) * 260;
      box(hx, hx + 12, hz, hz + 10, 0, 6 + rand(k + i) * 3, hc[0], hc[1], i % 3 ? hc[2] : hc[3]);
      if (night && rand(k * 9 + i + 0.2) < 0.75) glows.push([hx + 6, hz + 5, 3, 1.2, '#ffd27a']);
    }
  }
  // Bäume und Palmen
  for (let c = Math.floor((eyeX - 1000) / 50); c <= (eyeX + 4000) / 50; c++) {
    for (let k = 0; k < 3; k++) {
      const n = c * 3 + k;
      const x = c * 50 + rand(n + 0.1) * 50;
      const z = (rand(n + 0.6) - 0.5) * 5000;
      if (landFactor(x) < 1 || Math.abs(z) < 60) continue;
      if (Math.abs(z) < 320 && ((x > -1000 && x < RWY_A.x1 + 300) || (x > RWY_B.x0 - 1200 && x < RWY_B.x1 + 300))) continue;
      const kind = treeKind(x, n);
      if (!kind) continue;
      const [d, l] = cam(x, z);
      if (!visible(d, l, 30)) continue;
      const ht = 12 + rand(n + 0.3) * 10;
      things.push({ d, draw() {
        const [X, Y] = scr(d, l, 0), s = f / d;
        if (ht * s < 1.5) return;
        const save = S; S = s;
        drawTree(X, Y, ht * s, kind === 'palm');
        S = save;
      } });
    }
  }
  // Wolken
  const cell = 110;
  for (let c = Math.floor((eyeX - 3000) / cell); c <= (eyeX + DMAX * 0.6) / cell; c++) {
    for (let k = 0; k < 2; k++) {
      const n = c + k * 0.5;
      if (rand(n) > 0.5) continue;
      const x = c * cell + rand(n + 0.2) * 60;
      const alt = 70 + rand(n + 0.3) * 1250, z = (rand(n + 0.55) - 0.5) * 8000;
      const CR = (14 + rand(n + 0.7) * 26) * 3;
      const [d, l] = cam(x, z);
      if (d < 20 || !visible(d, l, CR * 3)) continue;
      things.push({ d, draw() {
        const [X, Y] = scr(d, l, alt), r = f * CR / d;
        if (Y < -r * 2 - h || Y > 2 * h + r * 2) return;
        cloud(X, Y, r, clamp((d - 20) / 250, 0, 1) * 0.9);
      } });
    }
  }
  if (PT().glider) {
    for (const t of THERMALS) {
      const [d, l] = cam(t.x, 0);
      if (d < 50 || !visible(d, l, 400)) continue;
      things.push({ d, draw() { const [X, Y] = scr(d, l, 345); cloud(X, Y, f * 110 / d, 0.95); } });
    }
    const tw = p.tow;
    if (tw && !tw.free) {
      const [d, l] = cam(tw.x, 0);
      if (d > near) things.push({ d, draw() {
        // von hinten: Flügel, Rumpf, Leitwerk, und das Seil kommt zu dir
        const [X, Y] = scr(d, l, tw.y + 1), k = f / d;
        ctx.strokeStyle = '#f2f2f2'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(cx, h * 0.6); ctx.quadraticCurveTo(cx, (h * 0.6 + Y) / 2 + 10, X, Y); ctx.stroke();
        ctx.fillStyle = '#ffffff'; ctx.fillRect(X - 5 * k, Y - 0.4 * k, 10 * k, 0.8 * k);
        ctx.fillStyle = GREEN; ctx.fillRect(X - 5 * k, Y + 0.1 * k, 10 * k, 0.3 * k);
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(X, Y, 0.9 * k, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = BLUE; ctx.fillRect(X - 0.25 * k, Y - 2.4 * k, 0.5 * k, 2.2 * k);
        ctx.fillStyle = '#dfe4ea'; ctx.fillRect(X - 2 * k, Y - 0.9 * k, 4 * k, 0.35 * k);
      } });
    }
  }
  // berühmte Bauwerke am Ziel
  for (const [kind, lx, lz] of R.landmarks) {
    const [d, l] = cam(DEST + lx, lz);
    if (!visible(d, l, 2000) || d > 60000) continue;
    things.push({ d, draw() {
      const [X, Y] = scr(d, l, 0);
      ctx.globalAlpha = 1 - 0.7 * hazeAt(d);
      drawLandmark(kind, X, Y, f / d * 2);   // doppelt so groß, damit man sie gut erkennt
      ctx.globalAlpha = 1;
    } });
  }
  for (const b of balloons) {
    const [d, l] = cam(b.x, 0);
    if (b.hit || !visible(d, l, 2000) || d > 8000) continue;
    things.push({ d, draw() { const [X, Y] = scr(d, l, b.a); drawBalloon(X, Y, Math.max(2, f * 8 / d), b.c); } });
  }
  for (const r of rockets) {
    const [d, l] = cam(r.x, 0);
    if (d < near) continue;
    things.push({ d, draw() { const [X, Y] = scr(d, l, r.a); ctx.fillStyle = '#ffb347'; ctx.beginPath(); ctx.arc(X, Y, Math.max(2, f * 1.5 / d), 0, Math.PI * 2); ctx.fill(); } });
  }
  // grüne Ringe der Landehilfe
  for (let x = DEST - GLIDE_LEN; x <= (PT().glider ? -1e9 : DEST); x += 120) {
    const [d, l] = cam(x, 0);
    if (!visible(d, l, 50) || d > 5000) continue;
    (night ? late : things).push({ d, draw() {
      const [X, Y] = scr(d, l, glideAlt(x) + 7), r = Math.max(2, f * 4 / d);
      // nahe Ringe werden durchsichtig, damit man die Landebahn dahinter sieht
      ctx.strokeStyle = `rgba(60,255,120,${0.85 * clamp((d - 100) / 300, 0, 1)})`; ctx.lineWidth = Math.max(1.5, r * 0.15);
      ctx.beginPath(); ctx.arc(X, Y, r, 0, Math.PI * 2); ctx.stroke();
    } });
  }
  things.sort((a, b) => b.d - a.d);
  for (const o of things) o.draw();

  if (night) {
    ctx.fillStyle = NIGHT_SKY;
    ctx.fillRect(cx - big, cy - big, 2 * big, 2 * big);
    for (let i = 0; i < (weather === 'sun' ? 160 : 0); i++) {
      const az = (rand(i * 1.7) - 0.5) * 170 * DEG - p.hdg, el = (1 + rand(i * 2.9) * 55) * DEG;
      if (Math.abs(az) > 80 * DEG) continue;
      const X = cx + f * Math.tan(az), Y = hy - f * Math.tan(el);
      ctx.fillStyle = `rgba(255,255,235,${0.4 + 0.5 * (0.5 + 0.5 * Math.sin(time * 2 + i * 1.3))})`;
      ctx.fillRect(X, Y, 1.5, 1.5);
    }
    if (weather === 'sun' && Math.abs(sunA) < 70 * DEG) drawMoon(sxp, syp, 22);
    // Lichter von Städten auf dem Boden
    for (let row = Math.floor((eyeX - 1000) / 300); row * 300 < eyeX + 12000; row++) {
      for (let k = 0; k < 14; k++) {
        const n = row * 14 + k, x = row * 300 + rand(n + 0.31) * 300, z = (rand(n + 0.62) - 0.5) * 9000;
        const city = x < 7000 || Math.abs(x - DEST) < 7000;
        if (landFactor(x) < 1 || Math.abs(z) < 80 || rand(n + 0.93) > (city ? 0.9 : 0.25)) continue;
        glows.push([x, z, 1, 1.5, rand(n) < 0.75 ? '#ffcd6e' : '#eef2ff']);
      }
    }
    for (const x0 of [300, DEST + 600]) for (let x = x0; x <= x0 + 380; x += 20) glows.push([x, -180, 8, 1.2, '#ffd78a']);
    for (const [x, z, a, r, color] of glows) {
      const [d, l] = cam(x, z);
      if (!visible(d, l, 20) || d > 12000) continue;
      const [X, Y] = scr(d, l, a), rr = Math.max(1, f * r / d);
      if (rr > 1.5) glowDot(X, Y, rr * 4, color);
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(X, Y, rr, 0, Math.PI * 2); ctx.fill();
    }
    late.sort((a, b) => b.d - a.d);
    for (const o of late) o.draw();
  }

  // Blendenflecken, wenn die Sonne zu sehen ist
  if (!night && weather === 'sun' && Math.abs(sunA) < 40 * DEG && syp > 0 && syp < h * 0.6) {
    const vx = cx - sxp, vy = cy - syp;
    for (const [k, r, a, c] of [[0.5, 18, 0.12, '255,220,150'], [0.9, 8, 0.18, '180,220,255'], [1.3, 26, 0.08, '255,180,120'], [1.7, 12, 0.12, '160,255,200']]) {
      ctx.fillStyle = `rgba(${c},${a})`;
      ctx.beginPath(); ctx.arc(sxp + vx * k, syp + vy * k, r, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();

  drawWeatherTint();
  drawWeatherFx(true);
  drawCockpitFrame();
}

function drawCockpitFrame() {
  const w = W(), h = H(), mid = w / 2;
  const top = h * 0.05, bot = h * 0.62;
  const fg = ctx.createLinearGradient(0, 0, 0, h);
  fg.addColorStop(0, '#3a414d'); fg.addColorStop(1, '#22262e');
  ctx.fillStyle = fg;
  ctx.beginPath();
  ctx.rect(0, 0, w, h);
  // eine große Scheibe ohne Mittelbalken, damit die Landebahn nie verdeckt ist
  ctx.moveTo(w * 0.02, top + h * 0.1); ctx.lineTo(w * 0.1, top); ctx.lineTo(w * 0.9, top); ctx.lineTo(w * 0.98, top + h * 0.1);
  ctx.lineTo(w * 0.95, bot); ctx.lineTo(w * 0.05, bot); ctx.closePath();
  ctx.fill('evenodd');
  ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 2;
  ctx.stroke();
  // Spiegelung in der Scheibe
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(w * 0.02, top + h * 0.1); ctx.lineTo(w * 0.1, top); ctx.lineTo(w * 0.9, top); ctx.lineTo(w * 0.98, top + h * 0.1);
  ctx.lineTo(w * 0.95, bot); ctx.lineTo(w * 0.05, bot); ctx.closePath();
  ctx.clip();
  const rg = ctx.createLinearGradient(w * 0.15, top, w * 0.45, bot);
  rg.addColorStop(0, 'rgba(255,255,255,0)'); rg.addColorStop(0.45, 'rgba(255,255,255,0.07)');
  rg.addColorStop(0.55, 'rgba(255,255,255,0.07)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, w, h);
  ctx.restore();
  // Schrauben im Rahmen
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  for (let i = 0; i <= 12; i++) {
    const x = w * 0.1 + (w * 0.8) * i / 12;
    ctx.beginPath(); ctx.arc(x, top - 5, 1.5, 0, Math.PI * 2); ctx.fill();
  }
  // Blendschutz über dem Armaturenbrett
  ctx.fillStyle = '#1a1d23';
  ctx.beginPath();
  ctx.moveTo(0, bot + 6); ctx.quadraticCurveTo(mid, bot - 14, w, bot + 6); ctx.lineTo(w, h); ctx.lineTo(0, h);
  ctx.closePath(); ctx.fill();

  // Bildschirme zwischen den Knöpfen
  const bs = buttons();
  const sy0 = bot + 12, sh = h - sy0 - 12;
  const l0 = bs.thrUp.x + bs.thrUp.w + 64, l1 = bs.gear.x - 12;
  const r0 = bs.brake.x + bs.brake.w + 12, r1 = bs.left.x - 12;
  if (l1 - l0 > 90 && sh > 50) {
    drawPFD(l0, sy0, l1 - l0, sh);
    if (r1 - r0 > 70) drawRadar(r0, sy0, Math.min(r1 - r0, sh), Math.min(r1 - r0, sh));
  } else {
    // Hochformat: Bildschirme über den Knöpfen
    const y1 = Math.min(bs.gear.y, bs.view.y) - 14, hh = y1 - sy0, half = (w - 28 - 12) / 2;
    if (hh > 60) {
      drawPFD(14, sy0, half, hh);
      drawRadar(14 + half + 12, sy0, half, hh);
    }
  }
}

function screen(x, y, w, h) {
  ctx.fillStyle = '#0b0e13';
  ctx.beginPath(); ctx.roundRect(x - 4, y - 4, w + 8, h + 8, 8); ctx.fill();
  ctx.fillStyle = '#05070a';
  ctx.fillRect(x, y, w, h);
}

function drawPFD(x, y, w, h) {
  // künstlicher Horizont: blauer Himmel, brauner Boden, bewegt sich mit der Nase
  screen(x, y, w, h);
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  const k = h / 40, mx = x + w / 2, off = p.pitch * k;
  ctx.fillStyle = '#2f7fd6'; ctx.fillRect(x, y, w, h);
  ctx.save();
  ctx.translate(mx, y + h / 2); ctx.rotate(-p.roll * DEG);
  ctx.fillStyle = '#8a5a2b'; ctx.fillRect(-w * 2, off, w * 4, h * 2);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-w * 2, off); ctx.lineTo(w * 2, off); ctx.stroke();
  for (let a = -20; a <= 20; a += 5) {
    if (!a) continue;
    const yy = off - a * k, len = a % 10 ? w * 0.08 : w * 0.16;
    ctx.beginPath(); ctx.moveTo(-len, yy); ctx.lineTo(len, yy); ctx.stroke();
  }
  ctx.restore();
  ctx.strokeStyle = '#ffd34d'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(mx - w * 0.22, y + h / 2); ctx.lineTo(mx - w * 0.07, y + h / 2); ctx.lineTo(mx, y + h / 2 + 6); ctx.lineTo(mx + w * 0.07, y + h / 2); ctx.lineTo(mx + w * 0.22, y + h / 2);
  ctx.stroke();
  ctx.restore();
  const fs = clamp(h * 0.16, 10, 16);
  for (const [tx, val, al] of [[x + 4, `${Math.round(p.v * 3.6)}`, 'left'], [x + w - 4, `${Math.round(p.y * ALT_SCALE / 10) * 10}`, 'right']]) {
    ctx.font = `bold ${fs}px system-ui, -apple-system, sans-serif`;
    const tw = ctx.measureText(val).width + 8;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(al === 'left' ? tx - 2 : tx - tw + 2, y + h / 2 - fs * 0.75, tw, fs * 1.5);
    txt(val, al === 'left' ? tx + 2 : tx - 2, y + h / 2, fs, '#7dff9a', al);
  }
  txt('km/h', x + 4, y + h / 2 + fs * 1.4, fs * 0.65, '#7dff9a', 'left');
  txt('m', x + w - 4, y + h / 2 + fs * 1.4, fs * 0.65, '#7dff9a', 'right');
}

// ── Spielschleife ──────────────────────────────────────────────────
let last = 0;
function loop(ts) {
  if (resizeFrames < 60) { resize(); resizeFrames++; }
  const dt = Math.min(0.05, last ? (ts - last) / 1000 : 0.016);
  last = ts;
  time += dt;

  if (state === 'menu') {
    startMusic();
    drawMenu(dt);
  } else {
    if (state === 'flying') { update(dt); updateEngine(); updateStorm(dt); }
    flash = Math.max(0, flash - dt * 2.5);
    welcomeT -= dt;
    resultT -= dt;
    if (state === 'crashed') updateCrash(dt);
    updateParticles(dt);

    const base = Math.min(W() / 260, H() / 170);
    // kleine Flugzeuge holt die Kamera näher heran
    S = base * (1 - 0.3 * clamp(p.y / 700, 0, 1)) * clamp(1 / Math.sqrt(PT().k), 1, 2.1);
    const target = Math.max(p.y + 10, H() * 0.27 / S);
    if (!cam.init) { cam.a = target; cam.init = true; }
    cam.a += (target - cam.a) * Math.min(1, dt * 4);
    shake = Math.max(0, shake - dt * 20);
    shX = (Math.random() - 0.5) * shake; shY = (Math.random() - 0.5) * shake;
    if (state === 'flying') farX += p.v * dt * 0.25;

    const gy = sy(0);
    if (view === 'cockpit' && state === 'flying') {
      drawCockpit();
    } else {
      drawSky();
      drawFarClouds(farX, -cam.a * S * 0.05);
      drawHills(gy);
      if (p.x < 9000) drawSkyline(gy);
      drawLandmarksSide(gy);
      drawGround(gy);
      drawAirports();
      drawTrees(gy);
      drawRunway(RWY_A);
      drawRunway(RWY_B);
      drawApproachLights();
      if (PT().glider) drawThermals();
      worldClouds(false);
      drawWeatherTint();
      if (night) {
        drawContrails();
        worldClouds(true);
        drawNightOutside(gy);
        if (PT().glider) drawTowPlane();
        drawBalloons(); drawCargo();
        drawPlaneNight();
        drawParticles();
        drawWreckFx();
      } else {
        drawGlidePath();
        drawContrails();
        drawShadow();
        if (PT().glider) drawTowPlane();
        drawBalloons(); drawCargo();
        drawPlane();
        drawParticles();
        drawWreckFx();
        worldClouds(true);
      }
      drawWeatherFx(false);
    }
    if (state === 'flying') drawHUD();
    drawResult();
  }

  homeBtn.hidden = state !== 'menu';
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
