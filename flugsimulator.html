<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>A380 Flugsimulator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #5aa9ee;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #home {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 10px);
    left: calc(env(safe-area-inset-left) + 10px);
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; text-decoration: none;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 12px;
  }
  #home[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<a id="home" href="index.html" aria-label="Zur Spielauswahl">🏠</a>
<script>
const homeBtn = document.getElementById('home');
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('load', resize);
document.addEventListener('DOMContentLoaded', resize);
resize();
let resizeFrames = 0;

const W = () => window.innerWidth;
const H = () => window.innerHeight;
const DEG = Math.PI / 180;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// ── Strecke ────────────────────────────────────────────────────────
// Die Spielwelt ist kleiner als die echte Welt, damit ein Flug nur ein paar Minuten dauert.
const RWY_A = { x0: 0, x1: 2800 };               // Startbahn Frankfurt
const DEST = 45000;                               // Anfang der Landebahn auf Mallorca
const RWY_B = { x0: DEST, x1: DEST + 3200 };
const SEA_FROM = 16000, SEA_TO = DEST - 3500;
const DIST_SCALE = 27;    // 45 km im Spiel = 1215 km Anzeige
const ALT_SCALE = 10;     // 1 m im Spiel = 10 m Anzeige
const GEAR_H = 8.2;       // von den Rädern bis zur Rumpfmitte
const VR = 75;            // Abhebetempo in m/s (270 km/h)
const CEILING = 1300;
const GLIDE = 4 * DEG;    // Winkel der grünen Landehilfe
const GLIDE_LEN = 13000;

const BLUE = '#1f4fd1', GREEN = '#1fb84f';

// ── Spielzustand ───────────────────────────────────────────────────
let state = 'menu';       // menu, flying, crashed, done
let p, cam, particles = [], contrail = [], result = null;
let resultT = 0, welcomeT = 0, shake = 0, farX = 0, time = 0;

function newFlight() {
  p = { x: 120, y: 0, v: 0, vy: 0, pitch: 0, throttle: 0, gear: 1, gearDown: true,
        onGround: true, flown: false, rwy: RWY_A, touchSink: 0, sinkAnim: 0, tilt: 0, drop: 0 };
  cam = { a: 0, init: false };
  particles = []; contrail = []; result = null;
  state = 'flying'; welcomeT = 4; shake = 0;
  pointers.clear();
  startEngine();
  chime();
}

function toMenu() {
  state = 'menu';
  stopEngine();
  pointers.clear();
}

// ── Steuerung ──────────────────────────────────────────────────────
const pointers = new Map();   // Finger -> Knopf
const keys = {};
const KEYMAP = {
  ArrowUp: 'up', ArrowDown: 'dn',
  ArrowRight: 'thrUp', w: 'thrUp', W: 'thrUp', '+': 'thrUp',
  ArrowLeft: 'thrDn', s: 'thrDn', S: 'thrDn', '-': 'thrDn',
  ' ': 'brake', b: 'brake', B: 'brake',
};
function held(k) {
  if (keys[k]) return true;
  for (const v of pointers.values()) if (v === k) return true;
  return false;
}
function toggleGear() {
  if (p.onGround) return;
  p.gearDown = !p.gearDown;
  clunk();
}

function buttons() {
  const b = clamp(Math.min(W(), H()) * 0.16, 54, 84);
  const m = 14;
  const gw = b * 1.25, gh = b * 0.72;
  return {
    thrUp: { x: m, y: H() - m - 2 * b - 10, w: b, h: b },
    thrDn: { x: m, y: H() - m - b, w: b, h: b },
    up:    { x: W() - m - b, y: H() - m - 2 * b - 10, w: b, h: b },
    dn:    { x: W() - m - b, y: H() - m - b, w: b, h: b },
    gear:  { x: W() / 2 - gw - 6, y: H() - m - gh, w: gw, h: gh },
    brake: { x: W() / 2 + 6, y: H() - m - gh, w: gw, h: gh },
    view:  { x: W() - m - b, y: H() - m - 2 * b - 20 - gh, w: b, h: gh },
  };
}
const hit = (r, x, y) => r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
function buttonAt(x, y) {
  const bs = buttons();
  for (const k in bs) if (hit(bs[k], x, y)) return k;
  return null;
}

let menuBtn = null, resBtns = {};
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  getAC();
  const x = e.clientX, y = e.clientY;
  if (state === 'menu') { if (hit(menuBtn, x, y)) newFlight(); return; }
  if (result && resultT <= 0) {
    if (hit(resBtns.again, x, y)) newFlight();
    else if (hit(resBtns.menu, x, y)) toMenu();
    return;
  }
  if (state !== 'flying') return;
  const k = buttonAt(x, y);
  if (!k) return;
  pointers.set(e.pointerId, k);
  if (k === 'gear') toggleGear();
  if (k === 'view') toggleView();
}, { passive: false });
canvas.addEventListener('pointermove', e => {
  e.preventDefault();
  if (!pointers.has(e.pointerId)) return;
  const k = buttonAt(e.clientX, e.clientY);
  const taps = ['gear', 'view'];
  if (!taps.includes(k) && !taps.includes(pointers.get(e.pointerId))) pointers.set(e.pointerId, k);
}, { passive: false });
const release = e => pointers.delete(e.pointerId);
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

window.addEventListener('keydown', e => {
  if (KEYMAP[e.key]) { keys[KEYMAP[e.key]] = true; e.preventDefault(); }
  if (e.repeat) return;
  getAC();
  if ((e.key === 'g' || e.key === 'G') && state === 'flying') toggleGear();
  if (e.key === 'c' || e.key === 'C') toggleView();
  if (e.key === 'Enter' && (state === 'menu' || (result && resultT <= 0))) newFlight();
  if (e.key === 'Escape' && state !== 'menu') toMenu();
});
window.addEventListener('keyup', e => { if (KEYMAP[e.key]) keys[KEYMAP[e.key]] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; pointers.clear(); });

// ── Töne ───────────────────────────────────────────────────────────
let AC = null, eng = null, noiseBuf = null;
function getAC() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function noise() {
  const ac = getAC();
  if (noiseBuf) return noiseBuf;
  const len = ac.sampleRate * 2;
  noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
  const d = noiseBuf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) {
    last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02;
    d[i] = last * 3.5;
  }
  return noiseBuf;
}
function startEngine() {
  const ac = getAC();
  if (eng) return;
  const src = ac.createBufferSource(); src.buffer = noise(); src.loop = true;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 250;
  const g = ac.createGain(); g.gain.value = 0;
  src.connect(lp).connect(g).connect(ac.destination);
  const whine = ac.createOscillator(); whine.type = 'sine'; whine.frequency.value = 700;
  const wg = ac.createGain(); wg.gain.value = 0;
  whine.connect(wg).connect(ac.destination);
  src.start(); whine.start();
  eng = { src, lp, g, whine, wg };
}
function updateEngine() {
  if (!eng) return;
  const t = AC.currentTime, th = p.throttle;
  eng.lp.frequency.setTargetAtTime(250 + th * 1100, t, 0.3);
  eng.g.gain.setTargetAtTime(0.15 + th * 0.35, t, 0.3);
  eng.whine.frequency.setTargetAtTime(700 + th * 1600, t, 0.5);
  eng.wg.gain.setTargetAtTime(0.006 + th * 0.016, t, 0.3);
}
function stopEngine() {
  if (!eng) return;
  const t = AC.currentTime, e = eng;
  e.g.gain.setTargetAtTime(0, t, 0.25);
  e.wg.gain.setTargetAtTime(0, t, 0.25);
  eng = null;
  setTimeout(() => { e.src.stop(); e.whine.stop(); }, 1500);
}
function tone(freq, start, dur, vol, type = 'sine') {
  const ac = getAC(), t = ac.currentTime + start;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function chime() { tone(880, 0, 1.2, 0.18); tone(698, 0.45, 1.6, 0.18); }
function noiseBurst(start, dur, vol, freq, type = 'lowpass') {
  const ac = getAC(), t = ac.currentTime + start;
  const src = ac.createBufferSource(); src.buffer = noise();
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = ac.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f).connect(g).connect(ac.destination);
  src.start(t, Math.random()); src.stop(t + dur + 0.05);
}
function clunk() { noiseBurst(0, 0.25, 0.6, 300); tone(90, 0, 0.2, 0.2, 'triangle'); }
function thump() { noiseBurst(0, 0.4, 0.9, 200); tone(60, 0, 0.3, 0.3, 'triangle'); }
function boom() { noiseBurst(0, 2.2, 1.6, 500); tone(45, 0, 1, 0.4, 'triangle'); }
function splash() { noiseBurst(0, 1.6, 1.2, 1200, 'bandpass'); noiseBurst(0.1, 1.2, 0.6, 400); }
function applause() {
  for (let i = 0; i < 70; i++) noiseBurst(Math.random() * 3, 0.06, 0.5 + Math.random() * 0.5, 1500 + Math.random() * 1500, 'bandpass');
}

// ── Physik ─────────────────────────────────────────────────────────
const inside = (x, r) => x >= r.x0 && x <= r.x1;

function localToWorld(lx, ly) {
  const dx = lx + 4, up = GEAR_H - ly, c = Math.cos(p.pitch * DEG), s = Math.sin(p.pitch * DEG);
  return [p.x + dx * c - up * s, p.y + dx * s + up * c];
}

function update(dt) {
  const up = held('up'), dn = held('dn');
  p.throttle = clamp(p.throttle + ((held('thrUp') ? 1 : 0) - (held('thrDn') ? 1 : 0)) * 0.45 * dt, 0, 1);
  p.gear += clamp((p.gearDown ? 1 : 0) - p.gear, -0.4 * dt, 0.4 * dt);

  // Auftrieb: erst ab 55 m/s trägt der Flügel, ab Abhebetempo ganz
  const lift = clamp((p.v - 55) / (VR - 55), 0, 1);
  const pr = (up ? 1 : 0) - (dn ? 1 : 0);
  if (p.onGround) {
    if (pr > 0 && p.v >= VR * 0.93) p.pitch += 8 * dt;
    else p.pitch -= 5 * dt;
    p.pitch = clamp(p.pitch, 0, 14);
  } else {
    p.pitch += pr * 12 * dt;
    if (p.v < 62) p.pitch -= (62 - p.v) * 0.8 * dt;   // zu langsam: die Nase sackt weg
    p.pitch = clamp(p.pitch, -20, 20);
  }

  const drag = 7.4e-5 * (1 + p.gear * 0.5);
  let acc = p.throttle * 5 - drag * p.v * p.v - 9.81 * Math.sin(p.pitch * DEG) * 0.6;
  if (p.onGround) acc -= 0.15 + (held('brake') ? 7 : 0);
  p.v = Math.max(0, p.v + acc * dt);

  // langsam sinkt er auch mit waagerechter Nase, damit man beim Landen aufsetzt
  const sag = clamp((100 - p.v) / 25, 0, 1) * 3;
  const vy = p.v * Math.sin(p.pitch * DEG) * lift - sag - (1 - lift) * 18;
  if (p.onGround) {
    p.vy = 0;
    if (vy > 0.5) p.onGround = false;
  }
  if (!p.onGround) {
    p.vy = vy;
    p.y = Math.min(CEILING, p.y + p.vy * dt);
    if (p.y > 10) p.flown = true;
  }
  p.x += p.v * Math.cos(p.pitch * DEG) * dt;

  if (!p.onGround && p.y <= 0) { touchdown(); return; }

  if (p.onGround && p.x > p.rwy.x1) {
    if (!p.flown) return crash('field', 'Die Startbahn war zu Ende! Gib mehr Schub und zieh die Nase hoch, sobald du 270 km/h schnell bist.');
    return crash('field', 'Über die Landebahn hinaus gerollt! Halte nach dem Aufsetzen die Bremse gedrückt.');
  }
  if (p.onGround && p.flown && p.v < 1.5) return landed();
  if (!p.onGround && p.x > RWY_B.x1 + 3000) {
    return finish({ ok: false, title: 'Vorbeigeflogen!', text: 'Mallorca liegt schon hinter dir. Folge beim nächsten Mal den grünen Punkten runter zur Landebahn.' });
  }

  // Kondensstreifen hoch oben
  if (p.y > 600) {
    for (const [lx, ly] of [[2, 5.6], [-8, 4.1]]) {
      const [x, a] = localToWorld(lx, ly);
      contrail.push({ x, a, t: 0, e: lx });
    }
  }
}

function touchdown() {
  const sink = -p.vy;
  p.y = 0;
  if (p.x > SEA_FROM && p.x < SEA_TO) return crash('sea', 'Du bist im Meer gelandet. Flieg weiter bis zur Insel Mallorca!');
  if (p.gear < 0.9) return crash('belly', 'Bauchlandung! Das Fahrwerk war nicht ausgefahren. Drück vor der Landung auf „Fahrwerk“.');
  if (p.pitch < -2) return crash('nose', 'Mit der Nase zuerst aufgesetzt! Zieh kurz vor dem Boden die Nase etwas hoch.');
  if (p.pitch > 12) return crash('tail', 'Heckaufsetzer! Die Nase war viel zu weit oben.');
  if (sink > 8) return crash('hard', 'Viel zu hart aufgesetzt! Sink langsamer und zieh kurz vor dem Boden die Nase hoch.');
  const rwy = inside(p.x, RWY_A) ? RWY_A : inside(p.x, RWY_B) ? RWY_B : null;
  if (!rwy) return crash('field', 'Daneben! Du bist neben der Landebahn aufgesetzt.');
  p.onGround = true; p.vy = 0; p.rwy = rwy; p.touchSink = sink;
  if (p.flown) p.throttle = 0;   // nach der Landung geht der Schub automatisch auf Leerlauf
  shake = Math.min(8, 2 + sink * 1.5);
  thump();
  for (let i = 0; i < 18; i++) {
    particles.push({ x: p.x - 4 + Math.random() * 6, a: 0.5, vx: -p.v * 0.15 * Math.random(), va: 1 + Math.random() * 3,
                     life: 1.4, max: 1.4, r: 1.5 + Math.random() * 2, grow: 4, color: '220,220,220' });
  }
}

function landed() {
  if (p.rwy === RWY_A) {
    return finish({ ok: true, stars: 0, title: 'Zurück in Frankfurt', text: 'Sicher gelandet! Aber Mallorca wartet noch auf dich. 🌴' });
  }
  const s = p.touchSink;
  const stars = s < 3 ? 3 : s < 5 ? 2 : 1;
  const text = stars === 3 ? 'Butterweich aufgesetzt! Die Passagiere klatschen.'
             : stars === 2 ? 'Gute Landung! Willkommen auf Mallorca. 🌴'
             : 'Etwas hart, aber alle sind heil angekommen!';
  finish({ ok: true, stars, title: 'Gelandet auf Mallorca!', text });
  applause();
}

function finish(r) {
  result = r;
  state = 'done';
  resultT = 0.6;
  stopEngine();
}

function crash(kind, text) {
  result = { ok: false, title: kind === 'sea' ? 'Platsch!' : 'Bumm!', text };
  state = 'crashed';
  resultT = 1.8;
  p.crash = kind;
  p.tilt = kind === 'nose' ? -6 : kind === 'tail' ? 8 : kind === 'sea' ? 0 : -3;
  p.drop = p.gear < 0.5 ? 4 : 2;
  shake = 14;
  stopEngine();
  if (kind === 'sea') {
    splash();
    for (let i = 0; i < 60; i++) {
      particles.push({ x: p.x - 30 + Math.random() * 70, a: 1, vx: (Math.random() - 0.3) * 30, va: 10 + Math.random() * 30,
                       life: 1.6, max: 1.6, r: 0.8 + Math.random() * 1.6, grow: 0, color: '235,245,255', g: 30 });
    }
  } else {
    boom();
    for (let i = 0; i < 50; i++) {
      const fire = i < 20;
      particles.push({ x: p.x - 30 + Math.random() * 70, a: 2 + Math.random() * 8, vx: (Math.random() - 0.5) * 8, va: 3 + Math.random() * 8,
                       life: fire ? 1 : 5, max: fire ? 1 : 5, r: fire ? 3 : 4 + Math.random() * 4, grow: fire ? 3 : 6,
                       color: fire ? '255,150,40' : '90,90,95' });
    }
  }
}

function updateParticles(dt) {
  for (const q of particles) {
    q.life -= dt;
    q.x += q.vx * dt;
    q.a += q.va * dt;
    if (q.g) q.va -= q.g * dt;
    q.r += q.grow * dt;
  }
  particles = particles.filter(q => q.life > 0);
  for (const c of contrail) c.t += dt;
  contrail = contrail.filter(c => c.t < 2.5);
  // Rauch steigt noch eine Weile nach dem Absturz auf
  if (state === 'crashed' && p.crash !== 'sea' && Math.random() < 0.3) {
    particles.push({ x: p.x - 20 + Math.random() * 40, a: 6, vx: 4, va: 6, life: 4, max: 4, r: 4, grow: 6, color: '90,90,95' });
  }
}

// ── Hinweise für den Piloten ───────────────────────────────────────
function glideAlt(x) { return (DEST - x) * Math.tan(GLIDE); }

function hint() {
  const dist = DEST - p.x;
  if (welcomeT > 0) return ['🔔 Bitte anschnallen! Wir fliegen nach Mallorca.', false];
  if (p.onGround && !p.flown) {
    if (p.throttle < 0.7) return ['Gib Schub! Halte „Schub +“ gedrückt.', false];
    if (p.v < VR * 0.93) return ['Schneller werden … bei 270 km/h abheben!', false];
    return ['Jetzt die Nase hoch! ▲', false];
  }
  if (p.onGround) return [p.throttle > 0.05 ? 'Schub ganz weg! Und bremsen! 🛑' : 'Bremse halten! 🛑', true];
  if (p.v < 66) return ['⚠️ Zu langsam! Mehr Schub und Nase runter!', true];
  if (p.gear > 0.5 && p.v > 110 && dist > 5000) return ['Fahrwerk einfahren! Sonst bremst es dich.', true];
  if (dist < 5000 && !p.gearDown) return ['Fahrwerk ausfahren! ⚙️', true];
  if (dist < 8000 && p.v > 105) return ['Zu schnell für die Landung! Schub weg.', true];
  if (dist < 1500 && p.y < 30) return ['Gleich am Boden: Nase ganz leicht hoch ▲', false];
  if (dist < GLIDE_LEN + 1500 && p.y > glideAlt(p.x) + 60) return ['Zeit für den Sinkflug! Folge den grünen Punkten ▼', false];
  if (dist < GLIDE_LEN && p.y < glideAlt(p.x) - 60) return ['Zu tief! Etwas höher ▲', true];
  if (dist < GLIDE_LEN) return ['Super, genau auf den grünen Punkten! 👍', false];
  if (p.y < 600) return ['Steig auf Reiseflughöhe: über 6000 m ▲', false];
  if (p.x > SEA_FROM && p.x < SEA_TO) return ['Unter dir ist das Meer 🌊', false];
  return ['Reiseflug! Genieß die Aussicht ☁️', false];
}

// ── Zeichnen: Hilfen ───────────────────────────────────────────────
let S = 1, shX = 0, shY = 0;
const sx = x => W() * 0.35 + (x - p.x) * S + shX;
const sy = a => H() * 0.5 - (a - cam.a) * S + shY;

function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(a, b, t) {
  const A = hex2rgb(a), B = hex2rgb(b);
  return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`;
}
function txt(str, x, y, size, color, align = 'center', stroke = null) {
  ctx.font = `bold ${size}px system-ui, -apple-system, sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineWidth = size * 0.2; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.strokeText(str, x, y); }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}
function wrap(str, maxW, size) {
  ctx.font = `bold ${size}px system-ui, -apple-system, sans-serif`;
  const lines = [];
  let line = '';
  for (const word of str.split(' ')) {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = word; }
    else line = test;
  }
  lines.push(line);
  return lines;
}
function cloud(x, y, r, alpha) {
  ctx.fillStyle = `rgba(255,255,255,${alpha})`;
  ctx.beginPath();
  for (const [dx, dy, k] of [[0, 0, 1], [-0.9, 0.25, 0.7], [0.95, 0.2, 0.75], [0.35, -0.45, 0.65], [-1.6, 0.45, 0.45], [1.7, 0.45, 0.45]]) {
    ctx.moveTo(x + dx * r + k * r, y + dy * r);
    ctx.arc(x + dx * r, y + dy * r, k * r, 0, Math.PI * 2);
  }
  ctx.fill();
}

// ── Zeichnen: der A380 ─────────────────────────────────────────────
// Koordinaten in Metern, Nase zeigt nach rechts, Mitte des Rumpfs ist (0,0).
function fuselagePath() {
  ctx.beginPath();
  ctx.moveTo(-38.5, -2.3);
  ctx.lineTo(-22, -4.2);
  ctx.lineTo(27, -4.2);
  ctx.bezierCurveTo(32, -4.2, 35.6, -2, 36.6, 0.6);
  ctx.bezierCurveTo(36.9, 2.3, 35, 4, 31, 4.2);
  ctx.lineTo(-14, 4.2);
  ctx.bezierCurveTo(-24, 4, -32, 1.6, -38.5, -1.2);
  ctx.closePath();
}

function drawWheel(x, y) {
  ctx.fillStyle = '#1b1b1f';
  ctx.beginPath(); ctx.arc(x, y, 0.62, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#9aa0a8';
  ctx.beginPath(); ctx.arc(x, y, 0.25, 0, Math.PI * 2); ctx.fill();
}

function drawEngine(x0, cy, shade) {
  // Pylon
  ctx.fillStyle = '#b7c0ca';
  ctx.beginPath();
  ctx.moveTo(x0 + 1, cy - 1.2); ctx.lineTo(x0 + 6, cy - 1.2); ctx.lineTo(x0 + 4, cy - 3); ctx.lineTo(x0 - 1, cy - 3);
  ctx.closePath(); ctx.fill();
  // Gondel
  const g = ctx.createLinearGradient(0, cy - 1.5, 0, cy + 1.5);
  g.addColorStop(0, shade ? '#e9edf2' : '#ffffff');
  g.addColorStop(1, shade ? '#a9b2bd' : '#c3cad3');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.roundRect(x0, cy - 1.5, 7, 3, 1.3); ctx.fill();
  ctx.strokeStyle = 'rgba(60,70,90,0.5)'; ctx.lineWidth = 0.12; ctx.stroke();
  ctx.fillStyle = GREEN;
  ctx.fillRect(x0 + 1.2, cy - 1.5, 0.5, 3);
  // Einlass vorne, Düse hinten
  ctx.fillStyle = '#2a2f38';
  ctx.beginPath(); ctx.ellipse(x0 + 7, cy, 0.45, 1.35, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#6b7380';
  ctx.beginPath(); ctx.moveTo(x0, cy - 0.8); ctx.lineTo(x0 - 1.4, cy); ctx.lineTo(x0, cy + 0.8); ctx.closePath(); ctx.fill();
}

function drawA380(gear, lights) {
  // Seitenleitwerk mit Logo
  ctx.fillStyle = BLUE;
  ctx.beginPath();
  ctx.moveTo(-22, -3.9); ctx.lineTo(-31, -18.5); ctx.lineTo(-36.5, -18.5); ctx.lineTo(-37.8, -2.6);
  ctx.closePath(); ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = GREEN;
  ctx.beginPath();
  ctx.moveTo(-22, -2); ctx.quadraticCurveTo(-30, -10, -40, -10); ctx.lineTo(-40, -6); ctx.quadraticCurveTo(-30, -6, -25.5, -2);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 6px system-ui, -apple-system, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('H', -32.3, -13);

  // Rumpf
  fuselagePath();
  const g = ctx.createLinearGradient(0, -4.2, 0, 4.2);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(0.6, '#f1f4f8');
  g.addColorStop(1, '#c9d1db');
  ctx.fillStyle = g; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = BLUE; ctx.fillRect(-40, 2.7, 80, 2);
  ctx.fillStyle = GREEN; ctx.fillRect(-40, 1.9, 80, 0.7);
  ctx.fillStyle = 'rgba(120,130,150,0.35)';
  ctx.beginPath(); ctx.ellipse(-3, 4.3, 12, 1.6, 0, 0, Math.PI * 2); ctx.fill();   // Bauchverkleidung
  ctx.restore();
  fuselagePath();
  ctx.strokeStyle = 'rgba(70,80,100,0.6)'; ctx.lineWidth = 0.15; ctx.stroke();

  // Fenster: zwei Decks
  ctx.fillStyle = '#2b3a55';
  for (let x = -16; x < 26.5; x += 1.25) if (Math.abs(x - 2) > 1 && Math.abs(x - 14) > 1) ctx.fillRect(x, -2.7, 0.55, 0.75);
  for (let x = -19; x < 29.5; x += 1.25) if (Math.abs(x - 9.5) > 1 && Math.abs(x + 4) > 1) ctx.fillRect(x, 0.3, 0.55, 0.75);
  // Türen
  ctx.strokeStyle = 'rgba(80,90,110,0.7)'; ctx.lineWidth = 0.12;
  for (const x of [28.4, 9.4, -4.1, -18.6]) { ctx.beginPath(); ctx.roundRect(x, -0.3, 1.1, 2.1, 0.3); ctx.stroke(); }
  for (const x of [1.9, 13.9, -14.5]) { ctx.beginPath(); ctx.roundRect(x, -3.3, 1.0, 1.9, 0.3); ctx.stroke(); }
  // Cockpit
  ctx.fillStyle = '#1d2433';
  ctx.beginPath();
  ctx.moveTo(31.8, -1.7); ctx.lineTo(34.4, -1.7); ctx.lineTo(35.3, -0.6); ctx.lineTo(31.8, -0.7);
  ctx.closePath(); ctx.fill();
  // Name
  ctx.fillStyle = BLUE;
  ctx.font = 'bold 1.45px system-ui, -apple-system, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('Henrik Airlines', -6, -0.85);

  // Höhenleitwerk
  ctx.fillStyle = '#dfe4ea';
  ctx.beginPath();
  ctx.moveTo(-28, -1.4); ctx.lineTo(-38.5, -3.6); ctx.lineTo(-40, -2.9); ctx.lineTo(-31.5, -0.5);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(70,80,100,0.5)'; ctx.stroke();

  // Fahrwerk (wird beim Einfahren kürzer)
  if (gear > 0.12) {
    const L = 3.4 * gear;
    ctx.strokeStyle = '#5b626d'; ctx.lineWidth = 0.45;
    ctx.beginPath();
    ctx.moveTo(30, 3.8); ctx.lineTo(30, 4.2 + L);
    ctx.moveTo(-5.5, 3.8); ctx.lineTo(-5.5, 4.2 + L);
    ctx.moveTo(0.3, 3.6); ctx.lineTo(0.3, 4.2 + L);
    ctx.stroke();
    ctx.lineWidth = 0.3;
    ctx.beginPath(); ctx.moveTo(-7.3, 4.2 + L); ctx.lineTo(-3.7, 4.2 + L); ctx.stroke();
    for (const x of [-7.3, -5.5, -3.7]) drawWheel(x, 4.2 + L);
    for (const x of [-0.6, 1.2]) drawWheel(x, 4.2 + L);
    drawWheel(30, 4.2 + L);
  }

  // Flügel und Triebwerke
  ctx.fillStyle = '#cfd6de';
  ctx.beginPath();
  ctx.moveTo(10, 3); ctx.lineTo(-20, 0.4); ctx.lineTo(-21.8, 1.1); ctx.lineTo(-5, 4.5);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(70,80,100,0.6)'; ctx.lineWidth = 0.15; ctx.stroke();
  ctx.fillStyle = GREEN;
  ctx.beginPath(); ctx.moveTo(-20.2, 0.5); ctx.lineTo(-21.6, -1.4); ctx.lineTo(-22.4, -1.2); ctx.lineTo(-21.8, 1.1); ctx.closePath(); ctx.fill();
  drawEngine(-8, 4.1, true);
  drawEngine(2, 5.6, false);

  // Blinklichter
  if (lights) {
    const blink = (time % 1.2) < 0.12;
    if (blink) {
      ctx.fillStyle = 'rgba(255,40,40,0.95)';
      ctx.beginPath(); ctx.arc(0, -4.5, 0.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,40,40,0.25)';
      ctx.beginPath(); ctx.arc(0, -4.5, 1.8, 0, Math.PI * 2); ctx.fill();
    }
    if ((time % 1.2) > 0.6 && (time % 1.2) < 0.68) {
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.arc(-21.8, -1, 1.2, 0, Math.PI * 2); ctx.fill();
    }
  }
}

// ── Zeichnen: Welt ─────────────────────────────────────────────────
function landFactor(x) {
  if (x < SEA_FROM) return clamp((SEA_FROM - x) / 1500, 0, 1);
  if (x > SEA_TO) return clamp((x - SEA_TO) / 1500, 0, 1);
  return 0;
}

function drawSky() {
  const t = clamp(cam.a / 1100, 0, 1);
  const g = ctx.createLinearGradient(0, 0, 0, H());
  g.addColorStop(0, mix('#4a9be6', '#0b2a66', t));
  g.addColorStop(1, mix('#cfe9ff', '#4f86cf', t));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W(), H());
  // Sonne
  const sxp = W() * 0.82, syp = H() * 0.16;
  const sg = ctx.createRadialGradient(sxp, syp, 0, sxp, syp, 90);
  sg.addColorStop(0, 'rgba(255,250,220,0.95)');
  sg.addColorStop(0.25, 'rgba(255,240,180,0.6)');
  sg.addColorStop(1, 'rgba(255,240,180,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(sxp, syp, 90, 0, Math.PI * 2); ctx.fill();
}

function drawFarClouds(offset, vshift) {
  const span = W() + 400;
  for (let i = 0; i < 8; i++) {
    const x = ((rand(i) * span - offset) % span + span) % span - 200;
    const y = H() * (0.08 + rand(i + 20) * 0.55) + vshift;
    cloud(x, y, 14 + rand(i + 40) * 22, 0.45);
  }
}

function drawHills(gy) {
  if (gy > H() + 10 || gy < -200) return;
  const layers = [
    { par: 0.2, amp: 70, col: mix('#8fb0b8', '#6f9aa8', 0.5), shift: 0 },
    { par: 0.45, amp: 35, col: '#6c9a6e', shift: 3 },
  ];
  for (const L of layers) {
    ctx.fillStyle = L.col;
    ctx.beginPath();
    ctx.moveTo(-10, gy);
    for (let x = -10; x <= W() + 10; x += 8) {
      const wx = p.x * L.par + (x - W() * 0.35) / S;
      const real = p.x + (x - W() * 0.35) / S / L.par;
      const big = real > SEA_TO - 2000 ? 2 : 1;   // auf Mallorca gibt es richtige Berge
      const h = (0.55 + 0.25 * Math.sin(wx / 530 + L.shift) + 0.15 * Math.sin(wx / 210 + 1.3) + 0.08 * Math.sin(wx / 90 + 2.1))
              * L.amp * landFactor(real) * big;
      ctx.lineTo(x, gy - h * S * 0.6);
    }
    ctx.lineTo(W() + 10, gy);
    ctx.closePath();
    ctx.fill();
  }
}

function drawSkyline(gy) {
  // Frankfurter Hochhäuser in der Ferne
  for (let i = 0; i < 26; i++) {
    const bx = -900 + i * 140;
    const x = W() * 0.35 + (bx - p.x) * S * 0.3;
    const w = (30 + rand(i + 5) * 35) * S * 0.3;
    if (x + w < 0 || x > W()) continue;
    const h = (40 + rand(i + 9) * 130) * S * 0.3;
    ctx.fillStyle = i % 3 === 0 ? '#7f93ae' : '#8ea1ba';
    ctx.fillRect(x, gy - h, w, h);
    if (i % 5 === 2) {
      ctx.beginPath(); ctx.moveTo(x, gy - h); ctx.lineTo(x + w / 2, gy - h - 20 * S * 0.3); ctx.lineTo(x + w, gy - h); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,240,180,0.35)';
    for (let wy = gy - h + 4; wy < gy - 4; wy += 7) ctx.fillRect(x + 2, wy, w - 4, 1.5);
  }
}

function drawGround(gy) {
  if (gy > H()) return;
  const x0 = p.x - (W() * 0.35) / S, x1 = p.x + (W() * 0.65) / S;
  // Wiese
  ctx.fillStyle = '#5da84a';
  ctx.fillRect(0, gy, W(), H() - gy);
  ctx.fillStyle = 'rgba(0,0,0,0.06)';
  for (let x = Math.floor(x0 / 40) * 40; x < x1; x += 80) ctx.fillRect(sx(x), gy, 40 * S, H() - gy);
  // Strand und Meer
  const beach = 250;
  const s0 = Math.max(x0, SEA_FROM - beach), s1 = Math.min(x1, SEA_TO + beach);
  if (s0 < s1) { ctx.fillStyle = '#e8d49a'; ctx.fillRect(sx(s0), gy, (s1 - s0) * S, H() - gy); }
  const m0 = Math.max(x0, SEA_FROM), m1 = Math.min(x1, SEA_TO);
  if (m0 < m1) {
    const g = ctx.createLinearGradient(0, gy, 0, H());
    g.addColorStop(0, '#2f8fd0'); g.addColorStop(1, '#14507f');
    ctx.fillStyle = g;
    ctx.fillRect(sx(m0), gy - 2, (m1 - m0) * S, H() - gy + 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.5;
    for (let row = 0; row < 4; row++) {
      const yy = gy + 6 + row * 14;
      if (yy > H()) break;
      for (let x = Math.floor(m0 / 50) * 50; x < m1; x += 50) {
        const xx = sx(x + ((time * 8 + row * 17) % 50));
        ctx.beginPath(); ctx.moveTo(xx, yy); ctx.quadraticCurveTo(xx + 4, yy - 3, xx + 8, yy); ctx.stroke();
      }
    }
    // Segelboot
    const bx = sx(30000);
    if (bx > -50 && bx < W() + 50) {
      const k = S;
      ctx.fillStyle = '#7a3b1e';
      ctx.beginPath(); ctx.moveTo(bx - 9 * k, gy + 2); ctx.lineTo(bx + 9 * k, gy + 2); ctx.lineTo(bx + 6 * k, gy + 5 * k); ctx.lineTo(bx - 6 * k, gy + 5 * k); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.moveTo(bx, gy + 1); ctx.lineTo(bx, gy - 16 * k); ctx.lineTo(bx + 8 * k, gy + 1); ctx.fill();
    }
  }
}

function drawTree(x, gy, h, palm) {
  if (palm) {
    ctx.strokeStyle = '#8a6a3c'; ctx.lineWidth = Math.max(1.5, 0.9 * S);
    ctx.beginPath(); ctx.moveTo(x, gy); ctx.quadraticCurveTo(x + h * 0.15, gy - h * 0.5, x + h * 0.1, gy - h); ctx.stroke();
    ctx.strokeStyle = '#2f8a3a'; ctx.lineWidth = Math.max(1.5, 0.8 * S);
    const tx = x + h * 0.1, ty = gy - h;
    for (const a of [-2.6, -1.9, -1.2, -0.5, 0.2]) {
      ctx.beginPath(); ctx.moveTo(tx, ty);
      ctx.quadraticCurveTo(tx + Math.cos(a) * h * 0.3, ty + Math.sin(a) * h * 0.3 - h * 0.1, tx + Math.cos(a) * h * 0.45, ty + h * 0.15);
      ctx.stroke();
    }
  } else {
    ctx.fillStyle = '#6b4a2b';
    ctx.fillRect(x - 0.6 * S, gy - h * 0.4, 1.2 * S, h * 0.4);
    ctx.fillStyle = '#3d8a3a';
    ctx.beginPath(); ctx.arc(x, gy - h * 0.65, h * 0.35, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.arc(x - h * 0.1, gy - h * 0.75, h * 0.15, 0, Math.PI * 2); ctx.fill();
  }
}

function drawTrees(gy) {
  const x0 = p.x - (W() * 0.35) / S - 30, x1 = p.x + (W() * 0.65) / S + 30;
  for (let c = Math.floor(x0 / 60); c <= x1 / 60; c++) {
    if (rand(c + 0.5) > 0.55) continue;
    const x = c * 60 + rand(c + 0.1) * 40;
    if (landFactor(x) < 1) continue;
    if (x > -1000 && x < RWY_A.x1 + 300) continue;
    if (x > RWY_B.x0 - 1200 && x < RWY_B.x0 + 1700) continue;
    drawTree(sx(x), gy - 3, (12 + rand(c + 0.3) * 10) * S, x > SEA_TO);
  }
}

function drawBuilding(x0, w, h, color, glass) {
  const x = sx(x0), gy = sy(0) - 3;
  ctx.fillStyle = color;
  ctx.fillRect(x, gy - h * S, w * S, h * S);
  ctx.fillStyle = glass;
  ctx.fillRect(x + 2 * S, gy - h * S * 0.75, w * S - 4 * S, h * S * 0.35);
}

function drawTower(x0, color) {
  const x = sx(x0), gy = sy(0) - 3;
  ctx.fillStyle = color;
  ctx.fillRect(x - 3 * S, gy - 55 * S, 6 * S, 55 * S);
  ctx.fillRect(x - 9 * S, gy - 58 * S, 18 * S, 3 * S);
  ctx.fillStyle = '#7fd4c9';
  ctx.beginPath();
  ctx.moveTo(x - 9 * S, gy - 58 * S); ctx.lineTo(x - 7 * S, gy - 66 * S); ctx.lineTo(x + 7 * S, gy - 66 * S); ctx.lineTo(x + 9 * S, gy - 58 * S);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = color;
  ctx.fillRect(x - 8 * S, gy - 69 * S, 16 * S, 3 * S);
  ctx.fillStyle = '#c33';
  ctx.fillRect(x - 0.3 * S, gy - 75 * S, 0.6 * S, 6 * S);
}

function drawAirports() {
  const gy = sy(0) - 3;
  // Frankfurt
  if (p.x < 6000) {
    drawBuilding(300, 380, 20, '#9aa3ad', 'rgba(70,120,170,0.75)');
    txt('FRANKFURT', sx(490), gy - 22.5 * S, Math.max(9, 3.6 * S), '#1f2f4a');
    drawTower(1100, '#d8dde3');
    drawBuilding(1500, 160, 26, '#c7ccd3', 'rgba(255,255,255,0.4)');   // Halle
  }
  // Mallorca
  if (p.x > DEST - 6000) {
    drawBuilding(DEST + 600, 380, 18, '#e9dcc2', 'rgba(70,140,170,0.75)');
    txt('MALLORCA', sx(DEST + 790), gy - 20.5 * S, Math.max(9, 3.6 * S), '#7a3b1e');
    drawTower(DEST + 1300, '#f1ece0');
    for (let i = 0; i < 8; i++) drawTree(sx(DEST + 520 + i * 60), gy, (14 + rand(i) * 4) * S, true);
  }
}

function drawRunway(r) {
  const gy = sy(0);
  const a = sx(r.x0), b = sx(r.x1);
  if (b < 0 || a > W() || gy > H() + 20) return;
  const depth = Math.max(8, 9 * S);
  const top = gy - 3;
  ctx.fillStyle = '#3b3f45';
  ctx.fillRect(a, top, b - a, depth);
  ctx.fillStyle = '#ffffff';
  const mid = top + depth * 0.5 - 1;
  for (let x = r.x0 + 120; x < r.x1 - 120; x += 70) {
    const xx = sx(x);
    if (xx > -40 * S && xx < W()) ctx.fillRect(xx, mid, 35 * S, 2);
  }
  for (const end of [r.x0 + 15, r.x1 - 45]) {
    for (let i = 0; i < 4; i++) ctx.fillRect(sx(end), top + depth * (0.15 + i * 0.22), 30 * S, 1.5);
  }
  // Randbefeuerung
  for (let x = r.x0; x <= r.x1; x += 60) {
    const xx = sx(x);
    if (xx < -5 || xx > W() + 5) continue;
    ctx.fillStyle = x === r.x0 ? '#3f3' : x + 60 > r.x1 ? '#f33' : '#fff7d0';
    ctx.fillRect(xx - 1, top - 1, 3, 3);
    ctx.fillRect(xx - 1, top + depth - 2, 3, 3);
  }
}

function drawApproachLights() {
  const gy = sy(0) - 3;
  const run = Math.floor((time * 2) % 1 * 15);   // Lauflicht Richtung Landebahn
  for (let i = 0; i < 15; i++) {
    const x = DEST - 60 - (14 - i) * 60;
    const xx = sx(x);
    if (xx < -10 || xx > W() + 10) continue;
    ctx.fillStyle = '#555';
    ctx.fillRect(xx - 0.5, gy - 4 * S, 1.5, 4 * S);
    ctx.fillStyle = i === run ? '#ffffff' : '#ffe98a';
    ctx.beginPath(); ctx.arc(xx, gy - 4 * S, i === run ? 3 : 1.8, 0, Math.PI * 2); ctx.fill();
  }
}

function drawGlidePath() {
  const x0 = p.x - (W() * 0.35) / S - 50, x1 = Math.min(DEST, p.x + (W() * 0.65) / S + 50);
  const step = 120;
  for (let x = Math.max(DEST - GLIDE_LEN, Math.ceil(x0 / step) * step); x <= x1; x += step) {
    const a = glideAlt(x) + GEAR_H;
    const X = sx(x), Y = sy(a);
    if (Y < -10 || Y > H() + 10) continue;
    ctx.fillStyle = 'rgba(60,255,120,0.85)';
    ctx.beginPath(); ctx.arc(X, Y, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(60,255,120,0.25)';
    ctx.beginPath(); ctx.arc(X, Y, 8, 0, Math.PI * 2); ctx.fill();
  }
}

function worldClouds(front) {
  const cell = 110;
  const x0 = p.x - (W() * 0.35) / S - 200, x1 = p.x + (W() * 0.65) / S + 200;
  for (let c = Math.floor(x0 / cell); c <= x1 / cell; c++) {
    if (rand(c) > 0.5) continue;
    if ((rand(c + 0.9) < 0.35) !== front) continue;
    const alt = 70 + rand(c + 0.3) * 1250;
    const r = (14 + rand(c + 0.7) * 26) * S;
    const X = sx(c * cell + rand(c + 0.2) * 60), Y = sy(alt);
    if (Y < -r * 3 || Y > H() + r * 3) continue;
    cloud(X, Y, r, front ? 0.7 : 0.92);
  }
}

function drawContrails() {
  ctx.lineCap = 'round';
  for (const e of [2, -8]) {
    let prev = null;
    for (const c of contrail) {
      if (c.e !== e) continue;
      if (prev) {
        const f = 1 - c.t / 2.5;
        ctx.strokeStyle = `rgba(255,255,255,${0.7 * f})`;
        ctx.lineWidth = (1.2 + c.t * 2) * S * 0.5;
        ctx.beginPath(); ctx.moveTo(sx(prev.x), sy(prev.a)); ctx.lineTo(sx(c.x), sy(c.a)); ctx.stroke();
      }
      prev = c;
    }
  }
}

function drawParticles() {
  for (const q of particles) {
    const f = q.life / q.max;
    ctx.fillStyle = `rgba(${q.color},${0.8 * f})`;
    ctx.beginPath(); ctx.arc(sx(q.x), sy(q.a), q.r * S, 0, Math.PI * 2); ctx.fill();
  }
}

function drawPlane() {
  const X = sx(p.x), Y = sy(p.y - p.drop + (p.crash === 'sea' ? -p.sinkAnim : 0));
  ctx.save();
  ctx.translate(X, Y);
  ctx.rotate(-(p.pitch + p.tilt) * DEG);
  ctx.scale(S, S);
  ctx.translate(4, -GEAR_H);
  drawA380(p.gear, state === 'flying');
  ctx.restore();
  if (p.crash === 'sea') {
    // Wasser schwappt über den sinkenden Flieger
    const gy = sy(0);
    const g = ctx.createLinearGradient(0, gy, 0, H());
    g.addColorStop(0, '#2f8fd0'); g.addColorStop(1, '#14507f');
    ctx.fillStyle = g;
    ctx.globalAlpha = 0.9;
    ctx.fillRect(X - 50 * S, gy - 2, 100 * S, H() - gy + 2);
    ctx.globalAlpha = 1;
  }
}

// ── Zeichnen: Anzeigen ─────────────────────────────────────────────
function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(10,20,40,0.55)';
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 10); ctx.fill();
}

function drawButton(r, big, small, active, color) {
  ctx.fillStyle = active ? 'rgba(255,255,255,0.45)' : 'rgba(10,20,40,0.45)';
  ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2; ctx.stroke();
  const u = r.h;
  if (small) {
    txt(big, r.x + r.w / 2, r.y + r.h * 0.42, u * 0.36, color || '#fff');
    let fs = Math.max(10, u * 0.17);
    ctx.font = `bold ${fs}px system-ui, -apple-system, sans-serif`;
    fs *= Math.min(1, (r.w - 8) / ctx.measureText(small).width);
    txt(small, r.x + r.w / 2, r.y + r.h * 0.78, fs, 'rgba(255,255,255,0.85)');
  } else {
    txt(big, r.x + r.w / 2, r.y + r.h / 2, u * 0.28, color || '#fff');
  }
}

function drawHUD() {
  const u = clamp(Math.min(W(), H()) / 400, 0.8, 1.4);
  const m = 12;
  const fs = 14 * u;
  // links: Tempo, Höhe, Steigen
  const pw = 172 * u, ph = fs * 4.1;
  panel(m, m, pw, ph);
  const vs = Math.round(p.vy);
  const rows = [
    ['Tempo', `${Math.round(p.v * 3.6)} km/h`],
    ['Höhe', `${(Math.round(p.y * ALT_SCALE / 10) * 10).toLocaleString('de-DE')} m`],
    [vs >= 0 ? 'Steigen' : 'Sinken', `${Math.abs(vs)} m/s`],
  ];
  rows.forEach(([k, v], i) => {
    txt(k, m + 10 * u, m + fs * (0.95 + i * 1.1), fs * 0.85, 'rgba(255,255,255,0.75)', 'left');
    txt(v, m + pw - 10 * u, m + fs * (0.95 + i * 1.1), fs, '#fff', 'right');
  });
  // rechts: Ziel
  const dist = Math.max(0, (DEST - p.x) * DIST_SCALE / 1000);
  const rw = 150 * u;
  panel(W() - m - rw, m, rw, ph);
  txt('🌴 Mallorca', W() - m - rw / 2, m + fs * 1.1, fs, '#fff');
  txt(`noch ${Math.round(dist)} km`, W() - m - rw / 2, m + fs * 2.6, fs * 1.05, '#ffd34d');

  // Strecke als kleine Karte von der Seite
  const my = m + ph + 8, mw = W() - 2 * m, mh = 30 * u;
  panel(m, my, mw, mh);
  const total = RWY_B.x1 + 1000;
  const mx = x => m + 10 + (x / total) * (mw - 20);
  const base = my + mh - 6;
  ctx.fillStyle = '#5da84a'; ctx.fillRect(mx(0), base, mx(total) - mx(0), 3);
  ctx.fillStyle = '#2f8fd0'; ctx.fillRect(mx(SEA_FROM), base, mx(SEA_TO) - mx(SEA_FROM), 3);
  ctx.strokeStyle = 'rgba(60,255,120,0.8)'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]);
  const alt = a => base - (a / CEILING) * (mh - 12);
  ctx.beginPath(); ctx.moveTo(mx(DEST - GLIDE_LEN), alt(glideAlt(DEST - GLIDE_LEN))); ctx.lineTo(mx(DEST), base); ctx.stroke();
  ctx.setLineDash([]);
  txt('FRA', mx(0) + 2, my + 9 * u, 9 * u, 'rgba(255,255,255,0.8)', 'left');
  txt('PMI', mx(DEST) + 10, my + 9 * u, 9 * u, 'rgba(255,255,255,0.8)', 'left');
  ctx.save();
  ctx.translate(mx(Math.max(0, p.x)), alt(p.y));
  ctx.rotate(-p.pitch * DEG);
  txt('✈', 0, 0, 14 * u, '#fff');
  ctx.restore();

  // Hinweis
  const [h, warn] = hint();
  const hs = 15 * u;
  ctx.font = `bold ${hs}px system-ui, -apple-system, sans-serif`;
  const tw = Math.min(W() - 2 * m, ctx.measureText(h).width + 24);
  const hy = view === 'cockpit' ? H() * 0.62 - hs * 2 - 10 : my + mh + 8;
  ctx.fillStyle = warn ? 'rgba(200,30,30,0.85)' : 'rgba(10,20,40,0.6)';
  ctx.beginPath(); ctx.roundRect(W() / 2 - tw / 2, hy, tw, hs * 2, 10); ctx.fill();
  txt(h, W() / 2, hy + hs, hs, '#fff');

  // Knöpfe
  const bs = buttons();
  drawButton(bs.thrUp, '+', 'Schub', held('thrUp'));
  drawButton(bs.thrDn, '−', 'Schub', held('thrDn'));
  drawButton(bs.up, '▲', 'Nase hoch', held('up'));
  drawButton(bs.dn, '▼', 'Nase runter', held('dn'));
  drawButton(bs.gear, p.gearDown ? '⚙️ raus' : '⚙️ drin', 'Fahrwerk', false, p.gearDown ? '#7dff9a' : '#ffd34d');
  drawButton(bs.brake, '🛑', 'Bremse', held('brake'));
  drawButton(bs.view, '👁️', view === 'cockpit' ? 'Außen' : 'Cockpit', false);
  // Schubanzeige
  const bx = bs.thrUp.x + bs.thrUp.w + 8, by = bs.thrUp.y, bh = bs.thrDn.y + bs.thrDn.h - by, bw = 12 * u;
  panel(bx, by, bw, bh);
  const fh = (bh - 6) * p.throttle;
  const g = ctx.createLinearGradient(0, by + bh, 0, by);
  g.addColorStop(0, '#5fe07a'); g.addColorStop(1, '#ff8a1f');
  ctx.fillStyle = g;
  ctx.fillRect(bx + 3, by + bh - 3 - fh, bw - 6, fh);
  txt(`${Math.round(p.throttle * 100)}%`, bx + bw + 4, by + bh - 3 - fh, 11 * u, '#fff', 'left', 'rgba(0,0,0,0.6)');
}

// ── Blick aus dem Cockpit ──────────────────────────────────────────
let view = 'outside';
function toggleView() {
  view = view === 'outside' ? 'cockpit' : 'outside';
  tone(660, 0, 0.1, 0.08);
}

const lerpRGB = (A, B, t) => A.map((v, i) => v + (B[i] - v) * t);
const rgb = A => `rgb(${A.map(Math.round).join(',')})`;
const COL = {
  land: [hex2rgb('#5da84a'), hex2rgb('#54a043')],
  isle: [hex2rgb('#7aa64e'), hex2rgb('#6f9c46')],
  sea: [hex2rgb('#2f8fd0'), hex2rgb('#2a86c4')],
  sand: [hex2rgb('#e8d49a'), hex2rgb('#e2cc8f')],
};
function groundColor(x, odd) {
  if (x > SEA_FROM && x < SEA_TO) return COL.sea[odd];
  if (x > SEA_FROM - 250 && x < SEA_TO + 250) return COL.sand[odd];
  return x > SEA_TO ? COL.isle[odd] : COL.land[odd];
}

function drawCockpit() {
  const w = W(), h = H();
  const f = Math.max(w, h) * 0.7;
  const pc = Math.cos(p.pitch * DEG), ps = Math.sin(p.pitch * DEG);
  const eyeX = p.x + 36 * pc;
  const eye = p.y + 7 + 36 * ps;
  const vib = p.onGround ? (Math.random() - 0.5) * p.v * 0.03 : 0;
  const cx = w / 2 + shX, cy = h * 0.36 + shY + vib;
  const hy = cy + f * Math.tan(p.pitch * DEG);
  const near = 8, DMAX = 25000;
  const P = (d, z, a) => [cx + f * z / d, hy + f * (eye - a) / d];
  const poly = (pts, color) => {
    ctx.fillStyle = color;
    ctx.beginPath();
    pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.closePath(); ctx.fill();
  };

  // Himmel und Sonne
  const t = clamp(p.y / 1100, 0, 1);
  const lowA = lerpRGB(hex2rgb('#cfe9ff'), hex2rgb('#4f86cf'), t);
  const g = ctx.createLinearGradient(0, hy - h, 0, hy);
  g.addColorStop(0, mix('#4a9be6', '#0b2a66', t));
  g.addColorStop(1, rgb(lowA));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  const sxp = cx + w * 0.3, syp = hy - f * 0.5;
  const sg = ctx.createRadialGradient(sxp, syp, 0, sxp, syp, 110);
  sg.addColorStop(0, 'rgba(255,250,220,0.95)');
  sg.addColorStop(0.25, 'rgba(255,240,180,0.6)');
  sg.addColorStop(1, 'rgba(255,240,180,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(sxp, syp, 110, 0, Math.PI * 2); ctx.fill();

  // Boden in Streifen, die auf dich zukommen; weit weg wird alles dunstig
  if (hy < h) {
    ctx.fillStyle = rgb(lowA);
    ctx.fillRect(0, hy, w, h - hy);
    const yAt = d => hy + f * eye / d;
    let d = DMAX;
    const dBottom = Math.max(near, f * eye / Math.max(1, h - hy));
    while (d > dBottom) {
      const step = d <= 1500 ? 100 : d <= 6000 ? 400 : 2000;
      const xa = Math.ceil((eyeX + d) / step - 1) * step;
      const d2 = Math.max(dBottom, xa - eyeX);
      const odd = Math.floor(xa / step) & 1;
      const col = lerpRGB(groundColor(eyeX + (d + d2) / 2, odd), lowA, Math.pow(clamp(d / 18000, 0, 1), 0.6));
      ctx.fillStyle = rgb(col);
      const y1 = yAt(d), y2 = Math.min(h, yAt(d2));
      ctx.fillRect(0, y1 - 0.5, w, y2 - y1 + 1);
      if (d2 >= d) break;
      d = d2;
    }
  }

  // Landebahnen
  for (const r of [RWY_A, RWY_B]) {
    const d1 = r.x1 - eyeX;
    let d0 = r.x0 - eyeX;
    if (d1 < near || d0 > DMAX) continue;
    d0 = Math.max(d0, near);
    poly([P(d0, -30, 0), P(d1, -30, 0), P(d1, 30, 0), P(d0, 30, 0)], '#3b3f45');
    for (const e of [r.x0 + 10, r.x1 - 50]) {
      const a = Math.max(near, e - eyeX), b = e + 40 - eyeX;
      if (b < near) continue;
      for (const z of [-26, -20, -14, -8, 5, 11, 17, 23]) poly([P(a, z, 0), P(b, z, 0), P(b, z + 3, 0), P(a, z + 3, 0)], '#ffffff');
    }
    for (let x = r.x0 + 120; x < r.x1 - 120; x += 70) {
      const a = Math.max(near, x - eyeX), b = x + 35 - eyeX;
      if (b < near || a > 6000) continue;
      poly([P(a, -0.7, 0), P(b, -0.7, 0), P(b, 0.7, 0), P(a, 0.7, 0)], '#ffffff');
    }
    for (let x = r.x0; x <= r.x1; x += 60) {
      const dd = x - eyeX;
      if (dd < near || dd > 9000) continue;
      ctx.fillStyle = x === r.x0 ? '#3f3' : x + 60 > r.x1 ? '#f33' : '#fff7d0';
      for (const z of [-31, 31]) {
        const [X, Y] = P(dd, z, 0.5);
        ctx.beginPath(); ctx.arc(X, Y, Math.max(1, f * 0.5 / dd), 0, Math.PI * 2); ctx.fill();
      }
    }
  }
  // Anflugbefeuerung mit Lauflicht
  const run = Math.floor((time * 2) % 1 * 15);
  for (let i = 0; i < 15; i++) {
    const dd = DEST - 60 - (14 - i) * 60 - eyeX;
    if (dd < near || dd > 9000) continue;
    const zs = i % 5 === 0 ? [-12, -6, 0, 6, 12] : [0];
    for (const z of zs) {
      const [X, Y] = P(dd, z, 4);
      ctx.fillStyle = i === run ? '#ffffff' : '#ffe98a';
      ctx.beginPath(); ctx.arc(X, Y, Math.max(1.2, f * (i === run ? 1.4 : 0.8) / dd), 0, Math.PI * 2); ctx.fill();
    }
  }

  // Alles, was in die Höhe ragt, von hinten nach vorne zeichnen
  const things = [];
  const box = (x0, x1, z0, z1, a0, a1, front, side, top) => things.push({ d: x0 - eyeX, draw() {
    const d1 = x1 - eyeX;
    if (d1 < near) return;
    const d0 = Math.max(near, x0 - eyeX);
    const zs = Math.abs(z0) < Math.abs(z1) ? z0 : z1;
    poly([P(d0, zs, a0), P(d1, zs, a0), P(d1, zs, a1), P(d0, zs, a1)], side);
    if (eye > a1) poly([P(d0, z0, a1), P(d1, z0, a1), P(d1, z1, a1), P(d0, z1, a1)], top);
    if (x0 - eyeX >= near) poly([P(d0, z0, a0), P(d0, z1, a0), P(d0, z1, a1), P(d0, z0, a1)], front);
  } });
  const tower = (x, z) => {
    box(x, x + 6, z, z + 6, 0, 55, '#e3e7ec', '#cdd3da', '#f0f2f5');
    box(x - 6, x + 12, z - 6, z + 12, 55, 66, '#7fd4c9', '#6cc2b7', '#d8dde3');
  };
  if (eyeX < RWY_A.x1 + 3000) {
    box(300, 680, -260, -180, 0, 20, '#9aa3ad', '#8a939d', '#b5bcc4');
    box(1500, 1660, -250, -190, 0, 26, '#c7ccd3', '#b7bcc3', '#dadde2');
    tower(1100, -130);
  }
  if (eyeX > DEST - 20000) {
    box(DEST + 600, DEST + 980, -260, -180, 0, 18, '#e9dcc2', '#d9cbb0', '#f3eadb');
    tower(DEST + 1300, -130);
  }
  // Bäume und Palmen
  for (let c = Math.floor((eyeX + near) / 50); c <= (eyeX + 4000) / 50; c++) {
    for (let k = 0; k < 2; k++) {
      const n = c * 2 + k;
      const x = c * 50 + rand(n + 0.1) * 50;
      const z = (rand(n + 0.6) - 0.5) * 3000;
      if (landFactor(x) < 1 || Math.abs(z) < 60) continue;
      if (Math.abs(z) < 320 && ((x > -1000 && x < RWY_A.x1 + 300) || (x > RWY_B.x0 - 1200 && x < RWY_B.x1 + 300))) continue;
      const d = x - eyeX, ht = 12 + rand(n + 0.3) * 10;
      things.push({ d, draw() {
        const [X, Y] = P(d, z, 0), s = f / d;
        if (ht * s < 1.5) return;
        const save = S; S = s;
        drawTree(X, Y, ht * s, x > SEA_TO);
        S = save;
      } });
    }
  }
  // Wolken
  const cell = 110;
  for (let c = Math.floor((eyeX + 20) / cell); c <= (eyeX + DMAX * 0.6) / cell; c++) {
    if (rand(c) > 0.5) continue;
    const x = c * cell + rand(c + 0.2) * 60, d = x - eyeX;
    if (d < 20) continue;
    const alt = 70 + rand(c + 0.3) * 1250, z = (rand(c + 0.55) - 0.5) * 2400;
    const R = (14 + rand(c + 0.7) * 26) * 3;
    things.push({ d, draw() {
      const [X, Y] = P(d, z, alt), r = f * R / d;
      if (X < -r * 3 || X > w + r * 3 || Y < -r * 2 || Y > h + r * 2) return;
      cloud(X, Y, r, clamp((d - 20) / 250, 0, 1) * 0.9);
    } });
  }
  // grüne Ringe der Landehilfe
  for (let x = Math.max(DEST - GLIDE_LEN, Math.ceil((eyeX + near) / 120) * 120); x <= Math.min(DEST, eyeX + 5000); x += 120) {
    const d = x - eyeX;
    things.push({ d, draw() {
      const [X, Y] = P(d, 0, glideAlt(x) + 7), r = Math.max(2, f * 4 / d);
      // nahe Ringe werden durchsichtig, damit man die Landebahn dahinter sieht
      ctx.strokeStyle = `rgba(60,255,120,${0.85 * clamp((d - 100) / 300, 0, 1)})`; ctx.lineWidth = Math.max(1.5, r * 0.15);
      ctx.beginPath(); ctx.arc(X, Y, r, 0, Math.PI * 2); ctx.stroke();
    } });
  }
  things.sort((a, b) => b.d - a.d);
  for (const o of things) o.draw();

  drawCockpitFrame();
}

function drawCockpitFrame() {
  const w = W(), h = H(), mid = w / 2;
  const top = h * 0.05, bot = h * 0.62;
  const fg = ctx.createLinearGradient(0, 0, 0, h);
  fg.addColorStop(0, '#3a414d'); fg.addColorStop(1, '#22262e');
  ctx.fillStyle = fg;
  ctx.beginPath();
  ctx.rect(0, 0, w, h);
  // eine große Scheibe ohne Mittelbalken, damit die Landebahn nie verdeckt ist
  ctx.moveTo(w * 0.02, top + h * 0.1); ctx.lineTo(w * 0.1, top); ctx.lineTo(w * 0.9, top); ctx.lineTo(w * 0.98, top + h * 0.1);
  ctx.lineTo(w * 0.95, bot); ctx.lineTo(w * 0.05, bot); ctx.closePath();
  ctx.fill('evenodd');
  ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 2;
  ctx.stroke();
  // Blendschutz über dem Armaturenbrett
  ctx.fillStyle = '#1a1d23';
  ctx.beginPath();
  ctx.moveTo(0, bot + 6); ctx.quadraticCurveTo(mid, bot - 14, w, bot + 6); ctx.lineTo(w, h); ctx.lineTo(0, h);
  ctx.closePath(); ctx.fill();

  // Bildschirme zwischen den Knöpfen
  const bs = buttons();
  const sy0 = bot + 12, sh = h - sy0 - 12;
  const l0 = bs.thrUp.x + bs.thrUp.w + 64, l1 = bs.gear.x - 12;
  const r0 = bs.brake.x + bs.brake.w + 12, r1 = bs.up.x - 12;
  if (l1 - l0 > 90 && sh > 50) {
    drawPFD(l0, sy0, l1 - l0, sh);
    if (r1 - r0 > 90) drawStatus(r0, sy0, r1 - r0, sh);
  } else {
    // Hochformat: Bildschirme über den Knöpfen
    const y1 = Math.min(bs.thrUp.y, bs.view.y) - 14, hh = y1 - sy0, half = (w - 28 - 12) / 2;
    if (hh > 60) {
      drawPFD(14, sy0, half, hh);
      drawStatus(14 + half + 12, sy0, half, hh);
    }
  }
}

function screen(x, y, w, h) {
  ctx.fillStyle = '#0b0e13';
  ctx.beginPath(); ctx.roundRect(x - 4, y - 4, w + 8, h + 8, 8); ctx.fill();
  ctx.fillStyle = '#05070a';
  ctx.fillRect(x, y, w, h);
}

function drawPFD(x, y, w, h) {
  // künstlicher Horizont: blauer Himmel, brauner Boden, bewegt sich mit der Nase
  screen(x, y, w, h);
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  const k = h / 40, mx = x + w / 2, my = y + h / 2 + p.pitch * k;
  ctx.fillStyle = '#2f7fd6'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#8a5a2b'; ctx.fillRect(x, my, w, y + h - my + 1);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x, my); ctx.lineTo(x + w, my); ctx.stroke();
  for (let a = -20; a <= 20; a += 5) {
    if (!a) continue;
    const yy = my - a * k, len = a % 10 ? w * 0.08 : w * 0.16;
    ctx.beginPath(); ctx.moveTo(mx - len, yy); ctx.lineTo(mx + len, yy); ctx.stroke();
  }
  ctx.strokeStyle = '#ffd34d'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(mx - w * 0.22, y + h / 2); ctx.lineTo(mx - w * 0.07, y + h / 2); ctx.lineTo(mx, y + h / 2 + 6); ctx.lineTo(mx + w * 0.07, y + h / 2); ctx.lineTo(mx + w * 0.22, y + h / 2);
  ctx.stroke();
  ctx.restore();
  const fs = clamp(h * 0.16, 10, 16);
  for (const [tx, val, al] of [[x + 4, `${Math.round(p.v * 3.6)}`, 'left'], [x + w - 4, `${Math.round(p.y * ALT_SCALE / 10) * 10}`, 'right']]) {
    ctx.font = `bold ${fs}px system-ui, -apple-system, sans-serif`;
    const tw = ctx.measureText(val).width + 8;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(al === 'left' ? tx - 2 : tx - tw + 2, y + h / 2 - fs * 0.75, tw, fs * 1.5);
    txt(val, al === 'left' ? tx + 2 : tx - 2, y + h / 2, fs, '#7dff9a', al);
  }
  txt('km/h', x + 4, y + h / 2 + fs * 1.4, fs * 0.65, '#7dff9a', 'left');
  txt('m', x + w - 4, y + h / 2 + fs * 1.4, fs * 0.65, '#7dff9a', 'right');
}

function drawStatus(x, y, w, h) {
  screen(x, y, w, h);
  const fs = clamp(h * 0.14, 9, 14);
  txt('FAHRWERK', x + w / 2, y + fs * 1.1, fs, '#9fb3c8');
  const col = p.gear > 0.95 ? '#3f3' : p.gear > 0.05 ? '#f33' : '#2a2f38';
  for (let i = -1; i <= 1; i++) {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x + w / 2 + i * fs * 1.8, y + fs * 2.6, fs * 0.6, 0, Math.PI * 2); ctx.fill();
  }
  const brk = held('brake') && p.onGround;
  txt('BREMSE', x + w / 2, y + fs * 4.3, fs, brk ? '#ff8a1f' : '#3a414d');
  if (h > fs * 6.5) txt(`PMI ${Math.max(0, Math.round((DEST - p.x) * DIST_SCALE / 1000))} km`, x + w / 2, y + fs * 6, fs, '#7dd3ff');
}

// ── Spielschleife ──────────────────────────────────────────────────
let last = 0;
function loop(ts) {
  if (resizeFrames < 60) { resize(); resizeFrames++; }
  const dt = Math.min(0.05, last ? (ts - last) / 1000 : 0.016);
  last = ts;
  time += dt;

  if (state === 'menu') {
    drawMenu(dt);
  } else {
    if (state === 'flying') { update(dt); updateEngine(); }
    welcomeT -= dt;
    resultT -= dt;
    if (p.crash === 'sea') p.sinkAnim = Math.min(10, p.sinkAnim + dt * 3);
    updateParticles(dt);

    const base = Math.min(W() / 260, H() / 170);
    S = base * (1 - 0.3 * clamp(p.y / 700, 0, 1));
    const target = Math.max(p.y + 10, H() * 0.27 / S);
    if (!cam.init) { cam.a = target; cam.init = true; }
    cam.a += (target - cam.a) * Math.min(1, dt * 4);
    shake = Math.max(0, shake - dt * 20);
    shX = (Math.random() - 0.5) * shake; shY = (Math.random() - 0.5) * shake;
    if (state === 'flying') farX += p.v * dt * 0.25;

    const gy = sy(0);
    if (view === 'cockpit' && state === 'flying') {
      drawCockpit();
    } else {
      drawSky();
      drawFarClouds(farX, -cam.a * S * 0.05);
      drawHills(gy);
      if (p.x < 9000) drawSkyline(gy);
      drawGround(gy);
      drawAirports();
      drawTrees(gy);
      drawRunway(RWY_A);
      drawRunway(RWY_B);
      drawApproachLights();
      worldClouds(false);
      drawGlidePath();
      drawContrails();
      drawPlane();
      drawParticles();
      worldClouds(true);
    }
    if (state === 'flying') drawHUD();
    drawResult();
  }

  homeBtn.hidden = state !== 'menu';
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
