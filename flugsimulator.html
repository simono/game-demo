<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>A380 Flugsimulator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #5aa9ee;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #home {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 10px);
    left: calc(env(safe-area-inset-left) + 10px);
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; text-decoration: none;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 12px;
  }
  #home[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<a id="home" href="index.html" aria-label="Zur Spielauswahl">🏠</a>
<script>
const homeBtn = document.getElementById('home');
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('load', resize);
document.addEventListener('DOMContentLoaded', resize);
resize();
let resizeFrames = 0;

const W = () => window.innerWidth;
const H = () => window.innerHeight;
const DEG = Math.PI / 180;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// ── Strecke ────────────────────────────────────────────────────────
// Die Spielwelt ist kleiner als die echte Welt, damit ein Flug nur ein paar Minuten dauert.
const RWY_A = { x0: 0, x1: 2800 };               // Startbahn Frankfurt
const ALT_SCALE = 10;     // 1 m im Spiel = 10 m Anzeige
const GEAR_H = 8.2;       // von den Rädern bis zur Rumpfmitte
const VR = 75;            // Abhebetempo in m/s (270 km/h)
const CEILING = 1300;
const GLIDE = 4 * DEG;    // Winkel der grünen Landehilfe
const GLIDE_LEN = 13000;

const BLUE = '#1f4fd1', GREEN = '#1fb84f';

// ── Spielzustand ───────────────────────────────────────────────────
let state = 'menu';       // menu, flying, crashed, done
let p, cam, particles = [], contrail = [], result = null;
let resultT = 0, welcomeT = 0, shake = 0, farX = 0, time = 0;

function newFlight() {
  stopMusic();
  p = { x: 120, y: 0, z: 0, hdg: 0, roll: 0, v: 0, vy: 0, pitch: 0, throttle: 0, gear: 1, gearDown: true,
        onGround: true, flown: false, rwy: RWY_A, touchSink: 0, sinkAnim: 0, tilt: 0, drop: 0 };
  cam = { a: 0, init: false };
  particles = []; contrail = []; result = null;
  state = 'flying'; welcomeT = 4; shake = 0;
  pointers.clear();
  startEngine();
  chime();
}

function toMenu() {
  state = 'menu';
  stopEngine();
  pointers.clear();
}

// ── Steuerung ──────────────────────────────────────────────────────
const pointers = new Map();   // Finger -> Knopf
const keys = {};
const KEYMAP = {
  ArrowUp: 'up', ArrowDown: 'dn',
  ArrowLeft: 'left', a: 'left', A: 'left',
  ArrowRight: 'right', d: 'right', D: 'right',
  w: 'thrUp', W: 'thrUp', '+': 'thrUp',
  s: 'thrDn', S: 'thrDn', '-': 'thrDn',
  ' ': 'brake', b: 'brake', B: 'brake',
};
function held(k) {
  if (keys[k]) return true;
  for (const v of pointers.values()) if (v === k) return true;
  return false;
}
function toggleGear() {
  if (p.onGround) return;
  p.gearDown = !p.gearDown;
  clunk();
}

function buttons() {
  const b = clamp(Math.min(W(), H()) * 0.16, 54, 84);
  const m = 14;
  const gw = b * 1.25, gh = b * 0.72;
  const top = H() - m - 2 * b - 10, bottom = H() - m - b, middle = (top + bottom) / 2;
  const padX = W() - m - 2 * b - 10;
  const bs = {
    thrUp: { x: m, y: top, w: b, h: b },
    thrDn: { x: m, y: bottom, w: b, h: b },
    up:    { x: padX, y: top, w: b, h: b },
    dn:    { x: padX, y: bottom, w: b, h: b },
    left:  { x: padX - b - 10, y: middle, w: b, h: b },
    right: { x: W() - m - b, y: middle, w: b, h: b },
    view:  { x: W() - m - b, y: middle - gh - 10, w: b, h: gh },
  };
  // Fahrwerk und Bremse unten in der Mitte; wenn dort kein Platz ist, über dem Schub
  if (W() / 2 + 16 + gw <= bs.left.x && W() / 2 - 16 - gw >= m + b + 60) {
    bs.gear = { x: W() / 2 - gw - 6, y: H() - m - gh, w: gw, h: gh };
    bs.brake = { x: W() / 2 + 6, y: H() - m - gh, w: gw, h: gh };
  } else {
    bs.gear = { x: m, y: top - gh - 10, w: gw, h: gh };
    bs.brake = { x: m + gw + 8, y: top - gh - 10, w: gw, h: gh };
  }
  return bs;
}
const hit = (r, x, y) => r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
function buttonAt(x, y) {
  const bs = buttons();
  for (const k in bs) if (hit(bs[k], x, y)) return k;
  return null;
}

let menuBtn = null, menuPrev = null, menuNext = null, musicBtn = null, resBtns = {};
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  getAC();
  const x = e.clientX, y = e.clientY;
  if (state === 'menu') {
    if (hit(musicBtn, x, y)) toggleMusic();
    else if (hit(menuBtn, x, y)) newFlight();
    else if (hit(menuPrev, x, y)) changeRoute(-1);
    else if (hit(menuNext, x, y)) changeRoute(1);
    return;
  }
  if (result && resultT <= 0) {
    if (hit(resBtns.again, x, y)) newFlight();
    else if (hit(resBtns.menu, x, y)) toMenu();
    return;
  }
  if (state !== 'flying') return;
  const k = buttonAt(x, y);
  if (!k) return;
  pointers.set(e.pointerId, k);
  if (k === 'gear') toggleGear();
  if (k === 'view') toggleView();
}, { passive: false });
canvas.addEventListener('pointermove', e => {
  e.preventDefault();
  if (!pointers.has(e.pointerId)) return;
  const k = buttonAt(e.clientX, e.clientY);
  const taps = ['gear', 'view'];
  if (!taps.includes(k) && !taps.includes(pointers.get(e.pointerId))) pointers.set(e.pointerId, k);
}, { passive: false });
const release = e => pointers.delete(e.pointerId);
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

window.addEventListener('keydown', e => {
  if (KEYMAP[e.key]) { keys[KEYMAP[e.key]] = true; e.preventDefault(); }
  if (e.repeat) return;
  getAC();
  if ((e.key === 'g' || e.key === 'G') && state === 'flying') toggleGear();
  if (e.key === 'c' || e.key === 'C') toggleView();
  if (state === 'menu' && (e.key === 'm' || e.key === 'M')) toggleMusic();
  if (state === 'menu' && e.key === 'ArrowLeft') changeRoute(-1);
  if (state === 'menu' && e.key === 'ArrowRight') changeRoute(1);
  if (e.key === 'Enter' && (state === 'menu' || (result && resultT <= 0))) newFlight();
  if (e.key === 'Escape' && state !== 'menu') toMenu();
});
window.addEventListener('keyup', e => { if (KEYMAP[e.key]) keys[KEYMAP[e.key]] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; pointers.clear(); });

// ── Töne ───────────────────────────────────────────────────────────
let AC = null, eng = null, noiseBuf = null;
function getAC() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function noise() {
  const ac = getAC();
  if (noiseBuf) return noiseBuf;
  const len = ac.sampleRate * 2;
  noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
  const d = noiseBuf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) {
    last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02;
    d[i] = last * 3.5;
  }
  return noiseBuf;
}
function startEngine() {
  const ac = getAC();
  if (eng) return;
  const src = ac.createBufferSource(); src.buffer = noise(); src.loop = true;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 250;
  const g = ac.createGain(); g.gain.value = 0;
  src.connect(lp).connect(g).connect(ac.destination);
  const whine = ac.createOscillator(); whine.type = 'sine'; whine.frequency.value = 700;
  const wg = ac.createGain(); wg.gain.value = 0;
  whine.connect(wg).connect(ac.destination);
  src.start(); whine.start();
  eng = { src, lp, g, whine, wg };
}
function updateEngine() {
  if (!eng) return;
  const t = AC.currentTime, th = p.throttle;
  eng.lp.frequency.setTargetAtTime(250 + th * 1100, t, 0.3);
  eng.g.gain.setTargetAtTime(0.15 + th * 0.35, t, 0.3);
  eng.whine.frequency.setTargetAtTime(700 + th * 1600, t, 0.5);
  eng.wg.gain.setTargetAtTime(0.006 + th * 0.016, t, 0.3);
}
function stopEngine() {
  if (!eng) return;
  const t = AC.currentTime, e = eng;
  e.g.gain.setTargetAtTime(0, t, 0.25);
  e.wg.gain.setTargetAtTime(0, t, 0.25);
  eng = null;
  setTimeout(() => { e.src.stop(); e.whine.stop(); }, 1500);
}
function tone(freq, start, dur, vol, type = 'sine') {
  const ac = getAC(), t = ac.currentTime + start;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function chime() { tone(880, 0, 1.2, 0.18); tone(698, 0.45, 1.6, 0.18); }
function noiseBurst(start, dur, vol, freq, type = 'lowpass') {
  const ac = getAC(), t = ac.currentTime + start;
  const src = ac.createBufferSource(); src.buffer = noise();
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = ac.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f).connect(g).connect(ac.destination);
  src.start(t, Math.random()); src.stop(t + dur + 0.05);
}
function clunk() { noiseBurst(0, 0.25, 0.6, 300); tone(90, 0, 0.2, 0.2, 'triangle'); }
function thump() { noiseBurst(0, 0.4, 0.9, 200); tone(60, 0, 0.3, 0.3, 'triangle'); }
function boom() { noiseBurst(0, 2.2, 1.6, 500); tone(45, 0, 1, 0.4, 'triangle'); }
function splash() { noiseBurst(0, 1.6, 1.2, 1200, 'bandpass'); noiseBurst(0.1, 1.2, 0.6, 400); }
function applause() {
  for (let i = 0; i < 70; i++) noiseBurst(Math.random() * 3, 0.06, 0.5 + Math.random() * 0.5, 1500 + Math.random() * 1500, 'bandpass');
}

// ── Musik im Menü ──────────────────────────────────────────────────
// 8 Takte in C-Dur, Achtelnoten: C – G – Am – F, je zwei Takte
const BPM = 104, EIGHTH = 60 / BPM / 2, LOOP = 64;
const CHORDS = [[48, 52, 55], [43, 47, 50], [45, 48, 52], [41, 45, 48]];
// [Achtel, Note, Länge in Achteln]
const MELODY = [
  [0, 72, 2], [2, 76, 2], [4, 79, 3], [7, 77, 1], [8, 76, 2], [10, 74, 2], [12, 72, 4],
  [16, 71, 2], [18, 74, 2], [20, 79, 3], [23, 77, 1], [24, 76, 2], [26, 74, 2], [28, 71, 4],
  [32, 72, 2], [34, 76, 2], [36, 81, 3], [39, 79, 1], [40, 77, 2], [42, 76, 2], [44, 74, 2], [46, 76, 2],
  [48, 77, 2], [50, 76, 2], [52, 74, 2], [54, 72, 2], [56, 74, 4], [60, 79, 4],
];
let music = null, whiteBuf = null;
let musicOff = false;
try { musicOff = localStorage.getItem('flug-musik') === 'aus'; } catch (e) {}

const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);
function white() {
  if (whiteBuf) return whiteBuf;
  const ac = getAC();
  whiteBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = whiteBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return whiteBuf;
}
function mNote(freq, t, dur, type, vol, attack = 0.01, cutoff = 0) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + attack);
  g.gain.setTargetAtTime(0, t + Math.max(attack, dur - 0.05), dur * 0.3);
  let node = o;
  if (cutoff) { const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff; o.connect(f); node = f; }
  node.connect(g).connect(music.g);
  o.start(t); o.stop(t + dur * 2 + 0.3);
}
function mNoise(t, dur, vol, type, freq) {
  const src = AC.createBufferSource(); src.buffer = white();
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f).connect(g).connect(music.g);
  src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
}
function kick(t) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.frequency.setValueAtTime(130, t);
  o.frequency.exponentialRampToValueAtTime(45, t + 0.15);
  g.gain.setValueAtTime(0.7, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
  o.connect(g).connect(music.g);
  o.start(t); o.stop(t + 0.35);
}

function playStep(step, t) {
  const bar = Math.floor(step / 8), beat = step % 8;
  const chord = CHORDS[Math.floor(step / 16)];
  // Klangteppich: ein Akkord für zwei Takte
  if (step % 16 === 0) for (const n of chord) {
    mNote(midiHz(n + 12), t, EIGHTH * 16, 'sawtooth', 0.035, 0.4, 900);
    mNote(midiHz(n + 12) * 1.004, t, EIGHTH * 16, 'sawtooth', 0.035, 0.4, 900);
  }
  // Bass
  if (beat === 0 || beat === 4) mNote(midiHz(chord[0] - 12), t, EIGHTH * 1.8, 'triangle', 0.32);
  if (beat === 6) mNote(midiHz(chord[0]), t, EIGHTH * 0.9, 'triangle', 0.22);
  // Glöckchen, die durch den Akkord laufen
  const arp = chord[[0, 1, 2, 1][step % 4]] + 24;
  mNote(midiHz(arp), t, EIGHTH * 0.9, 'sine', 0.05);
  // Melodie
  for (const [s, n, len] of MELODY) if (s === step) {
    mNote(midiHz(n), t, EIGHTH * len, 'triangle', 0.16, 0.02);
    mNote(midiHz(n + 12), t, EIGHTH * len, 'sine', 0.04, 0.02);
  }
  // Schlagzeug, im ersten Durchlauf erst ab Takt 3
  if (music.loops > 0 || bar >= 2) {
    if (beat === 0 || beat === 4) kick(t);
    if (beat === 2 || beat === 6) { mNoise(t, 0.15, 0.25, 'bandpass', 1800); mNote(190, t, 0.08, 'triangle', 0.1); }
    if (beat % 2 === 1) mNoise(t, 0.04, 0.12, 'highpass', 7000);
  }
}

function scheduleMusic() {
  if (!music) return;
  // nach einer Pause (Tab im Hintergrund) nicht alle verpassten Noten auf einmal spielen
  if (music.next < AC.currentTime - 0.1) music.next = AC.currentTime + 0.05;
  while (music.next < AC.currentTime + 0.2) {
    playStep(music.step, music.next);
    music.step++;
    if (music.step === LOOP) { music.step = 0; music.loops++; }
    music.next += EIGHTH;
  }
}
function startMusic() {
  if (music || musicOff || !AC || AC.state !== 'running') return;
  const g = AC.createGain();
  g.gain.value = 0;
  g.gain.setTargetAtTime(0.55, AC.currentTime, 0.4);
  g.connect(AC.destination);
  music = { g, step: 0, loops: 0, next: AC.currentTime + 0.1 };
  music.timer = setInterval(scheduleMusic, 50);
  scheduleMusic();
}
function stopMusic() {
  if (!music) return;
  const m = music;
  music = null;
  clearInterval(m.timer);
  m.g.gain.setTargetAtTime(0, AC.currentTime, 0.25);
  setTimeout(() => m.g.disconnect(), 2000);
}
function toggleMusic() {
  musicOff = !musicOff;
  try { localStorage.setItem('flug-musik', musicOff ? 'aus' : 'an'); } catch (e) {}
  if (musicOff) stopMusic();
}

// ── Ziele ──────────────────────────────────────────────────────────
// x der Bauwerke ist relativ zum Anfang der Landebahn, z ist seitlich (minus = links)
const ROUTES = [
  { name: 'Mallorca', in: 'auf Mallorca', code: 'PMI', icon: '🌴', km: 1215, dest: 45000, sea: [16000, 41500], seaName: 'das Mittelmeer',
    ground: ['#7aa64e', '#6f9c46'], fields: ['#9bae5a', '#b5a45e', '#7f9a4a', '#c7a86a', '#8aa050', '#a9b86a'],
    trees: 'palm', houses: ['#f4efe4', '#e2dccf', '#c0503a', '#a8443a'], hills: 2, hill: '#6c9a6e',
    mountains: [9000, -16000, 5000, 320, '#7d9a8c'], sky: ['#4a9be6', '#cfe9ff'], terminal: '#e9dcc2',
    landmarks: [['cathedral', 2600, -900]] },
  { name: 'London', in: 'in London', code: 'LHR', icon: '🇬🇧', km: 650, dest: 30000, sea: [21000, 25500], seaName: 'der Ärmelkanal',
    ground: ['#5a9a4a', '#52924a'], fields: ['#5d9e4c', '#6aa856', '#4e8f40', '#7fb062', '#8c9e52', '#679c4a'],
    trees: 'tree', houses: ['#b0664c', '#9c5a43', '#5a5a60', '#4c4c52'], hills: 0.7, hill: '#5f8f5e',
    mountains: null, sky: ['#7d93a8', '#d3dbe3'], terminal: '#a8b0b8',
    landmarks: [['bigben', 2000, -900], ['eye', 2800, -1000]] },
  { name: 'Paris', in: 'in Paris', code: 'CDG', icon: '🇫🇷', km: 480, dest: 26000, sea: null, seaName: '',
    ground: ['#8db55a', '#84ad52'], fields: ['#8fbf5a', '#c9b85a', '#a8c060', '#d4c46a', '#7a9a3a', '#b9a85a'],
    trees: 'tree', houses: ['#efe6d4', '#ddd2bd', '#6a7684', '#5c6876'], hills: 0.8, hill: '#6c9a6e',
    mountains: null, sky: ['#5aa2e6', '#d6ebff'], terminal: '#c7ccd3',
    landmarks: [['eiffel', 2200, -1100]] },
  { name: 'Dubai', in: 'in Dubai', code: 'DXB', icon: '🏜️', km: 4840, dest: 70000, sea: [20000, 42000], seaName: 'das Mittelmeer',
    ground: ['#e3c58a', '#dab97c'], fields: ['#e6c88f', '#dcbc80', '#e9cf9a', '#d4b277', '#e0c286'],
    trees: 'sparse', houses: ['#e8dcc4', '#d6c8ac', '#efe4cc', '#e6d9bd'], hills: 0.6, hill: '#d8b878', desert: true,
    mountains: [20000, -20000, 20000, 200, '#b89a78'], sky: ['#5aa7e0', '#f2e3c4'], terminal: '#e8e2d6',
    landmarks: [['burj', 3500, -1800]] },
  { name: 'New York', in: 'in New York', code: 'JFK', icon: '🗽', km: 6200, dest: 80000, sea: [14000, 76000], seaName: 'der Atlantik',
    ground: ['#6a9a5a', '#62925a'], fields: ['#6a9a5a', '#7aa466', '#5c8c50', '#8a9c6a', '#6e8e5e'],
    trees: 'tree', houses: ['#c9c4bb', '#b5afa5', '#6b6b6b', '#5e5e5e'], hills: 0.5, hill: '#6c8e6a',
    mountains: null, sky: ['#4f98e0', '#d2e6fa'], terminal: '#b5bcc4',
    landmarks: [['liberty', -6000, -1200], ['skyline', 4000, -3500]] },
];
let R, routeIdx = 0, DEST, RWY_B, SEA_FROM, SEA_TO, DEST_FROM;
function setRoute(i) {
  routeIdx = i;
  R = ROUTES[i];
  DEST = R.dest;
  RWY_B = { x0: DEST, x1: DEST + 3200 };
  // ohne Meer liegt die Wasserkante weit hinter dem Start, dann ist alles Land
  [SEA_FROM, SEA_TO] = R.sea || [-1e9, -1e9];
  DEST_FROM = R.sea ? SEA_TO : DEST - 8000;
}
try { routeIdx = clamp(parseInt(localStorage.getItem('flug-ziel'), 10) || 0, 0, ROUTES.length - 1); } catch (e) {}
setRoute(routeIdx);
function changeRoute(dir) {
  setRoute((routeIdx + dir + ROUTES.length) % ROUTES.length);
  try { localStorage.setItem('flug-ziel', routeIdx); } catch (e) {}
  tone(660 + routeIdx * 60, 0, 0.12, 0.1);
}
const kmLeft = () => Math.max(0, Math.round((DEST - p.x) / DEST * R.km));
function treeKind(x, n) {
  if (x <= DEST_FROM) return 'tree';
  if (R.trees === 'sparse') return rand(n + 0.77) < 0.12 ? 'palm' : null;
  return R.trees;
}

// ── Physik ─────────────────────────────────────────────────────────
const inside = (x, r) => x >= r.x0 && x <= r.x1;

function localToWorld(lx, ly) {
  const dx = lx + 4, up = GEAR_H - ly, c = Math.cos(p.pitch * DEG), s = Math.sin(p.pitch * DEG);
  return [p.x + dx * c - up * s, p.y + dx * s + up * c];
}

function update(dt) {
  const up = held('up'), dn = held('dn');
  p.throttle = clamp(p.throttle + ((held('thrUp') ? 1 : 0) - (held('thrDn') ? 1 : 0)) * 0.45 * dt, 0, 1);
  p.gear += clamp((p.gearDown ? 1 : 0) - p.gear, -0.4 * dt, 0.4 * dt);

  // Auftrieb: erst ab 55 m/s trägt der Flügel, ab Abhebetempo ganz
  const lift = clamp((p.v - 55) / (VR - 55), 0, 1);
  const pr = (up ? 1 : 0) - (dn ? 1 : 0);
  if (p.onGround) {
    if (pr > 0 && p.v >= VR * 0.93) p.pitch += 8 * dt;
    else p.pitch -= 5 * dt;
    p.pitch = clamp(p.pitch, 0, 14);
  } else {
    p.pitch += pr * 12 * dt;
    if (p.v < 62) p.pitch -= (62 - p.v) * 0.8 * dt;   // zu langsam: die Nase sackt weg
    p.pitch = clamp(p.pitch, -20, 20);
  }

  // Kurven: in der Luft legt sich der Flieger schräg, am Boden lenkt das Bugrad
  const lr = (held('right') ? 1 : 0) - (held('left') ? 1 : 0);
  if (p.onGround) {
    p.roll = 0;
    p.hdg += lr * 4 * DEG * clamp(p.v / 10, 0, 1) * dt;
  } else {
    if (lr) p.roll += lr * 35 * dt;
    else p.roll -= Math.sign(p.roll) * Math.min(Math.abs(p.roll), 25 * dt);   // richtet sich von selbst wieder gerade
    p.roll = clamp(p.roll, -35, 35);
    p.hdg += 9.81 * Math.tan(p.roll * DEG) / Math.max(p.v, 40) * 1.5 * dt;
  }
  p.hdg = clamp(p.hdg, -60 * DEG, 60 * DEG);

  const drag = 7.4e-5 * (1 + p.gear * 0.5);
  let acc = p.throttle * 5 - drag * p.v * p.v - 9.81 * Math.sin(p.pitch * DEG) * 0.6;
  if (p.onGround) acc -= 0.15 + (held('brake') ? 7 : 0);
  p.v = Math.max(0, p.v + acc * dt);

  // langsam sinkt er auch mit waagerechter Nase, damit man beim Landen aufsetzt
  const sag = clamp((100 - p.v) / 25, 0, 1) * 3;
  const vy = p.v * Math.sin(p.pitch * DEG) * lift - sag - (1 - lift) * 18 - (1 - Math.cos(p.roll * DEG)) * 10;
  if (p.onGround) {
    p.vy = 0;
    if (vy > 0.5) p.onGround = false;
  }
  if (!p.onGround) {
    p.vy = vy;
    p.y = Math.min(CEILING, p.y + p.vy * dt);
    if (p.y > 10) p.flown = true;
  }
  const vh = p.v * Math.cos(p.pitch * DEG);
  p.x += vh * Math.cos(p.hdg) * dt;
  p.z += vh * Math.sin(p.hdg) * dt;

  if (!p.onGround && p.y <= 0) { touchdown(); return; }

  if (p.onGround && p.x > p.rwy.x1) {
    if (!p.flown) return crash('field', 'Die Startbahn war zu Ende! Gib mehr Schub und zieh die Nase hoch, sobald du 270 km/h schnell bist.');
    return crash('field', 'Über die Landebahn hinaus gerollt! Halte nach dem Aufsetzen die Bremse gedrückt.');
  }
  if (p.onGround && Math.abs(p.z) > 32) return crash('field', 'Von der Bahn abgekommen! Lenk mit ◀ ▶, damit du in der Mitte bleibst.');
  if (p.onGround && p.flown && p.v < 1.5) return landed();
  if (!p.onGround && p.x > RWY_B.x1 + 3000) {
    return finish({ ok: false, title: 'Vorbeigeflogen!', text: `${R.name} liegt schon hinter dir. Folge beim nächsten Mal den grünen Punkten runter zur Landebahn.` });
  }

  // Kondensstreifen hoch oben
  if (p.y > 600) {
    for (const [lx, ly] of [[2, 5.6], [-8, 4.1]]) {
      const [x, a] = localToWorld(lx, ly);
      contrail.push({ x, a, t: 0, e: lx });
    }
  }
}

function touchdown() {
  const sink = -p.vy;
  p.y = 0;
  if (p.x > SEA_FROM && p.x < SEA_TO) return crash('sea', `Du bist im Meer gelandet. Flieg weiter bis nach ${R.name}!`);
  if (p.gear < 0.9) return crash('belly', 'Bauchlandung! Das Fahrwerk war nicht ausgefahren. Drück vor der Landung auf „Fahrwerk“.');
  if (p.pitch < -2) return crash('nose', 'Mit der Nase zuerst aufgesetzt! Zieh kurz vor dem Boden die Nase etwas hoch.');
  if (p.pitch > 12) return crash('tail', 'Heckaufsetzer! Die Nase war viel zu weit oben.');
  if (sink > 8) return crash('hard', 'Viel zu hart aufgesetzt! Sink langsamer und zieh kurz vor dem Boden die Nase hoch.');
  const onStrip = Math.abs(p.z) <= 30;
  const rwy = !onStrip ? null : inside(p.x, RWY_A) ? RWY_A : inside(p.x, RWY_B) ? RWY_B : null;
  if (!rwy) return crash('field', onStrip ? 'Daneben! Du bist vor oder hinter der Landebahn aufgesetzt.' : 'Daneben! Du bist neben der Landebahn aufgesetzt. Schau aufs Radar und lenk mit ◀ ▶.');
  p.onGround = true; p.vy = 0; p.rwy = rwy; p.touchSink = sink;
  if (p.flown) p.throttle = 0;   // nach der Landung geht der Schub automatisch auf Leerlauf
  shake = Math.min(8, 2 + sink * 1.5);
  thump();
  for (let i = 0; i < 18; i++) {
    particles.push({ x: p.x - 4 + Math.random() * 6, a: 0.5, vx: -p.v * 0.15 * Math.random(), va: 1 + Math.random() * 3,
                     life: 1.4, max: 1.4, r: 1.5 + Math.random() * 2, grow: 4, color: '220,220,220' });
  }
}

function landed() {
  if (p.rwy === RWY_A) {
    return finish({ ok: true, stars: 0, title: 'Zurück in Frankfurt', text: `Sicher gelandet! Aber ${R.name} wartet noch auf dich. ${R.icon}` });
  }
  const s = p.touchSink;
  const stars = s < 3 ? 3 : s < 5 ? 2 : 1;
  const text = stars === 3 ? 'Butterweich aufgesetzt! Die Passagiere klatschen.'
             : stars === 2 ? `Gute Landung! Willkommen ${R.in}. ${R.icon}`
             : 'Etwas hart, aber alle sind heil angekommen!';
  finish({ ok: true, stars, title: `Gelandet ${R.in}!`, text });
  applause();
}

function finish(r) {
  result = r;
  state = 'done';
  resultT = 0.6;
  stopEngine();
}

function crash(kind, text) {
  result = { ok: false, title: kind === 'sea' ? 'Platsch!' : 'Bumm!', text };
  state = 'crashed';
  resultT = 1.8;
  p.crash = kind;
  p.tilt = kind === 'nose' ? -6 : kind === 'tail' ? 8 : kind === 'sea' ? 0 : -3;
  p.drop = p.gear < 0.5 ? 4 : 2;
  shake = 14;
  stopEngine();
  if (kind === 'sea') {
    splash();
    for (let i = 0; i < 60; i++) {
      particles.push({ x: p.x - 30 + Math.random() * 70, a: 1, vx: (Math.random() - 0.3) * 30, va: 10 + Math.random() * 30,
                       life: 1.6, max: 1.6, r: 0.8 + Math.random() * 1.6, grow: 0, color: '235,245,255', g: 30 });
    }
  } else {
    boom();
    for (let i = 0; i < 50; i++) {
      const fire = i < 20;
      particles.push({ x: p.x - 30 + Math.random() * 70, a: 2 + Math.random() * 8, vx: (Math.random() - 0.5) * 8, va: 3 + Math.random() * 8,
                       life: fire ? 1 : 5, max: fire ? 1 : 5, r: fire ? 3 : 4 + Math.random() * 4, grow: fire ? 3 : 6,
                       color: fire ? '255,150,40' : '90,90,95' });
    }
  }
}

function updateParticles(dt) {
  for (const q of particles) {
    q.life -= dt;
    q.x += q.vx * dt;
    q.a += q.va * dt;
    if (q.g) q.va -= q.g * dt;
    q.r += q.grow * dt;
  }
  particles = particles.filter(q => q.life > 0);
  for (const c of contrail) c.t += dt;
  contrail = contrail.filter(c => c.t < 2.5);
  // Rauch steigt noch eine Weile nach dem Absturz auf
  if (state === 'crashed' && p.crash !== 'sea' && Math.random() < 0.3) {
    particles.push({ x: p.x - 20 + Math.random() * 40, a: 6, vx: 4, va: 6, life: 4, max: 4, r: 4, grow: 6, color: '90,90,95' });
  }
}

// ── Hinweise für den Piloten ───────────────────────────────────────
function glideAlt(x) { return (DEST - x) * Math.tan(GLIDE); }

function hint() {
  const dist = DEST - p.x;
  if (welcomeT > 0) return [`🔔 Bitte anschnallen! Wir fliegen nach ${R.name}.`, false];
  const side = p.z > 0 ? 'links ◀' : 'rechts ▶';
  if (p.onGround && Math.abs(p.z) > 12) return [`Bleib in der Mitte der Bahn! Lenk nach ${side}`, true];
  if (p.onGround && !p.flown) {
    if (p.throttle < 0.7) return ['Gib Schub! Halte „Schub +“ gedrückt.', false];
    if (p.v < VR * 0.93) return ['Schneller werden … bei 270 km/h abheben!', false];
    return ['Jetzt die Nase hoch! ▲', false];
  }
  if (p.onGround) return [p.throttle > 0.05 ? 'Schub ganz weg! Und bremsen! 🛑' : 'Bremse halten! 🛑', true];
  if (p.v < 66) return ['⚠️ Zu langsam! Mehr Schub und Nase runter!', true];
  if (p.gear > 0.5 && p.v > 110 && dist > 5000) return ['Fahrwerk einfahren! Sonst bremst es dich.', true];
  if (dist < 5000 && !p.gearDown) return ['Fahrwerk ausfahren! ⚙️', true];
  if (dist < 8000 && p.v > 105) return ['Zu schnell für die Landung! Schub weg.', true];
  if (dist < GLIDE_LEN + 3000 && Math.abs(p.z) > 40) return [`Die Landebahn ist ${side} – schau aufs Radar`, true];
  if (dist >= GLIDE_LEN + 3000 && Math.abs(p.hdg) > 25 * DEG) return [`${R.name} liegt ${p.hdg > 0 ? 'links ◀' : 'rechts ▶'}`, false];
  if (dist < 1500 && p.y < 30) return ['Gleich am Boden: Nase ganz leicht hoch ▲', false];
  if (dist < GLIDE_LEN + 1500 && p.y > glideAlt(p.x) + 60) return ['Zeit für den Sinkflug! Folge den grünen Punkten ▼', false];
  if (dist < GLIDE_LEN && p.y < glideAlt(p.x) - 60) return ['Zu tief! Etwas höher ▲', true];
  if (dist < GLIDE_LEN) return ['Super, genau auf den grünen Punkten! 👍', false];
  if (p.y < 600) return ['Steig auf Reiseflughöhe: über 6000 m ▲', false];
  if (p.x > SEA_FROM && p.x < SEA_TO) return [`Unter dir ist ${R.seaName} 🌊`, false];
  if (R.desert && p.x > DEST_FROM) return ['Unter dir ist die Wüste 🐪', false];
  return ['Reiseflug! Genieß die Aussicht ☁️', false];
}

// ── Zeichnen: Hilfen ───────────────────────────────────────────────
let S = 1, shX = 0, shY = 0;
const sx = x => W() * 0.35 + (x - p.x) * S + shX;
const sy = a => H() * 0.5 - (a - cam.a) * S + shY;

function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(a, b, t) {
  const A = hex2rgb(a), B = hex2rgb(b);
  return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`;
}
function txt(str, x, y, size, color, align = 'center', stroke = null) {
  ctx.font = `bold ${size}px system-ui, -apple-system, sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineWidth = size * 0.2; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.strokeText(str, x, y); }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}
function wrap(str, maxW, size) {
  ctx.font = `bold ${size}px system-ui, -apple-system, sans-serif`;
  const lines = [];
  let line = '';
  for (const word of str.split(' ')) {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = word; }
    else line = test;
  }
  lines.push(line);
  return lines;
}
const PUFFS = [[0, 0, 1], [-0.9, 0.25, 0.7], [0.95, 0.2, 0.75], [0.35, -0.45, 0.65], [-1.6, 0.45, 0.45], [1.7, 0.45, 0.45]];
function puffs(x, y, r, k) {
  ctx.beginPath();
  for (const [dx, dy, s] of PUFFS) {
    ctx.moveTo(x + dx * r + s * r * k, y + dy * r);
    ctx.arc(x + dx * r, y + dy * r, s * r * k, 0, Math.PI * 2);
  }
}
function cloud(x, y, r, alpha) {
  if (r < 4) {
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    puffs(x, y, r, 1); ctx.fill();
    return;
  }
  // grauer Bauch unten, heller Körper, Sonnenlicht oben
  ctx.fillStyle = `rgba(178,192,215,${alpha})`;
  puffs(x, y + r * 0.14, r, 1); ctx.fill();
  const g = ctx.createLinearGradient(0, y - r * 1.1, 0, y + r * 0.9);
  g.addColorStop(0, `rgba(255,255,255,${alpha})`);
  g.addColorStop(1, `rgba(222,230,243,${alpha})`);
  ctx.fillStyle = g;
  puffs(x, y, r, 0.95); ctx.fill();
  ctx.fillStyle = `rgba(255,255,255,${alpha * 0.8})`;
  ctx.beginPath();
  ctx.moveTo(x + r * 0.62, y - r * 0.55); ctx.arc(x + r * 0.27, y - r * 0.55, r * 0.35, 0, Math.PI * 2);
  ctx.moveTo(x - r * 0.25, y - r * 0.15); ctx.arc(x - r * 0.55, y - r * 0.15, r * 0.3, 0, Math.PI * 2);
  ctx.fill();
}

// ── Berühmte Bauwerke ──────────────────────────────────────────────
// in Metern, (0,0) ist die Mitte unten, nach oben ist minus
function drawLandmark(kind, X, Y, s) {
  ctx.save();
  ctx.translate(X, Y); ctx.scale(s, s);
  const lw = 1 / s;   // eine Bildschirm-Linie dünn
  if (kind === 'cathedral') {
    ctx.fillStyle = '#d9c49a';
    ctx.fillRect(-60, -30, 120, 30);
    for (let i = -60; i <= 60; i += 15) { ctx.fillRect(i - 2, -40, 4, 40); ctx.beginPath(); ctx.moveTo(i - 2, -40); ctx.lineTo(i, -46); ctx.lineTo(i + 2, -40); ctx.fill(); }
    ctx.fillRect(-70, -48, 12, 48); ctx.fillRect(58, -48, 12, 48);
    ctx.fillStyle = '#8a6a3c';
    ctx.beginPath(); ctx.arc(0, -20, 6, 0, Math.PI * 2); ctx.fill();
    for (let i = -50; i <= 50; i += 15) ctx.fillRect(i - 1.5, -24, 3, 12);
  } else if (kind === 'bigben') {

    ctx.fillStyle = '#c9a96a';
    ctx.fillRect(6, -24, 130, 24);
    for (let i = 10; i < 136; i += 12) { ctx.fillRect(i, -32, 3, 8); }
    ctx.fillRect(126, -60, 16, 60);

    ctx.fillRect(-6, -70, 12, 70);
    ctx.fillRect(-7.5, -84, 15, 14);
    ctx.fillRect(-6.5, -90, 13, 6);
    ctx.fillStyle = '#4a5560';
    ctx.beginPath(); ctx.moveTo(-6.5, -90); ctx.lineTo(0, -106); ctx.lineTo(6.5, -90); ctx.closePath(); ctx.fill();
    ctx.fillRect(-0.4, -110, 0.8, 5);
    ctx.fillStyle = '#f4f0e0';
    ctx.beginPath(); ctx.arc(0, -77, 5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#222'; ctx.lineWidth = 0.7;
    ctx.beginPath(); ctx.moveTo(0, -77); ctx.lineTo(0, -80.5); ctx.moveTo(0, -77); ctx.lineTo(2.5, -77); ctx.stroke();
    ctx.fillStyle = '#8f7444';
    for (let y = -64; y < -4; y += 8) ctx.fillRect(-4, y, 8, 3);

    ctx.beginPath(); ctx.moveTo(-25, 0); ctx.lineTo(0, cy); ctx.lineTo(25, 0); ctx.stroke();

    for (let i = 0; i < 32; i++) { const a = rot + i * Math.PI / 16; ctx.beginPath(); ctx.ellipse(Math.cos(a) * r, cy + Math.sin(a) * r + 2, 2.6, 1.8, 0, 0, Math.PI * 2); ctx.fill(); }
  } else if (kind === 'eiffel') {

    ctx.lineTo(2, -300); ctx.lineTo(5, -276); ctx.quadraticCurveTo(10, -200, 20, -115); ctx.lineTo(35, -57); ctx.quadraticCurveTo(45, -30, 62, 0);
    ctx.lineTo(40, 0); ctx.quadraticCurveTo(0, -60, -40, 0); ctx.closePath(); ctx.fill();
    ctx.save(); ctx.clip();
    ctx.strokeStyle = 'rgba(255,220,170,0.35)'; ctx.lineWidth = Math.max(0.6, 0.8 * lw);
    ctx.beginPath();
    for (let i = -320; i < 320; i += 9) { ctx.moveTo(i, 0); ctx.lineTo(i + 300, -300); ctx.moveTo(i, 0); ctx.lineTo(i - 300, -300); }
    ctx.stroke();
    ctx.restore();
    ctx.fillStyle = '#5e4630';
    ctx.fillRect(-40, -60, 80, 6); ctx.fillRect(-24, -118, 48, 5); ctx.fillRect(-7, -279, 14, 5);

    ctx.beginPath(); ctx.moveTo(180, 0); ctx.lineTo(220, 0); ctx.lineTo(212, -417); ctx.lineTo(188, -417); ctx.closePath(); ctx.fill();
    ctx.fillRect(199, -541, 2, 124);
  }
  ctx.restore();
}

function drawWheel(x, y) {
  ctx.fillStyle = '#1b1b1f';
  ctx.beginPath(); ctx.arc(x, y, 0.62, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#9aa0a8';
  ctx.beginPath(); ctx.arc(x, y, 0.25, 0, Math.PI * 2); ctx.fill();
}

function drawEngine(x0, cy, shade) {
  // Pylon
  ctx.fillStyle = '#b7c0ca';
  ctx.beginPath();
  ctx.moveTo(x0 + 1, cy - 1.2); ctx.lineTo(x0 + 6, cy - 1.2); ctx.lineTo(x0 + 4, cy - 3); ctx.lineTo(x0 - 1, cy - 3);
  ctx.closePath(); ctx.fill();
  // Gondel
  const g = ctx.createLinearGradient(0, cy - 1.5, 0, cy + 1.5);
  g.addColorStop(0, shade ? '#e9edf2' : '#ffffff');
  g.addColorStop(1, shade ? '#a9b2bd' : '#c3cad3');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.roundRect(x0, cy - 1.5, 7, 3, 1.3); ctx.fill();
  ctx.strokeStyle = 'rgba(60,70,90,0.5)'; ctx.lineWidth = 0.12; ctx.stroke();
  ctx.fillStyle = GREEN;
  ctx.fillRect(x0 + 1.2, cy - 1.5, 0.5, 3);
  // Einlass vorne, Düse hinten
  ctx.fillStyle = '#2a2f38';
  ctx.beginPath(); ctx.ellipse(x0 + 7, cy, 0.45, 1.35, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#6b7380';
  ctx.beginPath(); ctx.moveTo(x0, cy - 0.8); ctx.lineTo(x0 - 1.4, cy); ctx.lineTo(x0, cy + 0.8); ctx.closePath(); ctx.fill();
}

function drawA380(gear, lights) {
  // Seitenleitwerk mit Logo
  ctx.fillStyle = BLUE;
  ctx.beginPath();
  ctx.moveTo(-22, -3.9); ctx.lineTo(-31, -18.5); ctx.lineTo(-36.5, -18.5); ctx.lineTo(-37.8, -2.6);
  ctx.closePath(); ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = GREEN;
  ctx.beginPath();
  ctx.moveTo(-22, -2); ctx.quadraticCurveTo(-30, -10, -40, -10); ctx.lineTo(-40, -6); ctx.quadraticCurveTo(-30, -6, -25.5, -2);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 6px system-ui, -apple-system, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('H', -32.3, -13);

  // Rumpf
  fuselagePath();
  const g = ctx.createLinearGradient(0, -4.2, 0, 4.2);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(0.6, '#f1f4f8');
  g.addColorStop(1, '#c9d1db');
  ctx.fillStyle = g; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = BLUE; ctx.fillRect(-40, 2.7, 80, 2);
  ctx.fillStyle = GREEN; ctx.fillRect(-40, 1.9, 80, 0.7);
  ctx.fillStyle = 'rgba(120,130,150,0.35)';
  ctx.beginPath(); ctx.ellipse(-3, 4.3, 12, 1.6, 0, 0, Math.PI * 2); ctx.fill();   // Bauchverkleidung
  ctx.restore();
  fuselagePath();
  ctx.strokeStyle = 'rgba(70,80,100,0.6)'; ctx.lineWidth = 0.15; ctx.stroke();

  // Fenster: zwei Decks
  ctx.fillStyle = '#2b3a55';
  for (let x = -16; x < 26.5; x += 1.25) if (Math.abs(x - 2) > 1 && Math.abs(x - 14) > 1) ctx.fillRect(x, -2.7, 0.55, 0.75);
  for (let x = -19; x < 29.5; x += 1.25) if (Math.abs(x - 9.5) > 1 && Math.abs(x + 4) > 1) ctx.fillRect(x, 0.3, 0.55, 0.75);
  // Türen
  ctx.strokeStyle = 'rgba(80,90,110,0.7)'; ctx.lineWidth = 0.12;
  for (const x of [28.4, 9.4, -4.1, -18.6]) { ctx.beginPath(); ctx.roundRect(x, -0.3, 1.1, 2.1, 0.3); ctx.stroke(); }
  for (const x of [1.9, 13.9, -14.5]) { ctx.beginPath(); ctx.roundRect(x, -3.3, 1.0, 1.9, 0.3); ctx.stroke(); }
  // Cockpit
  ctx.fillStyle = '#1d2433';
  ctx.beginPath();
  ctx.moveTo(31.8, -1.7); ctx.lineTo(34.4, -1.7); ctx.lineTo(35.3, -0.6); ctx.lineTo(31.8, -0.7);
  ctx.closePath(); ctx.fill();
  // Name
  ctx.fillStyle = BLUE;
  ctx.font = 'bold 1.45px system-ui, -apple-system, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('Henrik Airlines', -6, -0.85);

  // Höhenleitwerk
  ctx.fillStyle = '#dfe4ea';
  ctx.beginPath();
  ctx.moveTo(-28, -1.4); ctx.lineTo(-38.5, -3.6); ctx.lineTo(-40, -2.9); ctx.lineTo(-31.5, -0.5);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(70,80,100,0.5)'; ctx.stroke();

  // Fahrwerk (wird beim Einfahren kürzer)
  if (gear > 0.12) {
    const L = 3.4 * gear;
    ctx.strokeStyle = '#5b626d'; ctx.lineWidth = 0.45;
    ctx.beginPath();
    ctx.moveTo(30, 3.8); ctx.lineTo(30, 4.2 + L);
    ctx.moveTo(-5.5, 3.8); ctx.lineTo(-5.5, 4.2 + L);
    ctx.moveTo(0.3, 3.6); ctx.lineTo(0.3, 4.2 + L);
    ctx.stroke();
    ctx.lineWidth = 0.3;
    ctx.beginPath(); ctx.moveTo(-7.3, 4.2 + L); ctx.lineTo(-3.7, 4.2 + L); ctx.stroke();
    for (const x of [-7.3, -5.5, -3.7]) drawWheel(x, 4.2 + L);
    for (const x of [-0.6, 1.2]) drawWheel(x, 4.2 + L);
    drawWheel(30, 4.2 + L);
  }

  // Flügel und Triebwerke
  ctx.fillStyle = '#cfd6de';
  ctx.beginPath();
  ctx.moveTo(10, 3); ctx.lineTo(-20, 0.4); ctx.lineTo(-21.8, 1.1); ctx.lineTo(-5, 4.5);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(70,80,100,0.6)'; ctx.lineWidth = 0.15; ctx.stroke();
  ctx.fillStyle = GREEN;
  ctx.beginPath(); ctx.moveTo(-20.2, 0.5); ctx.lineTo(-21.6, -1.4); ctx.lineTo(-22.4, -1.2); ctx.lineTo(-21.8, 1.1); ctx.closePath(); ctx.fill();
  drawEngine(-8, 4.1, true);
  drawEngine(2, 5.6, false);

  // Blinklichter
  if (lights) {
    const blink = (time % 1.2) < 0.12;
    if (blink) {
      ctx.fillStyle = 'rgba(255,40,40,0.95)';
      ctx.beginPath(); ctx.arc(0, -4.5, 0.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,40,40,0.25)';
      ctx.beginPath(); ctx.arc(0, -4.5, 1.8, 0, Math.PI * 2); ctx.fill();
    }
    if ((time % 1.2) > 0.6 && (time % 1.2) < 0.68) {
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.arc(-21.8, -1, 1.2, 0, Math.PI * 2); ctx.fill();
    }
  }
}

// ── Zeichnen: Welt ─────────────────────────────────────────────────
const FIELDS = ['#5da84a', '#6bb04f', '#4f9a3f', '#8fbf5a', '#c9b85a', '#a8c060', '#7a9a3a', '#b98f5a'];

function landFactor(x) {
  if (x < SEA_FROM) return clamp((SEA_FROM - x) / 1500, 0, 1);
  if (x > SEA_TO) return clamp((x - SEA_TO) / 1500, 0, 1);
  return 0;
}

// Himmel färbt sich auf den letzten Kilometern wie am Ziel, oben wird er dunkler
function skyColors(t) {
  const k = clamp((p.x - (DEST - 20000)) / 12000, 0, 1);
  return [
    lerpRGB(lerpRGB(hex2rgb('#4a9be6'), hex2rgb(R.sky[0]), k), hex2rgb('#0b2a66'), t),
    lerpRGB(lerpRGB(hex2rgb('#cfe9ff'), hex2rgb(R.sky[1]), k), hex2rgb('#4f86cf'), t),
  ];
}

function drawSky() {
  const t = clamp(cam.a / 1100, 0, 1);
  const [top, low] = skyColors(t);
  const g = ctx.createLinearGradient(0, 0, 0, H());
  g.addColorStop(0, rgb(top));
  g.addColorStop(1, rgb(low));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W(), H());
  // Sonne
  const sxp = W() * 0.82, syp = H() * 0.16;
  const sg = ctx.createRadialGradient(sxp, syp, 0, sxp, syp, 90);
  sg.addColorStop(0, 'rgba(255,250,220,0.95)');
  sg.addColorStop(0.25, 'rgba(255,240,180,0.6)');
  sg.addColorStop(1, 'rgba(255,240,180,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(sxp, syp, 90, 0, Math.PI * 2); ctx.fill();
}

function drawFarClouds(offset, vshift) {
  const span = W() + 400;
  for (let i = 0; i < 8; i++) {
    const x = ((rand(i) * span - offset) % span + span) % span - 200;
    const y = H() * (0.08 + rand(i + 20) * 0.55) + vshift;
    cloud(x, y, 14 + rand(i + 40) * 22, 0.45);
  }
}

function drawHills(gy) {
  if (gy > H() + 10 || gy < -200) return;
  const layers = [
    { par: 0.2, amp: 70, col: mix('#8fb0b8', '#6f9aa8', 0.5), shift: 0 },
    { par: 0.45, amp: 35, col: p.x > DEST_FROM - 3000 ? R.hill : '#6c9a6e', shift: 3 },
  ];
  for (const L of layers) {
    ctx.fillStyle = L.col;
    ctx.beginPath();
    ctx.moveTo(-10, gy);
    for (let x = -10; x <= W() + 10; x += 8) {
      const wx = p.x * L.par + (x - W() * 0.35) / S;
      const real = p.x + (x - W() * 0.35) / S / L.par;
      const big = real > DEST_FROM - 2000 ? R.hills : 1;   // am Ziel sind die Hügel anders hoch
      const h = (0.55 + 0.25 * Math.sin(wx / 530 + L.shift) + 0.15 * Math.sin(wx / 210 + 1.3) + 0.08 * Math.sin(wx / 90 + 2.1))
              * L.amp * landFactor(real) * big;
      ctx.lineTo(x, gy - h * S * 0.6);
    }
    ctx.lineTo(W() + 10, gy);
    ctx.closePath();
    ctx.fill();
  }
}

function drawSkyline(gy) {
  // Frankfurter Hochhäuser in der Ferne
  for (let i = 0; i < 26; i++) {
    const bx = -900 + i * 140;
    const x = W() * 0.35 + (bx - p.x) * S * 0.3;
    const w = (30 + rand(i + 5) * 35) * S * 0.3;
    if (x + w < 0 || x > W()) continue;
    const h = (40 + rand(i + 9) * 130) * S * 0.3;
    ctx.fillStyle = i % 3 === 0 ? '#7f93ae' : '#8ea1ba';
    ctx.fillRect(x, gy - h, w, h);
    if (i % 5 === 2) {
      ctx.beginPath(); ctx.moveTo(x, gy - h); ctx.lineTo(x + w / 2, gy - h - 20 * S * 0.3); ctx.lineTo(x + w, gy - h); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,240,180,0.35)';
    for (let wy = gy - h + 4; wy < gy - 4; wy += 7) ctx.fillRect(x + 2, wy, w - 4, 1.5);
  }
}

function drawLandmarksSide(gy) {
  for (const [kind, lx] of R.landmarks) {
    // weit hinten: bewegt sich langsam vorbei und ist schon von weitem zu sehen
    const X = W() * 0.35 + (DEST + lx - p.x) * S * 0.12;
    if (X < -500 * S || X > W() + 500 * S) continue;
    drawLandmark(kind, X, gy - 2, S * 0.4);
  }
}

function drawGround(gy) {
  if (gy > H()) return;
  const x0 = p.x - (W() * 0.35) / S, x1 = p.x + (W() * 0.65) / S;
  // Wiese mit Feldern in drei Reihen, die nach vorne größer werden
  ctx.fillStyle = '#5da84a';
  ctx.fillRect(0, gy, W(), H() - gy);
  if (x1 > DEST_FROM) { ctx.fillStyle = R.ground[0]; ctx.fillRect(Math.max(0, sx(DEST_FROM)), gy, W(), H() - gy); }
  const rows = [[0, 0.16, 90], [0.16, 0.42, 140], [0.42, 1, 220]];
  rows.forEach(([a, b, cw], ri) => {
    const ya = gy + (H() - gy) * a, yb = gy + (H() - gy) * b;
    const off = rand(ri + 0.5) * cw;
    for (let c = Math.floor((x0 - off) / cw); c * cw + off < x1; c++) {
      const cx0 = c * cw + off;
      if (landFactor(cx0) < 1 || landFactor(cx0 + cw) < 1) continue;
      const pal = cx0 > DEST_FROM ? R.fields : FIELDS;
      ctx.fillStyle = pal[Math.floor(rand(c * 3.1 + ri * 17) * pal.length)];
      ctx.fillRect(sx(cx0), ya, cw * S + 1, yb - ya + 1);
    }
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    ctx.fillRect(0, yb - 1, W(), 2);
  });
  // Strand und Meer
  const beach = 250;
  const s0 = Math.max(x0, SEA_FROM - beach), s1 = Math.min(x1, SEA_TO + beach);
  if (s0 < s1) { ctx.fillStyle = '#e8d49a'; ctx.fillRect(sx(s0), gy, (s1 - s0) * S, H() - gy); }
  const m0 = Math.max(x0, SEA_FROM), m1 = Math.min(x1, SEA_TO);
  if (m0 < m1) {
    const g = ctx.createLinearGradient(0, gy, 0, H());
    g.addColorStop(0, '#2f8fd0'); g.addColorStop(1, '#14507f');
    ctx.fillStyle = g;
    ctx.fillRect(sx(m0), gy - 2, (m1 - m0) * S, H() - gy + 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.5;
    for (let row = 0; row < 4; row++) {
      const yy = gy + 6 + row * 14;
      if (yy > H()) break;
      for (let x = Math.floor(m0 / 50) * 50; x < m1; x += 50) {
        const xx = sx(x + ((time * 8 + row * 17) % 50));
        ctx.beginPath(); ctx.moveTo(xx, yy); ctx.quadraticCurveTo(xx + 4, yy - 3, xx + 8, yy); ctx.stroke();
      }
    }
    // Glitzern der Sonne
    ctx.fillStyle = 'rgba(255,255,240,0.85)';
    for (let i = 0; i < 40; i++) {
      const xw = m0 + rand(i * 3.7 + Math.floor(time * 3)) * (m1 - m0);
      const yy = gy + 4 + rand(i * 5.3) * (H() - gy);
      if (rand(i + Math.floor(time * 8) * 0.37) < 0.5) ctx.fillRect(sx(xw), yy, 3, 1.5);
    }
    // Segelboot
    const bx = sx((SEA_FROM + SEA_TO) / 2);
    if (bx > -50 && bx < W() + 50) {
      const k = S;
      ctx.fillStyle = '#7a3b1e';
      ctx.beginPath(); ctx.moveTo(bx - 9 * k, gy + 2); ctx.lineTo(bx + 9 * k, gy + 2); ctx.lineTo(bx + 6 * k, gy + 5 * k); ctx.lineTo(bx - 6 * k, gy + 5 * k); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.moveTo(bx, gy + 1); ctx.lineTo(bx, gy - 16 * k); ctx.lineTo(bx + 8 * k, gy + 1); ctx.fill();
    }
  }
}

function drawTree(x, gy, h, palm) {
  if (palm) {
    ctx.strokeStyle = '#8a6a3c'; ctx.lineWidth = Math.max(1.5, 0.9 * S);
    ctx.beginPath(); ctx.moveTo(x, gy); ctx.quadraticCurveTo(x + h * 0.15, gy - h * 0.5, x + h * 0.1, gy - h); ctx.stroke();
    ctx.strokeStyle = '#2f8a3a'; ctx.lineWidth = Math.max(1.5, 0.8 * S);
    const tx = x + h * 0.1, ty = gy - h;
    for (const a of [-2.6, -1.9, -1.2, -0.5, 0.2]) {
      ctx.beginPath(); ctx.moveTo(tx, ty);
      ctx.quadraticCurveTo(tx + Math.cos(a) * h * 0.3, ty + Math.sin(a) * h * 0.3 - h * 0.1, tx + Math.cos(a) * h * 0.45, ty + h * 0.15);
      ctx.stroke();
    }
  } else {
    ctx.fillStyle = '#6b4a2b';
    ctx.fillRect(x - 0.6 * S, gy - h * 0.4, 1.2 * S, h * 0.4);
    ctx.fillStyle = '#3d8a3a';
    ctx.beginPath(); ctx.arc(x, gy - h * 0.65, h * 0.35, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.arc(x - h * 0.1, gy - h * 0.75, h * 0.15, 0, Math.PI * 2); ctx.fill();
  }
}

function drawTrees(gy) {
  const x0 = p.x - (W() * 0.35) / S - 30, x1 = p.x + (W() * 0.65) / S + 30;
  for (let c = Math.floor(x0 / 60); c <= x1 / 60; c++) {
    if (rand(c + 0.5) > 0.55) continue;
    const x = c * 60 + rand(c + 0.1) * 40;
    if (landFactor(x) < 1) continue;
    if (x > -1000 && x < RWY_A.x1 + 300) continue;
    if (x > RWY_B.x0 - 1200 && x < RWY_B.x0 + 1700) continue;
    const kind = treeKind(x, c);
    if (kind) drawTree(sx(x), gy - 3, (12 + rand(c + 0.3) * 10) * S, kind === 'palm');
  }
}

function drawBuilding(x0, w, h, color, glass) {
  const x = sx(x0), gy = sy(0) - 3;
  ctx.fillStyle = color;
  ctx.fillRect(x, gy - h * S, w * S, h * S);
  ctx.fillStyle = glass;
  ctx.fillRect(x + 2 * S, gy - h * S * 0.75, w * S - 4 * S, h * S * 0.35);
}

function drawTower(x0, color) {
  const x = sx(x0), gy = sy(0) - 3;
  ctx.fillStyle = color;
  ctx.fillRect(x - 3 * S, gy - 55 * S, 6 * S, 55 * S);
  ctx.fillRect(x - 9 * S, gy - 58 * S, 18 * S, 3 * S);
  ctx.fillStyle = '#7fd4c9';
  ctx.beginPath();
  ctx.moveTo(x - 9 * S, gy - 58 * S); ctx.lineTo(x - 7 * S, gy - 66 * S); ctx.lineTo(x + 7 * S, gy - 66 * S); ctx.lineTo(x + 9 * S, gy - 58 * S);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = color;
  ctx.fillRect(x - 8 * S, gy - 69 * S, 16 * S, 3 * S);
  ctx.fillStyle = '#c33';
  ctx.fillRect(x - 0.3 * S, gy - 75 * S, 0.6 * S, 6 * S);
}

function drawAirports() {
  const gy = sy(0) - 3;
  // Frankfurt
  if (p.x < 6000) {
    drawBuilding(300, 380, 20, '#9aa3ad', 'rgba(70,120,170,0.75)');
    txt('FRANKFURT', sx(490), gy - 22.5 * S, Math.max(9, 3.6 * S), '#1f2f4a');
    drawTower(1100, '#d8dde3');
    drawBuilding(1500, 160, 26, '#c7ccd3', 'rgba(255,255,255,0.4)');   // Halle
  }
  // Flughafen am Ziel
  if (p.x > DEST - 6000) {
    drawBuilding(DEST + 600, 380, 18, R.terminal, 'rgba(70,140,170,0.75)');
    txt(R.name.toUpperCase(), sx(DEST + 790), gy - 20.5 * S, Math.max(9, 3.6 * S), '#1f2f4a');
    drawTower(DEST + 1300, '#f1ece0');
    if (R.trees !== 'tree') for (let i = 0; i < 8; i++) drawTree(sx(DEST + 520 + i * 60), gy, (14 + rand(i) * 4) * S, true);
  }
}

function drawRunway(r) {
  const gy = sy(0);
  const a = sx(r.x0), b = sx(r.x1);
  if (b < 0 || a > W() || gy > H() + 20) return;
  const depth = Math.max(8, 9 * S);
  const top = gy - 3;
  ctx.fillStyle = '#3b3f45';
  ctx.fillRect(a, top, b - a, depth);
  ctx.fillStyle = '#ffffff';
  const mid = top + depth * 0.5 - 1;
  for (let x = r.x0 + 120; x < r.x1 - 120; x += 70) {
    const xx = sx(x);
    if (xx > -40 * S && xx < W()) ctx.fillRect(xx, mid, 35 * S, 2);
  }
  for (const end of [r.x0 + 15, r.x1 - 45]) {
    for (let i = 0; i < 4; i++) ctx.fillRect(sx(end), top + depth * (0.15 + i * 0.22), 30 * S, 1.5);
  }
  // Randbefeuerung
  for (let x = r.x0; x <= r.x1; x += 60) {
    const xx = sx(x);
    if (xx < -5 || xx > W() + 5) continue;
    ctx.fillStyle = x === r.x0 ? '#3f3' : x + 60 > r.x1 ? '#f33' : '#fff7d0';
    ctx.fillRect(xx - 1, top - 1, 3, 3);
    ctx.fillRect(xx - 1, top + depth - 2, 3, 3);
  }
}

function drawApproachLights() {
  const gy = sy(0) - 3;
  const run = Math.floor((time * 2) % 1 * 15);   // Lauflicht Richtung Landebahn
  for (let i = 0; i < 15; i++) {
    const x = DEST - 60 - (14 - i) * 60;
    const xx = sx(x);
    if (xx < -10 || xx > W() + 10) continue;
    ctx.fillStyle = '#555';
    ctx.fillRect(xx - 0.5, gy - 4 * S, 1.5, 4 * S);
    ctx.fillStyle = i === run ? '#ffffff' : '#ffe98a';
    ctx.beginPath(); ctx.arc(xx, gy - 4 * S, i === run ? 3 : 1.8, 0, Math.PI * 2); ctx.fill();
  }
}

function drawGlidePath() {
  const x0 = p.x - (W() * 0.35) / S - 50, x1 = Math.min(DEST, p.x + (W() * 0.65) / S + 50);
  const step = 120;
  for (let x = Math.max(DEST - GLIDE_LEN, Math.ceil(x0 / step) * step); x <= x1; x += step) {
    const a = glideAlt(x) + GEAR_H;
    const X = sx(x), Y = sy(a);
    if (Y < -10 || Y > H() + 10) continue;
    ctx.fillStyle = 'rgba(60,255,120,0.85)';
    ctx.beginPath(); ctx.arc(X, Y, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(60,255,120,0.25)';
    ctx.beginPath(); ctx.arc(X, Y, 8, 0, Math.PI * 2); ctx.fill();
  }
}

function worldClouds(front) {
  const cell = 110;
  const x0 = p.x - (W() * 0.35) / S - 200, x1 = p.x + (W() * 0.65) / S + 200;
  for (let c = Math.floor(x0 / cell); c <= x1 / cell; c++) {
    if (rand(c) > 0.5) continue;
    if ((rand(c + 0.9) < 0.35) !== front) continue;
    const alt = 70 + rand(c + 0.3) * 1250;
    const r = (14 + rand(c + 0.7) * 26) * S;
    const X = sx(c * cell + rand(c + 0.2) * 60), Y = sy(alt);
    if (Y < -r * 3 || Y > H() + r * 3) continue;
    cloud(X, Y, r, front ? 0.7 : 0.92);
  }
}

function drawContrails() {
  ctx.lineCap = 'round';
  for (const e of [2, -8]) {
    let prev = null;
    for (const c of contrail) {
      if (c.e !== e) continue;
      if (prev) {
        const f = 1 - c.t / 2.5;
        ctx.strokeStyle = `rgba(255,255,255,${0.7 * f})`;
        ctx.lineWidth = (1.2 + c.t * 2) * S * 0.5;
        ctx.beginPath(); ctx.moveTo(sx(prev.x), sy(prev.a)); ctx.lineTo(sx(c.x), sy(c.a)); ctx.stroke();
      }
      prev = c;
    }
  }
}

function drawParticles() {
  for (const q of particles) {
    const f = q.life / q.max;
    ctx.fillStyle = `rgba(${q.color},${0.8 * f})`;
    ctx.beginPath(); ctx.arc(sx(q.x), sy(q.a), q.r * S, 0, Math.PI * 2); ctx.fill();
  }
}

function drawShadow() {
  if (p.y > 250 || state === 'crashed' || p.x > SEA_FROM && p.x < SEA_TO && p.y > 0) return;
  const k = 1 - p.y / 250;
  ctx.fillStyle = `rgba(0,0,0,${0.28 * k})`;
  ctx.beginPath();
  ctx.ellipse(sx(p.x + 12), sy(0) + Math.max(8, 9 * S) * 0.3, 38 * S * (0.6 + 0.4 * k), 2.5 * S, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawPlane() {
  const X = sx(p.x), Y = sy(p.y - p.drop + (p.crash === 'sea' ? -p.sinkAnim : 0));
  ctx.save();
  ctx.translate(X, Y);
  ctx.rotate(-(p.pitch + p.tilt) * DEG);
  ctx.scale(S, S);
  ctx.translate(4, -GEAR_H);
  drawA380(p.gear, state === 'flying');
  ctx.restore();
  if (p.crash === 'sea') {
    // Wasser schwappt über den sinkenden Flieger
    const gy = sy(0);
    const g = ctx.createLinearGradient(0, gy, 0, H());
    g.addColorStop(0, '#2f8fd0'); g.addColorStop(1, '#14507f');
    ctx.fillStyle = g;
    ctx.globalAlpha = 0.9;
    ctx.fillRect(X - 50 * S, gy - 2, 100 * S, H() - gy + 2);
    ctx.globalAlpha = 1;
  }
}

// ── Zeichnen: Anzeigen ─────────────────────────────────────────────
function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(10,20,40,0.55)';
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 10); ctx.fill();
}

function drawButton(r, big, small, active, color) {
  ctx.fillStyle = active ? 'rgba(255,255,255,0.45)' : 'rgba(10,20,40,0.45)';
  ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2; ctx.stroke();
  const u = r.h;
  if (small) {
    txt(big, r.x + r.w / 2, r.y + r.h * 0.42, u * 0.36, color || '#fff');
    let fs = Math.max(10, u * 0.17);
    ctx.font = `bold ${fs}px system-ui, -apple-system, sans-serif`;
    fs *= Math.min(1, (r.w - 8) / ctx.measureText(small).width);
    txt(small, r.x + r.w / 2, r.y + r.h * 0.78, fs, 'rgba(255,255,255,0.85)');
  } else {
    txt(big, r.x + r.w / 2, r.y + r.h / 2, u * 0.28, color || '#fff');
  }
}

function drawHUD() {
  const u = clamp(Math.min(W(), H()) / 400, 0.8, 1.4);
  const m = 12;
  const fs = 14 * u;
  // links: Tempo, Höhe, Steigen
  const pw = 172 * u, ph = fs * 4.1;

  const vs = Math.round(p.vy);
  const rows = [
    ['Tempo', `${Math.round(p.v * 3.6)} km/h`],
    ['Höhe', `${(Math.round(p.y * ALT_SCALE / 10) * 10).toLocaleString('de-DE')} m`],
    [vs >= 0 ? 'Steigen' : 'Sinken', `${Math.abs(vs)} m/s`],
  ];
  rows.forEach(([k, v], i) => {
    txt(k, m + 10 * u, m + fs * (0.95 + i * 1.1), fs * 0.85, 'rgba(255,255,255,0.75)', 'left');
    txt(v, m + pw - 10 * u, m + fs * (0.95 + i * 1.1), fs, '#fff', 'right');
  });
  // rechts: Ziel

  // Strecke als kleine Karte von der Seite

  panel(m, my, mw, mh);
  const total = RWY_B.x1 + 1000;
  const mx = x => m + 10 + (x / total) * (mw - 20);

  ctx.fillStyle = '#2f8fd0'; ctx.fillRect(mx(SEA_FROM), base, mx(SEA_TO) - mx(SEA_FROM), 3);
  ctx.strokeStyle = 'rgba(60,255,120,0.8)'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]);
  const alt = a => base - (a / CEILING) * (mh - 12);
  ctx.beginPath(); ctx.moveTo(mx(DEST - GLIDE_LEN), alt(glideAlt(DEST - GLIDE_LEN))); ctx.lineTo(mx(DEST), base); ctx.stroke();
  ctx.setLineDash([]);
  txt('FRA', mx(0) + 2, my + 9 * u, 9 * u, 'rgba(255,255,255,0.8)', 'left');
  txt(R.code, mx(DEST) + 10, my + 9 * u, 9 * u, 'rgba(255,255,255,0.8)', 'left');
  ctx.save();
  ctx.translate(mx(Math.max(0, p.x)), alt(p.y));
  ctx.rotate(-p.pitch * DEG);
  txt('✈', 0, 0, 14 * u, '#fff');
  ctx.restore();

  // Hinweis
  const [h, warn] = hint();

  const tw = Math.min(W() - 2 * m, ctx.measureText(h).width + 24);

  ctx.fillStyle = warn ? 'rgba(200,30,30,0.85)' : 'rgba(10,20,40,0.6)';
  ctx.beginPath(); ctx.roundRect(W() / 2 - tw / 2, hy, tw, hs * 2, 10); ctx.fill();
  txt(h, W() / 2, hy + hs, hs, '#fff');

  // Knöpfe
  const bs = buttons();
  drawButton(bs.thrUp, '+', 'Schub', held('thrUp'));
  drawButton(bs.thrDn, '−', 'Schub', held('thrDn'));
  drawButton(bs.up, '▲', 'Nase hoch', held('up'));
  drawButton(bs.dn, '▼', 'Nase runter', held('dn'));
  drawButton(bs.gear, p.gearDown ? '⚙️ raus' : '⚙️ drin', 'Fahrwerk', false, p.gearDown ? '#7dff9a' : '#ffd34d');
  drawButton(bs.brake, '🛑', 'Bremse', held('brake'));
  drawButton(bs.view, '👁️', view === 'cockpit' ? 'Außen' : 'Cockpit', false);
  drawButton(bs.left, '◀', 'links', held('left'));
  drawButton(bs.right, '▶', 'rechts', held('right'));
  // Radar links über den Knöpfen
  const leftTop = Math.min(...[bs.thrUp, bs.gear].filter(r => r.x < W() * 0.3).map(r => r.y)) - 10;
  const radarTop = view === 'cockpit' ? my + mh + 8 : hy + hs * 2 + 8;
  const rs = Math.min(130 * u, leftTop - radarTop);
  if (rs >= 60 && view !== 'cockpit') drawRadar(m, leftTop - rs, rs);
  // Schubanzeige
  const bx = bs.thrUp.x + bs.thrUp.w + 8, by = bs.thrUp.y, bh = bs.thrDn.y + bs.thrDn.h - by, bw = 12 * u;
  panel(bx, by, bw, bh);
  const fh = (bh - 6) * p.throttle;

  g.addColorStop(0, '#5fe07a'); g.addColorStop(1, '#ff8a1f');
  ctx.fillStyle = g;
  ctx.fillRect(bx + 3, by + bh - 3 - fh, bw - 6, fh);
  txt(`${Math.round(p.throttle * 100)}%`, bx + bw + 4, by + bh - 3 - fh, 11 * u, '#fff', 'left', 'rgba(0,0,0,0.6)');
}

function drawRadar(x, y, R, RH = R) {
  // Karte von oben: oben ist Richtung Ziel, das Flugzeug in der Mitte
  panel(x, y, R, RH);
  ctx.save();
  ctx.beginPath(); ctx.roundRect(x, y, R, RH, 10); ctx.clip();
  const cxr = x + R / 2, cyr = y + RH * 0.6;
  const range = clamp(Math.abs(DEST - p.x) * 1.1, 600, 9000);
  const k = R * 0.5 / range;
  // zur Seite viermal so groß, damit man auch kleine Abweichungen sieht
  const mp = (wx, wz) => [cxr + (wz - p.z) * k * 4, cyr - (wx - p.x) * k];
  ctx.strokeStyle = 'rgba(60,255,120,0.75)'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(...mp(DEST - GLIDE_LEN, 0)); ctx.lineTo(...mp(DEST, 0)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = '#e8e8e8'; ctx.lineCap = 'butt';
  for (const r of [RWY_A, RWY_B]) {
    ctx.lineWidth = Math.max(3, 60 * k);
    ctx.beginPath(); ctx.moveTo(...mp(r.x0, 0)); ctx.lineTo(...mp(r.x1, 0)); ctx.stroke();
  }
  ctx.translate(cxr, cyr); ctx.rotate(Math.atan(Math.tan(p.hdg) * 4));
  ctx.fillStyle = '#ffd34d';
  ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(7, 7); ctx.lineTo(0, 3); ctx.lineTo(-7, 7); ctx.closePath(); ctx.fill();
  ctx.restore();
  txt('Radar', x + R / 2, y + 9, 10, 'rgba(255,255,255,0.7)');
}

// ── Blick aus dem Cockpit ──────────────────────────────────────────
let view = 'outside';
function toggleView() {
  view = view === 'outside' ? 'cockpit' : 'outside';
  tone(660, 0, 0.1, 0.08);
}

const lerpRGB = (A, B, t) => A.map((v, i) => v + (B[i] - v) * t);
const rgb = A => `rgb(${A.map(Math.round).join(',')})`;
const COL = {
  land: [hex2rgb('#5da84a'), hex2rgb('#54a043')],
  sea: [hex2rgb('#2f8fd0'), hex2rgb('#2a86c4')],
  sand: [hex2rgb('#e8d49a'), hex2rgb('#e2cc8f')],
};
function groundColor(x, odd) {
  if (x > SEA_FROM && x < SEA_TO) return COL.sea[odd];
  if (x > SEA_FROM - 250 && x < SEA_TO + 250) return COL.sand[odd];
  return x > DEST_FROM ? hex2rgb(R.ground[odd]) : COL.land[odd];
}

function drawCockpit() {
  const w = W(), h = H();
  const f = Math.max(w, h) * 0.7;
  const pc = Math.cos(p.pitch * DEG), ps = Math.sin(p.pitch * DEG);
  const ch = Math.cos(p.hdg), sh = Math.sin(p.hdg);
  const eyeX = p.x + 36 * pc * ch, eyeZ = p.z + 36 * pc * sh;
  const eye = p.y + 7 + 36 * ps;
  const vib = p.onGround ? (Math.random() - 0.5) * p.v * 0.03 : 0;
  const cx = w / 2 + shX, cy = h * 0.36 + shY + vib;
  const hy = cy + f * Math.tan(p.pitch * DEG);
  const near = 8, DMAX = 25000;
  // Weltpunkt -> Blickrichtung: d nach vorne, l zur Seite
  const cam = (x, z) => { const dx = x - eyeX, dz = z - eyeZ; return [dx * ch + dz * sh, -dx * sh + dz * ch]; };
  const scr = (d, l, a) => [cx + f * l / d, hy + f * (eye - a) / d];
  // Vielecke werden vorne abgeschnitten, damit nichts hinter dir gezeichnet wird
  const polyW = (pts, color) => {
    const cp = pts.map(([x, z, a]) => [...cam(x, z), a]);
    const out = [];
    for (let i = 0; i < cp.length; i++) {
      const A = cp[i], B = cp[(i + 1) % cp.length];
      if (A[0] >= near) out.push(A);
      if ((A[0] >= near) !== (B[0] >= near)) {
        const t = (near - A[0]) / (B[0] - A[0]);
        out.push([near, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t]);
      }
    }
    if (out.length < 3) return;
    ctx.fillStyle = color;
    ctx.beginPath();
    out.forEach((q, i) => { const [X, Y] = scr(q[0], q[1], q[2]); i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); });
    ctx.closePath(); ctx.fill();
  };
  const quad = (x0, x1, z0, z1, a, color) => polyW([[x0, z0, a], [x1, z0, a], [x1, z1, a], [x0, z1, a]], color);
  const hazeAt = d => Math.pow(clamp(d / 18000, 0, 1), 0.6);
  const tanView = Math.hypot(w, h) / 2 / f;
  const visible = (d, l, pad) => d > near && Math.abs(l) < d * tanView + pad;

  // in der Kurve kippt die ganze Welt
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(-p.roll * DEG); ctx.translate(-cx, -cy);
  const big = Math.max(w, h) * 2;

  // Himmel und Sonne
  const t = clamp(p.y / 1100, 0, 1);
  const [topA, lowA] = skyColors(t);
  const g = ctx.createLinearGradient(0, hy - h, 0, hy);
  g.addColorStop(0, rgb(topA));
  g.addColorStop(1, rgb(lowA));
  ctx.fillStyle = g;
  ctx.fillRect(cx - big, cy - big, 2 * big, 2 * big);
  const sunA = 20 * DEG - p.hdg;
  const sxp = cx + f * Math.tan(sunA), syp = hy - f * 0.5;
  if (Math.abs(sunA) < 70 * DEG) {
    const sg = ctx.createRadialGradient(sxp, syp, 0, sxp, syp, 110);
    sg.addColorStop(0, 'rgba(255,250,220,0.95)');
    sg.addColorStop(0.25, 'rgba(255,240,180,0.6)');
    sg.addColorStop(1, 'rgba(255,240,180,0)');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(sxp, syp, 110, 0, Math.PI * 2); ctx.fill();
  }

  // Boden in Streifen; weit weg wird alles dunstig
  ctx.fillStyle = rgb(lowA);
  ctx.fillRect(cx - big, hy, 2 * big, big);
  for (let x = Math.floor((eyeX - 3000) / 100) * 100; x < eyeX + DMAX;) {
    const dist = Math.abs(x - eyeX);
    const step = dist < 1500 ? 100 : dist < 6000 ? 400 : 2000;
    const nx = (Math.floor(x / step) + 1) * step;
    const odd = Math.floor(x / step) & 1;
    quad(x, nx, eyeZ - 60000, eyeZ + 60000, 0, rgb(lerpRGB(groundColor((x + nx) / 2, odd), lowA, hazeAt(Math.max(0, x - eyeX)))));
    x = nx;
  }

  // Berge am Horizont: flache Hügel bei Frankfurt, am Ziel je nach Land
  const ranges = [[12000, -9000, -800, 60, '#7f9fb0']];
  if (R.mountains) ranges.push([DEST + R.mountains[0], ...R.mountains.slice(1)]);
  let fieldMax = 7000;
  for (const [mx, z0, z1, mh, col] of ranges) {
    const dm = mx - eyeX;
    if (dm < 600 || dm > 60000) continue;
    fieldMax = Math.min(fieldMax, dm);
    const pts = [];
    for (let z = z0; z <= z1; z += (z1 - z0) / 60) {
      const env = Math.sin(Math.PI * (z - z0) / (z1 - z0));
      pts.push([mx, z, mh * env * (0.55 + 0.3 * Math.sin(z / 900) + 0.15 * Math.sin(z / 330 + 1))]);
    }
    pts.push([mx, z1, 0], [mx, z0, 0]);
    polyW(pts, rgb(lerpRGB(hex2rgb(col), lowA, Math.pow(clamp(dm / 40000, 0, 1), 0.5) * 0.55)));
  }

  // Felder wie ein Flickenteppich
  const FW = 250;
  for (let row = Math.floor((eyeX - 1500) / FW); row * FW < eyeX + fieldMax; row++) {
    const x0 = row * FW, x1 = x0 + FW, xm = x0 + FW / 2;
    if (landFactor(x0) < 1 || landFactor(x1) < 1) continue;
    const pal = xm > DEST_FROM ? R.fields : FIELDS;
    const off = rand(row + 0.42) * FW;
    const airport = (xm > -800 && xm < RWY_A.x1 + 600) || (xm > RWY_B.x0 - 600 && xm < RWY_B.x1 + 600);
    for (let c = Math.floor((eyeZ - 6000 - off) / FW); c * FW + off < eyeZ + 6000; c++) {
      const za = c * FW + off, zb = za + FW;
      const [d, l] = cam(xm, za + FW / 2);
      if (d > fieldMax + 400 || !visible(Math.max(d + FW, near + 1), l, FW * 1.5)) continue;
      const base = airport && Math.abs(za + FW / 2) < 600 ? '#6aae55' : pal[Math.floor(rand(row * 7.3 + c * 1.7) * pal.length)];
      quad(x0, x1, za, zb, 0, rgb(lerpRGB(hex2rgb(base), lowA, hazeAt(Math.max(0, d)))));
    }
  }
  // Landstraßen
  for (const z of [-900, 1400]) {
    for (let x = Math.floor((eyeX - 1500) / FW) * FW; x < eyeX + fieldMax; x += FW) {
      if (landFactor(x) < 1 || landFactor(x + FW) < 1) continue;
      if (x > RWY_B.x0 - 1500 && x < RWY_B.x1 + 800 && z > 0) continue;
      quad(x, x + FW, z - 4, z + 4, 0, rgb(lerpRGB([140, 140, 135], lowA, hazeAt(Math.max(0, x - eyeX)))));
    }
  }
  // Glitzern der Sonne auf dem Meer
  for (let i = 0; i < 90; i++) {
    const yy = hy + 2 + Math.pow(rand(i * 1.3), 2) * h;
    const dd = f * eye / Math.max(1, yy - hy);
    const xw = eyeX + dd * ch;
    if (!(xw > SEA_FROM && xw < SEA_TO)) continue;
    if (rand(i * 2.1 + Math.floor(time * 7) * 0.13) < 0.45) continue;
    const spread = 20 + (yy - hy) * 0.5;
    const xx = sxp + (rand(i * 4.7 + Math.floor(time * 3)) - 0.5) * spread * 2;
    ctx.fillStyle = 'rgba(255,255,235,0.9)';
    ctx.fillRect(xx, yy, 2 + (yy - hy) * 0.02, 1 + (yy - hy) * 0.008);
  }

  // Landebahnen
  const light = (x, z, a, r, color) => {
    const [d, l] = cam(x, z);
    if (!visible(d, l, 20) || d > 9000) return;
    const [X, Y] = scr(d, l, a);
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(X, Y, Math.max(1, f * r / d), 0, Math.PI * 2); ctx.fill();
  };
  for (const r of [RWY_A, RWY_B]) {
    if (r.x1 < eyeX - 3000 || r.x0 > eyeX + DMAX) continue;
    quad(r.x0, r.x1, -30, 30, 0, '#3b3f45');
    for (const e of [r.x0 + 10, r.x1 - 50]) {
      for (const z of [-26, -20, -14, -8, 5, 11, 17, 23]) quad(e, e + 40, z, z + 3, 0, '#ffffff');
    }
    for (let x = r.x0 + 120; x < r.x1 - 120; x += 70) {
      if (x + 35 < eyeX - 200 || x > eyeX + 6000) continue;
      quad(x, x + 35, -0.7, 0.7, 0, '#ffffff');
    }
    for (let x = r.x0; x <= r.x1; x += 60) {
      const color = x === r.x0 ? '#3f3' : x + 60 > r.x1 ? '#f33' : '#fff7d0';
      light(x, -31, 0.5, 0.5, color);
      light(x, 31, 0.5, 0.5, color);
    }
  }
  // Anflugbefeuerung mit Lauflicht
  const run = Math.floor((time * 2) % 1 * 15);
  for (let i = 0; i < 15; i++) {
    for (const z of i % 5 === 0 ? [-12, -6, 0, 6, 12] : [0]) {
      light(DEST - 60 - (14 - i) * 60, z, 4, i === run ? 1.4 : 0.8, i === run ? '#ffffff' : '#ffe98a');
    }
  }

  // Alles, was in die Höhe ragt, von hinten nach vorne zeichnen
  const things = [];
  const box = (x0, x1, z0, z1, a0, a1, front, side, top) => {
    const [d] = cam((x0 + x1) / 2, (z0 + z1) / 2);
    if (d < -200 || d > DMAX) return;
    things.push({ d, draw() {
      if (eyeZ < z0) polyW([[x0, z0, a0], [x1, z0, a0], [x1, z0, a1], [x0, z0, a1]], side);
      if (eyeZ > z1) polyW([[x0, z1, a0], [x1, z1, a0], [x1, z1, a1], [x0, z1, a1]], side);
      if (eyeX < x0) polyW([[x0, z0, a0], [x0, z1, a0], [x0, z1, a1], [x0, z0, a1]], front);
      if (eyeX > x1) polyW([[x1, z0, a0], [x1, z1, a0], [x1, z1, a1], [x1, z0, a1]], front);
      if (eye > a1) polyW([[x0, z0, a1], [x1, z0, a1], [x1, z1, a1], [x0, z1, a1]], top);
    } });
  };
  const tower = (x, z) => {
    box(x, x + 6, z, z + 6, 0, 55, '#e3e7ec', '#cdd3da', '#f0f2f5');
    box(x - 6, x + 12, z - 6, z + 12, 55, 66, '#7fd4c9', '#6cc2b7', '#d8dde3');
  };
  if (eyeX < RWY_A.x1 + 3000) {
    box(300, 680, -260, -180, 0, 20, '#9aa3ad', '#8a939d', '#b5bcc4');
    box(1500, 1660, -250, -190, 0, 26, '#c7ccd3', '#b7bcc3', '#dadde2');
    tower(1100, -130);
  }
  if (eyeX > DEST - 20000) {
    box(DEST + 600, DEST + 980, -260, -180, 0, 18, R.terminal, R.terminal, '#f3eadb');
    tower(DEST + 1300, -130);
  }
  // Dörfer mit roten Dächern
  for (let k = Math.floor((eyeX - 2500) / 2500); k <= (eyeX + 5000) / 2500; k++) {
    const vx = k * 2500 + 800;
    if (rand(k + 0.33) > 0.65 || landFactor(vx - 200) < 1 || landFactor(vx + 600) < 1) continue;
    if ((vx > -1500 && vx < RWY_A.x1 + 1500) || (vx > RWY_B.x0 - 2500 && vx < RWY_B.x1 + 1500)) continue;
    const zc = (rand(k + 0.77) < 0.5 ? -1 : 1) * (400 + rand(k + 0.9) * 1200);
    const hc = vx > DEST_FROM ? R.houses : ['#eadfcb', '#d8ccb6', '#c0503a', '#a8443a'];
    for (let i = 0; i < 9; i++) {
      const hx = vx + rand(k * 9 + i) * 320, hz = zc + rand(k * 9 + i + 0.5) * 260;
      box(hx, hx + 12, hz, hz + 10, 0, 6 + rand(k + i) * 3, hc[0], hc[1], i % 3 ? hc[2] : hc[3]);
    }
  }
  // Bäume und Palmen
  for (let c = Math.floor((eyeX - 1000) / 50); c <= (eyeX + 4000) / 50; c++) {
    for (let k = 0; k < 3; k++) {
      const n = c * 3 + k;
      const x = c * 50 + rand(n + 0.1) * 50;
      const z = (rand(n + 0.6) - 0.5) * 5000;
      if (landFactor(x) < 1 || Math.abs(z) < 60) continue;
      if (Math.abs(z) < 320 && ((x > -1000 && x < RWY_A.x1 + 300) || (x > RWY_B.x0 - 1200 && x < RWY_B.x1 + 300))) continue;
      const kind = treeKind(x, n);
      if (!kind) continue;
      const [d, l] = cam(x, z);
      if (!visible(d, l, 30)) continue;
      const ht = 12 + rand(n + 0.3) * 10;
      things.push({ d, draw() {
        const [X, Y] = scr(d, l, 0), s = f / d;
        if (ht * s < 1.5) return;
        const save = S; S = s;
        drawTree(X, Y, ht * s, kind === 'palm');
        S = save;
      } });
    }
  }
  // Wolken
  const cell = 110;
  for (let c = Math.floor((eyeX - 3000) / cell); c <= (eyeX + DMAX * 0.6) / cell; c++) {
    for (let k = 0; k < 2; k++) {
      const n = c + k * 0.5;
      if (rand(n) > 0.5) continue;
      const x = c * cell + rand(n + 0.2) * 60;
      const alt = 70 + rand(n + 0.3) * 1250, z = (rand(n + 0.55) - 0.5) * 8000;
      const CR = (14 + rand(n + 0.7) * 26) * 3;
      const [d, l] = cam(x, z);
      if (d < 20 || !visible(d, l, CR * 3)) continue;
      things.push({ d, draw() {
        const [X, Y] = scr(d, l, alt), r = f * CR / d;
        if (Y < -r * 2 - h || Y > 2 * h + r * 2) return;
        cloud(X, Y, r, clamp((d - 20) / 250, 0, 1) * 0.9);
      } });
    }
  }
  // berühmte Bauwerke am Ziel
  for (const [kind, lx, lz] of R.landmarks) {
    const [d, l] = cam(DEST + lx, lz);
    if (!visible(d, l, 2000) || d > 60000) continue;
    things.push({ d, draw() {
      const [X, Y] = scr(d, l, 0);
      ctx.globalAlpha = 1 - 0.7 * hazeAt(d);
      drawLandmark(kind, X, Y, f / d * 2);   // doppelt so groß, damit man sie gut erkennt
      ctx.globalAlpha = 1;
    } });
  }
  // grüne Ringe der Landehilfe
  for (let x = DEST - GLIDE_LEN; x <= DEST; x += 120) {
    const [d, l] = cam(x, 0);
    if (!visible(d, l, 50) || d > 5000) continue;
    things.push({ d, draw() {
      const [X, Y] = scr(d, l, glideAlt(x) + 7), r = Math.max(2, f * 4 / d);
      // nahe Ringe werden durchsichtig, damit man die Landebahn dahinter sieht
      ctx.strokeStyle = `rgba(60,255,120,${0.85 * clamp((d - 100) / 300, 0, 1)})`; ctx.lineWidth = Math.max(1.5, r * 0.15);
      ctx.beginPath(); ctx.arc(X, Y, r, 0, Math.PI * 2); ctx.stroke();
    } });
  }
  things.sort((a, b) => b.d - a.d);
  for (const o of things) o.draw();

  // Blendenflecken, wenn die Sonne zu sehen ist
  if (Math.abs(sunA) < 40 * DEG && syp > 0 && syp < h * 0.6) {
    const vx = cx - sxp, vy = cy - syp;
    for (const [k, r, a, c] of [[0.5, 18, 0.12, '255,220,150'], [0.9, 8, 0.18, '180,220,255'], [1.3, 26, 0.08, '255,180,120'], [1.7, 12, 0.12, '160,255,200']]) {
      ctx.fillStyle = `rgba(${c},${a})`;
      ctx.beginPath(); ctx.arc(sxp + vx * k, syp + vy * k, r, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();

  drawCockpitFrame();
}

function drawCockpitFrame() {
  const w = W(), h = H(), mid = w / 2;
  const top = h * 0.05, bot = h * 0.62;
  const fg = ctx.createLinearGradient(0, 0, 0, h);
  fg.addColorStop(0, '#3a414d'); fg.addColorStop(1, '#22262e');
  ctx.fillStyle = fg;
  ctx.beginPath();
  ctx.rect(0, 0, w, h);
  // eine große Scheibe ohne Mittelbalken, damit die Landebahn nie verdeckt ist
  ctx.moveTo(w * 0.02, top + h * 0.1); ctx.lineTo(w * 0.1, top); ctx.lineTo(w * 0.9, top); ctx.lineTo(w * 0.98, top + h * 0.1);
  ctx.lineTo(w * 0.95, bot); ctx.lineTo(w * 0.05, bot); ctx.closePath();
  ctx.fill('evenodd');
  ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 2;
  ctx.stroke();
  // Spiegelung in der Scheibe
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(w * 0.02, top + h * 0.1); ctx.lineTo(w * 0.1, top); ctx.lineTo(w * 0.9, top); ctx.lineTo(w * 0.98, top + h * 0.1);
  ctx.lineTo(w * 0.95, bot); ctx.lineTo(w * 0.05, bot); ctx.closePath();
  ctx.clip();
  const rg = ctx.createLinearGradient(w * 0.15, top, w * 0.45, bot);
  rg.addColorStop(0, 'rgba(255,255,255,0)'); rg.addColorStop(0.45, 'rgba(255,255,255,0.07)');
  rg.addColorStop(0.55, 'rgba(255,255,255,0.07)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, w, h);
  ctx.restore();
  // Schrauben im Rahmen
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  for (let i = 0; i <= 12; i++) {
    const x = w * 0.1 + (w * 0.8) * i / 12;
    ctx.beginPath(); ctx.arc(x, top - 5, 1.5, 0, Math.PI * 2); ctx.fill();
  }
  // Blendschutz über dem Armaturenbrett
  ctx.fillStyle = '#1a1d23';
  ctx.beginPath();
  ctx.moveTo(0, bot + 6); ctx.quadraticCurveTo(mid, bot - 14, w, bot + 6); ctx.lineTo(w, h); ctx.lineTo(0, h);
  ctx.closePath(); ctx.fill();

  // Bildschirme zwischen den Knöpfen
  const bs = buttons();
  const sy0 = bot + 12, sh = h - sy0 - 12;
  const l0 = bs.thrUp.x + bs.thrUp.w + 64, l1 = bs.gear.x - 12;
  const r0 = bs.brake.x + bs.brake.w + 12, r1 = bs.left.x - 12;
  if (l1 - l0 > 90 && sh > 50) {
    drawPFD(l0, sy0, l1 - l0, sh);
    if (r1 - r0 > 70) drawRadar(r0, sy0, Math.min(r1 - r0, sh), Math.min(r1 - r0, sh));
  } else {
    // Hochformat: Bildschirme über den Knöpfen
    const y1 = Math.min(bs.gear.y, bs.view.y) - 14, hh = y1 - sy0, half = (w - 28 - 12) / 2;
    if (hh > 60) {
      drawPFD(14, sy0, half, hh);
      drawRadar(14 + half + 12, sy0, half, hh);
    }
  }
}

function screen(x, y, w, h) {
  ctx.fillStyle = '#0b0e13';
  ctx.beginPath(); ctx.roundRect(x - 4, y - 4, w + 8, h + 8, 8); ctx.fill();
  ctx.fillStyle = '#05070a';
  ctx.fillRect(x, y, w, h);
}

function drawPFD(x, y, w, h) {
  // künstlicher Horizont: blauer Himmel, brauner Boden, bewegt sich mit der Nase
  screen(x, y, w, h);
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  const k = h / 40, mx = x + w / 2, off = p.pitch * k;
  ctx.fillStyle = '#2f7fd6'; ctx.fillRect(x, y, w, h);
  ctx.save();
  ctx.translate(mx, y + h / 2); ctx.rotate(-p.roll * DEG);
  ctx.fillStyle = '#8a5a2b'; ctx.fillRect(-w * 2, off, w * 4, h * 2);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-w * 2, off); ctx.lineTo(w * 2, off); ctx.stroke();
  for (let a = -20; a <= 20; a += 5) {
    if (!a) continue;
    const yy = off - a * k, len = a % 10 ? w * 0.08 : w * 0.16;
    ctx.beginPath(); ctx.moveTo(-len, yy); ctx.lineTo(len, yy); ctx.stroke();
  }
  ctx.restore();
  ctx.strokeStyle = '#ffd34d'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(mx - w * 0.22, y + h / 2); ctx.lineTo(mx - w * 0.07, y + h / 2); ctx.lineTo(mx, y + h / 2 + 6); ctx.lineTo(mx + w * 0.07, y + h / 2); ctx.lineTo(mx + w * 0.22, y + h / 2);
  ctx.stroke();
  ctx.restore();
  const fs = clamp(h * 0.16, 10, 16);
  for (const [tx, val, al] of [[x + 4, `${Math.round(p.v * 3.6)}`, 'left'], [x + w - 4, `${Math.round(p.y * ALT_SCALE / 10) * 10}`, 'right']]) {
    ctx.font = `bold ${fs}px system-ui, -apple-system, sans-serif`;
    const tw = ctx.measureText(val).width + 8;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(al === 'left' ? tx - 2 : tx - tw + 2, y + h / 2 - fs * 0.75, tw, fs * 1.5);
    txt(val, al === 'left' ? tx + 2 : tx - 2, y + h / 2, fs, '#7dff9a', al);
  }
  txt('km/h', x + 4, y + h / 2 + fs * 1.4, fs * 0.65, '#7dff9a', 'left');
  txt('m', x + w - 4, y + h / 2 + fs * 1.4, fs * 0.65, '#7dff9a', 'right');
}

// ── Spielschleife ──────────────────────────────────────────────────
let last = 0;
function loop(ts) {
  if (resizeFrames < 60) { resize(); resizeFrames++; }
  const dt = Math.min(0.05, last ? (ts - last) / 1000 : 0.016);
  last = ts;
  time += dt;

  if (state === 'menu') {
    startMusic();
    drawMenu(dt);
  } else {
    if (state === 'flying') { update(dt); updateEngine(); }
    welcomeT -= dt;
    resultT -= dt;
    if (p.crash === 'sea') p.sinkAnim = Math.min(10, p.sinkAnim + dt * 3);
    updateParticles(dt);

    const base = Math.min(W() / 260, H() / 170);
    S = base * (1 - 0.3 * clamp(p.y / 700, 0, 1));
    const target = Math.max(p.y + 10, H() * 0.27 / S);
    if (!cam.init) { cam.a = target; cam.init = true; }
    cam.a += (target - cam.a) * Math.min(1, dt * 4);
    shake = Math.max(0, shake - dt * 20);
    shX = (Math.random() - 0.5) * shake; shY = (Math.random() - 0.5) * shake;
    if (state === 'flying') farX += p.v * dt * 0.25;

    const gy = sy(0);
    if (view === 'cockpit' && state === 'flying') {
      drawCockpit();
    } else {
      drawSky();
      drawFarClouds(farX, -cam.a * S * 0.05);
      drawHills(gy);
      if (p.x < 9000) drawSkyline(gy);
      drawLandmarksSide(gy);
      drawGround(gy);
      drawAirports();
      drawTrees(gy);
      drawRunway(RWY_A);
      drawRunway(RWY_B);
      drawApproachLights();
      worldClouds(false);
      drawGlidePath();
      drawContrails();
      drawShadow();
      drawPlane();
      drawParticles();
      worldClouds(true);
    }
    if (state === 'flying') drawHUD();
    drawResult();
  }

  homeBtn.hidden = state !== 'menu';
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
