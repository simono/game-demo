function resize() {

// ── Töne ────────────────────────────────────────────────────────────
let ac = null;
function tone(freq, dur, type = 'square', vol = 0.08, slide = 0) {
  try {
    ac = ac || new AudioContext();
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const SFX = {
  jump:  () => tone(380, 0.18, 'square', 0.06, 400),
  coin:  () => { tone(990, 0.08, 'square', 0.06); setTimeout(() => tone(1320, 0.18, 'square', 0.06), 70); },
  stomp: () => tone(200, 0.15, 'triangle', 0.12, -120),
  hurt:  () => tone(300, 0.4, 'sawtooth', 0.08, -220),
  power: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.12, 'square', 0.06), i * 80)),
  bump:  () => tone(150, 0.08, 'square', 0.08),
  win:   () => [523, 659, 784, 1046, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.18, 'square', 0.07), i * 130)),
  ring:  () => [0, 90, 180].forEach(d => setTimeout(() => { tone(1568, 0.25, 'sine', 0.07); tone(2093, 0.2, 'sine', 0.04); }, d)),
};

// ── Level ───────────────────────────────────────────────────────────
// Zeichen: # Boden  = Ziegel  ? Fragezeichen (Münze)  * Fragezeichen (Kraft-Pilz)  ! benutzt
//          X Stein  c Wolke  o Münze  S Stacheln  C Kontrollpunkt  F Ziel
const ROWS = 14;
const SOLID = new Set(['#', '=', '?', '*', '!', 'X', 'c']);
function makeLevel(len, build) {
  const g = Array.from({ length: ROWS }, () => Array(len).fill(' '));
  const ents = [], movers = [];
  const L = {
    set: (x, y, ch) => { if (x >= 0 && x < len && y >= 0 && y < ROWS) g[y][x] = ch; },
    ground: (x0, x1, top = 12, ch = '#') => { for (let x = x0; x <= x1; x++) for (let y = top; y < ROWS; y++) L.set(x, y, ch); },
    row: (x0, x1, y, ch) => { for (let x = x0; x <= x1; x++) L.set(x, y, ch); },
    stairs: (x0, n, up = true, base = 11) => { for (let i = 0; i < n; i++) for (let k = 0; k <= i; k++) L.set(up ? x0 + i : x0 + n - 1 - i, base - k, 'X'); },
    enemy: (x, y = 11) => ents.push({ kind: 'slime', x: x + 0.5, y: y + 1 }),
    bat: (x, y) => ents.push({ kind: 'bat', x: x + 0.5, y: y + 0.5, baseY: y + 0.5 }),
    mover: (x, y, w, range, axis = 'x') => movers.push({ x, y, w, range, axis, x0: x, y0: y, t: 0, dx: 0, dy: 0 }),
  };
  build(L);
  return { g, ents, movers, len };
}
const LEVELS = [

    L.ground(28, 50); L.row(32, 36, 8, '='); L.row(32, 36, 7, 'o'); L.set(34, 8, '?');

    L.row(25, 27, 9, 'o');
    L.ground(54, 80); L.stairs(58, 4); L.stairs(62, 4, false); L.row(58, 65, 6, 'o');

    L.row(83, 84, 9, 'X'); L.row(87, 88, 8, 'X'); L.row(83, 88, 6, 'o');
    L.ground(91, 131); L.row(95, 98, 8, '='); L.set(96, 8, '?'); L.set(97, 8, '*');
    L.enemy(100); L.enemy(104); L.row(102, 106, 9, 'o');
    L.stairs(110, 7); L.set(121, 11, 'F');

  { name: 'Dunkle Höhle', icon: '🦇', sky: ['#1b1530', '#2c2140'], ground: '#4a4156', grass: '#7d6aa0', dark: true, make: () => makeLevel(140, L => {

    L.ground(76, 82, 13); L.row(76, 82, 12, 'S'); L.row(78, 79, 8, 'X'); L.row(78, 79, 7, 'o');
    L.ground(83, 104); L.bat(88, 8); L.bat(95, 6); L.enemy(91); L.enemy(98); L.row(92, 96, 9, 'o');
    L.set(100, 8, '?'); L.set(101, 8, '?');
    L.ground(105, 108, 13); L.row(105, 108, 12, 'S');
    L.ground(109, 139); L.enemy(115); L.enemy(119); L.bat(117, 7); L.stairs(123, 5); L.set(132, 11, 'F');
  }) },
  { name: 'Wolkenland', icon: '☁️', sky: ['#f7a6c8', '#ffe3b3'], ground: '#ffffff', grass: '#ffffff', clouds: true, make: () => makeLevel(150, L => {
    L.set(2, 11, 'P');
    L.ground(0, 12, 12, 'c'); L.row(5, 9, 9, 'o');
    L.row(15, 18, 11, 'c'); L.row(15, 18, 10, 'o');
    L.row(21, 24, 9, 'c'); L.set(22, 6, '*'); L.row(21, 24, 8, 'o');
    L.mover(27, 10, 3, 5); L.row(36, 44, 11, 'c'); L.enemy(40, 10);
    L.row(47, 49, 9, 'c'); L.row(52, 54, 7, 'c'); L.row(52, 54, 6, 'o');
    L.mover(57, 8, 3, 4, 'y'); L.row(61, 70, 10, 'c'); L.set(66, 9, 'C'); L.row(62, 65, 9, 'o');
    L.mover(73, 10, 3, 6); L.row(83, 86, 9, 'c'); L.row(89, 92, 11, 'c'); L.enemy(91, 10);
    L.row(95, 97, 9, 'c'); L.set(96, 6, '?'); L.mover(100, 9, 3, 5);
    L.row(109, 118, 10, 'c'); L.enemy(112, 9); L.enemy(116, 9); L.row(110, 117, 7, 'o');
    L.mover(121, 8, 2, 4, 'y'); L.row(125, 149, 12, 'c'); L.stairs(130, 5); L.set(141, 11, 'F');
  }) },
  // Endgegner: die Fahne erscheint erst, wenn Lucas besiegt ist
  { name: 'Lucas’ Klingel-Turm', icon: '🔔', sky: ['#2b1e3f', '#7a3f62'], ground: '#5b4636', grass: '#c9a227', boss: true, make: () => makeLevel(40, L => {
    L.set(4, 11, 'P');
    L.ground(0, 39);
    for (let y = 2; y < 12; y++) { L.set(0, y, 'X'); L.set(39, y, 'X'); }
    L.row(8, 11, 8, 'X'); L.row(28, 31, 8, 'X'); L.row(8, 11, 7, 'o'); L.row(28, 31, 7, 'o');
  }) },
];

// ── Zustand ─────────────────────────────────────────────────────────
const PROG_KEY = 'familyjump-progress';
let progress = { unlocked: 1, best: {} };
try { progress = { ...progress, ...JSON.parse(localStorage.getItem(PROG_KEY)) }; } catch (e) {}
const saveProgress = () => { try { localStorage.setItem(PROG_KEY, JSON.stringify(progress)); } catch (e) {} };

// ── Familie: jede Figur sieht anders aus und kann etwas Besonderes ──
const CHARS = [
  { id:'jonas',  name:'Jonas',  power:'⚡ läuft schneller',  shirt:'#e74c3c', pants:'#2b4c9a', skin:'#f1c8a5', hair:'#8a6a45', style:'cap', cap:'#e74c3c', scale:1, run:9.5 },
  { id:'henrik', name:'Henrik', power:'🦘 springt höher',    shirt:'#3498db', pants:'#34495e', skin:'#f1c8a5', hair:'#d8b060', style:'short', scale:0.92, jump:18.8 },
  { id:'anna',   name:'Anna',   power:'✨ Doppelsprung',     shirt:'#9b59b6', pants:'#2c3e50', skin:'#f1c8a5', hair:'#b8692e', style:'ponytail', scale:0.95, doubleJump:true },
  { id:'mama',   name:'Mama',   power:'🍄 startet groß',     shirt:'#1abc9c', pants:'#34495e', skin:'#f1c8a5', hair:'#5a3a20', style:'long', scale:1.08, startBig:true },
  { id:'papa',   name:'Papa',   power:'🪂 schwebt langsam',  shirt:'#27ae60', pants:'#2b2b2b', skin:'#f1c8a5', hair:'#3a2a1a', style:'short', beard:true, scale:1.1, glide:true },
];
const char = () => CHARS.find(c => c.id === progress.char) || CHARS[0];
function selectChar(id) { progress.char = id; saveProgress(); }

let state = 'title', levelIdx = 0, lvl = null, lives = 3, coins = 0, levelCoins = 0, wonAt = 0, deadAt = 0, time = 0;
const G = 38, JUMP = 16, RUN = 7, COYOTE = 0.1, BUFFER = 0.12;
const player = { x: 0, y: 0, vx: 0, vy: 0, w: 0.8, h: 1.4, big: false, onGround: false, face: 1, inv: 0, coyote: 0, buffer: 0, walk: 0, plat: null };
let checkpoint = null, items = [], pops = [], waves = [];

const tileAt = (x, y) => (y < 0 || y >= ROWS || x < 0 || x >= lvl.len) ? (y >= ROWS ? ' ' : '#') : lvl.g[y][x];
const solidAt = (x, y) => SOLID.has(tileAt(Math.floor(x), Math.floor(y)));

function startLevel(i) {
  levelIdx = i;
  const def = LEVELS[i];
  lvl = def.make(); lvl.def = def;
  levelCoins = 0; time = 0; items = []; pops = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < lvl.len; x++) if (lvl.g[y][x] === 'P') { lvl.start = { x: x + 0.5, y: y + 1 }; lvl.g[y][x] = ' '; }
  lvl.ents.forEach(e => Object.assign(e, { vx: e.kind === 'slime' ? -1.6 : 0, vy: 0, dead: 0, t: Math.random() * 6 }));
  waves = [];
  lvl.boss = def.boss ? { x: 30, y: 12, vx: -1, vy: 0, hp: 3, inv: 0, ringT: 2, ringing: 0, dead: 0, w: 1.4, h: 2.4, t: 0, onGround: true } : null;
  checkpoint = null; player.big = !!char().startBig;
  respawn();
  state = 'play';
}
function respawn() {
  const s = checkpoint || lvl.start;
  setSize(player.big || !!char().startBig);
  player.x = s.x; player.y = s.y - player.h; player.vx = player.vy = 0; player.inv = 1; player.plat = null;
}
function setSize(big) {
  const feet = player.y + player.h;
  player.big = big; player.h = big ? 1.9 : 1.4; player.y = feet - player.h;
}
function hurt() {
  if (player.inv > 0) return;
  if (player.big) { setSize(false); player.inv = 1.5; SFX.hurt(); return; }
  die();
}
function die() {
  SFX.hurt();
  lives--;
  if (lives <= 0) { state = 'over'; deadAt = performance.now(); return; }
  respawn();
}
function collect(x, y) {
  lvl.g[y][x] = ' '; coins++; levelCoins++; SFX.coin();
  if (coins >= 100) { coins -= 100; lives++; }
}

// ── Physik ──────────────────────────────────────────────────────────
function overlapTiles(x, y, w, h, fn) {
  for (let ty = Math.floor(y); ty <= Math.floor(y + h - 0.001); ty++)
    for (let tx = Math.floor(x - w / 2); tx <= Math.floor(x + w / 2 - 0.001); tx++) if (fn(tx, ty)) return true;
  return false;
}
const boxHits = (x, y, w, h) => overlapTiles(x, y, w, h, (tx, ty) => SOLID.has(tileAt(tx, ty)));
function hitBlock(tx, ty) {
  const ch = tileAt(tx, ty);
  if (ch === '?' || ch === '*') {
    lvl.g[ty][tx] = '!';
    if (ch === '?') { coins++; levelCoins++; SFX.coin(); pops.push({ x: tx + 0.5, y: ty, t: 0 }); }
    else { items.push({ x: tx + 0.5, y: ty - 0.9, vx: 2.2, vy: -4, w: 0.8, h: 0.8 }); SFX.power(); }
  } else if (ch === '=' && player.big) { lvl.g[ty][tx] = ' '; SFX.stomp(); }
  else SFX.bump();
}
function stepPlayer(dt, input) {
  const p = player;
  const c = char(), run = c.run || RUN, jump = c.jump || JUMP;
  const target = (input.right ? run : 0) - (input.left ? run : 0);
  p.vx += (target - p.vx) * Math.min(1, dt * (p.onGround ? 14 : 7));
  if (target) { p.face = Math.sign(target); p.walk += dt * 12; }
  p.coyote = p.onGround ? COYOTE : p.coyote - dt;
  p.buffer = input.jumpPressed ? BUFFER : p.buffer - dt;
  if (p.onGround) p.airJump = c.doubleJump ? 1 : 0;
  if (p.buffer > 0 && p.coyote > 0) { p.vy = -jump; p.buffer = 0; p.coyote = 0; p.onGround = false; p.plat = null; SFX.jump(); }
  else if (input.jumpPressed && p.coyote <= 0 && p.airJump > 0) { p.vy = -jump * 0.9; p.airJump--; p.buffer = 0; SFX.jump(); }
  // Früh loslassen springt weniger hoch
  if (!input.jump && p.vy < -6) p.vy = -6;
  p.vy = Math.min(p.vy + G * dt, 22);
  if (c.glide && input.jump && p.vy > 2.5) p.vy = 2.5;   // Papa schwebt wie mit einem Schirm
  if (p.plat) { p.x += p.plat.dx; p.y += p.plat.dy; }

  let nx = p.x + p.vx * dt;
  if (boxHits(nx, p.y, p.w, p.h)) { nx = p.vx > 0 ? Math.floor(nx + p.w / 2) - p.w / 2 - 0.001 : Math.ceil(nx - p.w / 2) + p.w / 2 + 0.001; p.vx = 0; }
  p.x = Math.max(p.w / 2, Math.min(lvl.len - p.w / 2, nx));

  let ny = p.y + p.vy * dt;
  const wasGround = p.onGround;
  p.onGround = false;
  if (boxHits(p.x, ny, p.w, p.h)) {
    if (p.vy > 0) { ny = Math.floor(ny + p.h) - p.h - 0.001; p.onGround = true; }
    else {
      const ty = Math.floor(ny), tx = Math.floor(p.x);
      if (SOLID.has(tileAt(tx, ty))) hitBlock(tx, ty);
      else for (const ox of [-p.w / 2 + 0.05, p.w / 2 - 0.05]) if (SOLID.has(tileAt(Math.floor(p.x + ox), ty))) { hitBlock(Math.floor(p.x + ox), ty); break; }
      ny = ty + 1 + 0.001;
    }
    p.vy = 0;
  }
  // Wolken-Plattformen, die sich bewegen: nur von oben betretbar
  p.plat = null;
  if (p.vy >= 0) for (const m of lvl.movers) {
    const feet = p.y + p.h, nfeet = ny + p.h;
    if (p.x + p.w / 2 > m.x && p.x - p.w / 2 < m.x + m.w && feet <= m.y + 0.15 && nfeet >= m.y) {
      ny = m.y - p.h; p.vy = 0; p.onGround = true; p.plat = m;
    }
  }
  p.y = ny;
  if (p.onGround && !wasGround) p.walk = 0;
  if (p.y > ROWS + 1) die();
  if (p.inv > 0) p.inv -= dt;

  // Münzen, Stacheln, Kontrollpunkte, Ziel
  overlapTiles(p.x, p.y, p.w, p.h, (tx, ty) => {
    const ch = tileAt(tx, ty);
    if (ch === 'o') collect(tx, ty);
    if (ch === 'S' && p.y + p.h > ty + 0.45) { hurt(); return true; }
    if (ch === 'C' && (!checkpoint || checkpoint.x !== tx + 0.5)) { checkpoint = { x: tx + 0.5, y: ty + 1 }; SFX.coin(); }
    if (ch === 'F') { win(); return true; }
    return false;
  });
}
function stepEnemies(dt) {
  const p = player;
  for (const e of lvl.ents) {
    if (e.dead) { e.dead += dt; continue; }
    e.t += dt;
    if (e.kind === 'slime') {
      // weiterlaufen, an Wänden und Kanten umdrehen
      const nx = e.x + e.vx * dt, ahead = nx + Math.sign(e.vx) * 0.45;
      if (solidAt(ahead, e.y - 0.5) || !solidAt(ahead, e.y + 0.1)) e.vx = -e.vx; else e.x = nx;
    } else {
      e.y = e.baseY + Math.sin(e.t * 2) * 1.5;
      e.x += Math.sin(e.t * 0.7) * dt * 1.2;
    }
    const ew = 0.8, eh = e.kind === 'slime' ? 0.75 : 0.7, ey = e.kind === 'slime' ? e.y - eh : e.y - eh / 2;
    if (Math.abs(p.x - e.x) < (p.w + ew) / 2 && p.y < ey + eh && p.y + p.h > ey) {
      // von oben drauf: platt
      if (p.vy > 0 && p.y + p.h - p.vy * dt <= ey + 0.35) { e.dead = 0.001; p.vy = -11; SFX.stomp(); }
      else hurt();
    }
  }
  for (const it of items) {
    it.vy = Math.min(it.vy + G * dt, 20);
    let nx = it.x + it.vx * dt;
    if (boxHits(nx, it.y, it.w, it.h)) { it.vx = -it.vx; nx = it.x; }
    it.x = nx;
    let ny = it.y + it.vy * dt;
    if (boxHits(it.x, ny, it.w, it.h)) { ny = it.vy > 0 ? Math.floor(ny + it.h) - it.h - 0.001 : it.y; it.vy = 0; }
    it.y = ny;
    if (Math.abs(p.x - it.x) < 0.8 && p.y < it.y + it.h && p.y + p.h > it.y) { it.taken = true; if (!p.big) setSize(true); SFX.power(); }
  }
  items = items.filter(it => !it.taken && it.y < ROWS + 2);
  for (const m of lvl.movers) {
    m.t += dt;
    const nx = m.axis === 'x' ? m.x0 + (Math.sin(m.t * 0.9) * 0.5 + 0.5) * m.range : m.x0;
    const ny = m.axis === 'y' ? m.y0 + (Math.sin(m.t * 0.9) * 0.5 - 0.5) * m.range : m.y0;
    m.dx = nx - m.x; m.dy = ny - m.y; m.x = nx; m.y = ny;
  }
  pops.forEach(q => q.t += dt); pops = pops.filter(q => q.t < 0.6);
}
// ── Der klingelnde Lucas ──
const LUCAS = { shirt: '#f39c12', pants: '#6c3483', skin: '#f1c8a5', hair: '#c0392b', style: 'short', scale: 1 };
function stepBoss(dt) {
  const b = lvl.boss;
  if (!b) return;
  if (b.dead) {
    b.dead += dt;
    if (b.dead > 2 && !b.flag) { b.flag = true; lvl.g[11][20] = 'F'; SFX.power(); }
    return;
  }
  b.t += dt;
  if (b.inv > 0) b.inv -= dt;
  if (b.ringing > 0) b.ringing -= dt;
  // Je weniger Treffer er noch aushält, desto schneller und öfter klingelt er
  b.vx = Math.sign(b.vx || -1) * [0, 5, 4, 3][b.hp];
  const nx = b.x + b.vx * dt;
  if (boxHits(nx, b.y - b.h, b.w, b.h)) b.vx = -b.vx; else b.x = nx;
  b.vy = Math.min(b.vy + G * dt, 22);
  let ny = b.y + b.vy * dt;
  b.onGround = false;
  if (boxHits(b.x, ny - b.h, b.w, b.h)) { if (b.vy > 0) { ny = Math.floor(ny) - 0.001; b.onGround = true; } else ny = b.y; b.vy = 0; }
  b.y = ny;
  if (b.hp < 3 && b.onGround && Math.random() < dt * 0.6) b.vy = -13;

  const w = W(), h = H(), t = performance.now() / 1000;
  const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#6ec6ff'); g.addColorStop(1, '#c9ecff');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#5bc23b'; ctx.fillRect(0, h * 0.88, w, h * 0.12);
  ctx.fillStyle = '#7a4b26'; ctx.fillRect(0, h * 0.91, w, h * 0.09);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const bounce = Math.abs(Math.sin(t * 3)) * 14;
  ctx.font = `900 ${Math.min(w * 0.085, 64)}px system-ui`;
  ctx.fillStyle = '#7a2e14'; ctx.fillText('FAMILY JUMP AND RUN', w / 2 + 4, h * 0.13 - bounce * 0.5 + 4, w - 20);
  ctx.fillStyle = '#ffd23f'; ctx.fillText('FAMILY JUMP AND RUN', w / 2, h * 0.13 - bounce * 0.5, w - 20);
  ctx.font = `bold ${Math.min(w * 0.035, 18)}px system-ui`; ctx.fillStyle = '#1b3a5c';
  ctx.fillText('Wähle deine Figur und dann ein Level!', w / 2, h * 0.235, w - 24);
  for (const b of charButtons()) {
    const on = b.c === char();
    ctx.fillStyle = on ? 'rgba(255,210,63,0.45)' : 'rgba(255,255,255,0.3)';
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 14); ctx.fill();
    ctx.strokeStyle = on ? '#ffd23f' : 'rgba(255,255,255,0.8)'; ctx.lineWidth = on ? 4 : 2; ctx.stroke();
    const fh = b.h * 0.46, hop = on ? Math.abs(Math.sin(t * 5)) * b.h * 0.05 : 0;
    drawFigure(b.c, b.x + b.w / 2, b.y + b.h * 0.08 - hop, fh * 0.57, fh, 1, 0);
    ctx.fillStyle = '#1b3a5c'; ctx.font = `900 ${Math.min(b.w * 0.16, 18)}px system-ui`;
    ctx.fillText(b.c.name, b.x + b.w / 2, b.y + b.h * 0.7, b.w - 6);
    ctx.font = `${Math.min(b.w * 0.1, 13)}px system-ui`;
    ctx.fillText(b.c.power, b.x + b.w / 2, b.y + b.h * 0.86, b.w - 6);
  }
  for (const b of levelButtons()) {
    const l = LEVELS[b.i];
    ctx.fillStyle = b.locked ? 'rgba(0,0,0,0.35)' : '#2e9e48';
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 16); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = `${b.h * 0.3}px system-ui`; ctx.fillText(b.locked ? '🔒' : l.icon, b.x + b.w / 2, b.y + b.h * 0.33);
    ctx.font = `bold ${Math.min(b.w * 0.11, 18)}px system-ui`; ctx.fillText(`${b.i + 1}. ${l.name}`, b.x + b.w / 2, b.y + b.h * 0.66, b.w - 10);
    if (progress.best[b.i] != null) { ctx.font = `${Math.min(b.w * 0.09, 14)}px system-ui`; ctx.fillText(`Bestwert: 🪙 ${progress.best[b.i]}`, b.x + b.w / 2, b.y + b.h * 0.84, b.w - 10); }
  }
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.font = '13px system-ui';
  ctx.fillText(touchUI ? 'Tippe auf eine Figur und dann auf ein Level' : `← → Figur wählen · 1 bis ${LEVELS.length} oder klicken: Level starten`, w / 2, h * 0.855, w - 24);
}

function step(dt) {
  if (state !== 'play') return;
  time += dt;
  stepPlayer(dt, readInput());
  if (state === 'play') stepEnemies(dt);
  if (state === 'play') { stepBoss(dt); stepWaves(dt); }
}
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  homeBtn.hidden = state === 'play';
  ctx.clearRect(0, 0, W(), H());
  if (state === 'title') drawTitle();
  else {
    step(dt);
    const cam = camera();
    drawBackground(cam); drawWorld(cam); drawBoss(cam); drawPlayer(cam); drawHUD();
    if (lvl.def.dark) {
      // In der Höhle sieht man nur um den Spieler herum gut
      const g = ctx.createRadialGradient(cam.ox + player.x * cam.ts, cam.oy + player.y * cam.ts, cam.ts * 2, cam.ox + player.x * cam.ts, cam.oy + player.y * cam.ts, cam.ts * 9);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.6)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W(), H());
    }
    if (state === 'won') drawOverlay('🏁 GESCHAFFT!', [`${levelCoins} Münzen in diesem Level`, lvl.def.boss ? 'Du hast den klingelnden Lucas besiegt! 🎉' : levelIdx + 1 < LEVELS.length ? 'Tippen oder Enter: nächstes Level' : 'Du hast alle Level geschafft! 🎉'], '#ffd23f');
    if (state === 'over') drawOverlay('GAME OVER', ['Keine Leben mehr.', 'Tippen oder Enter: zur Levelauswahl'], '#ff6b6b');
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
