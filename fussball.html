<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Kick it!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a5c1a;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #home {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 10px);
    left: calc(env(safe-area-inset-left) + 10px);
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; text-decoration: none;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 12px;
  }
  #home[hidden] { display: none; }
  #mic {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 10px);
    right: calc(env(safe-area-inset-right) + 10px);
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; cursor: pointer;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 12px;
  }
  #mic.off { opacity: 0.45; }
  #mic.off::after { content: ''; position: absolute; width: 34px; height: 3px; background: #e74c3c; transform: rotate(-45deg); border-radius: 2px; }
  #mic[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<a id="home" href="index.html" aria-label="Zur Spielauswahl">🏠</a>
<button id="mic" aria-label="Kommentator an oder aus">🎙️</button>
<script>
const homeBtn = document.getElementById('home');
const micBtn = document.getElementById('mic');
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('load', resize);
document.addEventListener('DOMContentLoaded', resize);
resize();
let resizeFrames = 0;

const W = () => window.innerWidth;
const H = () => window.innerHeight;

function drawKoelnCrest(cx, cy, s) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.lineCap='round'; ctx.lineJoin='round';
  const R=s*0.52, inner=s*0.39;

  // Roter Ring mit Schatten
  ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI*2);
  ctx.shadowColor='rgba(0,0,0,0.45)'; ctx.shadowBlur=s*0.12;
  ctx.fillStyle='#e3000f'; ctx.fill(); ctx.shadowBlur=0;

  // Vereinsname im Bogen oben, Sterne unten
  ctx.fillStyle='#fff';
  ctx.font=`900 ${s*0.1}px system-ui`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const name='1. FC KÖLN', textR=(R+inner)/2, spread=Math.PI*0.62;
  for (let i=0;i<name.length;i++) {
    const ang=-Math.PI/2-spread/2+spread*(i+0.5)/name.length;
    ctx.save();
    ctx.translate(Math.cos(ang)*textR, Math.sin(ang)*textR);
    ctx.rotate(ang+Math.PI/2);
    ctx.fillText(name[i], 0, 0);
    ctx.restore();
  }
  for (const ang of [Math.PI/2-0.45, Math.PI/2, Math.PI/2+0.45]) {
    const sx=Math.cos(ang)*textR, sy=Math.sin(ang)*textR, r=s*0.04;
    ctx.beginPath();
    for (let k=0;k<10;k++) {
      const a=-Math.PI/2+k*Math.PI/5, rr=k%2?r*0.45:r;
      ctx.lineTo(sx+Math.cos(a)*rr, sy+Math.sin(a)*rr);
    }
    ctx.closePath(); ctx.fill();
  }

  // Weißes Innenfeld
  ctx.beginPath(); ctx.arc(0, 0, inner, 0, Math.PI*2);
  ctx.fillStyle='#fff'; ctx.fill();

  // Kölner Dom von vorne: zwei sehr hohe Türme mit gestuften Geschossen,
  // durchbrochenen Turmhelmen und dem Mittelportal dazwischen
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, inner, 0, Math.PI*2); ctx.clip();
  ctx.translate(0, -s*0.07);
  ctx.scale(0.85, 0.85);
  ctx.fillStyle='#111';
  const tiers=[[0.7,0.14,0.07],[0.14,-0.03,0.055],[-0.03,-0.1,0.04]];
  for (const tx of [-s*0.16, s*0.16]) {
    for (const [yb,yt,hw] of tiers) {
      ctx.fillRect(tx-s*hw, s*yt, s*hw*2, s*(yb-yt));
      // Fialen an den Ecken jedes Geschosses
      for (const px of [tx-s*hw, tx+s*hw]) {
        ctx.beginPath();
        ctx.moveTo(px-s*0.015, s*yt); ctx.lineTo(px, s*yt-s*0.06); ctx.lineTo(px+s*0.015, s*yt);
        ctx.closePath(); ctx.fill();
      }
    }
    // Turmhelm
    ctx.beginPath();
    ctx.moveTo(tx-s*0.04, -s*0.1); ctx.lineTo(tx, -s*0.27); ctx.lineTo(tx+s*0.04, -s*0.1);
    ctx.closePath(); ctx.fill();
    ctx.fillRect(tx-s*0.005, -s*0.29, s*0.01, s*0.03);
  }
  // Mittelteil mit Giebel
  ctx.beginPath();
  ctx.moveTo(-s*0.09, s*0.7); ctx.lineTo(-s*0.09, s*0.08);
  ctx.lineTo(0, -s*0.06);
  ctx.lineTo(s*0.09, s*0.08); ctx.lineTo(s*0.09, s*0.7);
  ctx.closePath(); ctx.fill();

  // Weiße Details: Maßwerk im Helm, Spitzbogenfenster, großes Mittelfenster
  ctx.strokeStyle='#fff'; ctx.fillStyle='#fff'; ctx.lineWidth=Math.max(0.6, s*0.01);
  function arch(x, yb, hw, h) {
    ctx.beginPath();
    ctx.moveTo(x-hw, yb); ctx.lineTo(x-hw, yb-h+hw*1.6);
    ctx.lineTo(x, yb-h); ctx.lineTo(x+hw, yb-h+hw*1.6); ctx.lineTo(x+hw, yb);
    ctx.closePath();
  }
  for (const tx of [-s*0.16, s*0.16]) {
    ctx.beginPath();
    for (let i=1;i<4;i++) {
      const y=-s*0.1-i*s*0.04, hw=s*0.04*(1-i*0.04/0.17);
      ctx.moveTo(tx-hw*0.7, y); ctx.lineTo(tx+hw*0.7, y);
    }
    ctx.stroke();
    arch(tx-s*0.025, s*0.12, s*0.012, s*0.13); ctx.fill();
    arch(tx+s*0.025, s*0.12, s*0.012, s*0.13); ctx.fill();
    arch(tx, -s*0.045, s*0.012, s*0.08); ctx.fill();
  }
  arch(0, s*0.2, s*0.045, s*0.2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, s*0.2); ctx.lineTo(0, s*0.05); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, s*0.03, s*0.018, 0, Math.PI*2); ctx.stroke();
  ctx.restore();

  // Kontur
  ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI*2);
  ctx.strokeStyle='#8a0009'; ctx.lineWidth=s*0.025; ctx.stroke();

  ctx.restore();
}

function drawBayernCrest(cx, cy, s) {
  ctx.save();
  ctx.translate(cx, cy);
  const R=s*0.52, inner=s*0.34;

  // Roter Ring mit Schatten
  ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI*2);
  ctx.shadowColor='rgba(0,0,0,0.45)'; ctx.shadowBlur=s*0.12;
  ctx.fillStyle='#dc052d'; ctx.fill(); ctx.shadowBlur=0;
  ctx.strokeStyle='#fff'; ctx.lineWidth=s*0.02;
  ctx.beginPath(); ctx.arc(0, 0, R-s*0.025, 0, Math.PI*2); ctx.stroke();

  // Schrift im Bogen: oben FC BAYERN, unten MÜNCHEN
  ctx.fillStyle='#fff';
  ctx.font=`900 ${s*0.09}px system-ui`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const textR=(R+inner)/2;
  function arcText(text, mid, spread, bottom) {
    for (let i=0; i<text.length; i++) {
      const f=(i+0.5)/text.length;
      const ang=bottom ? mid+spread/2-spread*f : mid-spread/2+spread*f;
      ctx.save();
      ctx.translate(Math.cos(ang)*textR, Math.sin(ang)*textR);
      ctx.rotate(bottom ? ang-Math.PI/2 : ang+Math.PI/2);
      ctx.fillText(text[i], 0, 0);
      ctx.restore();
    }
  }
  arcText('FC BAYERN', -Math.PI/2, Math.PI*0.6, false);
  arcText('MÜNCHEN', Math.PI/2, Math.PI*0.5, true);
  // Punkte zwischen den Schriften
  for (const ang of [0, Math.PI]) {
    ctx.beginPath(); ctx.arc(Math.cos(ang)*textR, Math.sin(ang)*textR, s*0.022, 0, Math.PI*2); ctx.fill();
  }

  // Innen: blau-weiße bayerische Rauten
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, inner, 0, Math.PI*2); ctx.clip();
  ctx.fillStyle='#fff'; ctx.fillRect(-inner, -inner, inner*2, inner*2);
  ctx.fillStyle='#0066b2';
  const d=s*0.11;
  for (let row=-5; row<=5; row++) {
    for (let col=-5; col<=5; col++) {
      if ((row+col)%2) continue;
      const x=col*d*0.5, y=row*d*0.5;
      ctx.beginPath();
      ctx.moveTo(x, y-d*0.5); ctx.lineTo(x+d*0.5, y); ctx.lineTo(x, y+d*0.5); ctx.lineTo(x-d*0.5, y);
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(0, 0, inner, 0, Math.PI*2);
  ctx.strokeStyle='#fff'; ctx.lineWidth=s*0.02; ctx.stroke();

  ctx.restore();
}

function drawCityCrest(cx, cy, s) {
  ctx.save();
  ctx.translate(cx, cy);
  const R=s*0.52, inner=s*0.34;

  // Dunkelblauer Ring mit Schatten
  ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI*2);
  ctx.shadowColor='rgba(0,0,0,0.45)'; ctx.shadowBlur=s*0.12;
  ctx.fillStyle='#1c2c5b'; ctx.fill(); ctx.shadowBlur=0;
  ctx.strokeStyle='#6cabdd'; ctx.lineWidth=s*0.02;
  ctx.beginPath(); ctx.arc(0, 0, R-s*0.025, 0, Math.PI*2); ctx.stroke();

  // Schrift im Bogen: oben MANCHESTER CITY, unten 1894
  ctx.fillStyle='#fff';
  ctx.font=`900 ${s*0.075}px system-ui`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const textR=(R+inner)/2;
  function arcText(text, mid, spread, bottom) {
    for (let i=0; i<text.length; i++) {
      const f=(i+0.5)/text.length;
      const ang=bottom ? mid+spread/2-spread*f : mid-spread/2+spread*f;
      ctx.save();
      ctx.translate(Math.cos(ang)*textR, Math.sin(ang)*textR);
      ctx.rotate(bottom ? ang-Math.PI/2 : ang+Math.PI/2);
      ctx.fillText(text[i], 0, 0);
      ctx.restore();
    }
  }
  arcText('MANCHESTER CITY', -Math.PI/2, Math.PI*0.95, false);
  ctx.font=`900 ${s*0.09}px system-ui`;
  arcText('1894', Math.PI/2, Math.PI*0.25, true);

  // Innen himmelblau
  ctx.beginPath(); ctx.arc(0, 0, inner, 0, Math.PI*2);
  ctx.fillStyle='#6cabdd'; ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=s*0.02; ctx.stroke();

  // Wappenschild
  const sw=s*0.2, st=-s*0.24, sb=s*0.26;
  function shield() {
    ctx.beginPath();
    ctx.moveTo(-sw, st); ctx.lineTo(sw, st); ctx.lineTo(sw, s*0.06);
    ctx.quadraticCurveTo(sw, sb*0.8, 0, sb);
    ctx.quadraticCurveTo(-sw, sb*0.8, -sw, s*0.06);
    ctx.closePath();
  }
  shield(); ctx.fillStyle='#6cabdd'; ctx.fill();
  ctx.save(); shield(); ctx.clip();
  // Oben: goldenes Schiff
  ctx.fillStyle='#f2c230';
  ctx.beginPath();
  ctx.moveTo(-s*0.14, -s*0.08); ctx.lineTo(s*0.14, -s*0.08);
  ctx.lineTo(s*0.1, -s*0.02); ctx.lineTo(-s*0.1, -s*0.02);
  ctx.closePath(); ctx.fill();
  ctx.fillRect(-s*0.008, -s*0.21, s*0.016, s*0.13);
  ctx.beginPath();
  ctx.moveTo(s*0.015, -s*0.2); ctx.lineTo(s*0.11, -s*0.1); ctx.lineTo(s*0.015, -s*0.1);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-s*0.015, -s*0.17); ctx.lineTo(-s*0.09, -s*0.1); ctx.lineTo(-s*0.015, -s*0.1);
  ctx.closePath(); ctx.fill();
  // Unten: drei Flüsse
  ctx.strokeStyle='#f2c230'; ctx.lineWidth=s*0.025;
  for (let i=0; i<3; i++) {
    const o=i*s*0.06;
    ctx.beginPath(); ctx.moveTo(s*0.02+o, s*0.02); ctx.lineTo(-s*0.12+o, s*0.26); ctx.stroke();
  }
  // Rote Rose
  ctx.fillStyle='#d5121e';
  for (let i=0; i<5; i++) {
    const a=-Math.PI/2+i*Math.PI*2/5;
    ctx.beginPath(); ctx.arc(-s*0.08+Math.cos(a)*s*0.035, s*0.09+Math.sin(a)*s*0.035, s*0.035, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle='#f2c230';
  ctx.beginPath(); ctx.arc(-s*0.08, s*0.09, s*0.018, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  // Trennlinie und Rand
  ctx.strokeStyle='#1c2c5b'; ctx.lineWidth=s*0.02;
  ctx.beginPath(); ctx.moveTo(-sw, 0); ctx.lineTo(sw, 0); ctx.stroke();
  shield(); ctx.lineWidth=s*0.025; ctx.stroke();

  ctx.restore();
}

function drawArsenalCrest(cx, cy, s) {
  ctx.save();
  ctx.translate(cx, cy);
  const sw=s*0.36, st=-s*0.46, sb=s*0.5;
  function shield() {
    ctx.beginPath();
    ctx.moveTo(-sw, st); ctx.lineTo(sw, st); ctx.lineTo(sw, s*0.1);
    ctx.quadraticCurveTo(sw, sb*0.85, 0, sb);
    ctx.quadraticCurveTo(-sw, sb*0.85, -sw, s*0.1);
    ctx.closePath();
  }
  shield();
  ctx.shadowColor='rgba(0,0,0,0.45)'; ctx.shadowBlur=s*0.12;
  ctx.fillStyle='#ef0107'; ctx.fill(); ctx.shadowBlur=0;
  ctx.save(); shield(); ctx.clip();
  // Oben: dunkelblaues Band mit ARSENAL
  ctx.fillStyle='#063672';
  ctx.fillRect(-sw, st, sw*2, s*0.26);
  ctx.fillStyle='#fff';
  ctx.font=`900 ${s*0.13}px system-ui`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('ARSENAL', 0, st+s*0.135, sw*1.8);
  ctx.restore();
  // Goldene Kanone nach rechts
  ctx.fillStyle='#d4a017';
  ctx.save();
  ctx.translate(0, s*0.08); ctx.rotate(-0.05);
  ctx.beginPath();
  ctx.moveTo(-s*0.24, -s*0.06); ctx.lineTo(s*0.26, -s*0.035);
  ctx.lineTo(s*0.26, s*0.035); ctx.lineTo(-s*0.24, s*0.06);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(-s*0.25, 0, s*0.065, 0, Math.PI*2); ctx.fill();
  ctx.fillRect(s*0.24, -s*0.05, s*0.04, s*0.1);
  // Rad und Lafette
  ctx.beginPath(); ctx.arc(-s*0.08, s*0.12, s*0.08, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle='#ef0107';
  ctx.beginPath(); ctx.arc(-s*0.08, s*0.12, s*0.035, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  // Goldener Rand
  shield(); ctx.strokeStyle='#d4a017'; ctx.lineWidth=s*0.035; ctx.stroke();
  ctx.restore();
}

function drawLiverpoolCrest(cx, cy, s) {
  ctx.save();
  ctx.translate(cx, cy);
  const sw=s*0.34, st=-s*0.44, sb=s*0.5;
  function shield() {
    ctx.beginPath();
    ctx.moveTo(-sw, st); ctx.quadraticCurveTo(0, st-s*0.08, sw, st);
    ctx.lineTo(sw, s*0.12);
    ctx.quadraticCurveTo(sw, sb*0.85, 0, sb);
    ctx.quadraticCurveTo(-sw, sb*0.85, -sw, s*0.12);
    ctx.closePath();
  }
  shield();
  ctx.shadowColor='rgba(0,0,0,0.45)'; ctx.shadowBlur=s*0.12;
  ctx.fillStyle='#c8102e'; ctx.fill(); ctx.shadowBlur=0;
  // Liver Bird: Vogel mit erhobenen Flügeln und Seetang im Schnabel
  ctx.fillStyle='#f6eb61';
  ctx.beginPath(); ctx.ellipse(0, s*0.04, s*0.1, s*0.16, -0.15, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(-s*0.04, -s*0.15, s*0.06, 0, Math.PI*2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-s*0.09, -s*0.16); ctx.lineTo(-s*0.17, -s*0.13); ctx.lineTo(-s*0.09, -s*0.12);
  ctx.closePath(); ctx.fill();
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(side*s*0.05, -s*0.04);
    ctx.quadraticCurveTo(side*s*0.24, -s*0.12, side*s*0.22, -s*0.3);
    ctx.quadraticCurveTo(side*s*0.16, -s*0.12, side*s*0.06, s*0.06);
    ctx.closePath(); ctx.fill();
  }
  ctx.strokeStyle='#f6eb61'; ctx.lineWidth=s*0.025;
  ctx.beginPath(); ctx.moveTo(-s*0.03, s*0.18); ctx.lineTo(-s*0.05, s*0.27); ctx.moveTo(s*0.04, s*0.18); ctx.lineTo(s*0.05, s*0.27); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-s*0.17, -s*0.13); ctx.quadraticCurveTo(-s*0.24, -s*0.05, -s*0.2, s*0.02); ctx.stroke();
  // L.F.C.
  ctx.fillStyle='#fff';
  ctx.font=`900 ${s*0.11}px system-ui`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('L.F.C.', 0, s*0.37);
  shield(); ctx.strokeStyle='#f6eb61'; ctx.lineWidth=s*0.03; ctx.stroke();
  ctx.restore();
}

function drawChelseaCrest(cx, cy, s) {
  ctx.save();
  ctx.translate(cx, cy);
  const R=s*0.52, inner=s*0.36;
  ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI*2);
  ctx.shadowColor='rgba(0,0,0,0.45)'; ctx.shadowBlur=s*0.12;
  ctx.fillStyle='#034694'; ctx.fill(); ctx.shadowBlur=0;
  ctx.strokeStyle='#d4a017'; ctx.lineWidth=s*0.025;
  ctx.beginPath(); ctx.arc(0, 0, R-s*0.02, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, inner, 0, Math.PI*2); ctx.stroke();
  // Schrift im Bogen
  ctx.fillStyle='#fff';
  ctx.font=`900 ${s*0.085}px system-ui`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const textR=(R+inner)/2;
  function arcText(text, mid, spread, bottom) {
    for (let i=0; i<text.length; i++) {
      const f=(i+0.5)/text.length;
      const ang=bottom ? mid+spread/2-spread*f : mid-spread/2+spread*f;
      ctx.save();
      ctx.translate(Math.cos(ang)*textR, Math.sin(ang)*textR);
      ctx.rotate(bottom ? ang-Math.PI/2 : ang+Math.PI/2);
      ctx.fillText(text[i], 0, 0);
      ctx.restore();
    }
  }
  arcText('CHELSEA', -Math.PI/2, Math.PI*0.55, false);
  arcText('FOOTBALL CLUB', Math.PI/2, Math.PI*0.8, true);
  // Aufrechter Löwe mit Stab, nach links schauend
  ctx.fillStyle='#fff'; ctx.strokeStyle='#fff';
  ctx.beginPath(); ctx.ellipse(s*0.02, s*0.04, s*0.08, s*0.15, 0.35, 0, Math.PI*2); ctx.fill();
  for (let i=0; i<7; i++) {
    const a=i*Math.PI*2/7;
    ctx.beginPath(); ctx.arc(-s*0.04+Math.cos(a)*s*0.06, -s*0.13+Math.sin(a)*s*0.06, s*0.045, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle='#034694';
  ctx.beginPath(); ctx.arc(-s*0.07, -s*0.14, s*0.012, 0, Math.PI*2); ctx.fill();
  ctx.lineCap='round'; ctx.lineWidth=s*0.04;
  ctx.beginPath();
  ctx.moveTo(s*0.0, s*0.14); ctx.lineTo(-s*0.06, s*0.27);
  ctx.moveTo(s*0.07, s*0.12); ctx.lineTo(s*0.1, s*0.27);
  ctx.moveTo(-s*0.03, -s*0.04); ctx.lineTo(-s*0.14, -s*0.04);
  ctx.stroke();
  ctx.lineWidth=s*0.02;
  ctx.beginPath(); ctx.moveTo(s*0.08, s*0.1); ctx.quadraticCurveTo(s*0.24, s*0.12, s*0.18, -s*0.04); ctx.stroke();
  // Stab
  ctx.strokeStyle='#d4a017'; ctx.lineWidth=s*0.025;
  ctx.beginPath(); ctx.moveTo(-s*0.16, s*0.24); ctx.lineTo(-s*0.16, -s*0.22); ctx.stroke();
  ctx.fillStyle='#d4a017';
  ctx.beginPath(); ctx.arc(-s*0.16, -s*0.23, s*0.03, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawNewcastleCrest(cx, cy, s) {
  ctx.save();
  ctx.translate(cx, cy);
  const R=s*0.52;
  ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI*2);
  ctx.shadowColor='rgba(0,0,0,0.45)'; ctx.shadowBlur=s*0.12;
  ctx.fillStyle='#111'; ctx.fill(); ctx.shadowBlur=0;
  ctx.strokeStyle='#fff'; ctx.lineWidth=s*0.02;
  ctx.beginPath(); ctx.arc(0, 0, R-s*0.03, 0, Math.PI*2); ctx.stroke();
  // Schild: oben Burg auf Himmelblau, unten Wellen des Tyne
  const sw=s*0.24, st=-s*0.3, sb=s*0.3;
  function shield() {
    ctx.beginPath();
    ctx.moveTo(-sw, st); ctx.lineTo(sw, st); ctx.lineTo(sw, s*0.05);
    ctx.quadraticCurveTo(sw, sb*0.8, 0, sb);
    ctx.quadraticCurveTo(-sw, sb*0.8, -sw, s*0.05);
    ctx.closePath();
  }
  shield(); ctx.fillStyle='#41b6e6'; ctx.fill();
  ctx.save(); shield(); ctx.clip();
  ctx.fillStyle='#fff';
  ctx.fillRect(-sw, s*0.04, sw*2, sb);
  ctx.strokeStyle='#1d5fa8'; ctx.lineWidth=s*0.035;
  for (let r=0; r<3; r++) {
    const y=s*0.1+r*s*0.07;
    ctx.beginPath();
    for (let x=-sw; x<=sw; x+=s*0.02) {
      const yy=y+Math.sin(x/s*30)*s*0.015;
      if (x===-sw) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
    }
    ctx.stroke();
  }
  // Burg mit drei Türmen
  ctx.fillStyle='#8a8a8a';
  ctx.fillRect(-s*0.16, -s*0.12, s*0.32, s*0.16);
  for (const tx of [-s*0.13, 0, s*0.13]) {
    const th = tx===0 ? s*0.16 : s*0.1;
    ctx.fillRect(tx-s*0.04, -s*0.12-th, s*0.08, th);
    for (let k=-1; k<=1; k+=2) ctx.fillRect(tx+k*s*0.025-s*0.012, -s*0.12-th-s*0.03, s*0.024, s*0.03);
  }
  ctx.fillStyle='#333';
  ctx.beginPath(); ctx.arc(0, s*0.01, s*0.035, Math.PI, 0); ctx.lineTo(s*0.035, s*0.04); ctx.lineTo(-s*0.035, s*0.04); ctx.closePath(); ctx.fill();
  ctx.restore();
  shield(); ctx.strokeStyle='#fff'; ctx.lineWidth=s*0.025; ctx.stroke();
  // Schriftband
  ctx.fillStyle='#fff';
  ctx.font=`900 ${s*0.075}px system-ui`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('NEWCASTLE', 0, s*0.38);
  ctx.restore();
}

// Krone über spanischen Wappen
function drawCrown(x, y, cw, ch) {
  ctx.fillStyle='#f2c230';
  ctx.beginPath();
  ctx.moveTo(x-cw/2, y+ch/2);
  ctx.lineTo(x-cw/2, y-ch*0.1);
  ctx.lineTo(x-cw/4, y+ch*0.15);
  ctx.lineTo(x, y-ch/2);
  ctx.lineTo(x+cw/4, y+ch*0.15);
  ctx.lineTo(x+cw/2, y-ch*0.1);
  ctx.lineTo(x+cw/2, y+ch/2);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='#c0392b';
  for (const dx of [-cw/4, 0, cw/4]) { ctx.beginPath(); ctx.arc(x+dx, y+ch*0.3, ch*0.1, 0, Math.PI*2); ctx.fill(); }
  ctx.fillStyle='#f2c230';
  for (const [dx, dy] of [[-cw/2, -0.1], [0, -0.5], [cw/2, -0.1]]) { ctx.beginPath(); ctx.arc(x+dx, y+ch*dy, ch*0.1, 0, Math.PI*2); ctx.fill(); }
}

function drawBarcaCrest(cx, cy, s) {
  ctx.save();
  ctx.translate(cx, cy);
  const sw=s*0.36, st=-s*0.46;
  function shield() {
    ctx.beginPath();
    ctx.moveTo(-sw, st); ctx.lineTo(sw, st);
    ctx.quadraticCurveTo(sw*1.05, -s*0.05, sw*0.6, s*0.2);
    ctx.quadraticCurveTo(s*0.08, s*0.42, 0, s*0.52);
    ctx.quadraticCurveTo(-s*0.08, s*0.42, -sw*0.6, s*0.2);
    ctx.quadraticCurveTo(-sw*1.05, -s*0.05, -sw, st);
    ctx.closePath();
  }
  shield();
  ctx.shadowColor='rgba(0,0,0,0.45)'; ctx.shadowBlur=s*0.12;
  ctx.fillStyle='#fff'; ctx.fill(); ctx.shadowBlur=0;
  ctx.save(); shield(); ctx.clip();
  // Oben links: rotes Georgskreuz, oben rechts: katalanische Streifen
  ctx.fillStyle='#c8102e';
  ctx.fillRect(-sw*0.6, st, sw*0.25, s*0.3);
  ctx.fillRect(-sw, st+s*0.11, sw, s*0.08);
  ctx.fillStyle='#fcd116'; ctx.fillRect(0, st, sw, s*0.3);
  ctx.fillStyle='#c8102e';
  for (let i=0; i<4; i++) ctx.fillRect(sw*(0.1+i*0.24), st, sw*0.12, s*0.3);
  // Band mit FCB
  ctx.fillStyle='#f2c230'; ctx.fillRect(-sw, st+s*0.3, sw*2, s*0.11);
  ctx.fillStyle='#111';
  ctx.font=`900 ${s*0.09}px system-ui`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('FCB', 0, st+s*0.36);
  // Unten blau-rote Streifen mit Ball
  for (let i=0; i<6; i++) {
    ctx.fillStyle=i%2 ? '#a50044' : '#004d98';
    ctx.fillRect(-sw+i*sw/3, st+s*0.41, sw/3, s*0.6);
  }
  ctx.restore();
  ctx.fillStyle='#f2c230';
  ctx.beginPath(); ctx.arc(0, s*0.18, s*0.07, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle='#8a5a00'; ctx.lineWidth=s*0.01; ctx.stroke();
  shield(); ctx.strokeStyle='#f2c230'; ctx.lineWidth=s*0.03; ctx.stroke();
  ctx.restore();
}

function drawAtleticoCrest(cx, cy, s) {
  ctx.save();
  ctx.translate(cx, cy);
  const sw=s*0.34, st=-s*0.44, sb=s*0.5;
  function shield() {
    ctx.beginPath();
    ctx.moveTo(-sw, st); ctx.lineTo(sw, st); ctx.lineTo(sw, s*0.1);
    ctx.quadraticCurveTo(sw, sb*0.85, 0, sb);
    ctx.quadraticCurveTo(-sw, sb*0.85, -sw, s*0.1);
    ctx.closePath();
  }
  shield();
  ctx.shadowColor='rgba(0,0,0,0.45)'; ctx.shadowBlur=s*0.12;
  ctx.fillStyle='#fff'; ctx.fill(); ctx.shadowBlur=0;
  ctx.save(); shield(); ctx.clip();
  // Unten rot-weiße Streifen
  ctx.fillStyle='#cb3524';
  for (let i=0; i<5; i+=2) ctx.fillRect(-sw+i*sw*2/5, st, sw*2/5, s);
  // Oben links: blaues Feld mit Bär am Erdbeerbaum
  ctx.fillStyle='#272e61';
  ctx.beginPath();
  ctx.moveTo(-sw, st); ctx.lineTo(s*0.08, st); ctx.lineTo(s*0.08, s*0.02);
  ctx.quadraticCurveTo(-sw*0.5, s*0.2, -sw, s*0.18);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='#fff';
  for (let i=0; i<7; i++) {
    const a=Math.PI*0.15+i*Math.PI*0.7/6;
    const sx=-s*0.13+Math.cos(a)*s*0.17, sy=-s*0.3+Math.sin(a)*s*0.28;
    ctx.beginPath();
    for (let k=0; k<10; k++) {
      const aa=-Math.PI/2+k*Math.PI/5, rr=k%2 ? s*0.012 : s*0.028;
      ctx.lineTo(sx+Math.cos(aa)*rr, sy+Math.sin(aa)*rr);
    }
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle='#3a8a3a';
  ctx.beginPath(); ctx.arc(-s*0.06, -s*0.24, s*0.07, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle='#7a4a20';
  ctx.fillRect(-s*0.07, -s*0.2, s*0.025, s*0.15);
  ctx.beginPath(); ctx.ellipse(-s*0.15, -s*0.12, s*0.06, s*0.04, -0.6, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(-s*0.11, -s*0.17, s*0.03, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  shield(); ctx.strokeStyle='#272e61'; ctx.lineWidth=s*0.035; ctx.stroke();
  ctx.restore();
}

function drawRealMadridCrest(cx, cy, s) {
  ctx.save();
  ctx.translate(cx, cy+s*0.08);
  const R=s*0.38;
  drawCrown(0, -R-s*0.06, s*0.5, s*0.2);
  ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI*2);
  ctx.shadowColor='rgba(0,0,0,0.45)'; ctx.shadowBlur=s*0.12;
  ctx.fillStyle='#fff'; ctx.fill(); ctx.shadowBlur=0;
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI*2); ctx.clip();
  // Lila Schrägband
  ctx.fillStyle='#3d195b';
  ctx.beginPath();
  ctx.moveTo(-R, -R*0.35); ctx.lineTo(-R, R*0.05); ctx.lineTo(R, R*0.65); ctx.lineTo(R, R*0.25);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.fillStyle='#d4a017';
  ctx.font=`900 ${s*0.24}px Georgia, serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('MCF', 0, -s*0.01);
  ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI*2);
  ctx.strokeStyle='#d4a017'; ctx.lineWidth=s*0.04; ctx.stroke();
  ctx.restore();
}

function drawBetisCrest(cx, cy, s) {
  ctx.save();
  ctx.translate(cx, cy+s*0.06);
  const sw=s*0.32, st=-s*0.34, sb=s*0.46;
  function shield() {
    ctx.beginPath();
    ctx.moveTo(-sw, st); ctx.lineTo(sw, st); ctx.lineTo(sw, s*0.08);
    ctx.quadraticCurveTo(sw, sb*0.85, 0, sb);
    ctx.quadraticCurveTo(-sw, sb*0.85, -sw, s*0.08);
    ctx.closePath();
  }
  drawCrown(0, st-s*0.1, s*0.42, s*0.17);
  shield();
  ctx.shadowColor='rgba(0,0,0,0.45)'; ctx.shadowBlur=s*0.12;
  ctx.fillStyle='#fff'; ctx.fill(); ctx.shadowBlur=0;
  ctx.save(); shield(); ctx.clip();
  ctx.fillStyle='#0bb363';
  for (let i=0; i<7; i+=2) ctx.fillRect(-sw+i*sw*2/7, st, sw*2/7, s);
  ctx.restore();
  // RB in der Mitte
  ctx.fillStyle='#0bb363';
  ctx.beginPath(); ctx.arc(0, s*0.02, s*0.16, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=s*0.02; ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.font=`900 ${s*0.16}px Georgia, serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('RB', 0, s*0.03);
  shield(); ctx.strokeStyle='#f2c230'; ctx.lineWidth=s*0.03; ctx.stroke();
  ctx.restore();
}

function drawSociedadCrest(cx, cy, s) {
  ctx.save();
  ctx.translate(cx, cy+s*0.08);
  const R=s*0.38;
  drawCrown(0, -R-s*0.06, s*0.5, s*0.2);

  ctx.shadowColor='rgba(0,0,0,0.45)'; ctx.shadowBlur=s*0.12;
  ctx.fillStyle='#fff'; ctx.fill(); ctx.shadowBlur=0;
  // Blau-weiße Streifen im Ring, Mitte mit Ball und RS
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI*2); ctx.clip();

  for (let i=0; i<8; i+=2) ctx.fillRect(-R+i*R/4, -R, R/4, R*2);

  ctx.fillStyle='#f2c230'; ctx.fill();
  ctx.strokeStyle='#0067b1'; ctx.lineWidth=s*0.025; ctx.stroke();

  ctx.font=`900 ${s*0.2}px Georgia, serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('RS', 0, s*0.01);
  ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI*2);
  ctx.strokeStyle='#0067b1'; ctx.lineWidth=s*0.035; ctx.stroke();
  ctx.restore();
}

// Nationalteams tragen ihre Flagge als Wappen
function drawFlagCrest(cx, cy, s, paint) {
  const fw=s*0.84, fh=s*0.56;
  ctx.save();
  ctx.translate(cx-fw/2, cy-fh/2);
  roundRect(0, 0, fw, fh, s*0.05);
  ctx.shadowColor='rgba(0,0,0,0.45)'; ctx.shadowBlur=s*0.12;
  ctx.fillStyle='#fff'; ctx.fill(); ctx.shadowBlur=0;
  ctx.save(); roundRect(0, 0, fw, fh, s*0.05); ctx.clip();
  paint(fw, fh);
  ctx.restore();
  roundRect(0, 0, fw, fh, s*0.05);
  ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=s*0.02; ctx.stroke();
  ctx.restore();
}
const drawGermanyCrest = (cx, cy, s) => drawFlagCrest(cx, cy, s, (fw, fh) => {

});

});

const drawBelgiumCrest = (cx, cy, s) => drawFlagCrest(cx, cy, s, (fw, fh) => {

});
const drawCroatiaCrest = (cx, cy, s) => drawFlagCrest(cx, cy, s, (fw, fh) => {
  ['#ff0000', '#ffffff', '#171796'].forEach((c, i) => { ctx.fillStyle=c; ctx.fillRect(0, i*fh/3, fw, fh/3+1); });
  // Kleines rot-weißes Schachbrett-Wappen in der Mitte
  const q = fh*0.09;
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
    ctx.fillStyle = (i + j) % 2 ? '#ffffff' : '#ff0000';
    ctx.fillRect(fw/2 - 2*q + i*q, fh/2 - 2*q + j*q, q, q);
  }
});
const drawMoroccoCrest = (cx, cy, s) => drawFlagCrest(cx, cy, s, (fw, fh) => {

  for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) { ctx.beginPath(); ctx.arc(fw*(0.06 + i*0.09), fh*(0.09 + j*0.16), fh*0.025, 0, Math.PI*2); ctx.fill(); }

function drawSchalkeCrest(cx, cy, s) {
  ctx.save();
  ctx.translate(cx, cy);

  // Weißer äußerer Ring
  ctx.beginPath(); ctx.arc(0,0,s*0.54,0,Math.PI*2);
  ctx.shadowColor='rgba(0,0,0,0.4)'; ctx.shadowBlur=s*0.1;
  ctx.fillStyle='#fff'; ctx.fill(); ctx.shadowBlur=0;

  // Blauе Fläche
  ctx.beginPath(); ctx.arc(0,0,s*0.5,0,Math.PI*2);
  ctx.fillStyle=SCHALKE.color; ctx.fill();

  // Weißer Innenring
  ctx.beginPath(); ctx.arc(0,0,s*0.41,0,Math.PI*2);
  ctx.strokeStyle='#fff'; ctx.lineWidth=s*0.05; ctx.stroke();

  // Texte
  ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`bold ${s*0.13}px system-ui`;
  ctx.fillText('FC SCHALKE', 0, -s*0.22);
  ctx.font=`bold ${s*0.38}px system-ui`;
  ctx.fillText('04', 0, s*0.07);
  ctx.font=`${s*0.1}px system-ui`;
  ctx.fillText('GELSENKIRCHEN', 0, s*0.3);

  ctx.restore();
}

function drawBVBCrest(cx, cy, s) {

  ctx.beginPath(); ctx.arc(0, 0, s*0.54, 0, Math.PI*2);

}

function drawBMGCrest(cx, cy, s) {
  ctx.save();

  // Weißer äußerer Kreis
  ctx.beginPath(); ctx.arc(0, 0, s*0.54, 0, Math.PI*2);

  ctx.fillStyle='#fff'; ctx.fill(); ctx.shadowBlur=0;

  // Schwarze Fläche
  ctx.beginPath(); ctx.arc(0, 0, s*0.48, 0, Math.PI*2);
  ctx.fillStyle='#111'; ctx.fill();

  // Fohlen (vereinfachtes Pferdekopf-Silhouette)
  ctx.fillStyle='#fff';
  // Hals
  ctx.beginPath();
  ctx.ellipse(-s*0.05, s*0.08, s*0.12, s*0.2, -0.3, 0, Math.PI*2);
  ctx.fill();
  // Kopf
  ctx.beginPath();
  ctx.ellipse(s*0.1, -s*0.1, s*0.16, s*0.12, 0.5, 0, Math.PI*2);
  ctx.fill();
  // Maul
  ctx.beginPath();
  ctx.ellipse(s*0.24, -s*0.04, s*0.08, s*0.06, 0.3, 0, Math.PI*2);
  ctx.fill();
  // Ohr
  ctx.beginPath();
  ctx.moveTo(s*0.08, -s*0.2);
  ctx.lineTo(s*0.0,  -s*0.34);
  ctx.lineTo(s*0.18, -s*0.24);
  ctx.closePath(); ctx.fill();
  // Mähne
  ctx.fillStyle='#ddd';
  ctx.beginPath();
  ctx.moveTo(-s*0.06, -s*0.12);
  ctx.quadraticCurveTo(-s*0.22, -s*0.05, -s*0.18, s*0.1);
  ctx.quadraticCurveTo(-s*0.26, s*0.0,   -s*0.2,  -s*0.15);
  ctx.quadraticCurveTo(-s*0.12, -s*0.28,  s*0.04, -s*0.22);
  ctx.closePath(); ctx.fill();

  // "BMG" Text
  ctx.fillStyle='#fff';
  ctx.font=`bold ${s*0.17}px system-ui`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('BMG', 0, s*0.3);

  // "1900" klein
  ctx.font=`${s*0.1}px system-ui`;
  ctx.fillStyle='rgba(255,255,255,0.7)';
  ctx.fillText('1900', 0, s*0.43);

  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// Rasen wird einmal in ein eigenes Canvas gemalt und dann nur noch kopiert
let fieldCache = null, fieldCacheKey = '';

function drawField() {
  const w = W(), h = H(), dpr = window.devicePixelRatio || 1;
  const key = `${w}x${h}@${dpr}/${playerClub.short}/${opponentClub.short}`;
  if (key !== fieldCacheKey) {
    fieldCache = document.createElement('canvas');
    fieldCache.width = w * dpr;
    fieldCache.height = h * dpr;
    const f = fieldCache.getContext('2d');
    f.setTransform(dpr, 0, 0, dpr, 0, 0);
    paintField(f, w, h);
    fieldCacheKey = key;
  }
  ctx.drawImage(fieldCache, 0, 0, w, h);
}

// Tribünen im Heimstadion: Fans in Vereinsfarben, Gästeblock unten rechts, Werbebanden
function paintStands(f, w, h, padX, padY) {
  const home = playerClub, away = opponentClub;
  const standY = padY * 0.58, boardH = padY * 0.2, standX = padX * 0.58;
  const goalTop = h * GOAL_T - h * 0.03, goalBot = h * GOAL_B + h * 0.03;
  const regions = [
    [0, 0, w, standY],
    [0, h - standY, w, standY],
    [0, standY, standX, goalTop - standY],
    [0, goalBot, standX, h - standY - goalBot],
    [w - standX, standY, standX, goalTop - standY],
    [w - standX, goalBot, standX, h - standY - goalBot],
  ];
  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const gap = 4.5;
  for (const [rx, ry, rw, rh] of regions) {
    if (rw <= 0 || rh <= 0) continue;
    f.fillStyle = '#1b1e29';
    f.fillRect(rx, ry, rw, rh);
    for (let y = ry + gap / 2; y < ry + rh; y += gap) {
      for (let x = rx + gap / 2; x < rx + rw; x += gap) {
        const awayBlock = x > w * 0.78 && y > h - standY;
        const cols = awayBlock ? away.fans : home.fans;
        const r = rnd();
        f.fillStyle = r < 0.75 ? cols[Math.floor(rnd() * cols.length)] : (r < 0.88 ? '#e0b090' : '#2a2a2a');
        f.globalAlpha = 0.55 + rnd() * 0.45;
        f.beginPath();
        f.arc(x + (rnd() - 0.5), y + (rnd() - 0.5), 1.7, 0, Math.PI * 2);
        f.fill();
      }
    }
    f.globalAlpha = 1;
    // Stufen der Tribüne
    f.fillStyle = 'rgba(0,0,0,0.25)';
    for (let y = ry + gap * 2; y < ry + rh; y += gap * 2) f.fillRect(rx, y, rw, 0.7);
  }

  // Werbebanden oben und unten
  const leagues = new Set([clubEntry(playerClub).league, clubEntry(opponentClub).league]);
  const COUNTRY = { de:'DEUTSCHLAND', en:'ENGLAND', es:'SPANIEN' };
  const DUEL = { de:'BUNDESLIGA-DUELL', en:'PREMIER LEAGUE', es:'LALIGA' };
  const duel = leagues.has('nat') ? 'LÄNDERSPIEL' : leagues.size > 1 ? [...leagues].map(l => COUNTRY[l]).join(' VS ') : DUEL[[...leagues][0]];
  const ads = [home.stadium, 'KICK IT!', home.name, 'TOOOR!', duel];
  f.font = `bold ${boardH * 0.7}px system-ui`;
  f.textAlign = 'center';
  f.textBaseline = 'middle';
  for (const by of [standY, h - standY - boardH]) {
    let x = 0, i = 0;
    while (x < w) {
      const text = ads[i % ads.length];
      const segW = f.measureText(text).width + boardH * 3;
      const dark = i % 2 === 0;
      f.fillStyle = dark ? '#0d0d0d' : home.color;
      f.fillRect(x, by, segW, boardH);
      f.fillStyle = dark ? '#ffffff' : (home.numColor || '#ffffff');
      f.fillText(text, x + segW / 2, by + boardH / 2);
      x += segW; i++;
    }
    f.fillStyle = 'rgba(255,255,255,0.25)';
    f.fillRect(0, by, w, 1);
  }
}

function paintField(f, w, h) {
  const padX = w * FPADX;
  const padY = h * FPADY;

  // Gemähte Streifen quer zum Spielfeld, wie im Stadion
  const stripes = 16;
  const stripeW = w / stripes;
  for (let i = 0; i < stripes; i++) {
    f.fillStyle = i % 2 === 0 ? '#2f8f2f' : '#3aa53a';
    f.fillRect(i * stripeW, 0, stripeW + 1, h);
  }
  // Leichtes Karomuster darüber
  const rowH = h / 8;
  f.fillStyle = 'rgba(255,255,255,0.035)';
  for (let j = 0; j < 8; j += 2) f.fillRect(0, j * rowH, w, rowH);

  // Grashalme
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const blades = Math.floor(w * h / 60);
  f.lineWidth = 1;
  for (let i = 0; i < blades; i++) {
    const x = rnd() * w, y = rnd() * h;
    const len = 2 + rnd() * 3;
    f.strokeStyle = rnd() < 0.5 ? 'rgba(0,40,0,0.18)' : 'rgba(180,255,150,0.12)';
    f.beginPath();
    f.moveTo(x, y);
    f.lineTo(x + (rnd() - 0.5) * 2, y - len);
    f.stroke();
  }

  // Außerhalb der Linien etwas dunkler
  f.fillStyle = 'rgba(0,30,0,0.22)';
  f.fillRect(0, 0, w, padY);
  f.fillRect(0, h - padY, w, padY);
  f.fillRect(0, padY, padX, h - padY * 2);
  f.fillRect(w - padX, padY, padX, h - padY * 2);

  paintStands(f, w, h, padX, padY);

  // Flutlicht aus den vier Ecken
  for (const [lx, ly] of [[0, 0], [w, 0], [0, h], [w, h]]) {
    const g = f.createRadialGradient(lx, ly, 0, lx, ly, Math.max(w, h) * 0.55);
    g.addColorStop(0, 'rgba(255,255,220,0.10)');
    g.addColorStop(1, 'rgba(255,255,220,0)');
    f.fillStyle = g;
    f.fillRect(0, 0, w, h);
  }

  // Ränder abdunkeln
  const vig = f.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.max(w, h) * 0.75);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.35)');
  f.fillStyle = vig;
  f.fillRect(0, 0, w, h);

  const goalH = h * (GOAL_B - GOAL_T);
  const goalY = h * GOAL_T;
  const penW = w * 0.18;
  const penH = h * 0.6;
  const penY = (h - penH) / 2;
  const circR = h * 0.12;
  const spotL = padX + circR, spotR = w - padX - circR;
  // Strafraumbogen: Teil des Kreises um den Elfmeterpunkt außerhalb des Strafraums
  const dEdge = penW - circR;
  const dR = dEdge + h * 0.07;
  const dA = Math.acos(dEdge / dR);
  const cornerR = h * 0.03;

  function lines() {
    f.strokeRect(padX, padY, w - padX * 2, h - padY * 2);
    f.beginPath();
    f.moveTo(w / 2, padY);
    f.lineTo(w / 2, h - padY);
    f.stroke();
    f.beginPath();
    f.arc(w / 2, h / 2, circR, 0, Math.PI * 2);
    f.stroke();
    f.strokeRect(padX, penY, penW, penH);
    f.strokeRect(padX, goalY, w * 0.08, goalH);
    f.strokeRect(w - padX - penW, penY, penW, penH);
    f.strokeRect(w - padX - w * 0.08, goalY, w * 0.08, goalH);
    f.beginPath();
    f.arc(spotL, h / 2, dR, -dA, dA);
    f.stroke();
    f.beginPath();
    f.arc(spotR, h / 2, dR, Math.PI - dA, Math.PI + dA);
    f.stroke();
    // Eckfahnen-Viertelkreise
    const corners = [[padX, padY, 0], [w - padX, padY, 0.5], [w - padX, h - padY, 1], [padX, h - padY, 1.5]];
    for (const [cx, cy, a] of corners) {
      f.beginPath();
      f.arc(cx, cy, cornerR, a * Math.PI, (a + 0.5) * Math.PI);
      f.stroke();
    }
    for (const [x, y] of [[w / 2, h / 2], [spotL, h / 2], [spotR, h / 2]]) {
      f.beginPath();
      f.arc(x, y, 4, 0, Math.PI * 2);
      f.fill();
    }
  }

  f.lineWidth = 3;
  f.lineJoin = 'miter';
  // Schatten unter den Linien, dann die Kreidelinien
  f.save();
  f.translate(1, 1.5);
  f.strokeStyle = f.fillStyle = 'rgba(0,0,0,0.18)';
  lines();
  f.restore();
  f.strokeStyle = f.fillStyle = 'rgba(255,255,255,0.9)';
  lines();

  // Eckfahnen
  for (const [cx, cy] of [[padX, padY], [w - padX, padY], [w - padX, h - padY], [padX, h - padY]]) {
    f.strokeStyle = '#eee';
    f.lineWidth = 2;
    f.beginPath();
    f.moveTo(cx, cy);
    f.lineTo(cx, cy - h * 0.045);
    f.stroke();
    f.fillStyle = '#feca57';
    f.beginPath();
    f.moveTo(cx, cy - h * 0.045);
    f.lineTo(cx + (cx < w / 2 ? 1 : -1) * h * 0.025, cy - h * 0.037);
    f.lineTo(cx, cy - h * 0.029);
    f.closePath();
    f.fill();
  }
}

// x, y = Ecke des Tornetzes; goalW = Tiefe ins Aus; goalH = Breite des Tors; facingRight = Tor öffnet nach rechts
function drawGoal(x, y, goalW, goalH, facingRight) {
  const postR = 5;

  // Netz: dunkler Hintergrund, nach hinten tiefer, mit Rautenmaschen
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, goalW, goalH);
  ctx.clip();
  const back = facingRight ? x : x + goalW;
  const g = ctx.createLinearGradient(back, 0, facingRight ? x + goalW : x, 0);
  g.addColorStop(0, 'rgba(0,0,0,0.45)');
  g.addColorStop(1, 'rgba(0,0,0,0.15)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, goalW, goalH);
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 1;
  const mesh = Math.max(6, goalH / 14);
  ctx.beginPath();
  for (let d = -goalH; d < goalW + goalH; d += mesh) {
    ctx.moveTo(x + d, y);
    ctx.lineTo(x + d + goalH, y + goalH);
    ctx.moveTo(x + d, y + goalH);
    ctx.lineTo(x + d + goalH, y);
  }
  ctx.stroke();
  ctx.restore();

  // Schatten der Pfosten auf dem Rasen
  ctx.save();
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = postR * 2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  const sx = facingRight ? x + goalW : x;
  ctx.moveTo(sx + 3, y + 5);
  ctx.lineTo(sx + 3, y + goalH + 5);
  ctx.stroke();
  ctx.restore();

  // Pfosten (weiß, dick)
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = postR * 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Torpfosten oben
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + goalW, y);
  ctx.stroke();

  // Torpfosten unten
  ctx.beginPath();
  ctx.moveTo(x, y + goalH);
  ctx.lineTo(x + goalW, y + goalH);
  ctx.stroke();

  // Querbalken (die Linie zur Spielfeldseite)
  const qx = facingRight ? x : x + goalW;
  ctx.beginPath();
  ctx.moveTo(qx, y);
  ctx.lineTo(qx, y + goalH);
  ctx.stroke();

  // Glow
  ctx.shadowColor = 'rgba(255,255,255,0.6)';
  ctx.shadowBlur = 8;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x, y); ctx.lineTo(x + goalW, y);
  ctx.moveTo(x, y + goalH); ctx.lineTo(x + goalW, y + goalH);
  ctx.moveTo(qx, y); ctx.lineTo(qx, y + goalH);
  ctx.stroke();
  ctx.shadowBlur = 0;
}

let ballRoll = 0;

function drawBall(x, y, r) {
  const speed = Math.hypot(ball.vx * W(), ball.vy * H());
  ballRoll += speed / r;

  ctx.save();
  // Bewegungsspur bei schnellen Schüssen
  if (speed > r * 0.6) {
    const steps = 5;
    for (let i = steps; i > 0; i--) {
      ctx.fillStyle = `rgba(255,255,255,${0.12 * (1 - i / (steps + 1))})`;
      ctx.beginPath();
      ctx.arc(x - ball.vx * W() * i * 1.5, y - ball.vy * H() * i * 1.5, r * (1 - i * 0.1), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Schatten
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(x + 3, y + 4, r * 0.9, r * 0.45, 0, 0, Math.PI * 2);
  ctx.fill();

  // Spielball mit Schattierung; im Schnee orange, damit man ihn sieht
  const orange = weather === 'snow' && inMatch();
  const grad = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
  grad.addColorStop(0, orange ? '#ffc27a' : '#ffffff');
  grad.addColorStop(0.7, orange ? '#ff8a1f' : '#e8e8e8');
  grad.addColorStop(1, orange ? '#c25400' : '#a8a8a8');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();

  // Schwarze Fünfecke drehen sich, wenn der Ball rollt
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.clip();
  ctx.translate(x, y);
  ctx.rotate(ballRoll);
  const pentagon = (px, py, size, rot) => {
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = rot + i * Math.PI * 2 / 5;
      ctx.lineTo(px + Math.cos(a) * size, py + Math.sin(a) * size);
    }
    ctx.closePath();
    ctx.fill();
  };
  ctx.fillStyle = '#1a1a1a';
  pentagon(0, 0, r * 0.32, -Math.PI / 2);
  // Nähte vom Mittel-Fünfeck zu den äußeren
  ctx.strokeStyle = 'rgba(0,0,0,0.45)';
  ctx.lineWidth = Math.max(0.6, r * 0.06);
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + i * Math.PI * 2 / 5;
    ctx.moveTo(Math.cos(a) * r * 0.32, Math.sin(a) * r * 0.32);
    ctx.lineTo(Math.cos(a) * r * 0.62, Math.sin(a) * r * 0.62);
  }
  ctx.stroke();
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + Math.PI / 5 + i * Math.PI * 2 / 5;
    pentagon(Math.cos(a) * r * 0.95, Math.sin(a) * r * 0.95, r * 0.3, a + Math.PI);
  }
  ctx.restore();

  // Rand und Glanzpunkt
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath();
  ctx.ellipse(x - r * 0.28, y - r * 0.3, r * 0.22, r * 0.14, -0.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// Farbe heller (amt > 0) oder dunkler (amt < 0) machen
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = c => Math.max(0, Math.min(255, Math.round(amt > 0 ? c + (255 - c) * amt : c * (1 + amt))));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}

// motion: { moving, phase, face } – face ist 1 (nach rechts) oder -1 (nach links)
function drawPlayer(x, y, size, color, label, celebrate=false, numColor='rgba(255,255,255,0.9)', style={}, appearance={}, motion={}) {
  const skinCol  = appearance.skin     || '#d4956a';
  const skinDark = appearance.skinDark || '#b07040';
  const hairCol  = appearance.hair     || '#4a2800';
  const hairStyle= appearance.hairStyle|| 'short';
  const shortsCol = style.shortsColor || '#333';
  const socksCol  = style.socksColor  || '#333';
  const face   = motion.face || 1;
  const moving = !!motion.moving && !celebrate;
  const swing  = moving ? Math.sin(motion.phase || 0) : 0;
  const s = size;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Jubel: hüpfen; Laufen: leichtes Auf und Ab
  const bounce = celebrate ? Math.abs(Math.sin(Date.now()*0.01)) * s * 0.5
               : moving ? Math.abs(swing) * s * 0.06 : 0;
  y -= bounce;

  // Schatten (kleiner beim Hüpfen)
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  const shadowScale = celebrate ? Math.max(0.3, 1 - bounce/s) : 1;
  ctx.ellipse(x + 3, y + s * 1.76 + bounce, s * 0.5 * shadowScale, s * 0.13 * shadowScale, 0, 0, Math.PI * 2);
  ctx.fill();

  // Beine: Hüfte -> Knie -> Knöchel, beim Laufen schwingen sie gegengleich
  function leg(side, sw) {
    const hipX = x + side * s * 0.13, hipY = y + s * 0.95;
    let kneeX = hipX + sw * s * 0.18 * face, kneeY = y + s * 1.28 - Math.max(0, sw) * s * 0.06;
    let footX = hipX + sw * s * 0.3 * face + side * s * 0.03, footY = y + s * 1.66 - Math.max(0, -sw) * s * 0.12;
    if (celebrate) { kneeX = hipX + side * s * 0.12; footX = hipX + side * s * 0.02; footY = y + s * 1.62; }
    // Oberschenkel (Haut unter der Hose)
    ctx.strokeStyle = skinDark;
    ctx.lineWidth = s * 0.17;
    ctx.beginPath(); ctx.moveTo(hipX, hipY); ctx.lineTo(kneeX, kneeY); ctx.stroke();
    // Stutzen
    ctx.strokeStyle = socksCol;
    ctx.lineWidth = s * 0.15;
    ctx.beginPath(); ctx.moveTo(kneeX, kneeY + s * 0.04); ctx.lineTo(footX, footY); ctx.stroke();
    if (style.socksStripe) {
      ctx.strokeStyle = style.socksStripe;
      ctx.lineWidth = s * 0.155;
      const t = 0.15;
      ctx.beginPath();
      ctx.moveTo(kneeX + (footX - kneeX) * t, kneeY + (footY - kneeY) * t + s * 0.03);
      ctx.lineTo(kneeX + (footX - kneeX) * (t + 0.12), kneeY + (footY - kneeY) * (t + 0.12) + s * 0.03);
      ctx.stroke();
    }
    // Fußballschuh mit Sohle
    ctx.fillStyle = '#151515';
    ctx.beginPath();
    ctx.ellipse(footX + face * s * 0.07, footY + s * 0.05, s * 0.15, s * 0.07, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e8e8e8';
    ctx.fillRect(footX - s * 0.04, footY + s * 0.02, s * 0.12 * face, s * 0.025);
  }
  // Hinteres Bein zuerst, damit das vordere darüber liegt
  leg(-1, swing);
  leg(1, -swing);

  // Hose
  ctx.fillStyle = shortsCol;
  ctx.beginPath();
  ctx.moveTo(x - s * 0.29, y + s * 0.78);
  ctx.lineTo(x + s * 0.29, y + s * 0.78);
  ctx.lineTo(x + s * 0.3,  y + s * 1.08);
  ctx.lineTo(x + s * 0.03, y + s * 1.08);
  ctx.lineTo(x,            y + s * 0.98);
  ctx.lineTo(x - s * 0.03, y + s * 1.08);
  ctx.lineTo(x - s * 0.3,  y + s * 1.08);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(x - s * 0.29, y + s * 0.78, s * 0.58, s * 0.05);
  if (style.shortsStripe) {
    ctx.fillStyle = style.shortsStripe;
    ctx.fillRect(x - s * 0.3, y + s * 0.83, s * 0.04, s * 0.25);
    ctx.fillRect(x + s * 0.26, y + s * 0.83, s * 0.04, s * 0.25);
  }

  // Arme: Ärmel in Trikotfarbe, dann Unterarm und Hand
  const longSleeves = !style.shortSleeves;
  function arm(side, sw) {
    const shX = x + side * s * 0.3, shY = y + s * 0.22;
    let elX = shX + side * s * 0.08 - sw * s * 0.14 * face, elY = y + s * 0.5;
    let hdX = elX + side * s * 0.02 - sw * s * 0.12 * face, hdY = y + s * 0.74 - Math.abs(sw) * s * 0.06;
    if (celebrate) {
      const wave = Math.sin(Date.now() * 0.008) * s * 0.12 * side;
      elX = shX + side * s * 0.22; elY = y - s * 0.05;
      hdX = shX + side * s * 0.4;  hdY = y - s * 0.4 + wave;
    }
    ctx.lineWidth = s * 0.15;
    ctx.strokeStyle = style.sleeveColor || color;
    ctx.beginPath(); ctx.moveTo(shX, shY); ctx.lineTo(elX, elY);
    if (longSleeves) ctx.lineTo(hdX, hdY);
    ctx.stroke();
    if (!longSleeves && style.trim) {
      ctx.strokeStyle = style.trim;
      ctx.lineWidth = s * 0.155;
      const cx0 = shX + (elX - shX) * 0.82, cy0 = shY + (elY - shY) * 0.82;
      ctx.beginPath(); ctx.moveTo(cx0, cy0); ctx.lineTo(elX, elY); ctx.stroke();
    }
    if (!longSleeves) {
      ctx.strokeStyle = skinDark;
      ctx.lineWidth = s * 0.12;
      ctx.beginPath(); ctx.moveTo(elX, elY); ctx.lineTo(hdX, hdY); ctx.stroke();
    }
    ctx.fillStyle = style.gloves ? '#f5f5f5' : skinCol;
    ctx.beginPath(); ctx.arc(hdX, hdY, s * (style.gloves ? 0.1 : 0.07), 0, Math.PI * 2); ctx.fill();
  }
  arm(-1, -swing);

  // Trikot: breite Schultern, schmalere Taille, mit Licht von links
  function shirt() {
    ctx.beginPath();
    ctx.moveTo(x - s * 0.36, y + s * 0.2);
    ctx.quadraticCurveTo(x, y + s * 0.1, x + s * 0.36, y + s * 0.2);
    ctx.lineTo(x + s * 0.3, y + s * 0.84);
    ctx.quadraticCurveTo(x, y + s * 0.88, x - s * 0.3, y + s * 0.84);
    ctx.closePath();
  }
  shirt();
  ctx.fillStyle = color;
  ctx.fill();
  if (style.pattern || style.sidePanel) {
    ctx.save();
    shirt(); ctx.clip();
    if (style.pattern === 'pinstripes') {
      ctx.fillStyle = style.patternColor;
      for (let px = -0.3; px <= 0.3; px += 0.1) ctx.fillRect(x + px * s - s * 0.008, y, s * 0.016, s);
    } else if (style.pattern === 'stripes') {
      ctx.fillStyle = style.patternColor;
      for (let px = -0.33; px <= 0.3; px += 0.18) ctx.fillRect(x + px * s, y, s * 0.09, s);
    } else if (style.pattern === 'hoops') {
      ctx.fillStyle = style.patternColor;
      for (let py = 0.3; py < 0.85; py += 0.14) ctx.fillRect(x - s * 0.4, y + py * s, s * 0.8, s * 0.06);
    } else if (style.pattern === 'checks') {
      ctx.fillStyle = style.patternColor;
      const q = s * 0.1;
      for (let i = 0; i < 8; i++) for (let j = 0; j < 10; j++) if ((i + j) % 2) ctx.fillRect(x - s * 0.4 + i * q, y + j * q, q, q);
    } else if (style.pattern === 'chevron') {
      ctx.strokeStyle = style.patternColor;
      ctx.lineWidth = s * 0.06;
      ctx.beginPath();
      ctx.moveTo(x - s * 0.4, y + s * 0.28); ctx.lineTo(x, y + s * 0.42); ctx.lineTo(x + s * 0.4, y + s * 0.28);
      ctx.stroke();
    }
    if (style.sidePanel) {
      ctx.fillStyle = style.sidePanel;
      ctx.fillRect(x - s * 0.4, y, s * 0.1, s);
      ctx.fillRect(x + s * 0.3, y, s * 0.1, s);
    }
    ctx.restore();
    shirt();
  }
  const light = ctx.createLinearGradient(x - s * 0.36, 0, x + s * 0.36, 0);
  light.addColorStop(0, 'rgba(255,255,255,0.22)');
  light.addColorStop(0.5, 'rgba(255,255,255,0)');
  light.addColorStop(1, 'rgba(0,0,0,0.25)');
  ctx.fillStyle = light;
  ctx.fill();
  // Falten
  ctx.strokeStyle = 'rgba(0,0,0,0.12)';
  ctx.lineWidth = s * 0.025;
  ctx.beginPath();
  ctx.moveTo(x - s * 0.18, y + s * 0.7); ctx.quadraticCurveTo(x - s * 0.1, y + s * 0.6, x - s * 0.2, y + s * 0.5);
  ctx.moveTo(x + s * 0.2,  y + s * 0.72); ctx.quadraticCurveTo(x + s * 0.12, y + s * 0.62, x + s * 0.22, y + s * 0.52);
  ctx.stroke();
  // Kragen
  ctx.strokeStyle = style.trim || shade(color.startsWith('#') ? color : '#888888', -0.35);
  ctx.lineWidth = s * 0.05;
  ctx.beginPath();
  ctx.moveTo(x - s * 0.1, y + s * 0.15);
  ctx.lineTo(x, y + s * 0.26);
  ctx.lineTo(x + s * 0.1, y + s * 0.15);
  ctx.stroke();

  arm(1, swing);

  // Rückennummer
  ctx.fillStyle = numColor || 'rgba(255,255,255,0.9)';
  ctx.font = `bold ${s * 0.32}px system-ui`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, x, y + s * 0.52);

  // Hals
  ctx.strokeStyle = skinDark;
  ctx.lineWidth = s * 0.12;
  ctx.beginPath(); ctx.moveTo(x, y + s * 0.02); ctx.lineTo(x, y + s * 0.16); ctx.stroke();

  // Kopf: etwas länger als breit, Gesicht schaut in Laufrichtung
  const hx = x, hy = y - s * 0.1;
  const look = face * s * 0.04;
  const headGrad = ctx.createRadialGradient(hx - s * 0.07, hy - s * 0.07, s * 0.03, hx, hy, s * 0.24);
  headGrad.addColorStop(0, skinCol);
  headGrad.addColorStop(1, skinDark);
  ctx.fillStyle = headGrad;
  ctx.beginPath();
  ctx.ellipse(hx, hy, s * 0.19, s * 0.22, 0, 0, Math.PI * 2);
  ctx.fill();
  // Ohren
  ctx.fillStyle = skinDark;
  ctx.beginPath(); ctx.ellipse(hx - s * 0.19, hy + s * 0.02, s * 0.04, s * 0.06, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(hx + s * 0.19, hy + s * 0.02, s * 0.04, s * 0.06, 0, 0, Math.PI * 2); ctx.fill();

  // Haare
  ctx.fillStyle = hairCol;
  if (hairStyle === 'curly') {
    for (let i = 0; i < 6; i++) {
      const a = Math.PI + 0.25 + i * (Math.PI - 0.5) / 5;
      ctx.beginPath();
      ctx.arc(hx + Math.cos(a) * s * 0.17, hy - s * 0.02 + Math.sin(a) * s * 0.19, s * 0.08, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (hairStyle === 'buzz') {
    ctx.globalAlpha = 0.75;
    ctx.beginPath();
    ctx.ellipse(hx, hy - s * 0.03, s * 0.19, s * 0.2, 0, Math.PI * 1.05, Math.PI * 1.95);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  } else if (hairStyle === 'bun') {
    // Haare nach hinten gebunden, Dutt oben auf dem Kopf
    ctx.beginPath();
    ctx.ellipse(hx, hy - s * 0.03, s * 0.2, s * 0.21, 0, Math.PI * 1.02, Math.PI * 1.98);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.arc(hx - s * 0.02, hy - s * 0.25, s * 0.08, 0, Math.PI * 2);
    ctx.fill();
  } else if (hairStyle === 'top') {
    // Seiten kurz, oben länger
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.ellipse(hx, hy - s * 0.03, s * 0.19, s * 0.2, 0, Math.PI * 1.05, Math.PI * 1.95);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.ellipse(hx + s * 0.02, hy - s * 0.18, s * 0.15, s * 0.09, -0.15, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.ellipse(hx, hy - s * 0.04, s * 0.2, s * 0.2, 0, Math.PI * 1.03, Math.PI * 1.97);
    ctx.quadraticCurveTo(hx + s * 0.05, hy - s * 0.12, hx - s * 0.19, hy - s * 0.06);
    ctx.fill();
  }
  if (appearance.beard) {
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(hx, hy, s * 0.19, s * 0.22, 0, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = hairCol;
    ctx.globalAlpha = appearance.beard === 'stubble' ? 0.35 : 0.8;
    ctx.beginPath();
    ctx.ellipse(hx, hy + s * 0.15, s * 0.2, s * 0.12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Augenbrauen und Augen
  const ex = s * 0.075, ey = hy + s * 0.0;
  ctx.strokeStyle = shade(hairCol.length === 7 ? hairCol : '#444444', -0.2);
  ctx.lineWidth = s * 0.03;
  ctx.beginPath();
  ctx.moveTo(hx - ex - s * 0.04 + look, ey - s * 0.06); ctx.lineTo(hx - ex + s * 0.04 + look, ey - s * 0.07);
  ctx.moveTo(hx + ex - s * 0.04 + look, ey - s * 0.07); ctx.lineTo(hx + ex + s * 0.04 + look, ey - s * 0.06);
  ctx.stroke();
  if (celebrate) {
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = s * 0.03;
    ctx.beginPath();
    ctx.arc(hx - ex + look, ey + s * 0.01, s * 0.035, Math.PI, 0);
    ctx.moveTo(hx + ex + look + s * 0.035, ey + s * 0.01);
    ctx.arc(hx + ex + look, ey + s * 0.01, s * 0.035, 0, Math.PI, true);
    ctx.stroke();
  } else {
    for (const ox of [-ex, ex]) {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(hx + ox + look, ey, s * 0.04, s * 0.028, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2b1a0e';
      ctx.beginPath(); ctx.arc(hx + ox + look * 1.6, ey, s * 0.022, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Nase
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.lineWidth = s * 0.025;
  ctx.beginPath();
  ctx.moveTo(hx + look * 1.5, ey + s * 0.02);
  ctx.lineTo(hx + look * 1.5 + face * s * 0.025, ey + s * 0.08);
  ctx.lineTo(hx + look * 1.5, ey + s * 0.09);
  ctx.stroke();

  // Mund
  if (celebrate) {
    ctx.fillStyle = '#5a1a10';
    ctx.beginPath(); ctx.ellipse(hx + look, ey + s * 0.14, s * 0.06, s * 0.045, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillRect(hx + look - s * 0.045, ey + s * 0.105, s * 0.09, s * 0.02);
  } else {
    ctx.strokeStyle = '#8a4a3a';
    ctx.lineWidth = s * 0.025;
    ctx.beginPath();
    ctx.moveTo(hx + look - s * 0.045, ey + s * 0.135);
    ctx.quadraticCurveTo(hx + look, ey + s * 0.155, hx + look + s * 0.045, ey + s * 0.135);
    ctx.stroke();
  }

  ctx.restore();
}

const KICK_SPD    = 0.035;
const PASS_SPD    = 0.022;
const TACKLE_DIST = 0.1;
const PICKUP_DIST = 0.055;
// Feldlinien-Position (für Zeichnung und Tore)
const FPADX = 0.06, FPADY = 0.07;
// Spieler-Grenzen — deutlich innen (Arme ~size*0.7 breit, size=0.07*min)
const FL = 0.12, FR = 0.88, FT = 0.10, FB = 0.90;
// Tor-Bereich (Ball darf rein)
const GOAL_T = 0.40, GOAL_B = 0.60;
// GOAL_T / GOAL_B already defined above

// ── Audio ──────────────────────────────────────────────────────────
let AC = null;
let noiseBuffer = null;
let crowdSource = null, crowdGainNode = null, crowdLFO = null;
let menuTimer = null;
let lastAudioState = '';

function getAC() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  return AC;
}

function getNoiseBuf() {
  if (noiseBuffer) return noiseBuffer;
  const ac = getAC(), sr = ac.sampleRate;
  noiseBuffer = ac.createBuffer(1, sr * 2, sr);
  const d = noiseBuffer.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random()*2-1;
  return noiseBuffer;
}

// Fangesänge — gefiltertes Rauschen mit Rhythmus-LFO
function startCrowd() {
  if (crowdSource) return;
  const ac = getAC();
  crowdSource = ac.createBufferSource();
  crowdSource.buffer = getNoiseBuf(); crowdSource.loop = true;
  const bp = ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=700; bp.Q.value=1.8;
  const bp2 = ac.createBiquadFilter(); bp2.type='bandpass'; bp2.frequency.value=1400; bp2.Q.value=2;
  crowdGainNode = ac.createGain(); crowdGainNode.gain.value=0.25;
  // LFO für Gesangs-Rhythmus (~1.2Hz = Fansgesang-Takt)
  crowdLFO = ac.createOscillator(); crowdLFO.type='sine'; crowdLFO.frequency.value=1.2;
  const lfoGain = ac.createGain(); lfoGain.gain.value=0.15;
  crowdLFO.connect(lfoGain); lfoGain.connect(crowdGainNode.gain);
  crowdSource.connect(bp); bp.connect(bp2); bp2.connect(crowdGainNode); crowdGainNode.connect(ac.destination);
  crowdSource.start(); crowdLFO.start();
}

function stopCrowd() {
  if (!crowdSource) return;
  try { crowdSource.stop(); crowdLFO.stop(); } catch(e){}
  crowdSource = null; crowdGainNode = null; crowdLFO = null;
}
