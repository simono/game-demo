// Formanten (Hz) der Vokale einer tiefen Männerstimme
const VOWELS = {
  a:[730,1090,2440], e:[530,1840,2480], i:[270,2290,3010], o:[570,840,2410], u:[300,870,2240],
};
const CHOIR_BEAT = 0.32;
let choirOut = null;

function getChoirOut() {
  if (choirOut) return choirOut;
  const ac = getAC();
  choirOut = ac.createGain();
  choirOut.gain.value = 0.5;
  // Stadion-Echo: kurzes Delay mit Rückkopplung
  const delay = ac.createDelay(1), fb = ac.createGain(), lp = ac.createBiquadFilter();
  delay.delayTime.value = 0.13; fb.gain.value = 0.35;
  lp.type = 'lowpass'; lp.frequency.value = 2500;
  choirOut.connect(ac.destination);
  choirOut.connect(delay); delay.connect(lp); lp.connect(fb); fb.connect(delay);
  lp.connect(ac.destination);
  return choirOut;
}

// Viele leicht verstimmte, leicht versetzte Stimmen durch Vokal-Filter = grölende Menge
function singSyllable(vowel, freq, t, dur) {
  const ac = getAC(), out = getChoirOut();
  const sum = ac.createGain();
  sum.gain.value = 1;
  for (const f of VOWELS[vowel]) {
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = 7;
    sum.connect(bp); bp.connect(out);
  }
  const voices = 14;
  for (let v = 0; v < voices; v++) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sawtooth';
    const octave = v < 3 ? 2 : 1;          // ein paar höhere Stimmen
    o.frequency.value = freq * octave * (1 + (Math.random() - 0.5) * 0.035);
    const st = t + Math.random() * 0.06, en = t + dur * (0.85 + Math.random() * 0.2);
    g.gain.setValueAtTime(0.0001, st);
    g.gain.exponentialRampToValueAtTime(0.05, st + 0.05);
    g.gain.setValueAtTime(0.05, en - 0.08);
    g.gain.exponentialRampToValueAtTime(0.0001, en);
    o.connect(g); g.connect(sum);
    o.start(st); o.stop(en + 0.02);
  }
  // Rauschen für das Raue in den Stimmen
  const n = ac.createBufferSource(), ng = ac.createGain();
  n.buffer = getNoiseBuf();
  ng.gain.setValueAtTime(0.25, t);
  ng.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  n.connect(ng); ng.connect(sum);
  n.start(t, Math.random()); n.stop(t + dur);
}

// Spielt das Silbenmuster, liefert die Dauer in Sekunden
function singChoir(pattern) {
  const ac = getAC();
  let t = ac.currentTime + 0.05;
  const base = 196; // G3
  for (const tok of pattern.split(' ')) {
    if (tok[0] === '-') { t += parseFloat(tok.slice(1)) * CHOIR_BEAT; continue; }
    const vowel = tok[0];
    const [beats, semi] = tok.slice(1).split(':').map(Number);
    const dur = beats * CHOIR_BEAT;
    singSyllable(vowel, base * Math.pow(2, semi / 12), t, dur);
    t += dur;
  }
  return t - ac.currentTime;
}

function crowdClaps(times, gap, delay=0) {
  const ac = getAC(), t0 = ac.currentTime + 0.05 + delay;
  for (let i = 0; i < times; i++) {
    // Viele Hände, leicht versetzt
    for (let h = 0; h < 6; h++) {
      const t = t0 + i * gap + Math.random() * 0.03;
      const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      src.buffer = getNoiseBuf();
      f.type = 'bandpass'; f.frequency.value = 1000 + Math.random() * 1500; f.Q.value = 1.2;
      g.gain.setValueAtTime(0.12, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
      src.connect(f); f.connect(g); g.connect(ac.destination);
      src.start(t, Math.random()); src.stop(t + 0.1);
    }
  }
}

function crowdSwell(on) {
  if (!crowdGainNode) return;
  crowdGainNode.gain.setTargetAtTime(on ? 0.45 : 0.25, getAC().currentTime, 0.3);
}

let chantTimer = null;
function chant(club, isGoal) {
  const set = CHANTS[club.short];
  if (!set) return;
  // Text und Sprache stehen nur zur Übersicht in CHANTS; sprechen darf allein der Kommentator
  const [, , pattern] = isGoal ? set.goal : set.songs[Math.floor(Math.random() * set.songs.length)];
  stopChants();
  crowdSwell(true);
  const dur = singChoir(pattern);
  crowdClaps(3, 0.28, dur + 0.1);
  chantTimer = setTimeout(() => crowdSwell(false), (dur + 1.2) * 1000);
  nextChantBusyUntil = Date.now() + (dur + 1.2) * 1000;
}
let nextChantBusyUntil = 0;

function stopChants() {
  if (chantTimer) { clearTimeout(chantTimer); chantTimer = null; }
  crowdSwell(false);
}

// Während des Spiels singen alle 5–9 Sekunden die Fans, meistens die Heimfans
function updateChants() {
  if (gameState !== 'playing') return;
  const now = Date.now();
  if (!nextChantAt) { nextChantAt = now + 2000; return; }
  if (now < nextChantAt || now < nextChantBusyUntil) return;
  chant(Math.random() < 0.7 ? playerClub : opponentClub, false);
  nextChantAt = now + 5000 + Math.random() * 4000;
}

// Kommentator: spricht Deutsch über die Sprachausgabe und zeigt den Satz oben an.
// Wichtigeres (höhere Stufe) unterbricht Unwichtigeres, Geplauder braucht Pausen.
let commentOn = true;
try { commentOn = localStorage.getItem('kickit-comment') !== 'off'; } catch (e) {}
let commentLine = '', commentShownUntil = 0, commentBusyUntil = 0, commentQuietUntil = 0, commentPrio = 0, commentId = 0;
const pick = a => a[Math.floor(Math.random() * a.length)];
const MENU_STATES = ['start', 'title', 'menu', 'mode', 'cup', 'season'];
const inMatch = () => !MENU_STATES.includes(gameState);

// Es ist immer höchstens ein Satz unterwegs. Ob gerade gesprochen wird, sagt die
// Sprachausgabe selbst; Sätze, die zu spät drankommen, werden verworfen statt nachgeholt.
function say(lines, prio, anywhere = false) {
  if (!commentOn || (!anywhere && !inMatch())) return;
  const now = Date.now(), synth = window.speechSynthesis;
  const talking = synth ? synth.speaking || synth.pending : now < commentBusyUntil;
  if (talking && prio <= commentPrio) return;
  if (!talking && prio < 2 && now < commentQuietUntil) return;
  const text = Array.isArray(lines) ? pick(lines) : lines;
  const id = ++commentId;
  commentPrio = prio;
  const show = () => { commentLine = text; commentShownUntil = Date.now() + 1500 + text.length * 70; };
  if (!synth) {
    show();
    commentBusyUntil = now + 500 + text.length * 70;
    commentQuietUntil = commentBusyUntil + 1500;
    return;
  }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE';
  const voice = synth.getVoices().find(v => v.lang.replace('_', '-').startsWith('de'));
  if (voice) u.voice = voice;
  u.rate = 1.15; u.pitch = 1.05; u.volume = 1;
  u.onstart = () => {
    if (id !== commentId || Date.now() - now > 1200 || (!anywhere && !inMatch())) { synth.cancel(); return; }
    show();
  };
  u.onend = u.onerror = () => { if (id === commentId) { commentPrio = 0; commentQuietUntil = Date.now() + 1500; } };
  if (talking) synth.cancel();
  synth.speak(u);
}

function setCommentOn(on) {
  commentOn = on;
  try { localStorage.setItem('kickit-comment', on ? 'on' : 'off'); } catch (e) {}
  if (!on) { commentLine = ''; if (window.speechSynthesis) speechSynthesis.cancel(); }
}

const spokenClub = club => clubEntry(club).label.replace("M'gladbach", 'Gladbach');
function scoreLine() {
  const l = playerTeam === 'red' ? playerClub : opponentClub, r = playerTeam === 'red' ? opponentClub : playerClub;
  return `${spokenClub(l)} ${score.red}, ${spokenClub(r)} ${score.blue}.`;
}

// Beobachtet das Spiel und kommentiert, was sich seit dem letzten Bild geändert hat
let cPrevState = 'title', cPrevOwner = null, cLastTouch = null, cShot = null, cSaid10 = false, cPrevExtra = false;
function updateCommentary() {
  const st = gameState, prev = cPrevState, now = Date.now();
  cPrevState = st;
  if (st !== prev) {
    if (st === 'playing' && ['menu', 'cup', 'season'].includes(prev)) {
      cSaid10 = false; cPrevExtra = false; cShot = null;
      const comp = mode === 'cl' ? `${cup.wm ? 'Weltmeisterschaft' : 'Champions League'}, ${cupRounds()[cup.round]}! ` : mode === 'season' ? `${season.day + 1}. Spieltag! ` : '';
      const wx = { rain:' Es regnet, der Rasen ist rutschig!', snow:' Es schneit! Heute wird mit dem orangen Ball gespielt.' }[weather] || '';
      say([`${comp}Herzlich willkommen! Wir sind live dabei: ${playerClub.stadium}. ${spokenClub(playerClub)} gegen ${spokenClub(opponentClub)}. Der Ball rollt!${wx}`,
           `${comp}Hallo und willkommen zum Spiel ${spokenClub(playerClub)} gegen ${spokenClub(opponentClub)}!${wx} Anpfiff!`], 3);
    } else if (st === 'playing' && prev === 'halftime') {
      say(['Weiter geht\'s mit der zweiten Halbzeit!', 'Die zweite Halbzeit läuft!'], 3);
    } else if (st === 'goal') {
      const club = goalTeam === playerTeam ? playerClub : opponentClub;
      const s = goalScorer;
      const who = s && s.team === goalTeam ? `${playerName(s)} trifft für ${spokenClub(club)}! ` : s ? `Eigentor von ${playerName(s)}! ` : '';
      say(`${pick(['Tooor!', 'Tor! Tor! Tor!', 'Und drin ist das Ding!'])} ${who}${scoreLine()}`, 4);
      cShot = null;
    } else if (st === 'replay') {
      say(['Das schauen wir uns nochmal in Zeitlupe an!', 'Hier kommt die Zeitlupe!', 'Nochmal in Zeitlupe!'], 2);
    } else if (st === 'halftime') {
      say(`Halbzeit! ${scoreLine()}`, 4);
    } else if (st === 'fulltime') {
      const lead = score.red - score.blue;
      const winnerTeam = lead > 0 ? 'red' : lead < 0 ? 'blue' : null;
      const winner = winnerTeam && (winnerTeam === playerTeam ? playerClub : opponentClub);
      say(winner ? `Abpfiff! ${spokenClub(winner)} gewinnt! ${scoreLine()}` : `Abpfiff! Unentschieden! ${scoreLine()}`, 4);
    } else if (st === 'foul' && setPiece) {
      const f = playerName(setPiece.fouler), v = playerName(setPiece.victim);
      const card = { yellow:` Gelbe Karte für ${f}!`, yellowred:` Gelb-Rot! ${f} muss vom Platz!`, red:` Rote Karte! ${f} fliegt vom Platz!` }[setPiece.card] || '';
      const next = setPiece.type === 'penalty' ? ' Elfmeter!' : ' Freistoß.';
      say(`${pick([`Foul von ${f} an ${v}!`, `Oh, ${f} holt ${v} von den Beinen!`])}${card}${next}`, 3);
      cShot = null;
    } else if (st === 'penalty' && penalty) {
      say(`${playerName(penalty.taker)} legt sich den Ball zurecht. Gegenüber steht ${playerName(penalty.keeper)}.`, 3);
    }
  }
  if (st === 'penalty' && penalty && penalty.phase === 'result' && penalty.outcome === 'save' && !penalty.commented) {
    penalty.commented = true;
    say(`Gehalten! ${playerName(penalty.keeper)} pariert den Elfmeter!`, 4);
  }
  if (inExtra && !cPrevExtra && st === 'playing') say('Unentschieden! Es gibt dreißig Sekunden Verlängerung!', 3);
  cPrevExtra = inExtra;
  if (st !== 'playing') { cPrevOwner = ballOwner; return; }

  if (currentHalf === 2 && halfTimeLeft <= 10 && halfTimeLeft > 8 && !cSaid10 && !inExtra) {
    cSaid10 = true;
    say('Noch zehn Sekunden!', 2);
  }

  const owner = ballOwner, before = cPrevOwner;
  cPrevOwner = owner;
  if (owner) {
    if (owner.isKeeper && cShot && owner !== cShot.by) {
      say([`Gehalten! Klasse Parade von ${playerName(owner)}!`, `${playerName(owner)} hält den Ball fest!`, `Was für ein Reflex von ${playerName(owner)}!`], 2.5);
      cShot = null;
    } else if (!owner.isKeeper && before && before !== owner && before.team !== owner.team) {
      if (Math.random() < 0.35) say([`${playerName(owner)} erobert den Ball!`, `Ballgewinn durch ${playerName(owner)}!`, `${playerName(owner)} schnappt sich den Ball!`], 1);
    } else if (!owner.isKeeper && !before && cLastTouch && cLastTouch !== owner) {
      if (cLastTouch.team === owner.team) {
        if (Math.random() < 0.2) say([`${playerName(cLastTouch)} auf ${playerName(owner)}.`, `Schöner Pass zu ${playerName(owner)}.`, `${playerName(owner)} nimmt den Ball an.`], 1);
      } else if (Math.random() < 0.3) say([`Abgefangen von ${playerName(owner)}!`, `${playerName(owner)} geht dazwischen!`], 1);
      cShot = null;
    }
    if (owner !== cLastTouch) cLastTouch = owner;
    return;
  }
  // Schuss: Ball verlässt einen Feldspieler mit Schussgeschwindigkeit
  if (before && !before.isKeeper && Math.hypot(ball.vx, ball.vy) > KICK_SPD * 0.8) {
    cShot = { by: before, right: before.team === 'red', t: now };
    say([`${playerName(before)} zieht ab!`, `Schuss von ${playerName(before)}!`, `${playerName(before)} versucht es!`], 2);
  }
  if (cShot) {
    const atLine = cShot.right ? ball.x > 1 - FPADX - 0.025 : ball.x < FPADX + 0.025;
    if (atLine) { say(['Daneben!', 'Knapp vorbei!', 'Der war nicht weit weg!'], 2.5); cShot = null; }
    else if (now - cShot.t > 3000) cShot = null;
  }
}

// Wetter: vor dem Anpfiff wählbar
const WEATHERS = [
  { id:'random', label:'🎲 Zufall' },
  { id:'sun',    label:'☀️ Sonne' },
  { id:'rain',   label:'🌧️ Regen' },
  { id:'snow',   label:'❄️ Schnee' },
];
let weatherChoice = 'random', weather = 'sun', weatherParts = [], rainNode = null;
const weatherLabel = id => WEATHERS.find(x => x.id === id).label;
function rollWeather() {
  weather = weatherChoice === 'random' ? pick(['sun', 'rain', 'snow']) : weatherChoice;
  weatherParts = [];
}
// Nasser Rasen lässt den Ball weiter rollen, Schnee bremst ihn
const ballFriction = () => weather === 'rain' ? 1 - (1 - BALL_FRIC) * 0.6 : weather === 'snow' ? 1 - (1 - BALL_FRIC) * 1.6 : BALL_FRIC;

function drawWeatherTint(w, h) {
  if (weather === 'rain') { ctx.fillStyle = 'rgba(15,25,45,0.28)'; ctx.fillRect(0, 0, w, h); }
  if (weather === 'snow') {
    ctx.fillStyle = 'rgba(235,242,255,0.3)';
    ctx.fillRect(w * FPADX, h * FPADY, w * (1 - 2 * FPADX), h * (1 - 2 * FPADY));
  }
}

function drawSunshine(w, h) {
  const t = Date.now() / 1000;
  ctx.save();
  const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, Math.max(w, h) * 0.9);
  glow.addColorStop(0, 'rgba(255,236,150,0.45)'); glow.addColorStop(0.4, 'rgba(255,220,120,0.12)'); glow.addColorStop(1, 'rgba(255,220,120,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, w, h);
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 5; i++) {
    const a = 0.25 + i * 0.22 + Math.sin(t * 0.4 + i) * 0.03;
    ctx.fillStyle = 'rgba(255,240,180,0.05)';
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a - 0.04) * w * 1.5, Math.sin(a - 0.04) * w * 1.5);
    ctx.lineTo(Math.cos(a + 0.04) * w * 1.5, Math.sin(a + 0.04) * w * 1.5);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawWeather(w, h) {
  if (!inMatch()) return;
  if (weather === 'sun') { drawSunshine(w, h); return; }
  const rain = weather === 'rain', n = rain ? 160 : 110;
  while (weatherParts.length < n) weatherParts.push({ x: Math.random() * w, y: Math.random() * h, s: 0.5 + Math.random() });
  ctx.save();
  // In der Zeitlupe fällt auch der Niederschlag langsam
  const slow = gameState === 'replay' ? REPLAY_SPEED : 1;
  if (rain) { ctx.strokeStyle = 'rgba(200,220,255,0.75)'; ctx.lineWidth = 1.6; ctx.beginPath(); }
  else ctx.fillStyle = 'rgba(255,255,255,0.9)';
  for (const d of weatherParts) {
    if (rain) {
      d.y += 14 * d.s * slow; d.x -= 3 * d.s * slow;
      ctx.moveTo(d.x, d.y); ctx.lineTo(d.x + 3 * d.s, d.y - 14 * d.s);
    } else {
      d.y += 1.2 * d.s * slow; d.x += Math.sin(d.y * 0.02 + d.s * 10) * 0.6 * slow;
      ctx.beginPath(); ctx.arc(d.x, d.y, 1.5 + d.s * 1.8, 0, Math.PI * 2); ctx.fill();
    }
    if (d.y > h + 20) { d.y = -20; d.x = Math.random() * (w + 60); }
    if (d.x < -20) d.x = w + 10;
  }
  if (rain) ctx.stroke();
  ctx.restore();
}

// Regenrauschen: Rauschen durch einen Tief- und Hochpass
function startRain() {
  if (rainNode || weather !== 'rain') return;
  const ac = getAC();
  const src = ac.createBufferSource(); src.buffer = getNoiseBuf(); src.loop = true;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2500;
  const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 500;
  const g = ac.createGain(); g.gain.value = 0.07;
  src.connect(lp); lp.connect(hp); hp.connect(g); g.connect(ac.destination);
  src.start();
  rainNode = src;
}
function stopRain() {
  if (!rainNode) return;
  try { rainNode.stop(); } catch (e) {}
  rainNode = null;
}

// Zeitlupe: die letzten Sekunden werden mitgeschnitten und nach dem Tor langsam abgespielt
const REPLAY_KEEP_MS = 2600, REPLAY_SPEED = 0.35, REPLAY_HOLD_MS = 400;
const REPLAY_AUTO_MS = 2500;   // so lange jubelt der Tor-Bildschirm, dann kommt die Zeitlupe
let replayBuf = [], replay = null, goalShownAt = 0;
const snapshot = () => ({ ps: allPlayers.map(p => [p.x, p.y, p.diveAngle || 0]), b: [ball.x, ball.y, ballLift] });
function applySnapshot(s) {
  allPlayers.forEach((p, i) => { [p.x, p.y, p.diveAngle] = s.ps[i]; });
  [ball.x, ball.y, ballLift] = s.b;
}

function recordReplay() {
  if (gameState === 'goal') {
    const now = Date.now();
    if (!goalShownAt) goalShownAt = now;
    else if (now - goalShownAt > REPLAY_AUTO_MS) startReplay();
    return;
  }
  goalShownAt = 0;
  if (gameState !== 'playing' && gameState !== 'penalty') { replayBuf.length = 0; return; }
  const now = Date.now();
  replayBuf.push({ t: now, ...snapshot(), vx: ball.vx, vy: ball.vy });
  while (now - replayBuf[0].t > REPLAY_KEEP_MS) replayBuf.shift();
}

function startReplay() {
  const fr = replayBuf;
  replayBuf = [];
  if (fr.length < 10) { gameState = 'playing'; lastFrameMs = 0; return; }
  // Der letzte Mitschnitt ist kurz vor der Linie: Ball noch ins Netz rollen lassen
  const last = fr[fr.length - 1];
  for (let i = 1; i <= 18; i++) {
    const bx = Math.max(FPADX * 0.3, Math.min(1 - FPADX * 0.3, last.b[0] + last.vx * i));
    fr.push({ ...last, t: last.t + i * 17, b: [bx, last.b[1] + last.vy * i, last.b[2]] });
  }
  replay = { frames: fr, t0: fr[0].t, start: Date.now(), after: snapshot() };
  gameState = 'replay';
}

function endReplay() {
  if (!replay) return;
  applySnapshot(replay.after);
  replay = null;
  gameState = 'playing'; lastFrameMs = 0;
}

function updateReplay() {
  if (gameState !== 'replay') return;
  const fr = replay.frames, tt = replay.t0 + (Date.now() - replay.start) * REPLAY_SPEED;
  const endT = fr[fr.length - 1].t;
  if (tt > endT + REPLAY_HOLD_MS * REPLAY_SPEED) { endReplay(); return; }
  let i = fr.findIndex(f => f.t >= tt);
  if (i === -1) i = fr.length - 1;
  const a = fr[Math.max(0, i - 1)], b = fr[i];
  const k = b.t === a.t ? 1 : Math.max(0, Math.min(1, (tt - a.t) / (b.t - a.t)));
  const mix = (x, y) => x + (y - x) * k;
  allPlayers.forEach((p, j) => {
    p.x = mix(a.ps[j][0], b.ps[j][0]); p.y = mix(a.ps[j][1], b.ps[j][1]); p.diveAngle = mix(a.ps[j][2], b.ps[j][2]);
  });
  ball.x = mix(a.b[0], b.b[0]); ball.y = mix(a.b[1], b.b[1]); ballLift = mix(a.b[2], b.b[2]);
}

function drawReplayUI() {
  if (gameState !== 'replay') return;
  const w = W(), h = H(), bar = h * 0.09;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(0, 0, w, bar); ctx.fillRect(0, h - bar, w, bar);
  ctx.textBaseline = 'middle';
  if (Math.floor(Date.now() / 500) % 2) {
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath(); ctx.arc(22, bar / 2, bar * 0.18, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
  ctx.font = `900 ${bar * 0.45}px system-ui`;
  ctx.fillText('ZEITLUPE', 22 + bar * 0.35, bar / 2);
  ctx.textAlign = 'right';
  ctx.font = `${bar * 0.3}px system-ui`;
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText('Tippen zum Weiterspielen', w - 16, h - bar / 2);
  ctx.restore();
}

function drawCommentary() {
  if (!commentOn || !commentLine || ['start', 'title', 'menu', 'mode'].includes(gameState)) return;
  const left = commentShownUntil - Date.now();
  if (left <= 0) return;
  const w = W();
  ctx.save();
  ctx.globalAlpha = Math.min(1, left / 400);
  ctx.font = `bold ${Math.min(w * 0.032, 15)}px system-ui`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const text = `🎙️ ${commentLine}`;
  const tw = Math.min(ctx.measureText(text).width + 28, w - 24), th = 30, y = 56;
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  roundRect(w / 2 - tw / 2, y, tw, th, th / 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillText(text, w / 2, y + th / 2 + 1, tw - 20);
  ctx.restore();
}

// Titelmusik: Stadion-Hymne mit Schlagzeug, Bass, Akkorden und Melodie.
// Ein Takt hat 16 Schritte; die Noten werden kurz im Voraus eingeplant,
// damit der Takt auch bei ruckelndem Bild sauber bleibt.
const MUSIC_BPM  = 128;
const MUSIC_STEP = 60 / MUSIC_BPM / 4;
const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);
const MUSIC_CHORDS = [
  { bass:36, notes:[60,64,67] },  // C
  { bass:43, notes:[59,62,67] },  // G
  { bass:45, notes:[57,60,64] },  // Am
  { bass:41, notes:[57,60,65] },  // F
];
// [Schritt, Note, Länge in Schritten] pro Takt, 8 Takte
const MUSIC_LEAD = [
  [[0,67,3],[3,67,1],[4,69,2],[6,67,2],[8,72,4],[12,71,2],[14,69,2]],
  [[0,67,3],[3,67,1],[4,71,2],[6,74,2],[8,74,6]],
  [[0,72,3],[3,72,1],[4,76,2],[6,74,2],[8,72,4],[12,71,2],[14,69,2]],
  [[0,69,2],[2,72,2],[4,71,2],[6,69,2],[8,67,8]],
  [[0,76,2],[2,76,2],[4,76,4],[8,74,2],[10,72,2],[12,74,4]],
  [[0,74,2],[2,74,2],[4,74,4],[8,72,2],[10,71,2],[12,72,4]],
  [[0,72,2],[2,76,2],[4,79,4],[8,77,2],[10,76,2],[12,74,4]],
  [[0,72,4],[4,74,4],[8,71,4],[12,67,4]],
];
let musicStep = 0, musicNextTime = 0, musicOut = null;

function musicVoice(type, freq, t, dur, vol, filterHz) {
  const ac = getAC();
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
  g.gain.setValueAtTime(vol, t + dur * 0.7);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  let node = o;
  if (filterHz) {
    const f = ac.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = filterHz;
    o.connect(f); node = f;
  }
  node.connect(g); g.connect(musicOut);
  o.start(t); o.stop(t + dur + 0.02);
}

function musicNoise(t, dur, vol, type, freq) {
  const ac = getAC();
  const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = getNoiseBuf();
  f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(musicOut);
  src.start(t, Math.random() * 0.5); src.stop(t + dur);
}

function musicKick(t) {
  const ac = getAC();
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
  g.gain.setValueAtTime(0.55, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
  o.connect(g); g.connect(musicOut);
  o.start(t); o.stop(t + 0.26);
}

function playMusicStep(step, t) {
  const bar = Math.floor(step / 16) % MUSIC_LEAD.length, pos = step % 16;
  const chord = MUSIC_CHORDS[bar % MUSIC_CHORDS.length];

  // Schlagzeug: Bassdrum auf jedem Schlag, Klatschen auf 2 und 4, Hi-Hat dazwischen
  if (pos % 4 === 0) musicKick(t);
  if (pos === 4 || pos === 12) { musicNoise(t, 0.18, 0.28, 'bandpass', 1500); musicNoise(t + 0.012, 0.12, 0.18, 'bandpass', 2200); }
  if (pos % 2 === 0) musicNoise(t, pos % 4 === 2 ? 0.12 : 0.04, 0.07, 'highpass', 7000);
  if (pos === 0 && bar % 4 === 0) musicNoise(t, 1.2, 0.12, 'highpass', 5000);

  // Bass in Achteln, auf den Offbeats eine Oktave höher
  if (pos % 2 === 0) {
    const m = chord.bass + (pos % 4 === 2 ? 12 : 0);
    musicVoice('sawtooth', midiHz(m), t, MUSIC_STEP * 1.8, 0.11, 600);
  }

  // Akkord-Teppich am Anfang jedes Takts
  if (pos === 0) {
    for (const n of chord.notes) musicVoice('triangle', midiHz(n), t, MUSIC_STEP * 15.5, 0.035);
  }

  // Melodie: zwei leicht verstimmte Sägezähne klingen wie Blechbläser
  for (const [st, note, len] of MUSIC_LEAD[bar]) {
    if (st !== pos) continue;
    const dur = MUSIC_STEP * len * 0.95;
    musicVoice('sawtooth', midiHz(note) * 1.003, t, dur, 0.06, 2800);
    musicVoice('sawtooth', midiHz(note) * 0.997, t, dur, 0.06, 2800);
    musicVoice('square',   midiHz(note - 12),    t, dur, 0.025, 1500);
  }
}

function musicScheduler() {
  if (!['start', 'title', 'menu'].includes(gameState)) { stopMenuMusic(); return; }
  const ac = getAC();
  // Nach einem Hänger (z.B. Tab im Hintergrund) nicht alle verpassten Noten auf einmal spielen
  if (musicNextTime < ac.currentTime - 0.2) musicNextTime = ac.currentTime + 0.05;
  while (musicNextTime < ac.currentTime + 0.12) {
    playMusicStep(musicStep, musicNextTime);
    musicStep++;
    musicNextTime += MUSIC_STEP;
  }
}

function startMenuMusic() {
  if (menuTimer) return;
  const ac = getAC();
  if (!musicOut) {
    musicOut = ac.createGain();
    musicOut.gain.value = 0.55;
    musicOut.connect(ac.destination);
  }
  musicStep = 0;
  musicNextTime = ac.currentTime + 0.05;
  menuTimer = setInterval(musicScheduler, 25);
}
function stopMenuMusic()  { if (menuTimer) { clearInterval(menuTimer); menuTimer=null; } }

// Jubel-Sound bei Tor
function playGoalSound() {
  const ac = getAC();
  const t = ac.currentTime;

  // === Stadion-Lufthorn (3× kurz hintereinander) ===
  [0, 0.55, 1.0].forEach(delay => {
    // Lufthorn = mehrere verstimmte Sägezähne (Blechbläser-Effekt)
    [233, 237, 350, 466, 700].forEach((freq, i) => {
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = 'sawtooth';
      osc.frequency.value = freq;
      const vol = [0.18, 0.12, 0.1, 0.08, 0.05][i];
      const dur = i===0 ? 0.35 : 0.32;
      g.gain.setValueAtTime(0, t+delay);
      g.gain.linearRampToValueAtTime(vol, t+delay+0.015);
      g.gain.setValueAtTime(vol, t+delay+dur*0.7);
      g.gain.exponentialRampToValueAtTime(0.001, t+delay+dur);
      osc.connect(g); g.connect(ac.destination);
      osc.start(t+delay); osc.stop(t+delay+dur+0.05);
    });
  });

  // === Jubelwelle: Menge bricht aus ===
  const ns = ac.createBufferSource(); ns.buffer=getNoiseBuf(); ns.loop=true;
  const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3500;
  const hp = ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=200;
  const g = ac.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.55, t+0.08);
  g.gain.linearRampToValueAtTime(0.4,  t+2.0);
  g.gain.linearRampToValueAtTime(0.55, t+2.4);  // zweite Welle
  g.gain.linearRampToValueAtTime(0.2,  t+4.0);
  g.gain.linearRampToValueAtTime(0,    t+5.5);
  ns.connect(lp); lp.connect(hp); hp.connect(g); g.connect(ac.destination);
  ns.start(); ns.stop(t+5.6);

  // === "Tor!"-Ansager-Sweep ===
  const sweep = ac.createOscillator(), sg = ac.createGain();
  sweep.type = 'sine';
  sweep.frequency.setValueAtTime(280, t+1.6);
  sweep.frequency.linearRampToValueAtTime(420, t+2.2);
  sweep.frequency.linearRampToValueAtTime(350, t+2.6);
  sg.gain.setValueAtTime(0, t+1.6);
  sg.gain.linearRampToValueAtTime(0.22, t+1.68);
  sg.gain.setValueAtTime(0.22, t+2.4);
  sg.gain.linearRampToValueAtTime(0, t+2.8);
  sweep.connect(sg); sg.connect(ac.destination);
  sweep.start(t+1.6); sweep.stop(t+2.9);
}

// Schlusspfiff
function playWhistle() {
  const ac = getAC(), t = ac.currentTime;
  [0, 0.45, 0.9].forEach(d => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type='sine'; o.frequency.value = 2200;
    g.gain.setValueAtTime(0,t+d); g.gain.linearRampToValueAtTime(0.25,t+d+0.02);
    g.gain.setValueAtTime(0.25,t+d+0.18); g.gain.linearRampToValueAtTime(0,t+d+0.22);
    o.connect(g); g.connect(ac.destination); o.start(t+d); o.stop(t+d+0.25);
  });
}

function updateAudio() {
  if (gameState === lastAudioState) return;
  const prev = lastAudioState;
  lastAudioState = gameState;
  if (MENU_STATES.includes(gameState)) {
    stopCrowd(); stopRain(); startMenuMusic();
    if (window.speechSynthesis) speechSynthesis.cancel();
  }
  if (gameState === 'playing')  { stopMenuMusic(); startCrowd(); startRain(); }
  if (gameState === 'goal' && (prev==='playing' || prev==='penalty')) {
    playGoalSound();
    const scorer = goalTeam === playerTeam ? playerClub : opponentClub;
    stopChants();
    setTimeout(() => { if (['goal', 'replay', 'playing'].includes(gameState)) chant(scorer, true); }, 1500);
    nextChantAt = Date.now() + 8000;
  }
  if (!['playing', 'goal', 'replay'].includes(gameState)) { stopChants(); nextChantAt = 0; }
  if (gameState === 'halftime') { playWhistle(); }
  if (gameState === 'fulltime') { playWhistle(); stopCrowd(); stopRain(); }
}

function colorDistance(a, b) {
  const x = parseInt(a.slice(1), 16), y = parseInt(b.slice(1), 16);
  return Math.hypot((x>>16)-(y>>16), ((x>>8)&255)-((y>>8)&255), (x&255)-(y&255));
}

// Karten der Vereinsauswahl: bis 4 in einer Reihe, sonst zwei Reihen
function clubCardLayout(entries) {
  const w=W(), h=H();
  const n = entries.length, rowsN = n > 4 ? Math.max(2, Math.ceil(n / (w > h ? 8 : 4))) : 1, per = Math.ceil(n / rowsN);
  const rows = Array.from({ length:rowsN }, (_, r) => Math.min(per, n - r * per));
  const top = h*0.36, bottom = h*0.95, gapY = h*0.03;
  const rowH = (bottom - top - gapY*(rows.length-1)) / rows.length;
  const out = [];
  let idx = 0;
  rows.forEach((k, r) => {
    const cw = Math.min(w/rows[0]*0.8, 200, rowH*0.95);
    const ch = Math.min(rowH, cw*1.25);
    const y = top + r*(rowH+gapY) + (rowH-ch)/2;
    for (let i=0; i<k; i++, idx++) out.push({ entry:entries[idx], x:w*(i+0.5)/k - cw/2, y, w:cw, h:ch, n:idx+1 });
  });
  return out;
}

function getCP() {
  const t = playerTeam === 'red' ? redTeam : blueTeam;
  if (t[controlledIdx].sentOff) controlledIdx = t.findIndex(p => !p.sentOff);
  return t[controlledIdx];
}

function switchPlayer() {
  const t = playerTeam === 'red' ? redTeam : blueTeam;
  // Wechsel zum Spieler der dem Ball am nächsten ist (außer dem aktuellen)
  let best = (controlledIdx + 1) % t.length;
  let bestDist = Infinity;
  for (let i = 0; i < t.length; i++) {
    if (i === controlledIdx || t[i].sentOff) continue;
    const d = Math.hypot(t[i].x - ball.x, t[i].y - ball.y);
    if (d < bestDist) { bestDist = d; best = i; }
  }
  controlledIdx = best;
}

let protectUntil = 0;   // kurz nach einem Freistoß darf niemand den Ball abnehmen
let setPiece = null;    // { type:'free'|'penalty', victim, fouler, card, until }
let penalty = null;     // { taker, attackRight, t0, aimY }
const PENALTY_BOX_X = 0.18, PENALTY_BOX_T = 0.2, PENALTY_BOX_B = 0.8;
// Wahrscheinlichkeit, dass der gegnerische Torwart beim Elfmeter die richtige Ecke ahnt
const KEEPER_GUESS = { Leicht:0.25, Mittel:0.4, Schwer:0.55 };

const activeOf = team => team.filter(p => !p.sentOff);

function clubOf(p) { return p.team === playerTeam ? playerClub : opponentClub; }
function playerName(p) {
  const team = p.team === 'red' ? redTeam : blueTeam;
  const club = clubOf(p);
  if (p.isKeeper) return club.keeperName || 'Torwart';
  return (club.names && club.names[team.indexOf(p)]) || `Nr. ${p.num}`;
}

function commitFoul(fouler, victim) {
  if (gameState !== 'playing') return;
  playWhistle();
  let card = null;
  const r = Math.random();
  // Rot nur, wenn danach noch mindestens ein Feldspieler übrig ist
  const foulerTeam = fouler.team === 'red' ? redTeam : blueTeam;
  const canSendOff = activeOf(foulerTeam).length > 1;
  if (r < 0.07 && canSendOff) card = 'red';
  else if (r < 0.35) card = fouler.yellow && canSendOff ? 'yellowred' : 'yellow';
  if (card === 'yellow') fouler.yellow = 1;
  if (card === 'red' || card === 'yellowred') fouler.sentOff = true;

  const attackRight = victim.team === 'red';
  const inBox = victim.y > PENALTY_BOX_T && victim.y < PENALTY_BOX_B &&
    (attackRight ? victim.x > 1 - FPADX - PENALTY_BOX_X : victim.x < FPADX + PENALTY_BOX_X);
  const now = Date.now();
  // Schiri kommt vom näheren Rand (oben oder unten) zum Foulspieler gelaufen
  const fromTop = fouler.y < 0.5;
  setPiece = { type: inBox ? 'penalty' : 'free', victim, fouler, card, t0: now, until: now + (card ? 3600 : 2600),
               spotX: victim.x, spotY: victim.y,
               ref: { fromX: fouler.x, fromY: fromTop ? FT - 0.05 : FB + 0.05,
                      toX: Math.max(FL, Math.min(FR, fouler.x + 0.06)), toY: fouler.y + (fromTop ? -0.04 : 0.04) } };
  ballOwner = null; ball.vx = 0; ball.vy = 0;
  gameState = 'foul';
}

function takeControlOf(p) {
  const team = p.team === 'red' ? redTeam : blueTeam;
  if (p.team === playerTeam) controlledIdx = team.indexOf(p);
}

function setupSetPiece() {
  const { victim, fouler } = setPiece;
  if (fouler.sentOff) { fouler.x = -1; fouler.y = -1; }
  if (getCP().sentOff) switchPlayer();
  const foes = activeOf(victim.team === 'red' ? blueTeam : redTeam);
  const side = victim.team === 'red' ? 1 : -1;

  if (setPiece.type === 'free') {
    victim.x = Math.max(FL, Math.min(FR, setPiece.spotX));
    victim.y = Math.max(FT, Math.min(FB, setPiece.spotY));
    // Mauer-Abstand: Gegner weg vom Ball
    for (const f of foes) {
      const dx = f.x - victim.x, dy = f.y - victim.y, d = Math.hypot(dx, dy) || 1;
      if (d < 0.14) {
        f.x = Math.max(FL, Math.min(FR, victim.x + dx / d * 0.14));
        f.y = Math.max(FT, Math.min(FB, victim.y + dy / d * 0.14));
      }
    }
    ballOwner = victim;
    takeControlOf(victim);
    protectUntil = Date.now() + 1500;
    gameState = 'playing'; lastFrameMs = 0;
    return;
  }

  // Elfmeter: Ball auf den Punkt, alle anderen raus aus dem Strafraum
  const attackRight = victim.team === 'red';
  const spotX = attackRight ? 1 - FPADX - 0.12 * H() / W() : FPADX + 0.12 * H() / W();
  const outX  = attackRight ? 1 - FPADX - PENALTY_BOX_X - 0.06 : FPADX + PENALTY_BOX_X + 0.06;
  const ys = [0.25, 0.4, 0.6, 0.75, 0.32];
  let i = 0;
  for (const p of activeOf([...redTeam, ...blueTeam])) {
    if (p === victim) continue;
    p.x = outX - side * (i % 2) * 0.05; p.y = ys[i % ys.length]; p.vx = 0; p.vy = 0; i++;
  }
  ballOwner = null;
  ball.x = spotX; ball.y = 0.5; ball.vx = 0; ball.vy = 0;
  // Schütze steht mit etwas Anlauf hinter dem Ball
  victim.x = spotX - side * 0.12; victim.y = 0.5 - 0.09;
  takeControlOf(victim);
  const keeper = attackRight ? blueKeeper : redKeeper;
  keeper.y = 0.5; keeper.diveAngle = 0;
  penalty = { taker: victim, keeper, attackRight, side, mine: victim.team === playerTeam,
              phase: 'aim', t0: Date.now(), aimY: 0.5, power: 0.5, keeperChoice: 0,
              kickX: spotX - side * 0.045, kickY: 0.5 - 0.055, runFromX: victim.x, runFromY: victim.y };
  gameState = 'penalty';
}

const easeOut = t => 1 - Math.pow(1 - t, 3);
let ballLift = 0;   // Höhe des Balls beim Elfmeter, nur fürs Zeichnen

function penaltyInput() {
  const up = dpad.up || keys['ArrowUp'] || keys['w'], down = dpad.down || keys['ArrowDown'] || keys['s'];
  return up ? -1 : down ? 1 : 0;
}

function startRunUp() {
  penalty.phase = 'runup';
  penalty.t0 = Date.now();
}

function startShot() {
  const pn = penalty, k = pn.keeper;
  // Zu fest geschossen geht daneben
  const miss = pn.mine ? pn.power > 0.9 : Math.random() < 0.08;
  let diveY;
  if (k.team === playerTeam) {
    diveY = 0.5 + pn.keeperChoice * 0.065;
  } else {
    const center = Math.abs(pn.aimY - 0.5) < 0.03;
    const guess = Math.random() < KEEPER_GUESS[difficulty.name];
    diveY = guess ? (center ? 0.5 : (pn.aimY < 0.5 ? 0.435 : 0.565)) : (pn.aimY < 0.5 ? 0.565 : 0.435);
  }
  const reach = 0.045 + (pn.power < 0.35 ? 0.03 : 0);   // schwache Schüsse sind leichter zu halten
  const saved = !miss && Math.abs(diveY - pn.aimY) < reach;
  pn.outcome = miss ? 'miss' : saved ? 'save' : 'goal';
  pn.diveY = diveY;
  pn.startX = ball.x; pn.startY = ball.y;
  if (pn.outcome === 'goal') { pn.endX = pn.attackRight ? 1 - FPADX * 0.35 : FPADX * 0.35; pn.endY = pn.aimY; }
  else if (pn.outcome === 'save') { pn.endX = k.x - pn.side * 0.01; pn.endY = diveY; }
  else { pn.endX = pn.attackRight ? 1 - FPADX * 0.2 : FPADX * 0.2; pn.endY = pn.aimY < 0.5 ? GOAL_T - 0.05 : GOAL_B + 0.05; }
  pn.dur = 0.75 - pn.power * 0.35;
  pn.phase = 'shot';
  pn.t0 = Date.now();
  goalScorer = pn.taker;
}

function finishPenalty() {
  const k = penalty.keeper;
  k.diveAngle = 0; k.y = 0.5;
  ballLift = 0;
  ballOwner = k;
  penalty = null; setPiece = null;
  protectUntil = Date.now() + 800;
  gameState = 'playing'; lastFrameMs = 0;
}

function updatePenalty() {
  const now = Date.now(), pn = penalty, el = (now - pn.t0) / 1000;
  if (pn.phase === 'aim') {
    if (pn.mine) {
      // Mit ↑/↓ zielen, die Kraftanzeige pendelt, Schuss-Taste schießt
      pn.aimY = Math.max(0.42, Math.min(0.58, pn.aimY + penaltyInput() * 0.004));
      pn.power = (Math.sin(el * 3.2 - Math.PI / 2) + 1) / 2;
      if (keys[' '] || keys['Enter'] || btnActive.shoot) {
        keys[' '] = false; keys['Enter'] = false; btnActive.shoot = false;
        startRunUp();
      } else if (el > 9) startRunUp();
    } else {
      pn.keeperChoice = penaltyInput();
      if (el > 2.8) {
        const r = Math.random();
        pn.aimY = r < 0.4 ? 0.43 : r < 0.8 ? 0.57 : 0.5;
        pn.power = 0.45 + Math.random() * 0.4;
        startRunUp();
      }
    }
  } else if (pn.phase === 'runup') {
    if (!pn.mine) pn.keeperChoice = penaltyInput();
    const t = Math.min(1, el / 0.6);
    pn.taker.x = pn.runFromX + (pn.kickX - pn.runFromX) * t;
    pn.taker.y = pn.runFromY + (pn.kickY - pn.runFromY) * t;
    if (t >= 1) startShot();
  } else if (pn.phase === 'shot') {
    const t = Math.min(1, el / pn.dur);
    ball.x = pn.startX + (pn.endX - pn.startX) * t;
    ball.y = pn.startY + (pn.endY - pn.startY) * t;
    ballLift = Math.sin(Math.PI * t) * (0.3 + pn.power * 0.5);
    // Torwart hechtet schon beim Schuss los
    const k = pn.keeper, kt = easeOut(Math.min(1, el / (pn.dur * 0.85)));
    k.y = 0.5 + (pn.diveY - 0.5) * kt;
    k.diveAngle = pn.diveY === 0.5 ? 0 : Math.sign(pn.diveY - 0.5) * pn.side * kt * Math.PI / 2;
    if (t >= 1) {
      ballLift = 0;
      if (pn.outcome === 'goal') {
        if (pn.taker.team === 'red') score.red++; else score.blue++;
        goalTeam = pn.taker.team; halfTimeLeft += 10;
        k.diveAngle = 0;
        penalty = null; setPiece = null;
        gameState = 'goal';
        resetPositions();
        return;
      }
      pn.phase = 'result'; pn.t0 = now;
      if (pn.outcome === 'save') playWhistle();
    }
  } else if (pn.phase === 'result') {
    // Gehaltener Ball springt zurück ins Feld
    if (pn.outcome === 'save') {
      ball.x -= pn.side * 0.006 * Math.max(0, 1 - el);
      ball.y += (pn.diveY - 0.5) * 0.02 * Math.max(0, 1 - el);
    }
    if (el > 1.6) finishPenalty();
  }
}

function doShoot() {
  if (gameState === 'penalty') { if (penalty.mine && penalty.phase === 'aim') startRunUp(); return; }
  const cp = getCP();
  if (ballOwner !== cp) return;
  const goalX = playerTeam === 'red' ? FR : FL;
  const dy=0.5-ball.y, dx=goalX-ball.x, len=Math.sqrt(dx*dx+dy*dy)||1;
  ball.vx=(dx/len)*KICK_SPD; ball.vy=(dy/len)*KICK_SPD+(Math.random()-0.5)*0.006;
  goalScorer=cp; ballOwner=null;
}

function doPass() {
  const cp = getCP();
  if (ballOwner !== cp) return;
  const fwd = playerTeam === 'red' ? PASS_SPD : -PASS_SPD;
  let dx=cp.vx||fwd, dy=cp.vy||0;
  const len=Math.sqrt(dx*dx+dy*dy)||1;
  ball.vx=(dx/len)*PASS_SPD; ball.vy=(dy/len)*PASS_SPD;
  ballOwner=null;
}

function doTackle() {
  if (gameState !== 'playing' || Date.now() < protectUntil) return;
  const cp = getCP();
  const opponents = activeOf(playerTeam === 'red' ? blueTeam : redTeam);
  let target = null, best = TACKLE_DIST;
  for (const op of opponents) {
    const d = Math.hypot(cp.x-op.x, cp.y-op.y);
    if (d < best) { best = d; target = op; }
  }
  if (!target) return;
  // Mit Ball: meistens sauber; ohne Ball ist es oft ein Foul
  if (ballOwner === target) { if (Math.random() < 0.25) commitFoul(cp, target); else ballOwner = cp; }
  else if (Math.random() < 0.5) commitFoul(cp, target);
}

function getDpad() {
  const w=W(), h=H(), s=Math.min(w,h)*0.12;
  const g = s*0.15, margin = w*0.06;
  const cx = margin + s*1.5 + g;
  const cy = h - s*2.8;
  return {
    up:    {x:cx,     y:cy-s-g, s},
    down:  {x:cx,     y:cy+s+g, s},
    left:  {x:cx-s-g, y:cy,     s},
    right: {x:cx+s+g, y:cy,     s},
  };
}

function getActionBtns() {
  const w=W(), h=H(), r=Math.min(w,h)*0.08;
  const g=r*0.3, margin=w*0.06;
  const rx = w - margin - r - g;   // rechte Spalte
  const lx = rx - r*2 - g;         // linke Spalte
  const by = h - r - margin*0.8;   // untere Reihe
  const ty = by - r*2 - g;         // obere Reihe
  return {
    shoot:  {x:rx, y:by, r},   // unten rechts
    pass:   {x:lx, y:by, r},   // unten links
    tackle: {x:rx, y:ty, r},   // oben rechts
    switch: {x:lx, y:ty, r},   // oben links
    sprint: {x:lx-r*2-g, y:by, r},   // unten, ganz links
  };
}

function hitDpad(tx,ty,b) { return Math.abs(tx-b.x)<b.s*0.6 && Math.abs(ty-b.y)<b.s*0.6; }
function hitBtn(tx,ty,b)  { const dx=tx-b.x,dy=ty-b.y; return dx*dx+dy*dy<b.r*b.r*1.8; }

const MODES = [

  { id:'cl',       emoji:'🏆', label:'Champions League',   sub:['8 Teams aus Europa,', 'K.-o. bis zum Finale'], color:'#1d3f9a' },
  { id:'season',   emoji:'📊', label:'Liga-Saison',        sub:['Jeder gegen jeden', 'mit Tabelle'],        color:'#c0392b' },
];
const WM_MODE = { id:'cl', emoji:'🌍', label:'Weltmeisterschaft', sub:['16 Länder,', 'K.-o. bis zum Finale'], color:'#b8860b' };
const modeCards = () => MODES.map(m => m.id === 'cl' && isNation(playerClub) ? WM_MODE : m);
const CUP_ROUNDS = ['Viertelfinale', 'Halbfinale', 'Finale'];
const cupRounds = () => cup.wm ? ['Achtelfinale', ...CUP_ROUNDS] : CUP_ROUNDS;
let mode = 'friendly', modeSel = 0, cup = null, season = null;

const shuffle = a => { a = [...a]; for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
// Spiele ohne den Spieler werden ausgewürfelt: meistens 0 bis 3 Tore
const simGoals = () => pick([0,0,1,1,1,2,2,2,3,3,4]);
function simPens() {
  let a = 0, b = 0;
  for (let i = 0; i < 5; i++) { a += Math.random() < 0.75; b += Math.random() < 0.75; }
  while (a === b) { a += Math.random() < 0.75; b += Math.random() < 0.75; }
  return [a, b];
}
function simMatch(m, ko) {
  m.ga = simGoals(); m.gb = simGoals();
  if (ko && m.ga === m.gb) [m.pa, m.pb] = simPens();
}
const winnerOf = m => m.ga > m.gb ? m.a : m.gb > m.ga ? m.b : m.pa > m.pb ? m.a : m.b;
const isMine = m => m.a === playerClub || m.b === playerClub;
const pairUp = teams => { const ms = []; for (let i = 0; i < teams.length; i += 2) ms.push({ a:teams[i], b:teams[i+1] }); return ms; };
function recordMyMatch(m) {
  const mine = playerTeam === 'red' ? score.red : score.blue, theirs = playerTeam === 'red' ? score.blue : score.red;
  if (m.a === playerClub) { m.ga = mine; m.gb = theirs; } else { m.ga = theirs; m.gb = mine; }
}
const announce = (text, prio = 4) => setTimeout(() => say(text, prio, true), 400);

function chooseClub(entry) {
  playerTeam = entry.team; playerClub = entry.club; teamChosen = true;
  gameState = 'title'; titleSel = 0;
}
const isNation = club => clubEntry(club).league === 'nat';
function backToTeamPick() {
  mode = 'friendly'; cup = null; season = null; showControls = false;
  gameState = 'menu'; teamChosen = false; opponentChosen = false;
  menuLeague = clubEntry(playerClub).league;
}

function startCup() {
  const wm = isNation(playerClub);
  const others = shuffle(CLUB_LIST.filter(e => (e.league === 'nat') === wm).map(e => e.club).filter(c => c !== playerClub)).slice(0, wm ? 15 : 7);
  cup = { rounds:[pairUp(shuffle([playerClub, ...others]))], round:0, out:false, won:false, champion:null, wm };
  gameState = 'cup';
  announce(wm ? 'Willkommen zur Weltmeisterschaft! Sechzehn Länder, nur einer wird Weltmeister.' : 'Willkommen zur Champions League! Acht Teams, nur einer holt den Pokal.', 3);
}
function advanceCup() {
  const ms = cup.rounds[cup.round], mine = ms.find(isMine);
  recordMyMatch(mine);
  if (mine.ga === mine.gb) [mine.pa, mine.pb] = (playerClub === mine.a) === (Math.random() < 0.5) ? simPens() : simPens().reverse();
  for (const m of ms) if (m !== mine) simMatch(m, true);
  if (winnerOf(mine) !== playerClub) cup.out = true;
  // Bis zum Ende weiterspielen; nach dem Ausscheiden wird der Rest ausgewürfelt
  while (true) {
    const winners = cup.rounds[cup.round].map(winnerOf);
    if (winners.length === 1) { cup.champion = winners[0]; break; }
    cup.rounds.push(pairUp(winners)); cup.round++;
    if (!cup.out) break;
    for (const m of cup.rounds[cup.round]) simMatch(m, true);
  }
  const me = spokenClub(playerClub);
  if (cup.champion === playerClub) { cup.won = true; announce(cup.wm ? `Unglaublich! ${me} ist Weltmeister!` : `Unglaublich! ${me} gewinnt die Champions League!`); }
  else if (cup.out) announce(`Schade! ${me} ist ausgeschieden. Sieger wird ${spokenClub(cup.champion)}.`);
  else announce(`${me} steht im ${cupRounds()[cup.round]}!`);
}

function startSeason() {
  const league = clubEntry(playerClub).league;
  const clubs = CLUB_LIST.filter(e => e.league === league).map(e => e.club);
  // Jeder gegen jeden im Kreisverfahren; bei ungerader Zahl hat pro Spieltag einer frei
  const n = clubs.length + clubs.length % 2;
  let arr = clubs.length % 2 ? [...clubs, null] : [...clubs];
  const rounds = [];
  for (let r = 0; r < n - 1; r++) {
    const ms = [];
    for (let i = 0; i < n / 2; i++) {
      const a = arr[i], b = arr[n-1-i];
      if (a && b) ms.push(r % 2 ? { a:b, b:a } : { a, b });
    }
    rounds.push(ms);
    arr = [arr[0], arr[n-1], ...arr.slice(1, n-1)];
  }
  // Den Spieltag, an dem der Spieler frei hat, ans Ende schieben
  rounds.sort((x, y) => (x.some(isMine) ? 0 : 1) - (y.some(isMine) ? 0 : 1));
  season = { league, clubs, rounds, day:0, done:false };
  gameState = 'season';
  announce(league === 'nat' ? 'Das Länderturnier beginnt! Welches Land holt den Titel?' : `Die Saison beginnt! Wer wird Meister in der ${LEAGUES.find(l => l.id === league).label}?`, 3);
}
function advanceSeason() {
  const ms = season.rounds[season.day];
  recordMyMatch(ms.find(isMine));
  for (const m of ms) if (!isMine(m)) simMatch(m, false);
  season.day++;
  while (season.day < season.rounds.length && !season.rounds[season.day].some(isMine)) {
    for (const m of season.rounds[season.day]) simMatch(m, false);
    season.day++;
  }
  const table = seasonTable(), place = table.findIndex(r => r.club === playerClub) + 1;
  if (season.day >= season.rounds.length) {
    season.done = true;
    announce(place === 1 ? `${spokenClub(playerClub)} ist Meister! Was für eine Saison!` : `Die Saison ist vorbei. Meister ist ${spokenClub(table[0].club)}. ${spokenClub(playerClub)} wird ${place}.`);
  } else announce(`${spokenClub(playerClub)} steht auf Platz ${place}.`, 3);
}
function seasonTable() {
  const rows = new Map(season.clubs.map(c => [c, { club:c, sp:0, s:0, u:0, n:0, gf:0, ga:0, pts:0 }]));
  for (const r of season.rounds) for (const m of r) {
    if (m.ga == null) continue;
    const A = rows.get(m.a), B = rows.get(m.b);
    A.sp++; B.sp++; A.gf += m.ga; A.ga += m.gb; B.gf += m.gb; B.ga += m.ga;
    if (m.ga > m.gb) { A.s++; B.n++; A.pts += 3; }
    else if (m.gb > m.ga) { B.s++; A.n++; B.pts += 3; }
    else { A.u++; B.u++; A.pts++; B.pts++; }
  }
  return [...rows.values()].sort((x, y) => y.pts - x.pts || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf);
}

function compFinished() { return mode === 'cl' ? cup.out || cup.won : season.done; }
function compNextMatch() { return mode === 'cl' ? cup.rounds[cup.round].find(isMine) : season.rounds[season.day].find(isMine); }
function compAction() {
  if (compFinished()) { mode = 'friendly'; cup = null; season = null; commentLine = ''; gameState = 'title'; titleSel = 0; return; }
  const m = compNextMatch();
  opponentClub = m.a === playerClub ? m.b : m.a;
  opponentChosen = true;
  startMatch();
}

  stopCrowd(); showControls = false; titleSel = 0;

function modeCardLayout() {

}

  for (let i = 0; i < 90; i++) {

function drawTrophy(cx, cy, s) {
  ctx.save();
  const silver = ctx.createLinearGradient(cx - s * 0.4, 0, cx + s * 0.4, 0);
  silver.addColorStop(0, '#8e9aa6'); silver.addColorStop(0.35, '#f4f7fa'); silver.addColorStop(0.6, '#c3ccd5'); silver.addColorStop(1, '#6f7b86');
  ctx.fillStyle = silver; ctx.strokeStyle = silver;
  // Große Henkel, wie beim echten Pokal
  ctx.lineWidth = s * 0.07;
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(cx + side * s * 0.22, cy - s * 0.32);
    ctx.bezierCurveTo(cx + side * s * 0.62, cy - s * 0.42, cx + side * s * 0.58, cy + s * 0.1, cx + side * s * 0.16, cy + s * 0.06);
    ctx.stroke();
  }
  // Schale
  ctx.beginPath();
  ctx.moveTo(cx - s * 0.3, cy - s * 0.4);
  ctx.lineTo(cx + s * 0.3, cy - s * 0.4);
  ctx.quadraticCurveTo(cx + s * 0.28, cy + s * 0.08, cx + s * 0.06, cy + s * 0.16);
  ctx.lineTo(cx - s * 0.06, cy + s * 0.16);
  ctx.quadraticCurveTo(cx - s * 0.28, cy + s * 0.08, cx - s * 0.3, cy - s * 0.4);
  ctx.fill();
  ctx.fillRect(cx - s * 0.05, cy + s * 0.15, s * 0.1, s * 0.18);
  ctx.beginPath(); ctx.ellipse(cx, cy + s * 0.34, s * 0.2, s * 0.05, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1d3f9a';
  ctx.fillRect(cx - s * 0.22, cy + s * 0.36, s * 0.44, s * 0.1);
  ctx.fillStyle = silver;
  ctx.fillRect(cx - s * 0.25, cy + s * 0.46, s * 0.5, s * 0.04);
  ctx.restore();
}

function drawSchale(cx, cy, s) {
  ctx.save();
  const silver = ctx.createRadialGradient(cx - s * 0.15, cy - s * 0.15, s * 0.05, cx, cy, s * 0.5);
  silver.addColorStop(0, '#ffffff'); silver.addColorStop(0.6, '#c9d1d9'); silver.addColorStop(1, '#7d8893');
  ctx.fillStyle = silver;
  ctx.beginPath(); ctx.arc(cx, cy, s * 0.48, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(80,90,100,0.6)'; ctx.lineWidth = s * 0.015;
  for (const r of [0.42, 0.3]) { ctx.beginPath(); ctx.arc(cx, cy, s * r, 0, Math.PI * 2); ctx.stroke(); }
  ctx.fillStyle = 'rgba(80,90,100,0.5)';
  for (let i = 0; i < 16; i++) {
    const a = i * Math.PI / 8;
    ctx.beginPath(); ctx.arc(cx + Math.cos(a) * s * 0.36, cy + Math.sin(a) * s * 0.36, s * 0.02, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = '#feca57';
  ctx.beginPath(); ctx.arc(cx, cy, s * 0.16, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

  const rounds = cupRounds(), R = rounds.length, firstCount = 1 << (R - 1);
  const colW = (w - 24 - colGap * (R - 1)) / R;
  rounds.forEach((name, r) => {
    const x = 12 + r * (colW + colGap), count = firstCount >> r, ms = cup.rounds[r] || [];
    ctx.fillStyle = r === cup.round && !compFinished() ? '#feca57' : 'rgba(255,255,255,0.7)';
    ctx.font = `bold ${Math.min(w * 0.03, 14)}px system-ui`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(name, x + colW / 2, top);
    const area = bottom - top - 18, bh = Math.min(area / firstCount * 0.86, 60);
    for (let i = 0; i < count; i++) {
      const m = ms[i], cy = top + 18 + (i + 0.5) * area / count, by = cy - bh / 2;
      roundRect(x, by, colW, bh, 8);
      ctx.fillStyle = m && isMine(m) ? 'rgba(254,202,87,0.18)' : 'rgba(255,255,255,0.08)'; ctx.fill();
      ctx.strokeStyle = m && isMine(m) ? '#feca57' : 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.2; ctx.stroke();
      if (!m) { ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillText('?', x + colW / 2, cy); continue; }
      const played = m.ga != null, win = played ? winnerOf(m) : null;
      if (bh < 34) {
        // Wenig Platz: beide Teams in einer Zeile
        const cs = bh * 0.6;
        ctx.font = `bold ${Math.min(bh * 0.42, 12)}px system-ui`;
        [[m.a, x + 4 + cs * 0.5, 'left'], [m.b, x + colW - 4 - cs * 0.5, 'right']].forEach(([club, cx, align]) => {
          ctx.globalAlpha = played && win !== club ? 0.45 : 1;
          clubEntry(club).crest(cx, cy, cs);
          ctx.fillStyle = club === playerClub ? '#feca57' : '#fff';
          ctx.textAlign = align;
          ctx.fillText(club.short, cx + (align === 'left' ? 1 : -1) * cs * 0.6, cy);
        });
        ctx.globalAlpha = 1; ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
        if (played) ctx.fillText(m.pa != null ? `${m.ga}:${m.gb} (${m.pa}:${m.pb})` : `${m.ga}:${m.gb}`, x + colW / 2, cy);
        continue;
      }
      [[m.a, m.ga, m.pa], [m.b, m.gb, m.pb]].forEach(([club, goals, pens], k) => {
        const ry = by + bh * (k ? 0.74 : 0.27), cs = bh * 0.38;
        ctx.globalAlpha = played && win !== club ? 0.45 : 1;
        clubEntry(club).crest(x + cs * 0.75, ry, cs);
        ctx.fillStyle = club === playerClub ? '#feca57' : '#fff';
        ctx.font = `bold ${Math.min(bh * 0.28, 14)}px system-ui`;
        ctx.textAlign = 'left';
        const name = colW < 160 ? club.short : clubEntry(club).label, room = colW - cs * 1.5 - (pens != null ? 44 : 22);
        // Lieber nur die Flagge als ein zerquetschter Name
        if (room >= ctx.measureText(name).width * 0.7) ctx.fillText(name, x + cs * 1.5, ry, room);
        if (played) {
          ctx.textAlign = 'right';
          ctx.fillText(pens != null ? `${goals} (${pens})` : `${goals}`, x + colW - 6, ry);
        }
        ctx.globalAlpha = 1;
      });
    }
  });

  const label = compFinished() ? '🏠 Zurück zum Hauptmenü' : `▶ ${cupRounds()[cup.round]} gegen ${clubEntry((m => m.a === playerClub ? m.b : m.a)(compNextMatch())).label}`;
  drawCompButton(label);
  if (cup.won) drawWinnerOverlay(w, h, t, cup.wm ? `${clubEntry(playerClub).label} ist Weltmeister! 🏆` : 'Champions-League-Sieger! 🏆', true);
  else if (cup.out) {
    ctx.fillStyle = '#ff6b6b'; ctx.textAlign = 'center';
    ctx.font = `bold ${Math.min(w * 0.035, 17)}px system-ui`;
    ctx.fillText(`Ausgeschieden! Sieger: ${clubEntry(cup.champion).label}`, w / 2, compBtn().y - h * 0.025);
  }
  ctx.restore();
}

function drawSeasonScreen() {

  const lg = LEAGUES.find(l => l.id === season.league);

  }
  drawCompButton(done ? '🏠 Zurück zum Hauptmenü' : '▶ Zum Spiel');
  if (done && place === 1) drawWinnerOverlay(w, h, t, `${clubEntry(playerClub).label} ist Meister! 🏆`, false);

// Knöpfe im Hauptmenü: gleiche Rechtecke fürs Zeichnen und Antippen
function getTitleButtons() {
  const w=W(), h=H();
  if (gameState === 'start') {
    const bw=Math.min(w*0.6, 380), bh=Math.min(h*0.13, 70);
    return [{ id:'start', label:'▶  Spiel starten', x:w/2-bw/2, y:h*0.62, w:bw, h:bh }];
  }
  const bw=Math.min(w*0.42, 320), bh=Math.min(h*0.1, 56), x=w/2-bw/2;
  if (showControls) return [{ id:'back', label:'← Zurück', x, y:h*0.84, w:bw, h:bh }];
  const y0=h*0.46, gap=bh*1.22;
  return [
    { id:'play',       label:'▶  Spielen',                        x, y:y0,       w:bw, h:bh },
    { id:'difficulty', label:`💪  Schwierigkeit: ${difficulty.name}`, x, y:y0+gap,   w:bw, h:bh, accent:difficulty.color },
    { id:'duration',   label:`⏱  Halbzeit: ${halfSecs/60} Min`,   x, y:y0+gap*2, w:bw, h:bh },
    { id:'controls',   label:'🎮  Steuerung',                     x, y:y0+gap*3, w:bw, h:bh },
  ];
}

function titleAction(id) {
  if (id==='start')    { backToTeamPick(); }
  if (id==='team')     { backToTeamPick(); }
  if (id==='play')     { gameState='mode'; modeSel=0; }
  if (id==='difficulty') { difficulty=DIFFICULTIES[(DIFFICULTIES.indexOf(difficulty)+1)%DIFFICULTIES.length]; }
  if (id==='duration') { halfSecs=HALF_OPTIONS[(HALF_OPTIONS.indexOf(halfSecs)+1)%HALF_OPTIONS.length]; }
  if (id==='controls') { showControls=true; titleSel=0; }
  if (id==='back')     { showControls=false; titleSel=3; }
}

function titleButtonHit(tx, ty) {
  if (introRunning()) { introStart=0; return; }
  const chip = myTeamChip();
  if (gameState==='title' && !showControls && tx>=chip.x && tx<=chip.x+chip.w && ty>=chip.y && ty<=chip.y+chip.h) { titleAction('team'); return; }
  for (const b of getTitleButtons()) {
    if (tx>=b.x && tx<=b.x+b.w && ty>=b.y && ty<=b.y+b.h) { titleAction(b.id); return; }
  }
}

function weatherBtn() {
  const w=W(), h=H(), bw=Math.min(w*0.34, 190), bh=Math.min(h*0.075, 34);
  return { x:w-12-bw, y:12, w:bw, h:bh };
}
function nextWeather() {
  const i = WEATHERS.findIndex(x => x.id === weatherChoice);
  weatherChoice = WEATHERS[(i+1) % WEATHERS.length].id;
}

function menuButtonHit(tx, ty) {
  const w=W(), h=H();

  if (!teamChosen || !opponentChosen) {
    for (const b of leagueTabLayout()) {
      if (tx>=b.x && tx<=b.x+b.w && ty>=b.y && ty<=b.y+b.h) { menuLeague=b.league.id; return true; }
    }
    for (const b of clubCardLayout(menuClubs())) {
      if (tx>=b.x && tx<=b.x+b.w && ty>=b.y && ty<=b.y+b.h) {
        if (!teamChosen) chooseClub(b.entry);
        else { opponentClub=b.entry.club; opponentChosen=true; }
        return true;
      }
    }
  } else {
    // Schritt 3: Wetter wählen oder starten
    const wb = weatherBtn();
    if (tx>=wb.x && tx<=wb.x+wb.w && ty>=wb.y && ty<=wb.y+wb.h) { nextWeather(); return true; }
    const SW=Math.min(w*0.5, 340), SH=Math.min(h*0.1, 56);
    if (tx>=w/2-SW/2 && tx<=w/2+SW/2 && ty>=h*0.8 && ty<=h*0.8+SH) {
      startMatch(); return true;
    }
  }
  return false;
}

function onPointerDown(tx, ty, id) {
  getAC(); // AudioContext beim ersten Touch starten
  if (gameState === 'title' || gameState === 'start') { titleButtonHit(tx, ty); return; }
  if (gameState === 'menu') { menuButtonHit(tx, ty); return; }
  if (gameState === 'mode') { modeHit(tx, ty); return; }
  if (gameState === 'cup' || gameState === 'season') {
    const b = compBtn();
    if (tx>=b.x && tx<=b.x+b.w && ty>=b.y && ty<=b.y+b.h) compAction();
    return;
  }
  if (gameState === 'goal')     { startReplay(); return; }
  if (gameState === 'replay')   { endReplay(); return; }
  if (gameState === 'fulltime' && Date.now()-fulltimeShowMs > 4000) {
    afterFulltime(); return;
  }
  if (gameState === 'fulltime') return; // noch nicht weitertippen
  const ab=getActionBtns(), dp=getDpad();
  if (hitBtn(tx,ty,ab.shoot))  { btnActive.shoot=true;  touched[id]='shoot';  doShoot();      return; }
  if (hitBtn(tx,ty,ab.pass))   { btnActive.pass=true;   touched[id]='pass';   doPass();       return; }
  if (hitBtn(tx,ty,ab.tackle)) { btnActive.tackle=true; touched[id]='tackle'; doTackle();     return; }
  if (hitBtn(tx,ty,ab.switch)) { btnActive.switch=true; touched[id]='switch'; switchPlayer(); return; }
  if (hitBtn(tx,ty,ab.sprint)) { btnActive.sprint=true; touched[id]='sprint'; return; }
  for (const dir of ['up','down','left','right']) {
    if (hitDpad(tx,ty,dp[dir])) { dpad[dir]=true; touched[id]=dir; return; }
  }
}

function onPointerUp(id) {
  const what=touched[id]; if (!what) return;
  if (['shoot','pass','tackle','switch','sprint'].includes(what)) btnActive[what]=false;
  else dpad[what]=false;
  delete touched[id];
}

function onPointerMove(tx, ty, id) {
  const what=touched[id];
  if (what==='up'||what==='down'||what==='left'||what==='right') {
    const dp=getDpad();
    dpad[what]=false;
    for (const dir of ['up','down','left','right']) {
      if (hitDpad(tx,ty,dp[dir])) { dpad[dir]=true; touched[id]=dir; break; }
    }
  }
}

canvas.addEventListener('pointerdown', e=>{
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  onPointerDown(e.clientX, e.clientY, e.pointerId);
},{passive:false});

canvas.addEventListener('pointermove', e=>{
  e.preventDefault();
  onPointerMove(e.clientX, e.clientY, e.pointerId);
},{passive:false});

canvas.addEventListener('pointerup',     e=>{ onPointerUp(e.pointerId); },{passive:false});
canvas.addEventListener('pointercancel', e=>{ onPointerUp(e.pointerId); },{passive:false});

// Tastatur
const keys={};
window.addEventListener('keydown', e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  if (gameState === 'title' || gameState === 'start') {
    getAC();
    if (introRunning()) { introStart=0; return; }
    const btns=getTitleButtons();
    if (e.key==='ArrowUp')   titleSel=(titleSel+btns.length-1)%btns.length;
    if (e.key==='ArrowDown') titleSel=(titleSel+1)%btns.length;
    if (e.key==='Enter'||e.key===' ') titleAction(btns[Math.min(titleSel,btns.length-1)].id);
    if (e.key==='Escape') titleAction(showControls ? 'back' : gameState === 'title' ? 'team' : '');
    return;
  }
  if (gameState === 'mode') {
    if (e.key==='Escape') { gameState='title'; return; }
    if (e.key==='ArrowLeft' || e.key==='ArrowUp')    modeSel=(modeSel+MODES.length-1)%MODES.length;
    if (e.key==='ArrowRight' || e.key==='ArrowDown') modeSel=(modeSel+1)%MODES.length;
    const n = parseInt(e.key, 10) - 1;
    if (MODES[n]) pickMode(MODES[n].id);
    else if (e.key==='Enter'||e.key===' ') pickMode(MODES[modeSel].id);
    return;
  }
  if (gameState === 'cup' || gameState === 'season') {
    if (e.key==='Enter'||e.key===' ') compAction();
    if (e.key==='Escape') { mode='friendly'; cup=null; season=null; gameState='title'; }
    return;
  }
  if (gameState === 'menu') {
    if (e.key==='Escape') {
      if (teamChosen) { gameState='title'; opponentChosen=false; }
      else gameState='start';
      return;
    }
    const n = parseInt(e.key, 10) - 1;
    if (!opponentChosen && (e.key==='ArrowLeft' || e.key==='ArrowRight')) {
      const lgs = menuLeagues(), i = lgs.findIndex(l => l.id === menuLeague);
      menuLeague = lgs[(i + (e.key==='ArrowRight' ? 1 : lgs.length-1)) % lgs.length].id;
    } else if (!teamChosen) {
      const pick = menuClubs()[n];
      if (pick) chooseClub(pick);
    } else if (!opponentChosen) {
      const pick = menuClubs()[n];
      if (pick) { opponentClub=pick.club; opponentChosen=true; }
    } else if (e.key==='Enter'||e.key===' ') {
      startMatch();
    } else if (e.key==='w'||e.key==='W') {
      nextWeather();
    }
    return;
  }
  if (gameState === 'goal')     { startReplay(); return; }
  if (gameState === 'replay')   { endReplay(); return; }
  if (gameState === 'fulltime' && Date.now()-fulltimeShowMs > 4000) {
    afterFulltime(); return;
  }
  if (gameState === 'fulltime') return;
  keys[e.key]=true;
});
window.addEventListener('keyup', e=>{ keys[e.key]=false; });

// ── KI Gegner ───────────────────────────────────────────────────────
let aiShootCooldown = 0;

// Schwierigkeit betrifft nur den Gegner: Tempo, Zweikämpfe, Schüsse und seinen Torwart
const DIFFICULTIES = [
  { name:'Leicht', color:'#2ecc71', speed:0.0011, steal:0.006, aim:0.03,  cooldown:100, keeperSpeed:0.0024, keeperError:0.07 },
  { name:'Mittel', color:'#f39c12', speed:0.0014, steal:0.012, aim:0.01,  cooldown:70,  keeperSpeed:0.0032, keeperError:0.04 },
  { name:'Schwer', color:'#e74c3c', speed:0.0019, steal:0.022, aim:0.004, cooldown:45,  keeperSpeed:0.0042, keeperError:0.02 },
];
let difficulty = DIFFICULTIES[1];

function moveTo(p, tx, ty, spd) {
  const dx=tx-p.x, dy=ty-p.y, len=Math.sqrt(dx*dx+dy*dy)||1;
  p.vx=dx/len*spd; p.vy=dy/len*spd;
  p.x=Math.max(FL,Math.min(FR,p.x+p.vx));
  p.y=Math.max(FT,Math.min(FB,p.y+p.vy));
}

function updateAI() {
  aiShootCooldown--;
  const myTeam  = playerTeam === 'red' ? redTeam  : blueTeam;
  const foeTeam = playerTeam === 'red' ? blueTeam : redTeam;
  const cp       = getCP();
  const foeGoalX = playerTeam === 'red' ? FL : FR;
  const myGoalX  = playerTeam === 'red' ? FR : FL;
  const foeClose = playerTeam === 'red' ? (p => p.x < 0.38) : (p => p.x > 0.62);
  const myClose  = playerTeam === 'red' ? (p => p.x > 0.65) : (p => p.x < 0.35);

  // ── Gegnerisches Team (alle KI) ──
  const foeSupY = [0.5, 0.3, 0.7];
  for (let i=0; i<foeTeam.length; i++) {
    const fp = foeTeam[i];
    if (fp.sentOff) continue;
    const sx = foeGoalX + (playerTeam==='red' ? 0.06 : -0.06);
    if (ballOwner===fp) {
      if (foeClose(fp) && aiShootCooldown<=0) {
        const dx=foeGoalX-fp.x, dy=0.5-fp.y, len=Math.hypot(dx,dy)||1;
        ball.vx=(dx/len)*KICK_SPD; ball.vy=(dy/len)*KICK_SPD+(Math.random()-0.5)*difficulty.aim;
        goalScorer=fp; ballOwner=null; aiShootCooldown=difficulty.cooldown;
      } else { moveTo(fp, sx, foeSupY[i], difficulty.speed); }
    } else if (ballOwner && ballOwner.team===playerTeam) {
      moveTo(fp, ballOwner.x, ballOwner.y, difficulty.speed);
      if (Date.now()>=protectUntil && Math.hypot(fp.x-ballOwner.x,fp.y-ballOwner.y)<TACKLE_DIST*0.8 && Math.random()<difficulty.steal) {
        if (Math.random()<0.22) { commitFoul(fp, ballOwner); return; }
        ballOwner=fp;
      }
    } else if (!ballOwner) {
      moveTo(fp, ball.x, ball.y, difficulty.speed);
    } else {
      moveTo(fp, sx, foeSupY[i], difficulty.speed*0.65);
    }
  }

  // ── Eigene Mitspieler (KI, nicht der gesteuerte Spieler) ──
  const teammates = myTeam.filter(p => p !== cp && !p.sentOff);
  const mySupY = [0.28, 0.72];
  const mySuppX = playerTeam==='red' ? 0.38 : 0.62;
  for (let i=0; i<teammates.length; i++) {
    const rp = teammates[i];
    if (ballOwner===rp) {
      if (myClose(rp) && aiShootCooldown<=0) {
        const dx=myGoalX-ball.x, dy=0.5-ball.y, len=Math.hypot(dx,dy)||1;
        ball.vx=(dx/len)*KICK_SPD; ball.vy=(dy/len)*KICK_SPD;
        goalScorer=rp; ballOwner=null; aiShootCooldown=60;
      } else {
        const dx=cp.x-rp.x, dy=cp.y-rp.y, len=Math.hypot(dx,dy)||1;
        ball.vx=(dx/len)*PASS_SPD; ball.vy=(dy/len)*PASS_SPD;
        ballOwner=null;
      }
    } else if (!ballOwner) {
      moveTo(rp, ball.x, ball.y, AI_SPEED*0.8);
    } else if (ballOwner && ballOwner.team!==playerTeam) {
      moveTo(rp, ballOwner.x, ballOwner.y, AI_SPEED*0.8);
    } else {
      moveTo(rp, mySuppX, mySupY[i], AI_SPEED*0.65);
    }
  }
}

// ── Torwart-KI ──────────────────────────────────────────────────────
function updateKeepers() {
  [
    { k: redKeeper,  homeX: 0.07, isLeft: true  },
    { k: blueKeeper, homeX: 0.93, isLeft: false },
  ].forEach(({ k, homeX, isLeft }) => {
    k.x = homeX;
    // Eigener Torwart bleibt immer gleich, der gegnerische hängt von der Schwierigkeit ab
    const foe = k.team !== playerTeam;
    const KSPEED = foe ? difficulty.keeperSpeed : 0.0032;

    if (ballOwner === k) {
      const dir = isLeft ? 1 : -1;
      ball.vx = dir * KICK_SPD * 0.85;
      ball.vy = (Math.random()-0.5) * KICK_SPD * 0.5;
      ballOwner = null;
      return;
    }

    // Reagiert erst wenn Ball nah ist (nicht perfekt)
    const ballComing = isLeft ? (ball.vx < -0.005) : (ball.vx > 0.005);
    const near = Math.abs(ball.x - homeX) < 0.22; // erst bei Nähe reagieren
    if (!ballComing && !near) {
      // Langsam zurück zur Mitte
      const mid = 0.5;
      if      (k.y < mid - 0.005) k.y += KSPEED * 0.5;
      else if (k.y > mid + 0.005) k.y -= KSPEED * 0.5;
      return;
    }

    // Ziel: Ball-y + kleiner Fehler (nicht perfekt)
    const error = (Math.random()-0.5) * (foe ? difficulty.keeperError : 0.04);
    const targetY = ball.y + error;
    const clamped = Math.max(GOAL_T+0.04, Math.min(GOAL_B-0.04, targetY));

    if      (k.y < clamped - 0.005) k.y = Math.min(k.y + KSPEED, clamped);
    else if (k.y > clamped + 0.005) k.y = Math.max(k.y - KSPEED, clamped);
    k.y = Math.max(GOAL_T+0.01, Math.min(GOAL_B-0.01, k.y));
  });
}

// ── Update ──────────────────────────────────────────────────────────
function update() {
  const now = Date.now();
  const delta = (lastFrameMs && gameState==='playing') ? Math.min((now-lastFrameMs)/1000, 0.1) : 0;
  if (gameState==='playing') lastFrameMs = now;

  // Halbzeitpause-Countdown
  if (gameState === 'halftime') {
    if (!lastFrameMs) lastFrameMs = now;
    breakTimeLeft -= (now - lastFrameMs) / 1000;
    lastFrameMs = now;
    if (breakTimeLeft <= 0) {
      currentHalf = 2; halfTimeLeft = halfSecs; breakTimeLeft = BREAK_SECS;
      gameState = 'playing'; lastFrameMs = 0; resetPositions();
    }
    return;
  }

  if (gameState === 'foul') {
    if (now >= setPiece.until) setupSetPiece();
    return;
  }
  if (gameState === 'penalty') { updatePenalty(); return; }

  if (gameState !== 'playing') return;

  // Timer zählt runter
  halfTimeLeft = Math.max(0, halfTimeLeft - delta);
  if (halfTimeLeft <= 0) {
    if (currentHalf === 1) {
      gameState = 'halftime'; lastFrameMs = 0;
    } else if (inExtra) {
      // Verlängerung vorbei
      inExtra = false; gameState = 'fulltime'; fulltimeShowMs = Date.now();
    } else if (score.red === score.blue && mode !== 'season') {
      // Unentschieden → 30 Sek Verlängerung!
      inExtra = true; halfTimeLeft = 30; lastFrameMs = 0; resetPositions();
    } else {
      gameState = 'fulltime'; fulltimeShowMs = Date.now();
    }
    return;
  }

  // Spieler bewegen
  const cp = getCP();
  let mvx = 0, mvy = 0;
  if (dpad.left  || keys['ArrowLeft']  || keys['a']) mvx -= 1;
  if (dpad.right || keys['ArrowRight'] || keys['d']) mvx += 1;
  if (dpad.up    || keys['ArrowUp']    || keys['w']) mvy -= 1;
  if (dpad.down  || keys['ArrowDown']  || keys['s']) mvy += 1;
  if (keys[' ']||keys['Enter']) { doShoot();      keys[' ']=false; keys['Enter']=false; }
  if (keys['f']||keys['p'])     { doPass();       keys['f']=false; keys['p']=false; }
  if (keys['t']||keys['g'])     { doTackle();     keys['t']=false; keys['g']=false; }
  if (keys['x']||keys['Tab'])   { switchPlayer(); keys['x']=false; keys['Tab']=false; }

  const mlen=Math.sqrt(mvx*mvx+mvy*mvy)||1;
  if (stamina <= 0) tired = true; else if (stamina > 0.3) tired = false;
  const sprinting = (btnActive.sprint || keys['Shift']) && (mvx || mvy) && !tired;
  stamina = Math.max(0, Math.min(1, stamina + (sprinting ? -STAMINA_DRAIN : STAMINA_REFILL) * delta));
  const spd=Math.min(Math.sqrt(mvx*mvx+mvy*mvy),1)*SPEED*(sprinting ? SPRINT_FACTOR : 1);
  cp.vx=mvx/mlen*spd; cp.vy=mvy/mlen*spd;
  cp.x=Math.max(FL,Math.min(FR,cp.x+cp.vx));
  cp.y=Math.max(FT,Math.min(FB,cp.y+cp.vy));

  updateAI();
  updateKeepers();

  // Ball
  if (ballOwner) {
    const side = ballOwner.team==='red' ? 1 : -1;
    ball.x=ballOwner.x+side*0.045; ball.y=ballOwner.y+0.055;
  } else {
    ball.x+=ball.vx; ball.y+=ball.vy;
    const fr=ballFriction(); ball.vx*=fr; ball.vy*=fr;
    // Ball-Radius in normierte Koordinaten
    const bRy = Math.min(W(),H())*0.022 / H();
    const bRx = Math.min(W(),H())*0.022 / W();
    // Oben/Unten: an Außenlinien abprallen
    if (ball.y < FPADY+bRy)   { ball.y=FPADY+bRy;   ball.vy*=-0.7; }
    if (ball.y > 1-FPADY-bRy) { ball.y=1-FPADY-bRy; ball.vy*=-0.7; }
    // Links/Rechts: Tor oder Abprall
    if (ball.x < FPADX+bRx) {
      if (ball.y>GOAL_T && ball.y<GOAL_B) { score.blue++; goalTeam='blue'; halfTimeLeft+=10; gameState='goal'; resetPositions(); return; }
      ball.x=FPADX+bRx; ball.vx*=-0.7;
    }
    if (ball.x > 1-FPADX-bRx) {
      if (ball.y>GOAL_T && ball.y<GOAL_B) { score.red++; goalTeam='red'; halfTimeLeft+=10; gameState='goal'; resetPositions(); return; }
      ball.x=1-FPADX-bRx; ball.vx*=-0.7;
    }
    for (const p of allPlayers) {
      if (p.sentOff) continue;
      if (Math.hypot(p.x-ball.x, p.y-ball.y)<PICKUP_DIST) { ballOwner=p; break; }
    }
  }
}

// Nachtstadion: Himmel, Tribünen mit Fans, Flutlichtmasten
function drawStadiumBackdrop(w, h, t) {
  const sky=ctx.createLinearGradient(0,0,0,h);
  sky.addColorStop(0,'#050b1e');
  sky.addColorStop(0.55,'#0d2240');
  sky.addColorStop(1,'#08140c');
  ctx.fillStyle=sky; ctx.fillRect(0,0,w,h);

  // Tribüne als Bogen, Fans als bunte Punkte (immer gleich verteilt)
  const standTop=h*0.42, standBot=h*0.78;
  ctx.fillStyle='#14182a';
  ctx.beginPath();
  ctx.moveTo(0,standBot); ctx.lineTo(0,standTop+h*0.08);
  ctx.quadraticCurveTo(w/2,standTop-h*0.08,w,standTop+h*0.08);
  ctx.lineTo(w,standBot); ctx.closePath(); ctx.fill();
  const fanCols=['#e3000f','#ffe500','#004c9f','#ffffff','#2ecc71','#111111'];
  let seed=3;
  const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const fans=Math.floor(w*h/180);
  for (let i=0;i<fans;i++) {
    const fx=rnd()*w;
    const curve=standTop+h*0.08-Math.sin(fx/w*Math.PI)*h*0.08;
    const fy=curve+rnd()*(standBot-curve);
    const col=fanCols[Math.floor(rnd()*fanCols.length)];
    const jump=Math.max(0,Math.sin(t*6+i))*2;
    ctx.fillStyle=col;
    ctx.globalAlpha=0.35+rnd()*0.35;
    ctx.fillRect(fx,fy-jump,2.5,2.5);
  }
  ctx.globalAlpha=1;

  // Rasenstück vorne
  const grass=ctx.createLinearGradient(0,standBot,0,h);
  grass.addColorStop(0,'#2f8f2f'); grass.addColorStop(1,'#1b5c1b');
  ctx.fillStyle=grass; ctx.fillRect(0,standBot,w,h-standBot);
  ctx.fillStyle='rgba(255,255,255,0.05)';
  for (let i=0;i<12;i+=2) ctx.fillRect(i*w/12,standBot,w/12,h-standBot);

  // Flutlichtmasten mit Lichtkegeln
  for (const [mx,dir] of [[w*0.06,1],[w*0.94,-1]]) {
    const topY=h*0.08;
    ctx.strokeStyle='#2a2f3a'; ctx.lineWidth=6;
    ctx.beginPath(); ctx.moveTo(mx,standTop+h*0.1); ctx.lineTo(mx,topY); ctx.stroke();
    const beam=ctx.createLinearGradient(mx,topY,w/2,h*0.8);
    beam.addColorStop(0,`rgba(255,255,220,${0.22+Math.sin(t*2+mx)*0.03})`);
    beam.addColorStop(1,'rgba(255,255,220,0)');
    ctx.fillStyle=beam;
    ctx.beginPath();
    ctx.moveTo(mx,topY);
    ctx.lineTo(w/2+dir*w*0.05,h);
    ctx.lineTo(w/2+dir*w*0.45,h);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='#fffbe0'; ctx.shadowColor='#fffbe0'; ctx.shadowBlur=20;
    for (let r=0;r<2;r++) for (let c=0;c<3;c++) ctx.fillRect(mx-14+c*10,topY-12+r*9,8,7);
    ctx.shadowBlur=0;
  }

  // Leicht abdunkeln, damit Schrift und Knöpfe gut lesbar sind
  ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(0,0,w,h);
}

// Eigenes Spiel-Logo: Wappenschild mit Ball, Sternen und Lorbeer
// Intro beim Laden: das Logo setzt sich zusammen, dann kommt der Titel
const INTRO_MS = 3400;
let introStart = Date.now();
const introProgress = () => Math.min(1, (Date.now() - introStart) / INTRO_MS);
const introRunning = () => introProgress() < 1;
// Anteil 0..1 von x zwischen a und z
const seg = (x, a, z) => Math.max(0, Math.min(1, (x - a) / (z - a)));
const easeOutBack = x => 1 + 2.70158 * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2);

// build 0..1: Schild fliegt ein, Lorbeer wächst, Sterne fallen, Ball rollt rein, Blitz
function drawGameLogo(cx, cy, size, t, alpha=0.32, build=1) {
  ctx.save();
  ctx.globalAlpha=alpha;
  const sw=size*0.8, sh=size;
  function shield() {
    ctx.beginPath();
    ctx.moveTo(cx-sw/2, cy-sh*0.45);
    ctx.quadraticCurveTo(cx, cy-sh*0.55, cx+sw/2, cy-sh*0.45);
    ctx.lineTo(cx+sw/2, cy+sh*0.05);
    ctx.quadraticCurveTo(cx+sw/2, cy+sh*0.35, cx, cy+sh*0.52);
    ctx.quadraticCurveTo(cx-sw/2, cy+sh*0.35, cx-sw/2, cy+sh*0.05);
    ctx.closePath();
  }
  const sIn=seg(build, 0, 0.3);
  if (sIn > 0) {
    const e=easeOut(sIn);
    ctx.save();
    ctx.translate(cx, cy+(1-e)*size*1.5);
    ctx.rotate((1-e)*-0.8);
    const k=Math.max(0.01, easeOutBack(sIn));
    ctx.scale(k, k);
    ctx.translate(-cx, -cy);
    const g=ctx.createLinearGradient(cx-sw/2,0,cx+sw/2,0);
    g.addColorStop(0,'#1e8449'); g.addColorStop(0.5,'#27ae60'); g.addColorStop(1,'#145a32');
    shield(); ctx.fillStyle=g; ctx.fill();
    ctx.lineWidth=size*0.04; ctx.strokeStyle='#fff'; ctx.stroke();
    // Rasenstreifen im Schild
    ctx.save(); shield(); ctx.clip();
    ctx.fillStyle='rgba(255,255,255,0.08)';
    for (let i=0;i<8;i+=2) ctx.fillRect(cx-sw/2+i*sw/8, cy-sh/2, sw/8, sh);
    ctx.restore();
    ctx.restore();
  }
  // Lorbeerzweige wachsen Blatt für Blatt
  const lIn=seg(build, 0.25, 0.55);
  ctx.strokeStyle='#feca57'; ctx.fillStyle='#feca57'; ctx.lineWidth=size*0.015;
  if (lIn > 0) for (const side of [-1,1]) {
    const a0=Math.PI/2+side*0.3, a1=Math.PI/2+side*1.9;
    ctx.beginPath();
    ctx.arc(cx, cy+sh*0.05, sw*0.33, a0, a0+(a1-a0)*lIn, side<0);
    ctx.stroke();
    for (let i=0;i<7;i++) {
      const grow=Math.min(1, lIn*7-i);
      if (grow <= 0) break;
      const a=Math.PI/2+side*(0.45+i*0.22);
      const lx=cx+Math.cos(a)*sw*0.33, ly=cy+sh*0.05+Math.sin(a)*sw*0.33;
      ctx.beginPath();
      ctx.ellipse(lx, ly, size*0.04*grow, size*0.016*grow, a+side*0.8, 0, Math.PI*2);
      ctx.fill();
    }
  }
  // Drei Sterne fallen nacheinander von oben
  for (let i=-1;i<=1;i++) {
    const stIn=seg(build, 0.45+(i+1)*0.07, 0.6+(i+1)*0.07);
    if (stIn <= 0) continue;
    const drop=(1-easeOutBack(stIn))*size*0.8;
    const sx=cx+i*sw*0.18, sy=cy-sh*0.33+Math.abs(i)*sh*0.02-drop, r=size*0.045*(0.4+0.6*stIn);
    ctx.beginPath();
    for (let k=0;k<10;k++) {
      const a=-Math.PI/2+k*Math.PI/5, rr=k%2?r*0.45:r;
      ctx.lineTo(sx+Math.cos(a)*rr, sy+Math.sin(a)*rr);
    }
    ctx.closePath(); ctx.fill();
  }
  // Ball rollt von rechts in die Mitte
  const bIn=seg(build, 0.55, 0.85);
  if (bIn > 0) {
    const e=easeOut(bIn);
    const bx=cx+(1-e)*size*2, by=cy+sh*0.05;
    ctx.globalAlpha=Math.min(1, alpha*1.4);
    ctx.save();
    ctx.translate(bx, by); ctx.rotate(-(1-e)*10); ctx.translate(-bx, -by);
    drawBall(bx, by, size*0.2);
    ctx.restore();
  }
  // Blitz, wenn alles zusammen ist
  const fIn=seg(build, 0.85, 1);
  if (fIn > 0 && fIn < 1) {
    ctx.globalAlpha=(1-fIn)*0.8;
    ctx.strokeStyle='#fff'; ctx.lineWidth=size*0.03*(1-fIn)+1;
    ctx.beginPath(); ctx.arc(cx, cy, size*(0.5+fIn*0.6), 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.globalAlpha=(1-fIn)*0.35;
    shield(); ctx.fill();
  }
  ctx.restore();
}
