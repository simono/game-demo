<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fußball</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a5c1a;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('load', resize);
document.addEventListener('DOMContentLoaded', resize);
resize();
let resizeFrames = 0;

const W = () => window.innerWidth;
const H = () => window.innerHeight;

function drawKoelnCrest(cx, cy, s) {
  ctx.save();
  ctx.translate(cx, cy);

  function shield() {
    ctx.beginPath();
    ctx.moveTo(-s*0.48,-s*0.5); ctx.lineTo(s*0.48,-s*0.5);
    ctx.quadraticCurveTo(s*0.52,-s*0.5, s*0.52,-s*0.33);
    ctx.lineTo(s*0.52,s*0.12);
    ctx.quadraticCurveTo(s*0.52,s*0.36, 0,s*0.55);
    ctx.quadraticCurveTo(-s*0.52,s*0.36, -s*0.52,s*0.12);
    ctx.lineTo(-s*0.52,-s*0.33);
    ctx.quadraticCurveTo(-s*0.52,-s*0.5, -s*0.48,-s*0.5);
    ctx.closePath();
  }

  // Weißer Hintergrund
  shield();
  ctx.shadowColor='rgba(0,0,0,0.4)'; ctx.shadowBlur=s*0.1;
  ctx.fillStyle='#fff'; ctx.fill(); ctx.shadowBlur=0;

  // Rote Streifen (3 rot, 2 weiß → 5 Streifen)
  shield(); ctx.save(); ctx.clip();
  ctx.fillStyle='#e3000f';
  const sw=s*1.04/5;
  ctx.fillRect(-s*0.52,        -s*0.52, sw, s*1.1);
  ctx.fillRect(-s*0.52+sw*2,   -s*0.52, sw, s*1.1);
  ctx.fillRect(-s*0.52+sw*4,   -s*0.52, sw, s*1.1);
  ctx.restore();

  // Geißbock (schwarze Silhouette)
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.ellipse(0,s*0.17,s*0.2,s*0.13,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(s*0.1,-s*0.04,s*0.12,s*0.1,0.15,0,Math.PI*2); ctx.fill();
  // Hörner
  ctx.strokeStyle='#111'; ctx.lineWidth=s*0.05; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(s*0.04,-s*0.12); ctx.quadraticCurveTo(-s*0.04,-s*0.3,s*0.04,-s*0.36); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(s*0.16,-s*0.11); ctx.quadraticCurveTo(s*0.26,-s*0.27,s*0.18,-s*0.34); ctx.stroke();
  // Bart
  ctx.beginPath(); ctx.moveTo(s*0.14,-s*0.0); ctx.quadraticCurveTo(s*0.2,s*0.08,s*0.14,s*0.12); ctx.lineWidth=s*0.04; ctx.stroke();
  // Beine
  ctx.lineWidth=s*0.05;
  ctx.beginPath();
  ctx.moveTo(-s*0.1,s*0.28); ctx.lineTo(-s*0.13,s*0.44);
  ctx.moveTo(s*0.0,s*0.29);  ctx.lineTo(s*0.0, s*0.44);
  ctx.moveTo(s*0.1,s*0.28);  ctx.lineTo(s*0.13,s*0.44);
  ctx.moveTo(s*0.19,s*0.25); ctx.lineTo(s*0.22,s*0.42);
  ctx.stroke();
  // Schwanz
  ctx.beginPath(); ctx.moveTo(-s*0.19,s*0.08); ctx.quadraticCurveTo(-s*0.3,s*0.0,-s*0.26,-s*0.1); ctx.stroke();

  // Schildrand
  shield(); ctx.strokeStyle='#111'; ctx.lineWidth=s*0.04; ctx.stroke();

  // Text
  ctx.fillStyle='#e3000f'; ctx.font=`bold ${s*0.15}px system-ui`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('1.FC', 0, -s*0.38);

  ctx.restore();
}

function drawSchalkeCrest(cx, cy, s) {
  ctx.save();
  ctx.translate(cx, cy);

  // Weißer äußerer Ring
  ctx.beginPath(); ctx.arc(0,0,s*0.54,0,Math.PI*2);
  ctx.shadowColor='rgba(0,0,0,0.4)'; ctx.shadowBlur=s*0.1;
  ctx.fillStyle='#fff'; ctx.fill(); ctx.shadowBlur=0;

  // Blauе Fläche
  ctx.beginPath(); ctx.arc(0,0,s*0.5,0,Math.PI*2);
  ctx.fillStyle=SCHALKE.color; ctx.fill();

  // Weißer Innenring
  ctx.beginPath(); ctx.arc(0,0,s*0.41,0,Math.PI*2);
  ctx.strokeStyle='#fff'; ctx.lineWidth=s*0.05; ctx.stroke();

  // Texte
  ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`bold ${s*0.13}px system-ui`;
  ctx.fillText('FC SCHALKE', 0, -s*0.22);
  ctx.font=`bold ${s*0.38}px system-ui`;
  ctx.fillText('04', 0, s*0.07);
  ctx.font=`${s*0.1}px system-ui`;
  ctx.fillText('GELSENKIRCHEN', 0, s*0.3);

  ctx.restore();
}

function drawBVBCrest(cx, cy, s) {
  ctx.save();
  ctx.translate(cx, cy);

  // Gelber äußerer Kreis
  ctx.beginPath(); ctx.arc(0, 0, s*0.54, 0, Math.PI*2);
  ctx.shadowColor='rgba(0,0,0,0.4)'; ctx.shadowBlur=s*0.1;
  ctx.fillStyle='#ffe500'; ctx.fill(); ctx.shadowBlur=0;

  // Schwarze Fläche
  ctx.beginPath(); ctx.arc(0, 0, s*0.47, 0, Math.PI*2);
  ctx.fillStyle='#111'; ctx.fill();

  // Gelbes Oval (BVB-typische Form)
  ctx.beginPath();
  ctx.ellipse(0, -s*0.07, s*0.31, s*0.19, 0, 0, Math.PI*2);
  ctx.fillStyle='#ffe500'; ctx.fill();

  // "BVB" in Schwarz auf gelbem Oval
  ctx.fillStyle='#111';
  ctx.font=`bold ${s*0.19}px system-ui`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('BVB', 0, -s*0.07);

  // "09" in Gelb unten
  ctx.fillStyle='#ffe500';
  ctx.font=`bold ${s*0.22}px system-ui`;
  ctx.fillText('09', 0, s*0.24);

  // Äußerer Rand
  ctx.beginPath(); ctx.arc(0, 0, s*0.54, 0, Math.PI*2);
  ctx.strokeStyle='#111'; ctx.lineWidth=s*0.03; ctx.stroke();

  ctx.restore();
}

function drawBMGCrest(cx, cy, s) {
  ctx.save();
  ctx.translate(cx, cy);

  // Weißer äußerer Kreis
  ctx.beginPath(); ctx.arc(0, 0, s*0.54, 0, Math.PI*2);
  ctx.shadowColor='rgba(0,0,0,0.4)'; ctx.shadowBlur=s*0.1;
  ctx.fillStyle='#fff'; ctx.fill(); ctx.shadowBlur=0;

  // Schwarze Fläche
  ctx.beginPath(); ctx.arc(0, 0, s*0.48, 0, Math.PI*2);
  ctx.fillStyle='#111'; ctx.fill();

  // Fohlen (vereinfachtes Pferdekopf-Silhouette)
  ctx.fillStyle='#fff';
  // Hals
  ctx.beginPath();
  ctx.ellipse(-s*0.05, s*0.08, s*0.12, s*0.2, -0.3, 0, Math.PI*2);
  ctx.fill();
  // Kopf
  ctx.beginPath();
  ctx.ellipse(s*0.1, -s*0.1, s*0.16, s*0.12, 0.5, 0, Math.PI*2);
  ctx.fill();
  // Maul
  ctx.beginPath();
  ctx.ellipse(s*0.24, -s*0.04, s*0.08, s*0.06, 0.3, 0, Math.PI*2);
  ctx.fill();
  // Ohr
  ctx.beginPath();
  ctx.moveTo(s*0.08, -s*0.2);
  ctx.lineTo(s*0.0,  -s*0.34);
  ctx.lineTo(s*0.18, -s*0.24);
  ctx.closePath(); ctx.fill();
  // Mähne
  ctx.fillStyle='#ddd';
  ctx.beginPath();
  ctx.moveTo(-s*0.06, -s*0.12);
  ctx.quadraticCurveTo(-s*0.22, -s*0.05, -s*0.18, s*0.1);
  ctx.quadraticCurveTo(-s*0.26, s*0.0,   -s*0.2,  -s*0.15);
  ctx.quadraticCurveTo(-s*0.12, -s*0.28,  s*0.04, -s*0.22);
  ctx.closePath(); ctx.fill();

  // "BMG" Text
  ctx.fillStyle='#fff';
  ctx.font=`bold ${s*0.17}px system-ui`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('BMG', 0, s*0.3);

  // "1900" klein
  ctx.font=`${s*0.1}px system-ui`;
  ctx.fillStyle='rgba(255,255,255,0.7)';
  ctx.fillText('1900', 0, s*0.43);

  ctx.restore();
}

function drawDFBCrest(cx, cy, s) {
  ctx.save();
  ctx.translate(cx, cy);

  // Schild
  ctx.beginPath();
  ctx.moveTo(-s*0.5, -s*0.55);
  ctx.lineTo( s*0.5, -s*0.55);
  ctx.quadraticCurveTo( s*0.55, -s*0.55,  s*0.55, -s*0.38);
  ctx.lineTo( s*0.55,  s*0.12);
  ctx.quadraticCurveTo( s*0.55,  s*0.38,  0,       s*0.6);
  ctx.quadraticCurveTo(-s*0.55,  s*0.38, -s*0.55,  s*0.12);
  ctx.lineTo(-s*0.55, -s*0.38);
  ctx.quadraticCurveTo(-s*0.55, -s*0.55, -s*0.5, -s*0.55);
  ctx.closePath();
  ctx.shadowColor='rgba(0,0,0,0.5)'; ctx.shadowBlur=s*0.12;
  ctx.fillStyle='#fff'; ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle='#111'; ctx.lineWidth=s*0.04; ctx.stroke();

  // Adler — schwarze Silhouette
  ctx.fillStyle='#111';

  // Linker Flügel
  ctx.beginPath();
  ctx.moveTo(-s*0.06, -s*0.08);
  ctx.bezierCurveTo(-s*0.18, -s*0.32, -s*0.46, -s*0.26, -s*0.48, -s*0.04);
  ctx.lineTo(-s*0.41,  s*0.04);
  ctx.lineTo(-s*0.34, -s*0.02);
  ctx.lineTo(-s*0.27,  s*0.05);
  ctx.lineTo(-s*0.19,  0);
  ctx.lineTo(-s*0.12,  s*0.07);
  ctx.closePath();
  ctx.fill();

  // Rechter Flügel
  ctx.beginPath();
  ctx.moveTo( s*0.06, -s*0.08);
  ctx.bezierCurveTo( s*0.18, -s*0.32,  s*0.46, -s*0.26,  s*0.48, -s*0.04);
  ctx.lineTo( s*0.41,  s*0.04);
  ctx.lineTo( s*0.34, -s*0.02);
  ctx.lineTo( s*0.27,  s*0.05);
  ctx.lineTo( s*0.19,  0);
  ctx.lineTo( s*0.12,  s*0.07);
  ctx.closePath();
  ctx.fill();

  // Körper
  ctx.beginPath();
  ctx.ellipse(0, s*0.1, s*0.11, s*0.2, 0, 0, Math.PI*2);
  ctx.fill();

  // Schwanz
  ctx.beginPath();
  ctx.moveTo(-s*0.1, s*0.27);
  ctx.lineTo( s*0.1, s*0.27);
  ctx.lineTo( s*0.14, s*0.4);
  ctx.lineTo(-s*0.14, s*0.4);
  ctx.closePath();
  ctx.fill();

  // Kopf (schaut nach rechts)
  ctx.beginPath();
  ctx.arc(s*0.07, -s*0.22, s*0.12, 0, Math.PI*2);
  ctx.fill();

  // Schnabel
  ctx.beginPath();
  ctx.moveTo(s*0.17, -s*0.24);
  ctx.lineTo(s*0.32, -s*0.2);
  ctx.lineTo(s*0.17, -s*0.14);
  ctx.closePath();
  ctx.fill();

  // Auge (weiß)
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.arc(s*0.11, -s*0.25, s*0.035, 0, Math.PI*2);
  ctx.fill();

  // DFB Schriftzug
  ctx.fillStyle='#111';
  ctx.font=`bold ${s*0.2}px system-ui`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('DFB', 0, s*0.5);

  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawField() {
  const w = W(), h = H();

  // Grüner Rasen mit Streifen (von oben nach unten)
  const stripeH = h / 8;
  for (let i = 0; i < 8; i++) {
    ctx.fillStyle = i % 2 === 0 ? '#2e8b2e' : '#34a034';
    ctx.fillRect(0, i * stripeH, w, stripeH);
  }

  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 3;

  // Außenlinien
  const padX = w * FPADX;
  const padY = h * FPADY;
  ctx.strokeRect(padX, padY, w - padX * 2, h - padY * 2);

  // Mittellinie (senkrecht)
  ctx.beginPath();
  ctx.moveTo(w / 2, padY);
  ctx.lineTo(w / 2, h - padY);
  ctx.stroke();

  // Mittelkreis
  ctx.beginPath();
  ctx.arc(w / 2, h / 2, h * 0.12, 0, Math.PI * 2);
  ctx.stroke();

  // Mittelpunkt
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.arc(w / 2, h / 2, 5, 0, Math.PI * 2);
  ctx.fill();

  const goalH = h * 0.35;
  const goalY = (h - goalH) / 2;

  // Strafraum links
  const penW = w * 0.18;
  const penH = h * 0.6;
  const penY = (h - penH) / 2;
  ctx.strokeRect(padX, penY, penW, penH);

  // Torraum links
  ctx.strokeRect(padX, goalY, w * 0.08, goalH);

  // Strafraum rechts
  ctx.strokeRect(w - padX - penW, penY, penW, penH);

  // Torraum rechts
  ctx.strokeRect(w - padX - w * 0.08, goalY, w * 0.08, goalH);

  // Elfmeterpunkt links
  ctx.beginPath();
  ctx.arc(padX + h * 0.12, h / 2, 5, 0, Math.PI * 2);
  ctx.fill();

  // Elfmeterpunkt rechts
  ctx.beginPath();
  ctx.arc(w - padX - h * 0.12, h / 2, 5, 0, Math.PI * 2);
  ctx.fill();

  // Tor-Hintergrund links + rechts
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(0, goalY, padX, goalH);
  ctx.fillRect(w - padX, goalY, padX, goalH);
}

// x, y = Ecke des Tornetzes; goalW = Tiefe ins Aus; goalH = Breite des Tors; facingRight = Tor öffnet nach rechts
function drawGoal(x, y, goalW, goalH, facingRight) {
  const postR = 5;

  // Netz (Gitterlinien)
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 1;
  const cols = 4, rows = 8;
  const cellW = goalW / cols;
  const cellH = goalH / rows;
  for (let i = 0; i <= cols; i++) {
    ctx.beginPath();
    ctx.moveTo(x + i * cellW, y);
    ctx.lineTo(x + i * cellW, y + goalH);
    ctx.stroke();
  }
  for (let j = 0; j <= rows; j++) {
    ctx.beginPath();
    ctx.moveTo(x, y + j * cellH);
    ctx.lineTo(x + goalW, y + j * cellH);
    ctx.stroke();
  }
  ctx.restore();

  // Pfosten (weiß, dick)
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = postR * 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Torpfosten oben
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + goalW, y);
  ctx.stroke();

  // Torpfosten unten
  ctx.beginPath();
  ctx.moveTo(x, y + goalH);
  ctx.lineTo(x + goalW, y + goalH);
  ctx.stroke();

  // Querbalken (die Linie zur Spielfeldseite)
  const qx = facingRight ? x : x + goalW;
  ctx.beginPath();
  ctx.moveTo(qx, y);
  ctx.lineTo(qx, y + goalH);
  ctx.stroke();

  // Glow
  ctx.shadowColor = 'rgba(255,255,255,0.6)';
  ctx.shadowBlur = 8;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x, y); ctx.lineTo(x + goalW, y);
  ctx.moveTo(x, y + goalH); ctx.lineTo(x + goalW, y + goalH);
  ctx.moveTo(qx, y); ctx.lineTo(qx, y + goalH);
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function drawBall(x, y, r) {
  // Schatten
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(x + 3, y + 4, r * 0.9, r * 0.45, 0, 0, Math.PI * 2);
  ctx.fill();

  // Ball bunt
  const grad = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.05, x, y, r);
  grad.addColorStop(0, '#ff6b6b');
  grad.addColorStop(0.4, '#feca57');
  grad.addColorStop(0.75, '#48dbfb');
  grad.addColorStop(1, '#a29bfe');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();

  // Bunte Flecken
  const patches = [
    [0, 0,       '#ff4757'],
    [0.45, -0.35, '#2ed573'],
    [-0.45, -0.35,'#ffa502'],
    [0.5, 0.25,  '#1e90ff'],
    [-0.5, 0.25, '#ff6b81'],
  ];
  for (const [dx, dy, color] of patches) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x + dx * r, y + dy * r, r * 0.22, 0, Math.PI * 2);
    ctx.fill();
  }

  // Glanzpunkt
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath();
  ctx.ellipse(x - r * 0.28, y - r * 0.3, r * 0.22, r * 0.14, -0.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawPlayer(x, y, size, color, label, celebrate=false, numColor='rgba(255,255,255,0.9)', style={}, appearance={}) {
  const skinCol  = appearance.skin     || '#d4956a';
  const skinDark = appearance.skinDark || '#b07040';
  const hairCol  = appearance.hair     || '#4a2800';
  const hairStyle= appearance.hairStyle|| 'short';
  ctx.save();

  // Jubel: hüpfen
  const bounce = celebrate ? Math.abs(Math.sin(Date.now()*0.01)) * size * 0.5 : 0;
  y -= bounce;

  // Schatten (kleiner beim Hüpfen)
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  const shadowScale = celebrate ? Math.max(0.3, 1 - bounce/size) : 1;
  ctx.ellipse(x + 2, y + size * 1.7 + bounce + 3, size * 0.6 * shadowScale, size * 0.15 * shadowScale, 0, 0, Math.PI * 2);
  ctx.fill();

  // Beine: Hose (oben) + Stulpen (unten)
  const shortsCol = style.shortsColor || '#333';
  const socksCol  = style.socksColor  || '#333';
  ctx.lineWidth = size * 0.22;
  ctx.lineCap = 'round';

  if (celebrate) {
    // Hose (Oberschenkel)
    ctx.strokeStyle = shortsCol;
    ctx.beginPath(); ctx.moveTo(x - size*0.18, y + size*0.9); ctx.lineTo(x - size*0.28, y + size*1.2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + size*0.18, y + size*0.9); ctx.lineTo(x + size*0.28, y + size*1.2); ctx.stroke();
    // Stulpen (Unterschenkel, angewinkelt)
    ctx.strokeStyle = socksCol;
    ctx.beginPath(); ctx.moveTo(x - size*0.28, y + size*1.2); ctx.lineTo(x - size*0.35, y + size*1.4); ctx.lineTo(x - size*0.15, y + size*1.7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + size*0.28, y + size*1.2); ctx.lineTo(x + size*0.35, y + size*1.4); ctx.lineTo(x + size*0.15, y + size*1.7); ctx.stroke();
  } else {
    // Hose (Oberschenkel)
    ctx.strokeStyle = shortsCol;
    ctx.beginPath(); ctx.moveTo(x - size*0.18, y + size*0.9); ctx.lineTo(x - size*0.23, y + size*1.2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + size*0.18, y + size*0.9); ctx.lineTo(x + size*0.23, y + size*1.2); ctx.stroke();
    // Stulpen (Unterschenkel)
    ctx.strokeStyle = socksCol;
    ctx.beginPath(); ctx.moveTo(x - size*0.23, y + size*1.2); ctx.lineTo(x - size*0.28, y + size*1.68); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + size*0.23, y + size*1.2); ctx.lineTo(x + size*0.28, y + size*1.68); ctx.stroke();
    // Stulpen-Streifen oben
    if (style.socksStripe) {
      ctx.strokeStyle = style.socksStripe;
      ctx.lineWidth = size * 0.09;
      ctx.beginPath(); ctx.moveTo(x - size*0.31, y + size*1.25); ctx.lineTo(x - size*0.14, y + size*1.25); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + size*0.14, y + size*1.25); ctx.lineTo(x + size*0.31, y + size*1.25); ctx.stroke();
    }
  }

  // Schuhe
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.ellipse(x - size * 0.3, y + size * 1.75, size * 0.22, size * 0.12, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x + size * 0.3, y + size * 1.75, size * 0.22, size * 0.12, 0.3, 0, Math.PI * 2);
  ctx.fill();

  // Körper (Trikot)
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(x, y + size * 0.55, size * 0.42, size * 0.48, 0, 0, Math.PI * 2);
  ctx.fill();

  // Arme — beim Jubel hoch gestreckt in V-Form
  ctx.strokeStyle = color;
  ctx.lineWidth = size * 0.2;
  ctx.lineCap = 'round';
  if (celebrate) {
    const wave = Math.sin(Date.now()*0.008) * size * 0.15;
    ctx.beginPath();
    ctx.moveTo(x - size * 0.38, y + size * 0.3);
    ctx.lineTo(x - size * 0.75, y - size * 0.45 + wave);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + size * 0.38, y + size * 0.3);
    ctx.lineTo(x + size * 0.75, y - size * 0.45 - wave);
    ctx.stroke();
  } else if (style.shortSleeves) {
    // Kurze Ärmel (Trikotfarbe)
    ctx.beginPath();
    ctx.moveTo(x - size * 0.38, y + size * 0.3);
    ctx.lineTo(x - size * 0.55, y + size * 0.52);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + size * 0.38, y + size * 0.3);
    ctx.lineTo(x + size * 0.55, y + size * 0.52);
    ctx.stroke();
    // Unterarme (Hautfarbe)
    ctx.strokeStyle = skinDark;
    ctx.beginPath();
    ctx.moveTo(x - size * 0.55, y + size * 0.52);
    ctx.lineTo(x - size * 0.65, y + size * 0.82);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + size * 0.55, y + size * 0.52);
    ctx.lineTo(x + size * 0.65, y + size * 0.82);
    ctx.stroke();
    // Hände
    ctx.fillStyle = skinCol;
    ctx.beginPath(); ctx.arc(x - size*0.66, y + size*0.86, size*0.1, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + size*0.66, y + size*0.86, size*0.1, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(x - size * 0.38, y + size * 0.3);
    ctx.lineTo(x - size * 0.65, y + size * 0.85);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + size * 0.38, y + size * 0.3);
    ctx.lineTo(x + size * 0.65, y + size * 0.85);
    ctx.stroke();
  }

  // Kopf
  const headGrad = ctx.createRadialGradient(x - size*0.1, y - size*0.15, size*0.05, x, y, size*0.38);
  headGrad.addColorStop(0, skinCol);
  headGrad.addColorStop(1, skinDark);
  ctx.fillStyle = headGrad;
  ctx.beginPath();
  ctx.arc(x, y, size * 0.38, 0, Math.PI * 2);
  ctx.fill();

  // Haare
  ctx.fillStyle = hairCol;
  if (hairStyle === 'curly') {
    // Lockige Haare — mehrere Bögen
    for (let i = 0; i < 5; i++) {
      const hx = x - size*0.28 + i * size*0.14;
      ctx.beginPath();
      ctx.arc(hx, y - size*0.28, size*0.13, Math.PI, Math.PI*2);
      ctx.fill();
    }
  } else {
    // Kurze Haare — flache Ellipse
    ctx.beginPath();
    ctx.ellipse(x, y - size*0.22, size*0.35, size*0.18, 0, Math.PI, Math.PI*2);
    ctx.fill();
  }

  // Augen — beim Jubel geschlossen (Bogen)
  if (celebrate) {
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = size * 0.06;
    ctx.beginPath();
    ctx.arc(x - size * 0.13, y - size * 0.04, size * 0.09, Math.PI, 0);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x + size * 0.13, y - size * 0.04, size * 0.09, Math.PI, 0);
    ctx.stroke();
  } else {
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(x - size * 0.13, y - size * 0.04, size * 0.09, size * 0.1, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x + size * 0.13, y - size * 0.04, size * 0.09, size * 0.1, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.arc(x - size * 0.11, y - size * 0.04, size * 0.055, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + size * 0.15, y - size * 0.04, size * 0.055, 0, Math.PI * 2);
    ctx.fill();
  }

  // Mund — beim Jubel breites offenes Lachen
  ctx.strokeStyle = '#a0522d';
  ctx.lineWidth = size * 0.06;
  ctx.lineCap = 'round';
  if (celebrate) {
    ctx.beginPath();
    ctx.arc(x, y + size * 0.1, size * 0.22, 0.05, Math.PI - 0.05);
    ctx.stroke();
    // Zähne
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(x, y + size * 0.18, size * 0.14, 0, Math.PI);
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.arc(x, y + size * 0.1, size * 0.15, 0.2, Math.PI - 0.2);
    ctx.stroke();
  }

  // Nummer / Label auf Trikot
  ctx.fillStyle = numColor || 'rgba(255,255,255,0.9)';
  ctx.font = `bold ${size * 0.35}px system-ui`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, x, y + size * 0.55);

  ctx.restore();
}

const PASS_SPD    = 0.014;

const PICKUP_DIST = 0.055;
// Feldlinien-Position (für Zeichnung und Tore)

// ── Audio ──────────────────────────────────────────────────────────
let AC = null;
let noiseBuffer = null;
let crowdSource = null, crowdGainNode = null, crowdLFO = null;
let menuTimer = null, melodyIdx = 0;
let lastAudioState = '';

function getAC() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  return AC;
}

function getNoiseBuf() {
  if (noiseBuffer) return noiseBuffer;
  const ac = getAC(), sr = ac.sampleRate;
  noiseBuffer = ac.createBuffer(1, sr * 2, sr);
  const d = noiseBuffer.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random()*2-1;
  return noiseBuffer;
}

// Fangesänge — gefiltertes Rauschen mit Rhythmus-LFO
function startCrowd() {
  if (crowdSource) return;
  const ac = getAC();
  crowdSource = ac.createBufferSource();
  crowdSource.buffer = getNoiseBuf(); crowdSource.loop = true;
  const bp = ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=700; bp.Q.value=1.8;
  const bp2 = ac.createBiquadFilter(); bp2.type='bandpass'; bp2.frequency.value=1400; bp2.Q.value=2;
  crowdGainNode = ac.createGain(); crowdGainNode.gain.value=0.25;
  // LFO für Gesangs-Rhythmus (~1.2Hz = Fansgesang-Takt)
  crowdLFO = ac.createOscillator(); crowdLFO.type='sine'; crowdLFO.frequency.value=1.2;
  const lfoGain = ac.createGain(); lfoGain.gain.value=0.15;
  crowdLFO.connect(lfoGain); lfoGain.connect(crowdGainNode.gain);
  crowdSource.connect(bp); bp.connect(bp2); bp2.connect(crowdGainNode); crowdGainNode.connect(ac.destination);
  crowdSource.start(); crowdLFO.start();
}

function stopCrowd() {
  if (!crowdSource) return;
  try { crowdSource.stop(); crowdLFO.stop(); } catch(e){}
  crowdSource = null; crowdGainNode = null; crowdLFO = null;
}

// Menü-Musik — einfache Fanfare-Melodie
const MELODY = [
  [392,0.18],[392,0.12],[440,0.22],[392,0.22],[349,0.12],[392,0.42],
  [440,0.18],[440,0.12],[494,0.22],[440,0.22],[392,0.12],[523,0.55],
  [392,0.12],[440,0.12],[392,0.12],[349,0.22],[330,0.12],[392,0.42],
  [330,0.18],[349,0.18],[330,0.18],[294,0.18],[262,0.55],[0,0.3],
];

function playMenuNote() {
  if (gameState !== 'menu') { menuTimer=null; return; }
  const ac = getAC();
  const [freq, dur] = MELODY[melodyIdx % MELODY.length];
  melodyIdx++;
  if (freq > 0) {
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type='triangle'; osc.frequency.value=freq;
    g.gain.setValueAtTime(0.13, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+dur*0.85);
    osc.connect(g); g.connect(ac.destination);
    osc.start(); osc.stop(ac.currentTime+dur);
    // Oktave tiefer leise dazu
    const osc2 = ac.createOscillator(), g2 = ac.createGain();
    osc2.type='sine'; osc2.frequency.value=freq/2;
    g2.gain.setValueAtTime(0.04, ac.currentTime);
    g2.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+dur*0.85);
    osc2.connect(g2); g2.connect(ac.destination);
    osc2.start(); osc2.stop(ac.currentTime+dur);
  }
  menuTimer = setTimeout(playMenuNote, dur*1000);
}

function startMenuMusic() { if (!menuTimer) { melodyIdx=0; playMenuNote(); } }
function stopMenuMusic()  { if (menuTimer) { clearTimeout(menuTimer); menuTimer=null; } }

// Jubel-Sound bei Tor
function playGoalSound() {
  const ac = getAC();
  const t = ac.currentTime;

  // === Stadion-Lufthorn (3× kurz hintereinander) ===
  [0, 0.55, 1.0].forEach(delay => {
    // Lufthorn = mehrere verstimmte Sägezähne (Blechbläser-Effekt)
    [233, 237, 350, 466, 700].forEach((freq, i) => {
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = 'sawtooth';
      osc.frequency.value = freq;
      const vol = [0.18, 0.12, 0.1, 0.08, 0.05][i];
      const dur = i===0 ? 0.35 : 0.32;
      g.gain.setValueAtTime(0, t+delay);
      g.gain.linearRampToValueAtTime(vol, t+delay+0.015);
      g.gain.setValueAtTime(vol, t+delay+dur*0.7);
      g.gain.exponentialRampToValueAtTime(0.001, t+delay+dur);
      osc.connect(g); g.connect(ac.destination);
      osc.start(t+delay); osc.stop(t+delay+dur+0.05);
    });
  });

  // === Jubelwelle: Menge bricht aus ===
  const ns = ac.createBufferSource(); ns.buffer=getNoiseBuf(); ns.loop=true;
  const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3500;
  const hp = ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=200;
  const g = ac.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.55, t+0.08);
  g.gain.linearRampToValueAtTime(0.4,  t+2.0);
  g.gain.linearRampToValueAtTime(0.55, t+2.4);  // zweite Welle
  g.gain.linearRampToValueAtTime(0.2,  t+4.0);
  g.gain.linearRampToValueAtTime(0,    t+5.5);
  ns.connect(lp); lp.connect(hp); hp.connect(g); g.connect(ac.destination);
  ns.start(); ns.stop(t+5.6);

  // === "Tor!"-Ansager-Sweep ===
  const sweep = ac.createOscillator(), sg = ac.createGain();
  sweep.type = 'sine';
  sweep.frequency.setValueAtTime(280, t+1.6);
  sweep.frequency.linearRampToValueAtTime(420, t+2.2);
  sweep.frequency.linearRampToValueAtTime(350, t+2.6);
  sg.gain.setValueAtTime(0, t+1.6);
  sg.gain.linearRampToValueAtTime(0.22, t+1.68);
  sg.gain.setValueAtTime(0.22, t+2.4);
  sg.gain.linearRampToValueAtTime(0, t+2.8);
  sweep.connect(sg); sg.connect(ac.destination);
  sweep.start(t+1.6); sweep.stop(t+2.9);
}

// Schlusspfiff
function playWhistle() {
  const ac = getAC(), t = ac.currentTime;
  [0, 0.45, 0.9].forEach(d => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type='sine'; o.frequency.value = 2200;
    g.gain.setValueAtTime(0,t+d); g.gain.linearRampToValueAtTime(0.25,t+d+0.02);
    g.gain.setValueAtTime(0.25,t+d+0.18); g.gain.linearRampToValueAtTime(0,t+d+0.22);
    o.connect(g); g.connect(ac.destination); o.start(t+d); o.stop(t+d+0.25);
  });
}

function updateAudio() {
  if (gameState === lastAudioState) return;
  const prev = lastAudioState;
  lastAudioState = gameState;
  if (gameState === 'menu')     { stopCrowd(); startMenuMusic(); }
  if (gameState === 'playing')  { stopMenuMusic(); startCrowd(); }
  if (gameState === 'goal' && (prev==='playing')) playGoalSound();
  if (gameState === 'halftime') { playWhistle(); }
  if (gameState === 'fulltime') { playWhistle(); stopCrowd(); }
}

function getCP() {
  const t = playerTeam === 'red' ? redTeam : blueTeam;
  return t[controlledIdx];
}

function switchPlayer() {
  const t = playerTeam === 'red' ? redTeam : blueTeam;
  // Wechsel zum Spieler der dem Ball am nächsten ist (außer dem aktuellen)
  let best = (controlledIdx + 1) % t.length;
  let bestDist = Infinity;
  for (let i = 0; i < t.length; i++) {
    if (i === controlledIdx) continue;
    const d = Math.hypot(t[i].x - ball.x, t[i].y - ball.y);
    if (d < bestDist) { bestDist = d; best = i; }
  }
  controlledIdx = best;
}

// ── Aktionen ────────────────────────────────────────────────────────
function doShoot() {
  const cp = getCP();
  if (ballOwner !== cp) return;
  const goalX = playerTeam === 'red' ? FR : FL;
  const dy=0.5-ball.y, dx=goalX-ball.x, len=Math.sqrt(dx*dx+dy*dy)||1;
  ball.vx=(dx/len)*KICK_SPD; ball.vy=(dy/len)*KICK_SPD+(Math.random()-0.5)*0.006;
  goalScorer=cp; ballOwner=null;
}

function doPass() {
  const cp = getCP();
  if (ballOwner !== cp) return;
  const fwd = playerTeam === 'red' ? PASS_SPD : -PASS_SPD;
  let dx=cp.vx||fwd, dy=cp.vy||0;
  const len=Math.sqrt(dx*dx+dy*dy)||1;
  ball.vx=(dx/len)*PASS_SPD; ball.vy=(dy/len)*PASS_SPD;
  ballOwner=null;
}

function doTackle() {
  const cp = getCP();
  const opponents = playerTeam === 'red' ? blueTeam : redTeam;
  for (const op of opponents) {
    if (ballOwner !== op) continue;
    if (Math.hypot(cp.x-op.x, cp.y-op.y) < TACKLE_DIST) { ballOwner=cp; break; }
  }
}

const dpad      = { up:false, down:false, left:false, right:false };
const btnActive = { shoot:false, pass:false, tackle:false, switch:false };
const touched   = {};

function getDpad() {
  const w=W(), h=H(), s=Math.min(w,h)*0.12;
  const g = s*0.15, margin = w*0.06;
  const cx = margin + s*1.5 + g;
  const cy = h - s*2.8;
  return {
    up:    {x:cx,     y:cy-s-g, s},
    down:  {x:cx,     y:cy+s+g, s},
    left:  {x:cx-s-g, y:cy,     s},
    right: {x:cx+s+g, y:cy,     s},
  };
}

function getActionBtns() {
  const w=W(), h=H(), r=Math.min(w,h)*0.08;
  const g=r*0.3, margin=w*0.06;
  const rx = w - margin - r - g;   // rechte Spalte
  const lx = rx - r*2 - g;         // linke Spalte
  const by = h - r - margin*0.8;   // untere Reihe
  const ty = by - r*2 - g;         // obere Reihe
  return {
    shoot:  {x:rx, y:by, r},   // unten rechts
    pass:   {x:lx, y:by, r},   // unten links
    tackle: {x:rx, y:ty, r},   // oben rechts
    switch: {x:lx, y:ty, r},   // oben links
  };
}

function hitDpad(tx,ty,b) { return Math.abs(tx-b.x)<b.s*0.6 && Math.abs(ty-b.y)<b.s*0.6; }
function hitBtn(tx,ty,b)  { const dx=tx-b.x,dy=ty-b.y; return dx*dx+dy*dy<b.r*b.r*1.8; }

function menuButtonHit(tx, ty) {

    for (let i=0; i<4; i++) {
      const cx=GX[i%2], by=GY[Math.floor(i/2)];
      if (tx>=cx-BW/2 && tx<=cx+BW/2 && ty>=by && ty<=by+BH) {
        playerTeam=ALL_PTEAMS[i]; playerClub=ALL_CLUBS[i];
        teamChosen=true; return true;
      }
    }
  } else if (!opponentChosen) {
    // Schritt 2: andere 3 Clubs als Gegner
    const others=ALL_CLUBS.filter(c=>c!==playerClub);
    const CX=[w*0.18, w*0.5, w*0.82];
    for (let i=0; i<3; i++) {
      if (tx>=CX[i]-BW/2 && tx<=CX[i]+BW/2 && ty>=h*0.62 && ty<=h*0.62+BH) {
        opponentClub=others[i]; opponentChosen=true; return true;
      }
    }
  } else {
    // Schritt 3: Starten
    const SW=w*0.6, SH=h*0.09;
    if (tx>=w/2-SW/2 && tx<=w/2+SW/2 && ty>=h*0.74 && ty<=h*0.74+SH) {
      controlledIdx=0; ballOwner=playerTeam==='red'?redP:blueP;
      currentHalf=1; halfTimeLeft=HALF_SECS; breakTimeLeft=BREAK_SECS; lastFrameMs=0;
      score.red=0; score.blue=0;
      gameState='playing'; teamChosen=false; opponentChosen=false; return true;
    }
  }
  return false;
}

function onPointerDown(tx, ty, id) {
  getAC(); // AudioContext beim ersten Touch starten
  if (gameState === 'menu') { menuButtonHit(tx, ty); return; }
  if (gameState === 'goal')     { gameState='playing'; lastFrameMs=0; return; }
  if (gameState === 'fulltime' && Date.now()-fulltimeShowMs > 4000) {
    gameState='menu'; teamChosen=false; opponentChosen=false; stopCrowd(); startMenuMusic(); return;
  }
  if (gameState === 'fulltime') return; // noch nicht weitertippen
  const ab=getActionBtns(), dp=getDpad();
  if (hitBtn(tx,ty,ab.shoot))  { btnActive.shoot=true;  touched[id]='shoot';  doShoot();      return; }
  if (hitBtn(tx,ty,ab.pass))   { btnActive.pass=true;   touched[id]='pass';   doPass();       return; }
  if (hitBtn(tx,ty,ab.tackle)) { btnActive.tackle=true; touched[id]='tackle'; doTackle();     return; }
  if (hitBtn(tx,ty,ab.switch)) { btnActive.switch=true; touched[id]='switch'; switchPlayer(); return; }
  for (const dir of ['up','down','left','right']) {
    if (hitDpad(tx,ty,dp[dir])) { dpad[dir]=true; touched[id]=dir; return; }
  }
}

function onPointerUp(id) {
  const what=touched[id]; if (!what) return;
  if (['shoot','pass','tackle','switch'].includes(what)) btnActive[what]=false;
  else dpad[what]=false;
  delete touched[id];
}

function onPointerMove(tx, ty, id) {
  const what=touched[id];
  if (what==='up'||what==='down'||what==='left'||what==='right') {
    const dp=getDpad();
    dpad[what]=false;
    for (const dir of ['up','down','left','right']) {
      if (hitDpad(tx,ty,dp[dir])) { dpad[dir]=true; touched[id]=dir; break; }
    }
  }
}

canvas.addEventListener('pointerdown', e=>{
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  onPointerDown(e.clientX, e.clientY, e.pointerId);
},{passive:false});

canvas.addEventListener('pointermove', e=>{
  e.preventDefault();
  onPointerMove(e.clientX, e.clientY, e.pointerId);
},{passive:false});

canvas.addEventListener('pointerup',     e=>{ onPointerUp(e.pointerId); },{passive:false});
canvas.addEventListener('pointercancel', e=>{ onPointerUp(e.pointerId); },{passive:false});

// Tastatur
const keys={};
window.addEventListener('keydown', e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  if (gameState === 'menu') {
    if (!teamChosen) {
      if (e.key==='1') { playerTeam='red';  playerClub=KOELN;   teamChosen=true; }
      if (e.key==='2') { playerTeam='red';  playerClub=BVB;     teamChosen=true; }
      if (e.key==='3') { playerTeam='blue'; playerClub=SCHALKE; teamChosen=true; }
      if (e.key==='4') { playerTeam='red';  playerClub=BMG;     teamChosen=true; }
    } else if (!opponentChosen) {
      const others=[KOELN,BVB,SCHALKE,BMG].filter(c=>c!==playerClub);
      if (e.key==='1') { opponentClub=others[0]; opponentChosen=true; }
      if (e.key==='2') { opponentClub=others[1]; opponentChosen=true; }
      if (e.key==='3') { opponentClub=others[2]; opponentChosen=true; }

});
window.addEventListener('keyup', e=>{ keys[e.key]=false; });

// ── KI Gegner ───────────────────────────────────────────────────────
let aiShootCooldown = 0;

function moveTo(p, tx, ty, spd) {
  const dx=tx-p.x, dy=ty-p.y, len=Math.sqrt(dx*dx+dy*dy)||1;
  p.vx=dx/len*spd; p.vy=dy/len*spd;
  p.x=Math.max(FL,Math.min(FR,p.x+p.vx));
  p.y=Math.max(FT,Math.min(FB,p.y+p.vy));
}

function updateAI() {
  aiShootCooldown--;
  const myTeam  = playerTeam === 'red' ? redTeam  : blueTeam;
  const foeTeam = playerTeam === 'red' ? blueTeam : redTeam;
  const cp       = getCP();
  const foeGoalX = playerTeam === 'red' ? FL : FR;
  const myGoalX  = playerTeam === 'red' ? FR : FL;
  const foeClose = playerTeam === 'red' ? (p => p.x < 0.38) : (p => p.x > 0.62);
  const myClose  = playerTeam === 'red' ? (p => p.x > 0.65) : (p => p.x < 0.35);

  // ── Gegnerisches Team (alle KI) ──
  const foeSupY = [0.5, 0.3, 0.7];
  for (let i=0; i<foeTeam.length; i++) {
    const fp = foeTeam[i];
    const sx = foeGoalX + (playerTeam==='red' ? 0.06 : -0.06);
    if (ballOwner===fp) {
      if (foeClose(fp) && aiShootCooldown<=0) {
        const dx=foeGoalX-fp.x, dy=0.5-fp.y, len=Math.hypot(dx,dy)||1;
        ball.vx=(dx/len)*KICK_SPD; ball.vy=(dy/len)*KICK_SPD+(Math.random()-0.5)*0.01;
        goalScorer=fp; ballOwner=null; aiShootCooldown=70;
      } else { moveTo(fp, sx, foeSupY[i], AI_SPEED); }
    } else if (ballOwner && ballOwner.team===playerTeam) {
      moveTo(fp, ballOwner.x, ballOwner.y, AI_SPEED);
      if (Math.hypot(fp.x-ballOwner.x,fp.y-ballOwner.y)<TACKLE_DIST*0.8 && Math.random()<0.012) ballOwner=fp;
    } else if (!ballOwner) {
      moveTo(fp, ball.x, ball.y, AI_SPEED);
    } else {
      moveTo(fp, sx, foeSupY[i], AI_SPEED*0.65);
    }
  }

  // ── Eigene Mitspieler (KI, nicht der gesteuerte Spieler) ──
  const teammates = myTeam.filter(p => p !== cp);
  const mySupY = [0.28, 0.72];
  const mySuppX = playerTeam==='red' ? 0.38 : 0.62;
  for (let i=0; i<teammates.length; i++) {
    const rp = teammates[i];
    if (ballOwner===rp) {
      if (myClose(rp) && aiShootCooldown<=0) {
        const dx=myGoalX-ball.x, dy=0.5-ball.y, len=Math.hypot(dx,dy)||1;
        ball.vx=(dx/len)*KICK_SPD; ball.vy=(dy/len)*KICK_SPD;
        goalScorer=rp; ballOwner=null; aiShootCooldown=60;
      } else {
        const dx=cp.x-rp.x, dy=cp.y-rp.y, len=Math.hypot(dx,dy)||1;
        ball.vx=(dx/len)*PASS_SPD; ball.vy=(dy/len)*PASS_SPD;
        ballOwner=null;
      }
    } else if (!ballOwner) {
      moveTo(rp, ball.x, ball.y, AI_SPEED*0.8);
    } else if (ballOwner && ballOwner.team!==playerTeam) {
      moveTo(rp, ballOwner.x, ballOwner.y, AI_SPEED*0.8);
    } else {
      moveTo(rp, mySuppX, mySupY[i], AI_SPEED*0.65);
    }
  }
}

// ── Update ──────────────────────────────────────────────────────────
function update() {
  const now = Date.now();
  const delta = (lastFrameMs && gameState==='playing') ? Math.min((now-lastFrameMs)/1000, 0.1) : 0;
  if (gameState==='playing') lastFrameMs = now;

  // Halbzeitpause-Countdown
  if (gameState === 'halftime') {
    if (!lastFrameMs) lastFrameMs = now;
    breakTimeLeft -= (now - lastFrameMs) / 1000;
    lastFrameMs = now;
    if (breakTimeLeft <= 0) {
      currentHalf = 2; halfTimeLeft = HALF_SECS; breakTimeLeft = BREAK_SECS;
      gameState = 'playing'; lastFrameMs = 0; resetPositions();
    }
    return;
  }

  if (gameState !== 'playing') return;

  // Timer zählt runter
  halfTimeLeft = Math.max(0, halfTimeLeft - delta);
  if (halfTimeLeft <= 0) {
    if (currentHalf === 1) {
      gameState = 'halftime'; lastFrameMs = 0;
    } else {
      gameState = 'fulltime'; fulltimeShowMs = Date.now();
    }
    return;
  }

  // Spieler bewegen
  const cp = getCP();
  let mvx = 0, mvy = 0;
  if (dpad.left  || keys['ArrowLeft']  || keys['a']) mvx -= 1;
  if (dpad.right || keys['ArrowRight'] || keys['d']) mvx += 1;
  if (dpad.up    || keys['ArrowUp']    || keys['w']) mvy -= 1;
  if (dpad.down  || keys['ArrowDown']  || keys['s']) mvy += 1;
  if (keys[' ']||keys['Enter']) { doShoot();      keys[' ']=false; keys['Enter']=false; }
  if (keys['f']||keys['p'])     { doPass();       keys['f']=false; keys['p']=false; }
  if (keys['t']||keys['g'])     { doTackle();     keys['t']=false; keys['g']=false; }
  if (keys['x']||keys['Tab'])   { switchPlayer(); keys['x']=false; keys['Tab']=false; }

  const mlen=Math.sqrt(mvx*mvx+mvy*mvy)||1;
  const spd=Math.min(Math.sqrt(mvx*mvx+mvy*mvy),1)*SPEED;
  cp.vx=mvx/mlen*spd; cp.vy=mvy/mlen*spd;
  cp.x=Math.max(FL,Math.min(FR,cp.x+cp.vx));
  cp.y=Math.max(FT,Math.min(FB,cp.y+cp.vy));

  updateAI();

  // Ball
  if (ballOwner) {
    const side = ballOwner.team==='red' ? 1 : -1;
    ball.x=ballOwner.x+side*0.045; ball.y=ballOwner.y+0.055;
  } else {
    ball.x+=ball.vx; ball.y+=ball.vy;
    ball.vx*=BALL_FRIC; ball.vy*=BALL_FRIC;
    // Ball-Radius in normierte Koordinaten
    const bRy = Math.min(W(),H())*0.022 / H();
    const bRx = Math.min(W(),H())*0.022 / W();
    // Oben/Unten: an Außenlinien abprallen
    if (ball.y < FPADY+bRy)   { ball.y=FPADY+bRy;   ball.vy*=-0.7; }
    if (ball.y > 1-FPADY-bRy) { ball.y=1-FPADY-bRy; ball.vy*=-0.7; }
    // Links/Rechts: Tor oder Abprall
    if (ball.x < FPADX+bRx) {
      if (ball.y>GOAL_T && ball.y<GOAL_B) { score.blue++; goalTeam='blue'; gameState='goal'; resetPositions(); return; }
      ball.x=FPADX+bRx; ball.vx*=-0.7;
    }
    if (ball.x > 1-FPADX-bRx) {
      if (ball.y>GOAL_T && ball.y<GOAL_B) { score.red++; goalTeam='red'; gameState='goal'; resetPositions(); return; }
      ball.x=1-FPADX-bRx; ball.vx*=-0.7;
    }
    for (const p of allPlayers) {
      if (Math.hypot(p.x-ball.x, p.y-ball.y)<PICKUP_DIST) { ballOwner=p; break; }
    }
  }
}

function drawUI() {

    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#feca57';

    ctx.fillText('Halbzeit! ⏱️', w/2, h*0.3);
    ctx.fillStyle='#fff';
    ctx.font=`bold ${Math.min(w*0.08,34)}px system-ui`;
    const lC=playerTeam==='red'?playerClub:opponentClub, rC=playerTeam==='red'?opponentClub:playerClub;
    const lS=playerTeam==='red'?score.red:score.blue, rS=playerTeam==='red'?score.blue:score.red;

    ctx.font=`${Math.min(w*0.05,22)}px system-ui`;
    ctx.textAlign='center';
    ctx.fillText(`2. Halbzeit in ${Math.ceil(Math.max(0,breakTimeLeft))}s...`, w/2, h*0.6);
    ctx.restore();
    return;
  }

  // Spielende-Bildschirm
  if (gameState === 'fulltime') {
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.75)'; ctx.fillRect(0,0,w,h);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#fff';
    ctx.font=`bold ${Math.min(w*0.1,44)}px system-ui`;
    ctx.fillText('Spielende! 🏁', w/2, h*0.22);
    const lC=playerTeam==='red'?playerClub:opponentClub, rC=playerTeam==='red'?opponentClub:playerClub;
    const lS=playerTeam==='red'?score.red:score.blue, rS=playerTeam==='red'?score.blue:score.red;
    // Vereinsnamen
    ctx.font=`bold ${Math.min(w*0.05,21)}px system-ui`;
    ctx.fillStyle=lC.light; ctx.textAlign='right';  ctx.fillText(lC.short, w/2-30, h*0.36);
    ctx.fillStyle=rC.light; ctx.textAlign='left';   ctx.fillText(rC.short, w/2+30, h*0.36);
    // Ergebnis groß
    ctx.font=`bold ${Math.min(w*0.15,64)}px system-ui`;
    ctx.fillStyle=lC.light; ctx.textAlign='right';  ctx.fillText(lS, w/2-18, h*0.48);
    ctx.fillStyle='#fff';   ctx.textAlign='center'; ctx.fillText(':', w/2,    h*0.48);
    ctx.fillStyle=rC.light; ctx.textAlign='left';   ctx.fillText(rS, w/2+18, h*0.48);
    // Gewinner
    ctx.textAlign='center';
    ctx.font=`bold ${Math.min(w*0.06,26)}px system-ui`;
    if (lS > rS)      { ctx.fillStyle=lC.light; ctx.fillText(`${lC.name} gewinnt! 🏆`, w/2, h*0.63); }
    else if (rS > lS) { ctx.fillStyle=rC.light; ctx.fillText(`${rC.name} gewinnt! 🏆`, w/2, h*0.63); }
    else              { ctx.fillStyle='#feca57'; ctx.fillText('Unentschieden! 🤝', w/2, h*0.63); }
    const elapsed = Date.now() - fulltimeShowMs;
    if (elapsed > 4000) {
      const blink = Math.sin(Date.now()*0.005) > 0;
      if (blink) {
        ctx.fillStyle='rgba(255,255,255,0.7)';
        ctx.font=`${Math.min(w*0.045,19)}px system-ui`;
        ctx.fillText('Drückt eine Taste zum Hauptmenü', w/2, h*0.77);
      }
    } else {
      // Countdown bis man weiterkann
      const remaining = Math.ceil((4000 - elapsed) / 1000);
      ctx.fillStyle='rgba(255,255,255,0.4)';
      ctx.font=`${Math.min(w*0.04,17)}px system-ui`;
      ctx.fillText(`Weiter in ${remaining}...`, w/2, h*0.77);
    }

    return;
  }

  const rClub = playerTeam==='red' ? opponentClub : playerClub;
  const lScore = playerTeam==='red' ? score.red : score.blue;

  const secs = Math.ceil(halfTimeLeft);

  ctx.fillStyle=rClub.light;  ctx.textAlign='left';  ctx.fillText(rClub.short, w/2+38, 18);

  ctx.fillStyle=rClub.light;  ctx.textAlign='left';   ctx.fillText(rScore, w/2+14, 34);

    ctx.lineWidth=3; ctx.stroke();

    ctx.font=`bold ${b.s*0.52}px system-ui`;

    ctx.fillText(arrows[dir], b.x, b.y);
    ctx.restore();
  }

  // Aktions-Buttons

  const cp2 = getCP();
  const pulse = Math.abs(Math.sin(Date.now()*0.006));
  ctx.save();
  ctx.fillStyle = `rgba(255,230,0,${0.6+pulse*0.4})`;
  ctx.font = `bold ${Math.min(w,h)*0.045}px system-ui`;

  ctx.fillText('▼', cp2.x*w, cp2.y*h - Math.min(w,h)*0.12 - pulse*4);
  ctx.restore();

  const bs=getActionBtns();
  const infos={
    shoot:  {emoji:'⚽', label:'Schuss',    color:'#c0392b'},
    pass:   {emoji:'→',  label:'Passen',   color:'#d35400'},
    tackle: {emoji:'💪', label:'Zweikampf', color:'#27ae60'},
    switch: {emoji:'🔄', label:'Wechsel',   color:'#7d3c98'},
  };
  for (const [k,b] of Object.entries(bs)) {
    if(!b) continue;
    const inf=infos[k], pressed=btnActive[k];
    ctx.save();
    ctx.globalAlpha=pressed?0.97:0.78;
    ctx.fillStyle=inf.color;
    ctx.shadowColor=inf.color; ctx.shadowBlur=pressed?18:6;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r*(pressed?1.08:1),0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=2.5;
    ctx.stroke();
    ctx.globalAlpha=1;
    ctx.font=`${b.r*0.72}px system-ui`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(inf.emoji, b.x, b.y-b.r*0.12);
    ctx.font=`bold ${b.r*0.29}px system-ui`;
    ctx.fillStyle='#fff';
    ctx.fillText(inf.label, b.x, b.y+b.r*0.58);
    ctx.restore();
  }

  // Hauptmenü
  if (gameState === 'menu') {
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(0,0,w,h);
    ctx.textAlign='center'; ctx.textBaseline='middle';

    const ALL_CLUBS  = [KOELN, BVB, SCHALKE, BMG];
    const ALL_CRESTS = [drawKoelnCrest, drawBVBCrest, drawSchalkeCrest, drawBMGCrest];
    const ALL_NAMES  = ['Köln','Dortmund','Schalke','M\'gladbach'];
    const CS = Math.min(w,h)*0.1;   // Wappen-Größe
    const BW = w*0.27, BH = h*0.08; // Button-Größe

    function drawClubBtn(cx, by, club, crestFn, label) {
      crestFn(cx, by - CS*0.9, CS);
      ctx.fillStyle=club.color;
      roundRect(cx-BW/2, by, BW, BH, BH*0.3); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=2; ctx.stroke();
      ctx.fillStyle=club===BVB?'#111':'#fff';
      ctx.font=`bold ${Math.min(w*0.04,16)}px system-ui`;
      ctx.fillText(label, cx, by+BH/2);
    }

    // DFB-Wappen klein oben
    drawDFBCrest(w/2, h*0.1, CS*0.85);

    if (!teamChosen) {
      ctx.fillStyle='#fff';
      ctx.font=`bold ${Math.min(w*0.09,38)}px system-ui`;
      ctx.shadowColor='#27ae60'; ctx.shadowBlur=20;
      ctx.fillText('⚽ FUSSBALL', w/2, h*0.22);
      ctx.shadowBlur=0;
      ctx.fillStyle='rgba(255,255,255,0.8)';
      ctx.font=`bold ${Math.min(w*0.048,20)}px system-ui`;
      ctx.fillText('Wählt euer Team:', w/2, h*0.32);

      // 2×2 Grid
      const GX=[w*0.27, w*0.73];
      const GY=[h*0.50, h*0.75];
      for (let i=0; i<4; i++)
        drawClubBtn(GX[i%2], GY[Math.floor(i/2)], ALL_CLUBS[i], ALL_CRESTS[i], ALL_NAMES[i]);

    } else if (!opponentChosen) {
      ctx.fillStyle='rgba(255,255,255,0.8)';
      ctx.font=`bold ${Math.min(w*0.048,20)}px system-ui`;
      ctx.fillText('Gegen wen spielst du?', w/2, h*0.25);

      const myIdx=ALL_CLUBS.indexOf(playerClub);
      ALL_CRESTS[myIdx](w/2, h*0.37, CS*0.85);
      ctx.fillStyle='rgba(255,255,255,0.5)';
      ctx.font=`${Math.min(w*0.038,15)}px system-ui`;
      ctx.fillText('vs.', w/2, h*0.48);

      const others=ALL_CLUBS.map((c,i)=>({c,fn:ALL_CRESTS[i],n:ALL_NAMES[i]})).filter(o=>o.c!==playerClub);
      const CX=[w*0.18, w*0.5, w*0.82];
      for (let i=0; i<3; i++)
        drawClubBtn(CX[i], h*0.62, others[i].c, others[i].fn, others[i].n);

    } else {
      ctx.fillStyle='rgba(255,255,255,0.8)';
      ctx.font=`bold ${Math.min(w*0.048,20)}px system-ui`;
      ctx.fillText('Bereit!', w/2, h*0.25);

      const myIdx  = ALL_CLUBS.indexOf(playerClub);
      const oppIdx = ALL_CLUBS.indexOf(opponentClub);
      ALL_CRESTS[myIdx] (w/2-w*0.22, h*0.43, CS);
      ALL_CRESTS[oppIdx](w/2+w*0.22, h*0.43, CS);
      ctx.fillStyle='rgba(255,255,255,0.7)';
      ctx.font=`bold ${Math.min(w*0.07,28)}px system-ui`;
      ctx.fillText('VS', w/2, h*0.43);
      ctx.font=`${Math.min(w*0.04,16)}px system-ui`;
      ctx.fillStyle='rgba(255,255,255,0.55)';
      ctx.fillText(`${ALL_NAMES[myIdx]} gegen ${ALL_NAMES[oppIdx]}`, w/2, h*0.57);

      const SW=w*0.6, SH=h*0.09;
      ctx.fillStyle='#27ae60'; ctx.shadowColor='#27ae60'; ctx.shadowBlur=20;
      roundRect(w/2-SW/2, h*0.74, SW, SH, SH*0.3); ctx.fill(); ctx.shadowBlur=0;
      ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.stroke();
      ctx.fillStyle='#fff'; ctx.font=`bold ${Math.min(w*0.055,22)}px system-ui`;
      ctx.fillText('▶  Jetzt starten!', w/2, h*0.74+SH/2);
    }

    ctx.restore();
    return;
  }

  // Tor-Bildschirm
  if (gameState === 'goal') {
    const team = goalTeam===playerTeam ? playerClub : opponentClub;
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,w,h);
    ctx.fillStyle=team.light;
    ctx.font=`bold ${Math.min(w*0.18,90)}px system-ui`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowColor=team.light; ctx.shadowBlur=40;
    ctx.fillText('TOR! ⚽', w/2, h*0.38);
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff';
    ctx.font=`bold ${Math.min(w*0.06,26)}px system-ui`;
    ctx.fillText(`Tor für ${team.name}!`, w/2, h*0.5);
    if (goalScorer) {
      const sTeam = goalScorer.team==='red' ? redTeam : blueTeam;
      const sClub = goalScorer.team===playerTeam ? playerClub : opponentClub;
      const sNum  = sClub.nums[sTeam.indexOf(goalScorer)] ?? goalScorer.num;
      const sName = sClub.names ? ' ' + sClub.names[sTeam.indexOf(goalScorer)] : '';
      ctx.font=`${Math.min(w*0.048,20)}px system-ui`;
      ctx.fillStyle='rgba(255,255,255,0.85)';
      ctx.fillText(`Torschütze: Nr. ${sNum}${sName}`, w/2, h*0.59);
    }
    const blink = Math.sin(Date.now()*0.004) > 0;
    if (blink) {
      ctx.fillStyle='#feca57';
      ctx.font=`bold ${Math.min(w*0.05,22)}px system-ui`;
      ctx.fillText('Drückt eine Taste zum Weiterspielen', w/2, h*0.63);
    }
    ctx.restore();
  }
}

// ── Schleife ────────────────────────────────────────────────────────
function loop() {
  if (resizeFrames < 60) { resize(); resizeFrames++; }
  const w=W(), h=H();
  ctx.clearRect(0,0,w,h);
  drawField();

  const goalH=h*0.35, goalY=(h-goalH)/2, padX=w*FPADX;
  drawGoal(0,       goalY, padX, goalH, true);
  drawGoal(w-padX,  goalY, padX, goalH, false);

  update();

  const ps=Math.min(w,h)*0.07;
  for (const p of allPlayers) {
    const club = p.team===playerTeam ? playerClub : opponentClub;
    const team = p.team==='red' ? redTeam : blueTeam;
    const num  = club.nums[team.indexOf(p)] ?? p.num;
    const cel  = gameState==='goal' && goalTeam===p.team;
    const px=p.x*w, py=p.y*h-ps*1.5;
    const appearance = (club.appearances ? club.appearances[team.indexOf(p)] : null) || p;
    drawPlayer(px, py, ps, club.color, num, cel, club.numColor, club.style||{}, appearance);
    const playerName = club.names ? club.names[team.indexOf(p)] : null;
    if (playerName) {
      ctx.save();
      ctx.font=`bold ${ps*0.3}px system-ui`;
      const nameW=ctx.measureText(playerName).width+8;
      ctx.fillStyle='rgba(0,0,0,0.55)';
      roundRect(px-nameW/2, py+ps*2.0, nameW, ps*0.42, ps*0.1);
      ctx.fill();
      ctx.fillStyle='#fff';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(playerName, px, py+ps*2.21);
      ctx.restore();
    }
  }

  const ballR=Math.min(w,h)*0.022;
  drawBall(ball.x*w, ball.y*h, ballR);

  updateAudio();
  drawUI();
  requestAnimationFrame(loop);
}

loop();
</script>
