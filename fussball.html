function drawTitle() {
  const w=W(), h=H(), t=Date.now()/1000;
  ctx.save();
  drawStadiumBackdrop(w, h, t);
  const ip=introProgress();
  const textIn=seg(ip, 0.6, 0.78), uiIn=seg(ip, 0.78, 1);
  if (!showControls) {
    // Erst groß in der Mitte, dann rückt das Logo hinter den Titel
    const m=easeOut(textIn);
    const big=Math.min(w, h)*0.62, small=Math.min(w, h)*0.42;
    drawGameLogo(w/2, h*(0.5-0.14*m), big+(small-big)*m, t, 1-0.68*m, seg(ip, 0, 0.6));
  }

  ctx.textAlign='center'; ctx.textBaseline='middle';

  if (showControls) {
    ctx.fillStyle='#fff';
    ctx.font=`bold ${Math.min(w*0.07,40)}px system-ui`;
    ctx.fillText('Steuerung', w/2, h*0.12);
    const rows=[
      ['Laufen',           'Pfeiltasten oder W A S D', 'Steuerkreuz links'],
      ['Schießen',         'Leertaste oder Enter',     'Knopf „Schuss“'],
      ['Passen',           'F oder P',                 'Knopf „Passen“'],
      ['Zweikampf',        'T oder G',                 'Knopf „Zweikampf“'],
      ['Spieler wechseln', 'X oder Tab',               'Knopf „Wechsel“'],
      ['Sprinten',         'Shift gedrückt halten',    'Knopf „Sprint“ halten'],
    ];
    const fs=Math.min(w*0.032,18), rowH=Math.min(h*0.1,52), top=h*0.27;
    ctx.font=`bold ${fs}px system-ui`;
    ctx.fillStyle='#feca57';
    ctx.fillText('Tastatur', w*0.5, top-rowH*0.8);
    ctx.fillText('Handy',    w*0.8, top-rowH*0.8);
    rows.forEach(([what,key,touch],i)=>{
      const y=top+i*rowH;
      ctx.fillStyle=i%2?'rgba(255,255,255,0.04)':'rgba(255,255,255,0.09)';
      roundRect(w*0.06, y-rowH*0.45, w*0.88, rowH*0.9, 8); ctx.fill();
      ctx.font=`bold ${fs}px system-ui`;
      ctx.fillStyle='#fff';             ctx.textAlign='left';   ctx.fillText(what,  w*0.09, y);
      ctx.font=`${fs}px system-ui`;
      ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.textAlign='center'; ctx.fillText(key, w*0.5, y);
      ctx.fillText(touch, w*0.8, y);
    });
    ctx.textAlign='center';
  } else {
    const ts=Math.min(w*0.13,84);
    // Titel knallt groß rein und schrumpft auf seine Größe
    if (textIn > 0) {
      const k=1+2.5*(1-easeOutBack(textIn));
      ctx.save();
      ctx.globalAlpha=Math.min(1, textIn*2);
      ctx.translate(w/2, h*0.27); ctx.scale(k, k); ctx.translate(-w/2, -h*0.27);
      ctx.font=`900 ${ts}px system-ui`;
      ctx.shadowColor='#27ae60'; ctx.shadowBlur=25+Math.sin(t*3)*10;
      const tg=ctx.createLinearGradient(0,h*0.27-ts/2,0,h*0.27+ts/2);
      tg.addColorStop(0,'#ffffff'); tg.addColorStop(1,'#c8f5c8');
      ctx.fillStyle=tg;
      ctx.fillText('KICK IT!', w/2, h*0.27);
      ctx.restore();
    }
    ctx.shadowBlur=0;
    ctx.globalAlpha=uiIn;
    ctx.font=`bold ${Math.min(w*0.035,20)}px system-ui`;
    ctx.fillStyle='#feca57';
    ctx.fillText('SPIELE FUSSBALL AUF EINE ANDERE ART', w/2, h*0.27+ts*0.7);
  }

  ctx.globalAlpha=uiIn;
  if (gameState==='title' && !showControls) { drawMyTeamChip(`${clubEntry(playerClub).label} 🔄`); ctx.textAlign='center'; }
  getTitleButtons().forEach((b,i)=>{
    const sel=i===titleSel;
    const primary=b.id==='play' || b.id==='start';
    ctx.fillStyle=primary?'#27ae60':(sel?'rgba(255,255,255,0.22)':'rgba(255,255,255,0.1)');
    if (primary) { ctx.shadowColor='#27ae60'; ctx.shadowBlur=sel?25:12; }
    roundRect(b.x, b.y, b.w, b.h, b.h*0.3); ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle=sel?'#fff':'rgba(255,255,255,0.35)'; ctx.lineWidth=sel?3:1.5; ctx.stroke();
    if (b.accent) {
      ctx.fillStyle=b.accent;
      roundRect(b.x+6, b.y+6, 8, b.h-12, 4); ctx.fill();
    }
    ctx.fillStyle='#fff';
    ctx.font=`bold ${Math.min(b.h*0.42,24)}px system-ui`;
    ctx.fillText(b.label, b.x+b.w/2, b.y+b.h/2, b.w-28);
  });

  ctx.globalAlpha=1;
  ctx.font=`${Math.min(w*0.025,13)}px system-ui`;
  ctx.fillStyle='rgba(255,255,255,0.4)';
  ctx.fillText(showControls?'Esc = zurück':introRunning()?'Tippen oder Taste drücken zum Überspringen':gameState==='start'?'Enter drücken oder antippen':'↑ ↓ auswählen · Enter bestätigen · Esc = Team wechseln', w/2, h*0.965);
  ctx.restore();
}

function drawUI() {
  const w=W(), h=H();
  if (gameState === 'title' || gameState === 'start') { drawTitle(); return; }
  if (gameState === 'mode') { drawModeScreen(); return; }
  if (gameState === 'cup') { drawCupScreen(); return; }
  if (gameState === 'season') { drawSeasonScreen(); return; }

  if (gameState === 'playing' && Date.now() < stadiumBannerUntil) {
    const left=stadiumBannerUntil-Date.now();
    ctx.save();
    ctx.globalAlpha=Math.min(1, left/500, (3500-left)/300);
    const bw=Math.min(w*0.6, 420), bh=Math.min(h*0.14, 70), bx=w/2-bw/2, by=h*0.22;
    ctx.fillStyle='rgba(0,0,0,0.7)';
    roundRect(bx, by, bw, bh, 12); ctx.fill();
    ctx.fillStyle=playerClub.color;
    ctx.fillRect(bx+12, by+bh-6, bw-24, 3);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='rgba(255,255,255,0.75)';
    ctx.font=`${bh*0.22}px system-ui`;
    ctx.fillText('Willkommen im', w/2, by+bh*0.3);
    ctx.fillStyle='#fff';
    ctx.font=`bold ${bh*0.36}px system-ui`;
    ctx.fillText(playerClub.stadium, w/2, by+bh*0.62, bw-24);
    ctx.font=`bold ${bh*0.26}px system-ui`;
    ctx.fillStyle='#feca57';
    roundRect(w/2-bw*0.22, by+bh+6, bw*0.44, bh*0.42, bh*0.21);
    ctx.fill();
    ctx.fillStyle='#111';
    ctx.fillText(`Wetter: ${weatherLabel(weather)}`, w/2, by+bh+6+bh*0.22, bw*0.4);
    ctx.restore();
  }

  // Halbzeit-Bildschirm
  if (gameState === 'halftime') {
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,w,h);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#feca57';
    ctx.font=`bold ${Math.min(w*0.12,52)}px system-ui`;
    ctx.fillText('Halbzeit! ⏱️', w/2, h*0.3);
    ctx.fillStyle='#fff';
    ctx.font=`bold ${Math.min(w*0.08,34)}px system-ui`;
    const lC=playerTeam==='red'?playerClub:opponentClub, rC=playerTeam==='red'?opponentClub:playerClub;
    const lS=score.red, rS=score.blue;
    ctx.fillStyle=lC.light; ctx.textAlign='right';  ctx.fillText(lS, w/2-18, h*0.45);
    ctx.fillStyle='#fff';   ctx.textAlign='center'; ctx.fillText(':', w/2, h*0.45);
    ctx.fillStyle=rC.light; ctx.textAlign='left';   ctx.fillText(rS, w/2+18, h*0.45);
    ctx.fillStyle='rgba(255,255,255,0.7)';
    ctx.font=`${Math.min(w*0.05,22)}px system-ui`;
    ctx.textAlign='center';
    ctx.fillText(`2. Halbzeit in ${Math.ceil(Math.max(0,breakTimeLeft))}s...`, w/2, h*0.6);
    ctx.restore();
    return;
  }

  // Spielende-Bildschirm
  if (gameState === 'fulltime') {
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.75)'; ctx.fillRect(0,0,w,h);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#fff';
    ctx.font=`bold ${Math.min(w*0.1,44)}px system-ui`;
    ctx.fillText('Spielende! 🏁', w/2, h*0.22);
    const lC=playerTeam==='red'?playerClub:opponentClub, rC=playerTeam==='red'?opponentClub:playerClub;
    const lS=score.red, rS=score.blue;
    // Vereinsnamen
    ctx.font=`bold ${Math.min(w*0.05,21)}px system-ui`;
    ctx.fillStyle=lC.light; ctx.textAlign='right';  ctx.fillText(lC.short, w/2-30, h*0.36);
    ctx.fillStyle=rC.light; ctx.textAlign='left';   ctx.fillText(rC.short, w/2+30, h*0.36);
    // Ergebnis groß
    ctx.font=`bold ${Math.min(w*0.15,64)}px system-ui`;
    ctx.fillStyle=lC.light; ctx.textAlign='right';  ctx.fillText(lS, w/2-18, h*0.48);
    ctx.fillStyle='#fff';   ctx.textAlign='center'; ctx.fillText(':', w/2,    h*0.48);
    ctx.fillStyle=rC.light; ctx.textAlign='left';   ctx.fillText(rS, w/2+18, h*0.48);
    // Gewinner
    ctx.textAlign='center';
    ctx.font=`bold ${Math.min(w*0.06,26)}px system-ui`;
    if (lS > rS)      { ctx.fillStyle=lC.light; ctx.fillText(`${lC.name} gewinnt! 🏆`, w/2, h*0.63); }
    else if (rS > lS) { ctx.fillStyle=rC.light; ctx.fillText(`${rC.name} gewinnt! 🏆`, w/2, h*0.63); }
    else              { ctx.fillStyle='#feca57'; ctx.fillText(mode === 'cl' ? 'Unentschieden! Elfmeterschießen … 🥅' : 'Unentschieden! 🤝', w/2, h*0.63); }
    const elapsed = Date.now() - fulltimeShowMs;
    if (elapsed > 4000) {
      const blink = Math.sin(Date.now()*0.005) > 0;
      if (blink) {
        ctx.fillStyle='rgba(255,255,255,0.7)';
        ctx.font=`${Math.min(w*0.045,19)}px system-ui`;
        ctx.fillText(mode === 'cl' ? 'Drückt eine Taste: weiter zum Turnier' : mode === 'season' ? 'Drückt eine Taste: weiter zur Tabelle' : 'Drückt eine Taste zum Hauptmenü', w/2, h*0.77);
      }
    } else {
      // Countdown bis man weiterkann
      const remaining = Math.ceil((4000 - elapsed) / 1000);
      ctx.fillStyle='rgba(255,255,255,0.4)';
      ctx.font=`${Math.min(w*0.04,17)}px system-ui`;
      ctx.fillText(`Weiter in ${remaining}...`, w/2, h*0.77);
    }
    ctx.restore();
    return;
  }

  // Ergebnis oben
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.55)';
  roundRect(w/2-110,5,220,42,21);
  ctx.fill();
  ctx.font='bold 13px system-ui';
  ctx.textBaseline='middle';
  const lClub = playerTeam==='red' ? playerClub : opponentClub;
  const rClub = playerTeam==='red' ? opponentClub : playerClub;
  // Rot spielt immer links, Blau rechts
  const lScore = score.red;
  const rScore = score.blue;
  const secs = Math.ceil(halfTimeLeft);
  const timerStr = `${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`;
  ctx.textAlign='center';
  ctx.font=`${Math.min(w*0.03,13)}px system-ui`;
  if (inExtra) {
    ctx.fillStyle='#feca57';
    ctx.fillText(`Verlängerung  ${timerStr}`, w/2, 14);
  } else {
    ctx.fillStyle='rgba(255,255,255,0.7)';
    ctx.fillText(`${currentHalf}. HZ  ${timerStr}`, w/2, 14);
  }
  ctx.fillStyle=lClub.light;  ctx.textAlign='right'; ctx.fillText(lClub.short, w/2-38, 18);
  ctx.fillStyle=rClub.light;  ctx.textAlign='left';  ctx.fillText(rClub.short, w/2+38, 18);
  ctx.font='bold 26px system-ui';
  ctx.fillStyle=lClub.light;  ctx.textAlign='right';  ctx.fillText(lScore, w/2-14, 34);
  ctx.fillStyle='#fff';       ctx.textAlign='center'; ctx.fillText(':',     w/2,    34);
  ctx.fillStyle=rClub.light;  ctx.textAlign='left';   ctx.fillText(rScore, w/2+14, 34);
  ctx.restore();

  // D-Pad zeichnen
  const dp=getDpad(), arrows={up:'▲',down:'▼',left:'◀',right:'▶'};
  for(const dir of ['up','down','left','right']){
    const b=dp[dir], pressed=dpad[dir];
    ctx.save();
    ctx.fillStyle=pressed?'rgba(255,255,255,0.9)':'rgba(0,0,0,0.5)';
    roundRect(b.x-b.s/2, b.y-b.s/2, b.s, b.s, b.s*0.2);
    ctx.fill();
    ctx.strokeStyle=pressed?'#fff':'rgba(255,255,255,0.7)';
    ctx.lineWidth=3; ctx.stroke();
    ctx.fillStyle=pressed?'#222':'#fff';
    ctx.font=`bold ${b.s*0.52}px system-ui`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(arrows[dir], b.x, b.y);
    ctx.restore();
  }

  // Aktions-Buttons
  // Pfeil über dem kontrollierten Spieler
  const cp2 = getCP();
  const pulse = Math.abs(Math.sin(Date.now()*0.006));
  ctx.save();
  ctx.fillStyle = `rgba(255,230,0,${0.6+pulse*0.4})`;
  ctx.font = `bold ${Math.min(w,h)*0.045}px system-ui`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('▼', cp2.x*w, cp2.y*h - Math.min(w,h)*0.12 - pulse*4);
  ctx.restore();

  const bs=getActionBtns();
  const infos={
    shoot:  {emoji:'⚽', label:'Schuss',    color:'#c0392b'},
    pass:   {emoji:'👟', label:'Passen',   color:'#d35400'},
    tackle: {emoji:'💪', label:'Zweikampf', color:'#27ae60'},
    switch: {emoji:'🔄', label:'Wechsel',   color:'#7d3c98'},
    sprint: {emoji:'🏃', label:'Sprint',    color:'#2980b9'},
  };
  for (const [k,b] of Object.entries(bs)) {
    if(!b) continue;
    const inf=infos[k], pressed=btnActive[k];
    ctx.save();
    ctx.globalAlpha=pressed?0.97:0.78;
    ctx.fillStyle=inf.color;
    ctx.shadowColor=inf.color; ctx.shadowBlur=pressed?18:6;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r*(pressed?1.08:1),0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=2.5;
    ctx.stroke();
    ctx.globalAlpha=1;
    ctx.font=`${b.r*0.72}px system-ui`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(inf.emoji, b.x, b.y-b.r*0.12);
    ctx.font=`bold ${b.r*0.29}px system-ui`;
    ctx.fillStyle='#fff';
    ctx.fillText(inf.label, b.x, b.y+b.r*0.58);
    // Ausdauer als Ring um den Sprint-Knopf
    if (k === 'sprint') {
      ctx.lineWidth = b.r*0.14; ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r*1.15, 0, Math.PI*2); ctx.stroke();
      ctx.strokeStyle = tired ? '#e74c3c' : '#feca57';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r*1.15, -Math.PI/2, -Math.PI/2 + Math.PI*2*stamina); ctx.stroke();
    }
    ctx.restore();
  }

  // Vereinsauswahl
  if (gameState === 'menu') {
    const t = Date.now()/1000;
    ctx.save();
    drawStadiumBackdrop(w, h, t);
    ctx.textAlign='center'; ctx.textBaseline='middle';

    // Vereinskarte: Farbverlauf, Glanzstreifen, großes Wappen, Name und Stadion
    function drawClubCard(c, opts={}) {
      const { x, y, w:cw, h:ch, entry } = c;
      const club = entry.club;
      ctx.save();
      ctx.shadowColor = opts.glow ? club.light : 'rgba(0,0,0,0.6)';
      ctx.shadowBlur = opts.glow ? 30 : 16;
      ctx.shadowOffsetY = opts.glow ? 0 : 6;
      roundRect(x, y, cw, ch, cw*0.1);
      const g = ctx.createLinearGradient(x, y, x, y+ch);
      g.addColorStop(0, shade(club.color, 0.15));
      g.addColorStop(1, shade(club.color, -0.55));
      ctx.fillStyle = g; ctx.fill();
      ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
      // Glanzstreifen
      ctx.save();
      roundRect(x, y, cw, ch, cw*0.1); ctx.clip();
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.beginPath();
      ctx.moveTo(x+cw*0.55, y); ctx.lineTo(x+cw*0.85, y); ctx.lineTo(x+cw*0.35, y+ch); ctx.lineTo(x+cw*0.05, y+ch);
      ctx.closePath(); ctx.fill();
      // dunkler Boden für die Schrift
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(x, y+ch*0.72, cw, ch*0.28);
      ctx.restore();
      roundRect(x, y, cw, ch, cw*0.1);
      ctx.strokeStyle = opts.glow ? '#fff' : 'rgba(255,255,255,0.4)';
      ctx.lineWidth = opts.glow ? 3 : 1.5;
      ctx.stroke();

      entry.crest(x+cw/2, y+ch*0.38, Math.min(cw*0.6, ch*0.5));
      ctx.fillStyle = '#fff';
      ctx.font = `900 ${Math.min(cw*0.13, ch*0.1, 22)}px system-ui`;
      ctx.fillText(entry.label, x+cw/2, y+ch*0.8, cw-12);
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      ctx.font = `${Math.min(cw*0.075, ch*0.06, 12)}px system-ui`;
      ctx.fillText(club.stadium, x+cw/2, y+ch*0.91, cw-12);
      // Taste zum Auswählen
      if (c.n) {
        const r = Math.min(cw*0.08, 12);
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.beginPath(); ctx.arc(x+r*1.6, y+r*1.6, r, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${r*1.2}px system-ui`;
        ctx.fillText(String(c.n), x+r*1.6, y+r*1.65);
      }
      ctx.restore();
    }

    function heading(text, sub) {
      ctx.fillStyle='#fff';
      ctx.font=`900 ${Math.min(w*0.06,34)}px system-ui`;
      ctx.shadowColor='#27ae60'; ctx.shadowBlur=18;
      ctx.fillText(text, w/2, h*0.2);
      ctx.shadowBlur=0;
      if (sub) {
        ctx.fillStyle='rgba(255,255,255,0.7)';
        ctx.font=`${Math.min(w*0.032,16)}px system-ui`;
        ctx.fillText(sub, w/2, h*0.28);
      }
    }

    // Reiter für die Ligen
    function leagueTabs() {
      for (const b of leagueTabLayout()) {
        const on = b.league.id === menuLeague;
        roundRect(b.x, b.y, b.w, b.h, b.h/2);
        ctx.fillStyle = on ? '#27ae60' : 'rgba(0,0,0,0.5)'; ctx.fill();
        ctx.strokeStyle = on ? '#fff' : 'rgba(255,255,255,0.35)'; ctx.lineWidth = on ? 2 : 1; ctx.stroke();
        ctx.fillStyle = on ? '#fff' : 'rgba(255,255,255,0.7)';
        ctx.font = `bold ${b.h*0.45}px system-ui`;
        ctx.fillText(`${b.league.flag} ${b.league.label}`, b.x+b.w/2, b.y+b.h/2+1, b.w-10);
      }
    }

    drawGameLogo(w/2, h*0.08, Math.min(w,h)*0.09, t, 1);

    if (!teamChosen) {
      const pickWhat = menuLeague === 'nat' ? 'Wähle dein Land' : 'Wähle deinen Verein';
      heading(mode === 'cl' ? '🏆 ' + pickWhat : mode === 'season' ? '📊 ' + pickWhat : pickWhat);
      leagueTabs();
      clubCardLayout(menuClubs()).forEach(c => drawClubCard(c));

    } else if (!opponentChosen) {
      heading('Gegen wen spielst du?');
      leagueTabs();
      drawMyTeamChip(`Du: ${clubEntry(playerClub).label}`);
      clubCardLayout(menuClubs()).forEach(c => drawClubCard(c));

    } else {
      heading('Anpfiff!', `im ${playerClub.stadium} · Halbzeit ${halfSecs/60} Min · ${difficulty.name} · ${weatherLabel(weatherChoice)}`);
      const wb = weatherBtn();
      roundRect(wb.x, wb.y, wb.w, wb.h, wb.h/2);
      ctx.fillStyle='#2980b9'; ctx.shadowColor='#48dbfb'; ctx.shadowBlur=12+Math.sin(t*4)*8; ctx.fill(); ctx.shadowBlur=0;
      ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
      ctx.fillStyle='#fff'; ctx.font=`bold ${wb.h*0.42}px system-ui`;
      ctx.fillText(`Wetter: ${weatherLabel(weatherChoice)}`, wb.x+wb.w/2, wb.y+wb.h/2+1, wb.w-12);
      const me = clubEntry(playerClub), opp = clubEntry(opponentClub);
      const cw = Math.min(w*0.26, 210), ch = Math.min(cw*1.25, h*0.44);
      const cy = h*0.34;
      drawClubCard({ entry:me,  x:w/2-cw-w*0.08, y:cy, w:cw, h:ch }, { glow:true });
      drawClubCard({ entry:opp, x:w/2+w*0.08,    y:cy, w:cw, h:ch }, { glow:true });
      // VS mit Blitz-Glühen
      ctx.save();
      ctx.font=`900 ${Math.min(w*0.09,52)}px system-ui`;
      ctx.shadowColor='#feca57'; ctx.shadowBlur=20+Math.sin(t*6)*10;
      ctx.fillStyle='#feca57';
      ctx.fillText('VS', w/2, cy+ch/2);
      ctx.restore();

      const SW=Math.min(w*0.5, 340), SH=Math.min(h*0.1, 56), sy=h*0.8;
      const pulse = 1 + Math.sin(t*4)*0.03;
      ctx.save();
      ctx.translate(w/2, sy+SH/2); ctx.scale(pulse, pulse);
      ctx.fillStyle='#27ae60'; ctx.shadowColor='#27ae60'; ctx.shadowBlur=25;
      roundRect(-SW/2, -SH/2, SW, SH, SH*0.3); ctx.fill(); ctx.shadowBlur=0;
      ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.stroke();
      ctx.fillStyle='#fff'; ctx.font=`bold ${Math.min(SH*0.42,24)}px system-ui`;
      ctx.fillText('▶  Jetzt starten!', 0, 0);
      ctx.restore();
    }

    ctx.fillStyle='rgba(255,255,255,0.4)';
    ctx.font=`${Math.min(w*0.025,13)}px system-ui`;
    ctx.fillText(opponentChosen ? 'W oder antippen = Wetter wechseln · Esc = zurück zum Hauptmenü'
      : `Tippe auf eine Karte oder drücke 1 bis ${Math.min(menuClubs().length, 9)} · ← → Liga wechseln · Esc = zurück`, w/2, h*0.975);
    ctx.restore();
    return;
  }

  // Tor-Bildschirm
  if (gameState === 'goal') {
    const team = goalTeam===playerTeam ? playerClub : opponentClub;
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,w,h);
    ctx.fillStyle=team.light;
    ctx.font=`bold ${Math.min(w*0.18,90)}px system-ui`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowColor=team.light; ctx.shadowBlur=40;
    ctx.fillText('TOR! ⚽', w/2, h*0.38);
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff';
    ctx.font=`bold ${Math.min(w*0.06,26)}px system-ui`;
    ctx.fillText(`Tor für ${team.name}!`, w/2, h*0.5);
    if (goalScorer) {
      const sTeam = goalScorer.team==='red' ? redTeam : blueTeam;
      const sClub = goalScorer.team===playerTeam ? playerClub : opponentClub;
      const sNum  = sClub.nums[sTeam.indexOf(goalScorer)] ?? goalScorer.num;
      const sName = sClub.names ? ' ' + sClub.names[sTeam.indexOf(goalScorer)] : '';
      ctx.font=`${Math.min(w*0.048,20)}px system-ui`;
      ctx.fillStyle='rgba(255,255,255,0.85)';
      ctx.fillText(`Torschütze: Nr. ${sNum}${sName}`, w/2, h*0.59);
    }
    const blink = Math.sin(Date.now()*0.004) > 0;
    if (blink) {
      ctx.fillStyle='#feca57';
      ctx.font=`bold ${Math.min(w*0.05,22)}px system-ui`;
      ctx.fillText('Gleich kommt die Zeitlupe … 🎬', w/2, h*0.63);
    }
    ctx.restore();
  }
}

function drawCard(x, y, hgt, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-0.12);
  ctx.shadowColor='rgba(0,0,0,0.5)'; ctx.shadowBlur=12;
  ctx.fillStyle=color;
  roundRect(-hgt*0.35, -hgt/2, hgt*0.7, hgt, hgt*0.06); ctx.fill();
  ctx.restore();
}

let camZoom = 1, camFocusX = 0;

// Liegender Gefoulter, hechtender Torwart
function poseAngle(p) {
  if (p.diveAngle) return p.diveAngle;
  if (gameState === 'foul' && setPiece && p === setPiece.victim) {
    const el = (Date.now() - setPiece.t0) / 1000;
    const fall = Math.min(1, el / 0.25);
    const dir = setPiece.fouler.x < p.x ? 1 : -1;
    return dir * (Math.PI / 2) * fall + Math.sin(el * 9) * 0.08 * fall;
  }
  return 0;
}

// Staubwolke an der Foulstelle
function drawFoulScene(w, h, ps) {
  const el = (Date.now() - setPiece.t0) / 1000;
  if (el > 0.7) return;
  const x = setPiece.spotX * w, y = setPiece.spotY * h;
  ctx.save();
  for (let i = 0; i < 7; i++) {
    const a = i / 7 * Math.PI * 2, r = ps * (0.3 + el * 1.6);
    ctx.fillStyle = `rgba(210,190,150,${0.45 * (1 - el / 0.7)})`;
    ctx.beginPath();
    ctx.arc(x + Math.cos(a) * r, y + Math.sin(a) * r * 0.5, ps * (0.18 + el * 0.4), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// Schiri läuft zum Foulspieler und zeigt die Karte hoch
function drawReferee(w, h, ps) {
  const sp = setPiece, ref = sp.ref, el = (Date.now() - sp.t0) / 1000;
  const t = easeOut(Math.max(0, Math.min(1, (el - 0.2) / 1.0)));
  const rx = ref.fromX + (ref.toX - ref.fromX) * t, ry = ref.fromY + (ref.toY - ref.fromY) * t;
  const px = rx * w, py = ry * h - ps * 1.5;
  const moving = t > 0 && t < 1;
  const refStyle = { shortsColor:'#111111', shortSleeves:true, socksColor:'#111111', socksStripe:'#ffffff', trim:'#ffd400' };
  const refLook = { skin:'#f1c8a5', skinDark:'#d9a47f', hair:'#555555', hairStyle:'buzz' };
  drawPlayer(px, py, ps, '#151515', '', false, '#fff', refStyle, refLook,
             { moving, phase: el * 14, face: ref.toX >= ref.fromX ? 1 : -1 });
  ctx.save();
  ctx.font = `bold ${ps * 0.28}px system-ui`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  roundRect(px - ps * 0.45, py + ps * 2.0, ps * 0.9, ps * 0.42, ps * 0.1); ctx.fill();
  ctx.fillStyle = '#ffd400';
  ctx.fillText('Schiri', px, py + ps * 2.21);
  ctx.restore();
  if (sp.card && el > 1.25) {
    const up = easeOut(Math.min(1, (el - 1.25) / 0.25));
    const col = sp.card === 'yellow' ? '#ffd400' : '#e10600';
    ctx.save();
    ctx.strokeStyle = '#151515'; ctx.lineWidth = ps * 0.13; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(px + ps * 0.3, py + ps * 0.25); ctx.lineTo(px + ps * 0.45, py + ps * (0.25 - 0.7 * up)); ctx.stroke();
    ctx.translate(px + ps * 0.47, py + ps * (0.05 - 0.75 * up));
    ctx.rotate(0.15);
    ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 10;
    ctx.fillRect(-ps * 0.14, -ps * 0.4, ps * 0.28, ps * 0.4);
    ctx.restore();
  }
}

// Zielkreuz und gestrichelte Schusslinie beim eigenen Elfmeter
function drawPenaltyAim(w, h) {
  const pn = penalty;
  const lx = (pn.attackRight ? 1 - FPADX : FPADX) * w, ly = pn.aimY * h, r = Math.min(w, h) * 0.022;
  ctx.save();
  ctx.strokeStyle = '#ff3b3b'; ctx.lineWidth = 2.5;
  ctx.shadowColor = '#ff3b3b'; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.arc(lx, ly, r, 0, Math.PI * 2);
  ctx.moveTo(lx - r * 1.6, ly); ctx.lineTo(lx + r * 1.6, ly);
  ctx.moveTo(lx, ly - r * 1.6); ctx.lineTo(lx, ly + r * 1.6);
  ctx.stroke();
  ctx.setLineDash([6, 6]); ctx.lineWidth = 1.5; ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath(); ctx.moveTo(ball.x * w, ball.y * h); ctx.lineTo(lx, ly); ctx.stroke();
  ctx.restore();
}

function drawSetPieceUI() {
  const w=W(), h=H();
  ctx.save();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  if (gameState === 'foul') {
    const { victim, fouler, card, type } = setPiece;
    const el = (Date.now() - setPiece.t0) / 1000;
    const vig = ctx.createRadialGradient(w/2, h/2, Math.min(w,h)*0.3, w/2, h/2, Math.max(w,h)*0.7);
    vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,0.45)');
    ctx.fillStyle = vig; ctx.fillRect(0, 0, w, h);
    // FOUL! knallt rein
    const slam = 1 + Math.max(0, 1 - el / 0.22) * 1.6;
    ctx.save();
    ctx.translate(w/2, h*0.18); ctx.scale(slam, slam); ctx.rotate(-0.06);
    ctx.font=`900 ${Math.min(w*0.12,66)}px system-ui`;
    ctx.lineWidth = 6; ctx.strokeStyle = '#000'; ctx.strokeText('FOUL!', 0, 0);
    ctx.fillStyle = '#ff3b3b'; ctx.fillText('FOUL!', 0, 0);
    ctx.restore();
    if (el > 0.3) {
      ctx.globalAlpha = Math.min(1, (el - 0.3) / 0.3);
      ctx.font=`bold ${Math.min(w*0.035,18)}px system-ui`;
      const line = `${playerName(fouler)} foult ${playerName(victim)}`;
      const lw = ctx.measureText(line).width + 24;
      ctx.fillStyle='rgba(0,0,0,0.55)';
      roundRect(w/2-lw/2, h*0.28-14, lw, 28, 14); ctx.fill();
      ctx.fillStyle='#fff';
      ctx.fillText(line, w/2, h*0.28);
      ctx.globalAlpha = 1;
    }
    // Karte dreht sich groß ins Bild
    if (card && el > 1.4) {
      const flip = easeOut(Math.min(1, (el - 1.4) / 0.3));
      const ch = Math.min(h*0.16, 80);
      ctx.save();
      ctx.translate(w*0.85, h*0.45); ctx.scale(flip, 1);
      if (card === 'yellowred') { drawCard(-ch*0.22, 0, ch, '#ffd400'); drawCard(ch*0.22, 0, ch, '#e10600'); }
      else drawCard(0, 0, ch, card === 'yellow' ? '#ffd400' : '#e10600');
      ctx.restore();
      ctx.globalAlpha = flip;
      ctx.fillStyle = card === 'yellow' ? '#ffd400' : '#ff4d4d';
      ctx.font=`900 ${Math.min(w*0.035,20)}px system-ui`;
      ctx.fillText(card === 'yellow' ? 'Gelbe Karte' : card === 'red' ? 'Rote Karte!' : 'Gelb-Rot!', w*0.85, h*0.45 + ch*0.75);
      if (card !== 'yellow') {
        ctx.font=`bold ${Math.min(w*0.028,14)}px system-ui`;
        ctx.fillText('Platzverweis!', w*0.85, h*0.45 + ch*0.75 + 20);
      }
      ctx.globalAlpha = 1;
    }
    const showAt = card ? 2.0 : 1.2;
    if (el > showAt) {
      const club = clubOf(victim);
      const a = Math.min(1, (el - showAt) / 0.3);
      const pen = type === 'penalty';
      const bw = Math.min(w*0.7, 460), bh = Math.min(h*0.12, 60), y = h*0.75 + (1-a)*20;
      ctx.globalAlpha = a;
      ctx.fillStyle = pen ? 'rgba(254,202,87,0.92)' : 'rgba(0,0,0,0.7)';
      roundRect(w/2-bw/2, y-bh/2, bw, bh, 12); ctx.fill();
      ctx.fillStyle = pen ? '#111' : '#fff';
      ctx.font=`900 ${bh*0.42}px system-ui`;
      ctx.fillText(pen ? `ELFMETER für ${club.name}!` : `Freistoß für ${club.name}`, w/2, y, bw-20);
      ctx.globalAlpha = 1;
    }
  }
  if (gameState === 'penalty') {
    const pn = penalty;
    const bw=Math.min(w*0.72, 480), bh=Math.min(h*0.13, 66), by=h*0.04;
    ctx.fillStyle='rgba(0,0,0,0.65)';
    roundRect(w/2-bw/2, by, bw, bh, 12); ctx.fill();
    ctx.fillStyle='#feca57';
    ctx.font=`900 ${bh*0.36}px system-ui`;
    ctx.fillText('ELFMETER!', w/2, by+bh*0.33);
    ctx.fillStyle='#fff';
    ctx.font=`bold ${bh*0.21}px system-ui`;
    const hint = pn.phase !== 'aim' && pn.phase !== 'runup' ? `${playerName(pn.taker)} gegen ${playerName(pn.keeper)}` :
      pn.mine ? '↑ ↓ zielen · „Schuss“ drücken, wenn die Kraft passt (nicht zu fest!)' : 'Halte ↑ oder ↓: dein Torwart springt in diese Ecke!';
    ctx.fillText(hint, w/2, by+bh*0.72, bw-16);

    // Kraftanzeige
    if (pn.mine && pn.phase === 'aim') {
      const pw = Math.min(w*0.4, 260), ph = 16, px = w/2-pw/2, py = h*0.9;
      const g = ctx.createLinearGradient(px, 0, px+pw, 0);
      g.addColorStop(0, '#2ecc71'); g.addColorStop(0.7, '#f1c40f'); g.addColorStop(0.9, '#e67e22'); g.addColorStop(1, '#e74c3c');
      ctx.fillStyle='rgba(0,0,0,0.6)'; roundRect(px-6, py-6, pw+12, ph+12, 10); ctx.fill();
      ctx.fillStyle=g; roundRect(px, py, pw, ph, 6); ctx.fill();
      ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(px+pw*0.9, py, 2, ph);
      ctx.fillStyle='#fff';
      ctx.fillRect(px + pw*pn.power - 3, py - 5, 6, ph + 10);
      ctx.font='bold 12px system-ui';
      ctx.fillText('KRAFT', w/2, py - 14);
    }
    // Torwart-Wahl
    if (!pn.mine && (pn.phase === 'aim' || pn.phase === 'runup')) {
      const labels = ['↑ oben', 'Mitte', '↓ unten'];
      const bw2 = Math.min(w*0.12, 80);
      labels.forEach((l, i) => {
        const sel = pn.keeperChoice === i - 1;
        const x = w/2 + (i-1)*(bw2+10);
        ctx.fillStyle = sel ? '#27ae60' : 'rgba(0,0,0,0.6)';
        roundRect(x-bw2/2, h*0.88, bw2, 32, 10); ctx.fill();
        ctx.fillStyle='#fff'; ctx.font='bold 14px system-ui';
        ctx.fillText(l, x, h*0.88+16);
      });
    }
    // Ergebnis
    if (pn.phase === 'result') {
      const el = (Date.now() - pn.t0) / 1000;
      const sc = 1 + Math.max(0, 1 - el/0.2)*1.2;
      const txt = pn.outcome === 'save' ? 'GEHALTEN!' : 'DANEBEN!';
      ctx.save();
      ctx.translate(w/2, h*0.45); ctx.scale(sc, sc);
      ctx.font=`900 ${Math.min(w*0.12,64)}px system-ui`;
      ctx.lineWidth=6; ctx.strokeStyle='#000'; ctx.strokeText(txt, 0, 0);
      ctx.fillStyle = pn.outcome === 'save' ? '#2ecc71' : '#feca57';
      ctx.fillText(txt, 0, 0);
      ctx.restore();
      ctx.fillStyle='#fff';
      ctx.font=`bold ${Math.min(w*0.035,18)}px system-ui`;
      ctx.fillText(pn.outcome === 'save' ? `Super Parade von ${playerName(pn.keeper)}!` : `${playerName(pn.taker)} schießt vorbei!`, w/2, h*0.56);
    }
  }
  ctx.restore();
}

// ── Schleife ────────────────────────────────────────────────────────
function loop() {
  if (resizeFrames < 60) { resize(); resizeFrames++; }
  const w=W(), h=H();
  ctx.clearRect(0,0,w,h);
  // Beim Elfmeter zoomt die Kamera aufs Tor
  const camTarget = gameState === 'penalty' ? 1.45 : 1;
  camZoom += (camTarget - camZoom) * 0.08;
  if (penalty) camFocusX = penalty.attackRight ? w * 0.82 : w * 0.18;
  if (Math.abs(camZoom - 1) < 0.002) camZoom = 1;
  const camOn = camZoom !== 1;
  if (camOn) {
    const cx = Math.max(w / (2 * camZoom), Math.min(w - w / (2 * camZoom), camFocusX));
    ctx.save();
    ctx.translate(w / 2, h / 2);
    ctx.scale(camZoom, camZoom);
    ctx.translate(-cx, -h / 2);
  }
  drawField();
  if (gameState==='goal') {
    const sy=h*FPADY*0.58;
    ctx.fillStyle='#fff';
    for (let i=0;i<25;i++) {
      ctx.globalAlpha=Math.random();
      const fy=Math.random()<0.5 ? Math.random()*sy : h-Math.random()*sy;
      ctx.beginPath(); ctx.arc(Math.random()*w, fy, 1.5+Math.random()*2, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  const goalH=h*(GOAL_B-GOAL_T), goalY=h*GOAL_T, padX=w*FPADX;
  drawGoal(0,       goalY, padX, goalH, true);
  drawGoal(w-padX,  goalY, padX, goalH, false);
  drawWeatherTint(w, h);

  update();
  recordReplay();
  updateReplay();

  const ps=Math.min(w,h)*0.07;
  if (gameState === 'foul') drawFoulScene(w, h, ps);
  for (const p of allPlayers) {
    if (p.sentOff) continue;
    const cel = gameState==='goal' && goalTeam===p.team;
    const px=p.x*w, py=p.y*h-ps*1.5;
    const rot = poseAngle(p);
    if (rot) { ctx.save(); ctx.translate(px, py+ps*0.9); ctx.rotate(rot); ctx.translate(-px, -(py+ps*0.9)); }
    const mdx=p.x-(p._lx ?? p.x), mdy=p.y-(p._ly ?? p.y);
    p._lx=p.x; p._ly=p.y;
    const step=Math.hypot(mdx*w, mdy*h);
    p._run=(p._run||0)+step*0.18;
    if (Math.abs(mdx*w)>0.3) p._face=Math.sign(mdx);
    const motion={ moving: step>0.3, phase: p._run, face: p._face || (p.x<0.5 ? 1 : -1) };
    if (p.isKeeper) {
      const kClub = p.team===playerTeam ? playerClub : opponentClub;
      const keeperStyle = {shortsColor:'#1a6b1a', shortSleeves:false, socksColor:'#1a6b1a', socksStripe:'#fff', gloves:true, trim:'#111111', pattern:'hoops', patternColor:'rgba(0,0,0,0.12)'};
      drawPlayer(px, py, ps, '#27ae60', kClub.keeperNum || p.num, cel, '#fff', keeperStyle, kClub.keeperLook || p, motion);
      const kName = kClub.keeperName;
      if (kName) {
        ctx.save();
        ctx.font=`bold ${ps*0.3}px system-ui`;
        const nw=ctx.measureText(kName).width+8;
        ctx.fillStyle='rgba(0,0,0,0.55)';
        roundRect(px-nw/2, py+ps*2.0, nw, ps*0.42, ps*0.1); ctx.fill();
        ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(kName, px, py+ps*2.21);
        ctx.restore();
      }
    } else {
      const club = p.team===playerTeam ? playerClub : opponentClub;
      const team = p.team==='red' ? redTeam : blueTeam;
      const num  = club.nums[team.indexOf(p)] ?? p.num;
      const appearance = (club.appearances ? club.appearances[team.indexOf(p)] : null) || p;
      const kit = kitFor(club);
      drawPlayer(px, py, ps, kit.color, num, cel, kit.numColor, kit.style||{}, appearance, motion);
      const playerName = club.names ? club.names[team.indexOf(p)] : null;
      if (playerName) {
        ctx.save();
        ctx.font=`bold ${ps*0.3}px system-ui`;
        const nameW=ctx.measureText(playerName).width+8;
        ctx.fillStyle='rgba(0,0,0,0.55)';
        roundRect(px-nameW/2, py+ps*2.0, nameW, ps*0.42, ps*0.1);
        ctx.fill();
        ctx.fillStyle='#fff';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(playerName, px, py+ps*2.21);
        if (p.yellow) {
          ctx.fillStyle='#ffd400';
          ctx.fillRect(px+nameW/2+3, py+ps*2.0, ps*0.26, ps*0.38);
        }
        ctx.restore();
      }
    }
    if (rot) ctx.restore();
  }
  if (gameState === 'foul') drawReferee(w, h, ps);

  const ballR=Math.min(w,h)*0.022;
  drawBall(ball.x*w, ball.y*h - ballLift*ballR*2.5, ballR*(1+ballLift*0.5));
  if (gameState === 'penalty' && penalty.mine && penalty.phase === 'aim') drawPenaltyAim(w, h);
  if (camOn) ctx.restore();
  drawWeather(w, h);

  updateAudio();
  updateChants();
  updateCommentary();
  drawUI();
  if (gameState === 'foul' || gameState === 'penalty') drawSetPieceUI();
  drawReplayUI();
  drawCommentary();
  homeBtn.hidden = gameState !== 'start';
  micBtn.hidden = !['start', 'title'].includes(gameState) || showControls || introRunning();
  micBtn.classList.toggle('off', !commentOn);
  requestAnimationFrame(loop);
}

micBtn.addEventListener('click', () => {
  setCommentOn(!commentOn);
  if (commentOn) say('Hallo! Ich bin dein Kommentator.', 3, true);
});
loop();
</script>
