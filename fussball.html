<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fußball</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a5c1a;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('load', resize);
document.addEventListener('DOMContentLoaded', resize);
resize();
let resizeFrames = 0;

const W = () => window.innerWidth;
const H = () => window.innerHeight;

function drawKoelnCrest(cx, cy, s) {
  ctx.save();
  ctx.translate(cx, cy);

  function shield() {
    ctx.beginPath();
    ctx.moveTo(-s*0.48,-s*0.5); ctx.lineTo(s*0.48,-s*0.5);
    ctx.quadraticCurveTo(s*0.52,-s*0.5, s*0.52,-s*0.33);
    ctx.lineTo(s*0.52,s*0.12);
    ctx.quadraticCurveTo(s*0.52,s*0.36, 0,s*0.55);
    ctx.quadraticCurveTo(-s*0.52,s*0.36, -s*0.52,s*0.12);
    ctx.lineTo(-s*0.52,-s*0.33);
    ctx.quadraticCurveTo(-s*0.52,-s*0.5, -s*0.48,-s*0.5);
    ctx.closePath();
  }

  // Weißer Hintergrund
  shield();
  ctx.shadowColor='rgba(0,0,0,0.4)'; ctx.shadowBlur=s*0.1;
  ctx.fillStyle='#fff'; ctx.fill(); ctx.shadowBlur=0;

  // Rote Streifen (3 rot, 2 weiß → 5 Streifen)
  shield(); ctx.save(); ctx.clip();
  ctx.fillStyle='#e3000f';
  const sw=s*1.04/5;
  ctx.fillRect(-s*0.52,        -s*0.52, sw, s*1.1);
  ctx.fillRect(-s*0.52+sw*2,   -s*0.52, sw, s*1.1);
  ctx.fillRect(-s*0.52+sw*4,   -s*0.52, sw, s*1.1);
  ctx.restore();

  // Geißbock (schwarze Silhouette)
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.ellipse(0,s*0.17,s*0.2,s*0.13,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(s*0.1,-s*0.04,s*0.12,s*0.1,0.15,0,Math.PI*2); ctx.fill();
  // Hörner
  ctx.strokeStyle='#111'; ctx.lineWidth=s*0.05; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(s*0.04,-s*0.12); ctx.quadraticCurveTo(-s*0.04,-s*0.3,s*0.04,-s*0.36); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(s*0.16,-s*0.11); ctx.quadraticCurveTo(s*0.26,-s*0.27,s*0.18,-s*0.34); ctx.stroke();
  // Bart
  ctx.beginPath(); ctx.moveTo(s*0.14,-s*0.0); ctx.quadraticCurveTo(s*0.2,s*0.08,s*0.14,s*0.12); ctx.lineWidth=s*0.04; ctx.stroke();
  // Beine
  ctx.lineWidth=s*0.05;
  ctx.beginPath();
  ctx.moveTo(-s*0.1,s*0.28); ctx.lineTo(-s*0.13,s*0.44);
  ctx.moveTo(s*0.0,s*0.29);  ctx.lineTo(s*0.0, s*0.44);
  ctx.moveTo(s*0.1,s*0.28);  ctx.lineTo(s*0.13,s*0.44);
  ctx.moveTo(s*0.19,s*0.25); ctx.lineTo(s*0.22,s*0.42);
  ctx.stroke();
  // Schwanz
  ctx.beginPath(); ctx.moveTo(-s*0.19,s*0.08); ctx.quadraticCurveTo(-s*0.3,s*0.0,-s*0.26,-s*0.1); ctx.stroke();

  // Schildrand
  shield(); ctx.strokeStyle='#111'; ctx.lineWidth=s*0.04; ctx.stroke();

  // Text
  ctx.fillStyle='#e3000f'; ctx.font=`bold ${s*0.15}px system-ui`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('1.FC', 0, -s*0.38);

  ctx.restore();
}

function drawSchalkeCrest(cx, cy, s) {
  ctx.save();
  ctx.translate(cx, cy);

  // Weißer äußerer Ring
  ctx.beginPath(); ctx.arc(0,0,s*0.54,0,Math.PI*2);
  ctx.shadowColor='rgba(0,0,0,0.4)'; ctx.shadowBlur=s*0.1;
  ctx.fillStyle='#fff'; ctx.fill(); ctx.shadowBlur=0;

  // Blauе Fläche
  ctx.beginPath(); ctx.arc(0,0,s*0.5,0,Math.PI*2);
  ctx.fillStyle=SCHALKE.color; ctx.fill();

  // Weißer Innenring
  ctx.beginPath(); ctx.arc(0,0,s*0.41,0,Math.PI*2);
  ctx.strokeStyle='#fff'; ctx.lineWidth=s*0.05; ctx.stroke();

  // Texte
  ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`bold ${s*0.13}px system-ui`;
  ctx.fillText('FC SCHALKE', 0, -s*0.22);
  ctx.font=`bold ${s*0.38}px system-ui`;
  ctx.fillText('04', 0, s*0.07);
  ctx.font=`${s*0.1}px system-ui`;
  ctx.fillText('GELSENKIRCHEN', 0, s*0.3);

  ctx.restore();
}

function drawDFBCrest(cx, cy, s) {
  ctx.save();
  ctx.translate(cx, cy);

  // Schild
  ctx.beginPath();
  ctx.moveTo(-s*0.5, -s*0.55);
  ctx.lineTo( s*0.5, -s*0.55);
  ctx.quadraticCurveTo( s*0.55, -s*0.55,  s*0.55, -s*0.38);
  ctx.lineTo( s*0.55,  s*0.12);
  ctx.quadraticCurveTo( s*0.55,  s*0.38,  0,       s*0.6);
  ctx.quadraticCurveTo(-s*0.55,  s*0.38, -s*0.55,  s*0.12);
  ctx.lineTo(-s*0.55, -s*0.38);
  ctx.quadraticCurveTo(-s*0.55, -s*0.55, -s*0.5, -s*0.55);
  ctx.closePath();
  ctx.shadowColor='rgba(0,0,0,0.5)'; ctx.shadowBlur=s*0.12;
  ctx.fillStyle='#fff'; ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle='#111'; ctx.lineWidth=s*0.04; ctx.stroke();

  // Adler — schwarze Silhouette
  ctx.fillStyle='#111';

  // Linker Flügel
  ctx.beginPath();
  ctx.moveTo(-s*0.06, -s*0.08);
  ctx.bezierCurveTo(-s*0.18, -s*0.32, -s*0.46, -s*0.26, -s*0.48, -s*0.04);
  ctx.lineTo(-s*0.41,  s*0.04);
  ctx.lineTo(-s*0.34, -s*0.02);
  ctx.lineTo(-s*0.27,  s*0.05);
  ctx.lineTo(-s*0.19,  0);
  ctx.lineTo(-s*0.12,  s*0.07);
  ctx.closePath();
  ctx.fill();

  // Rechter Flügel
  ctx.beginPath();
  ctx.moveTo( s*0.06, -s*0.08);
  ctx.bezierCurveTo( s*0.18, -s*0.32,  s*0.46, -s*0.26,  s*0.48, -s*0.04);
  ctx.lineTo( s*0.41,  s*0.04);
  ctx.lineTo( s*0.34, -s*0.02);
  ctx.lineTo( s*0.27,  s*0.05);
  ctx.lineTo( s*0.19,  0);
  ctx.lineTo( s*0.12,  s*0.07);
  ctx.closePath();
  ctx.fill();

  // Körper
  ctx.beginPath();
  ctx.ellipse(0, s*0.1, s*0.11, s*0.2, 0, 0, Math.PI*2);
  ctx.fill();

  // Schwanz
  ctx.beginPath();
  ctx.moveTo(-s*0.1, s*0.27);
  ctx.lineTo( s*0.1, s*0.27);
  ctx.lineTo( s*0.14, s*0.4);
  ctx.lineTo(-s*0.14, s*0.4);
  ctx.closePath();
  ctx.fill();

  // Kopf (schaut nach rechts)
  ctx.beginPath();
  ctx.arc(s*0.07, -s*0.22, s*0.12, 0, Math.PI*2);
  ctx.fill();

  // Schnabel
  ctx.beginPath();
  ctx.moveTo(s*0.17, -s*0.24);
  ctx.lineTo(s*0.32, -s*0.2);
  ctx.lineTo(s*0.17, -s*0.14);
  ctx.closePath();
  ctx.fill();

  // Auge (weiß)
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.arc(s*0.11, -s*0.25, s*0.035, 0, Math.PI*2);
  ctx.fill();

  // DFB Schriftzug
  ctx.fillStyle='#111';
  ctx.font=`bold ${s*0.2}px system-ui`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('DFB', 0, s*0.5);

  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawField() {
  const w = W(), h = H();

  // Grüner Rasen mit Streifen (von oben nach unten)
  const stripeH = h / 8;
  for (let i = 0; i < 8; i++) {
    ctx.fillStyle = i % 2 === 0 ? '#2e8b2e' : '#34a034';
    ctx.fillRect(0, i * stripeH, w, stripeH);
  }

  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 3;

  // Außenlinien
  const padX = w * 0.04;
  const padY = h * 0.06;
  ctx.strokeRect(padX, padY, w - padX * 2, h - padY * 2);

  // Mittellinie (senkrecht)
  ctx.beginPath();
  ctx.moveTo(w / 2, padY);
  ctx.lineTo(w / 2, h - padY);
  ctx.stroke();

  // Mittelkreis
  ctx.beginPath();
  ctx.arc(w / 2, h / 2, h * 0.12, 0, Math.PI * 2);
  ctx.stroke();

  // Mittelpunkt
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.arc(w / 2, h / 2, 5, 0, Math.PI * 2);
  ctx.fill();

  const goalH = h * 0.35;
  const goalY = (h - goalH) / 2;

  // Strafraum links
  const penW = w * 0.18;
  const penH = h * 0.6;
  const penY = (h - penH) / 2;
  ctx.strokeRect(padX, penY, penW, penH);

  // Torraum links
  ctx.strokeRect(padX, goalY, w * 0.08, goalH);

  // Strafraum rechts
  ctx.strokeRect(w - padX - penW, penY, penW, penH);

  // Torraum rechts
  ctx.strokeRect(w - padX - w * 0.08, goalY, w * 0.08, goalH);

  // Elfmeterpunkt links
  ctx.beginPath();
  ctx.arc(padX + h * 0.12, h / 2, 5, 0, Math.PI * 2);
  ctx.fill();

  // Elfmeterpunkt rechts
  ctx.beginPath();
  ctx.arc(w - padX - h * 0.12, h / 2, 5, 0, Math.PI * 2);
  ctx.fill();

  // Tor-Hintergrund links + rechts
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(0, goalY, padX, goalH);
  ctx.fillRect(w - padX, goalY, padX, goalH);
}

// x, y = Ecke des Tornetzes; goalW = Tiefe ins Aus; goalH = Breite des Tors; facingRight = Tor öffnet nach rechts
function drawGoal(x, y, goalW, goalH, facingRight) {
  const postR = 5;

  // Netz (Gitterlinien)
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 1;
  const cols = 4, rows = 8;
  const cellW = goalW / cols;
  const cellH = goalH / rows;
  for (let i = 0; i <= cols; i++) {
    ctx.beginPath();
    ctx.moveTo(x + i * cellW, y);
    ctx.lineTo(x + i * cellW, y + goalH);
    ctx.stroke();
  }
  for (let j = 0; j <= rows; j++) {
    ctx.beginPath();
    ctx.moveTo(x, y + j * cellH);
    ctx.lineTo(x + goalW, y + j * cellH);
    ctx.stroke();
  }
  ctx.restore();

  // Pfosten (weiß, dick)
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = postR * 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Torpfosten oben
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + goalW, y);
  ctx.stroke();

  // Torpfosten unten
  ctx.beginPath();
  ctx.moveTo(x, y + goalH);
  ctx.lineTo(x + goalW, y + goalH);
  ctx.stroke();

  // Querbalken (die Linie zur Spielfeldseite)
  const qx = facingRight ? x : x + goalW;
  ctx.beginPath();
  ctx.moveTo(qx, y);
  ctx.lineTo(qx, y + goalH);
  ctx.stroke();

  // Glow
  ctx.shadowColor = 'rgba(255,255,255,0.6)';
  ctx.shadowBlur = 8;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x, y); ctx.lineTo(x + goalW, y);
  ctx.moveTo(x, y + goalH); ctx.lineTo(x + goalW, y + goalH);
  ctx.moveTo(qx, y); ctx.lineTo(qx, y + goalH);
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function drawBall(x, y, r) {
  // Schatten
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(x + 3, y + 4, r * 0.9, r * 0.45, 0, 0, Math.PI * 2);
  ctx.fill();

  // Ball bunt
  const grad = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.05, x, y, r);
  grad.addColorStop(0, '#ff6b6b');
  grad.addColorStop(0.4, '#feca57');
  grad.addColorStop(0.75, '#48dbfb');
  grad.addColorStop(1, '#a29bfe');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();

  // Bunte Flecken
  const patches = [
    [0, 0,       '#ff4757'],
    [0.45, -0.35, '#2ed573'],
    [-0.45, -0.35,'#ffa502'],
    [0.5, 0.25,  '#1e90ff'],
    [-0.5, 0.25, '#ff6b81'],
  ];
  for (const [dx, dy, color] of patches) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x + dx * r, y + dy * r, r * 0.22, 0, Math.PI * 2);
    ctx.fill();
  }

  // Glanzpunkt
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath();
  ctx.ellipse(x - r * 0.28, y - r * 0.3, r * 0.22, r * 0.14, -0.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawPlayer(x, y, size, color, label, celebrate=false) {
  ctx.save();

  // Jubel: hüpfen
  const bounce = celebrate ? Math.abs(Math.sin(Date.now()*0.01)) * size * 0.5 : 0;
  y -= bounce;

  // Schatten (kleiner beim Hüpfen)
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  const shadowScale = celebrate ? Math.max(0.3, 1 - bounce/size) : 1;
  ctx.ellipse(x + 2, y + size * 1.7 + bounce + 3, size * 0.6 * shadowScale, size * 0.15 * shadowScale, 0, 0, Math.PI * 2);
  ctx.fill();

  // Beine
  ctx.strokeStyle = '#333';
  ctx.lineWidth = size * 0.22;
  ctx.lineCap = 'round';
  if (celebrate) {
    // Beine angewinkelt beim Jubel
    ctx.beginPath();
    ctx.moveTo(x - size * 0.18, y + size * 0.9);
    ctx.lineTo(x - size * 0.35, y + size * 1.4);
    ctx.lineTo(x - size * 0.15, y + size * 1.7);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + size * 0.18, y + size * 0.9);
    ctx.lineTo(x + size * 0.35, y + size * 1.4);
    ctx.lineTo(x + size * 0.15, y + size * 1.7);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(x - size * 0.18, y + size * 0.9);
    ctx.lineTo(x - size * 0.28, y + size * 1.7);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + size * 0.18, y + size * 0.9);
    ctx.lineTo(x + size * 0.28, y + size * 1.7);
    ctx.stroke();
  }

  // Schuhe
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.ellipse(x - size * 0.3, y + size * 1.75, size * 0.22, size * 0.12, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x + size * 0.3, y + size * 1.75, size * 0.22, size * 0.12, 0.3, 0, Math.PI * 2);
  ctx.fill();

  // Körper (Trikot)
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(x, y + size * 0.55, size * 0.42, size * 0.48, 0, 0, Math.PI * 2);
  ctx.fill();

  // Arme — beim Jubel hoch gestreckt in V-Form
  ctx.strokeStyle = color;
  ctx.lineWidth = size * 0.2;
  ctx.lineCap = 'round';
  if (celebrate) {
    const wave = Math.sin(Date.now()*0.008) * size * 0.15;
    ctx.beginPath();
    ctx.moveTo(x - size * 0.38, y + size * 0.3);
    ctx.lineTo(x - size * 0.75, y - size * 0.45 + wave);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + size * 0.38, y + size * 0.3);
    ctx.lineTo(x + size * 0.75, y - size * 0.45 - wave);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(x - size * 0.38, y + size * 0.3);
    ctx.lineTo(x - size * 0.65, y + size * 0.85);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + size * 0.38, y + size * 0.3);
    ctx.lineTo(x + size * 0.65, y + size * 0.85);
    ctx.stroke();
  }

  // Kopf
  const headGrad = ctx.createRadialGradient(x - size * 0.1, y - size * 0.15, size * 0.05, x, y, size * 0.38);
  headGrad.addColorStop(0, '#ffe0b2');
  headGrad.addColorStop(1, '#d4956a');
  ctx.fillStyle = headGrad;
  ctx.beginPath();
  ctx.arc(x, y, size * 0.38, 0, Math.PI * 2);
  ctx.fill();

  // Haare
  ctx.fillStyle = '#4a2800';
  ctx.beginPath();
  ctx.ellipse(x, y - size * 0.22, size * 0.35, size * 0.18, 0, Math.PI, Math.PI * 2);
  ctx.fill();

  // Augen — beim Jubel geschlossen (Bogen)
  if (celebrate) {
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = size * 0.06;
    ctx.beginPath();
    ctx.arc(x - size * 0.13, y - size * 0.04, size * 0.09, Math.PI, 0);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x + size * 0.13, y - size * 0.04, size * 0.09, Math.PI, 0);
    ctx.stroke();
  } else {
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(x - size * 0.13, y - size * 0.04, size * 0.09, size * 0.1, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x + size * 0.13, y - size * 0.04, size * 0.09, size * 0.1, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.arc(x - size * 0.11, y - size * 0.04, size * 0.055, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + size * 0.15, y - size * 0.04, size * 0.055, 0, Math.PI * 2);
    ctx.fill();
  }

  // Mund — beim Jubel breites offenes Lachen
  ctx.strokeStyle = '#a0522d';
  ctx.lineWidth = size * 0.06;
  ctx.lineCap = 'round';
  if (celebrate) {
    ctx.beginPath();
    ctx.arc(x, y + size * 0.1, size * 0.22, 0.05, Math.PI - 0.05);
    ctx.stroke();
    // Zähne
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(x, y + size * 0.18, size * 0.14, 0, Math.PI);
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.arc(x, y + size * 0.1, size * 0.15, 0.2, Math.PI - 0.2);
    ctx.stroke();
  }

  // Nummer / Label auf Trikot
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.font = `bold ${size * 0.35}px system-ui`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, x, y + size * 0.55);

  ctx.restore();
}

// ── Spiellogik ──────────────────────────────────────────────────────
const SPEED       = 0.004;
const AI_SPEED    = 0.0014;
const BALL_FRIC   = 0.92;
const KICK_SPD    = 0.022;
const PASS_SPD    = 0.014;
const TACKLE_DIST = 0.1;
const PICKUP_DIST = 0.055;
const FL = 0.04, FR = 0.96, FT = 0.06, FB = 0.94; // Spielfeld Grenzen
const GOAL_T = 0.325, GOAL_B = 0.675;              // Tor oben/unten (normiert)

let redP  = { x:0.28, y:0.5,  vx:0, vy:0, team:'red',  num:'7',  name:'Lucas' };
let redP2 = { x:0.18, y:0.32, vx:0, vy:0, team:'red',  num:'10' };
let redP3 = { x:0.18, y:0.68, vx:0, vy:0, team:'red',  num:'11' };
let blueP  = { x:0.72, y:0.5,  vx:0, vy:0, team:'blue', num:'9'  };
let blueP2 = { x:0.82, y:0.32, vx:0, vy:0, team:'blue', num:'3'  };
let blueP3 = { x:0.82, y:0.68, vx:0, vy:0, team:'blue', num:'4'  };
const redTeam   = [redP, redP2, redP3];
const blueTeam  = [blueP, blueP2, blueP3];
const allPlayers = [...redTeam, ...blueTeam];
const KOELN   = { name: '1. FC Köln',  short: 'KÖL', color: '#e3000f', light: '#ff3a3a' };
const SCHALKE = { name: 'Schalke 04', short: 'S04', color: '#004c9f', light: '#1a6cc8' };

let ball  = { x: 0.5, y: 0.5, vx: 0, vy: 0 };
let ballOwner = redP;
let score = { red: 0, blue: 0 };
let goalTeam = '';
let gameState = 'menu';
let playerTeam = 'red'; // welches Team der Spieler steuert
let teamChosen = false; // true wenn Team gewählt aber noch nicht gestartet
let controlledIdx = 0;  // Index im eigenen Team (0/1/2)

function getCP() {
  const t = playerTeam === 'red' ? redTeam : blueTeam;
  return t[controlledIdx];
}

function switchPlayer() {
  const t = playerTeam === 'red' ? redTeam : blueTeam;
  // Wechsel zum Spieler der dem Ball am nächsten ist (außer dem aktuellen)
  let best = (controlledIdx + 1) % t.length;
  let bestDist = Infinity;
  for (let i = 0; i < t.length; i++) {
    if (i === controlledIdx) continue;
    const d = Math.hypot(t[i].x - ball.x, t[i].y - ball.y);
    if (d < bestDist) { bestDist = d; best = i; }
  }
  controlledIdx = best;
}

function resetPositions() {
  redP.x=0.28;  redP.y=0.5;  redP.vx=0;  redP.vy=0;
  redP2.x=0.18; redP2.y=0.32;redP2.vx=0; redP2.vy=0;
  redP3.x=0.18; redP3.y=0.68;redP3.vx=0; redP3.vy=0;
  blueP.x=0.72; blueP.y=0.5; blueP.vx=0; blueP.vy=0;
  blueP2.x=0.82;blueP2.y=0.32;blueP2.vx=0;blueP2.vy=0;
  blueP3.x=0.82;blueP3.y=0.68;blueP3.vx=0;blueP3.vy=0;
  ball.x=0.5; ball.y=0.5; ball.vx=0; ball.vy=0;
  controlledIdx = 0;
  ballOwner = getCP();
}

// ── Aktionen ────────────────────────────────────────────────────────
function doShoot() {
  const cp = getCP();
  if (ballOwner !== cp) return;
  const goalX = playerTeam === 'red' ? FR : FL;
  const dy=0.5-ball.y, dx=goalX-ball.x, len=Math.sqrt(dx*dx+dy*dy)||1;
  ball.vx=(dx/len)*KICK_SPD; ball.vy=(dy/len)*KICK_SPD+(Math.random()-0.5)*0.006;
  ballOwner=null;
}

function doPass() {
  const cp = getCP();
  if (ballOwner !== cp) return;
  const fwd = playerTeam === 'red' ? PASS_SPD : -PASS_SPD;
  let dx=cp.vx||fwd, dy=cp.vy||0;
  const len=Math.sqrt(dx*dx+dy*dy)||1;
  ball.vx=(dx/len)*PASS_SPD; ball.vy=(dy/len)*PASS_SPD;
  ballOwner=null;
}

function doTackle() {
  const cp = getCP();
  const opponents = playerTeam === 'red' ? blueTeam : redTeam;
  for (const op of opponents) {
    if (ballOwner !== op) continue;
    if (Math.hypot(cp.x-op.x, cp.y-op.y) < TACKLE_DIST) { ballOwner=cp; break; }
  }
}

// ── Eingabe ─────────────────────────────────────────────────────────
const dpad      = { up:false, down:false, left:false, right:false };
const btnActive = { shoot:false, pass:false, tackle:false, switch:false };
const touched   = {};

function getDpad() {
  const w=W(), h=H(), s=Math.min(w,h)*0.12;
  const g = s*0.15, margin = w*0.06;
  const cx = margin + s*1.5 + g;
  const cy = h - s*2.8;
  return {
    up:    {x:cx,     y:cy-s-g, s},
    down:  {x:cx,     y:cy+s+g, s},
    left:  {x:cx-s-g, y:cy,     s},
    right: {x:cx+s+g, y:cy,     s},
  };
}

function getActionBtns() {
  const w=W(), h=H(), r=Math.min(w,h)*0.08;
  const g=r*0.3, margin=w*0.06;
  const rx = w - margin - r - g;   // rechte Spalte
  const lx = rx - r*2 - g;         // linke Spalte
  const by = h - r - margin*0.8;   // untere Reihe
  const ty = by - r*2 - g;         // obere Reihe
  return {
    shoot:  {x:rx, y:by, r},   // unten rechts
    pass:   {x:lx, y:by, r},   // unten links
    tackle: {x:rx, y:ty, r},   // oben rechts
    switch: {x:lx, y:ty, r},   // oben links
  };
}

function hitDpad(tx,ty,b) { return Math.abs(tx-b.x)<b.s*0.6 && Math.abs(ty-b.y)<b.s*0.6; }
function hitBtn(tx,ty,b)  { const dx=tx-b.x,dy=ty-b.y; return dx*dx+dy*dy<b.r*b.r*1.8; }

function menuButtonHit(tx, ty) {
  const w=W(), h=H(), bw=w*0.55, bh=h*0.1, bx=w/2-bw/2;
  const col=w*0.27, bw2=w*0.4, bh2=h*0.09;
  // Köln
  if (tx>=w/2-col-bw2/2 && tx<=w/2-col+bw2/2 && ty>=h*0.69 && ty<=h*0.69+bh2) { playerTeam='red';  teamChosen=true; return true; }
  // Schalke
  if (tx>=w/2+col-bw2/2 && tx<=w/2+col+bw2/2 && ty>=h*0.69 && ty<=h*0.69+bh2) { playerTeam='blue'; teamChosen=true; return true; }
  // Jetzt starten
  const sbw=w*0.55;
  if (teamChosen && ty>=h*0.81 && ty<=h*0.81+bh2 && tx>=w/2-sbw/2 && tx<=w/2+sbw/2) {
    controlledIdx=0; ballOwner=playerTeam==='red'?redP:blueP;
    gameState='playing'; teamChosen=false; return true;
  }
  return false;
}

function onTouchStart(tx,ty,id) {
  if (gameState === 'menu') { if (!menuButtonHit(tx,ty)) menuButtonHit(tx,ty); return; }
  if (gameState === 'goal') { gameState = 'playing'; return; }
  const ab=getActionBtns(), dp=getDpad();
  if (hitBtn(tx,ty,ab.shoot))  { btnActive.shoot=true;  touched[id]='shoot';  doShoot();       return; }
  if (hitBtn(tx,ty,ab.pass))   { btnActive.pass=true;   touched[id]='pass';   doPass();        return; }
  if (hitBtn(tx,ty,ab.tackle)) { btnActive.tackle=true; touched[id]='tackle'; doTackle();      return; }
  if (hitBtn(tx,ty,ab.switch)) { btnActive.switch=true; touched[id]='switch'; switchPlayer();  return; }
  for (const dir of ['up','down','left','right']) {
    if (hitDpad(tx,ty,dp[dir])) { dpad[dir]=true; touched[id]=dir; return; }
  }
}

function onTouchEnd(id) {
  const what=touched[id]; if(!what) return;
  if (['shoot','pass','tackle','switch'].includes(what)) btnActive[what]=false;
  else dpad[what]=false;
  delete touched[id];
}

canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  for(const t of e.changedTouches) onTouchStart(t.clientX,t.clientY,t.identifier);
},{passive:false});

canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
  const dp=getDpad();
  for(const t of e.changedTouches){
    const what=touched[t.identifier];
    if(what==='up'||what==='down'||what==='left'||what==='right'){
      dpad[what]=false;
      for(const dir of ['up','down','left','right']){
        if(hitDpad(t.clientX,t.clientY,dp[dir])){ dpad[dir]=true; touched[t.identifier]=dir; break; }
      }
    }
  }
},{passive:false});

canvas.addEventListener('touchend',    e=>{e.preventDefault(); for(const t of e.changedTouches) onTouchEnd(t.identifier);},{passive:false});
canvas.addEventListener('touchcancel', e=>{                    for(const t of e.changedTouches) onTouchEnd(t.identifier);},{passive:false});

// Tastatur
const keys={};
window.addEventListener('keydown', e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  if (gameState === 'menu') {
    if (e.key==='r'||e.key==='R') { playerTeam='red';  teamChosen=true; }
    if (e.key==='b'||e.key==='B') { playerTeam='blue'; teamChosen=true; }
    if ((e.key==='Enter'||e.key===' ') && teamChosen) {
      controlledIdx=0; ballOwner=playerTeam==='red'?redP:blueP;
      gameState='playing'; teamChosen=false;
    }
    return;
  }
  if (gameState === 'goal') { gameState = 'playing'; return; }
  keys[e.key]=true;
});
window.addEventListener('keyup', e=>{ keys[e.key]=false; });

// ── KI Gegner ───────────────────────────────────────────────────────
let aiShootCooldown = 0;

function moveTo(p, tx, ty, spd) {
  const dx=tx-p.x, dy=ty-p.y, len=Math.sqrt(dx*dx+dy*dy)||1;
  p.vx=dx/len*spd; p.vy=dy/len*spd;
  p.x=Math.max(FL,Math.min(FR,p.x+p.vx));
  p.y=Math.max(FT,Math.min(FB,p.y+p.vy));
}

function updateAI() {
  aiShootCooldown--;
  const myTeam  = playerTeam === 'red' ? redTeam  : blueTeam;
  const foeTeam = playerTeam === 'red' ? blueTeam : redTeam;
  const cp       = getCP();
  const foeGoalX = playerTeam === 'red' ? FL : FR;
  const myGoalX  = playerTeam === 'red' ? FR : FL;
  const foeClose = playerTeam === 'red' ? (p => p.x < 0.38) : (p => p.x > 0.62);
  const myClose  = playerTeam === 'red' ? (p => p.x > 0.65) : (p => p.x < 0.35);

  // ── Gegnerisches Team (alle KI) ──
  const foeSupY = [0.5, 0.3, 0.7];
  for (let i=0; i<foeTeam.length; i++) {
    const fp = foeTeam[i];
    const sx = foeGoalX + (playerTeam==='red' ? 0.06 : -0.06);
    if (ballOwner===fp) {
      if (foeClose(fp) && aiShootCooldown<=0) {
        const dx=foeGoalX-fp.x, dy=0.5-fp.y, len=Math.hypot(dx,dy)||1;
        ball.vx=(dx/len)*KICK_SPD; ball.vy=(dy/len)*KICK_SPD+(Math.random()-0.5)*0.01;
        ballOwner=null; aiShootCooldown=70;
      } else { moveTo(fp, sx, foeSupY[i], AI_SPEED); }
    } else if (ballOwner && ballOwner.team===playerTeam) {
      moveTo(fp, ballOwner.x, ballOwner.y, AI_SPEED);
      if (Math.hypot(fp.x-ballOwner.x,fp.y-ballOwner.y)<TACKLE_DIST*0.8 && Math.random()<0.012) ballOwner=fp;
    } else if (!ballOwner) {
      moveTo(fp, ball.x, ball.y, AI_SPEED);
    } else {
      moveTo(fp, sx, foeSupY[i], AI_SPEED*0.65);
    }
  }

  // ── Eigene Mitspieler (KI, nicht der gesteuerte Spieler) ──
  const teammates = myTeam.filter(p => p !== cp);
  const mySupY = [0.28, 0.72];
  const mySuppX = playerTeam==='red' ? 0.38 : 0.62;
  for (let i=0; i<teammates.length; i++) {
    const rp = teammates[i];
    if (ballOwner===rp) {
      if (myClose(rp) && aiShootCooldown<=0) {
        const dx=myGoalX-ball.x, dy=0.5-ball.y, len=Math.hypot(dx,dy)||1;
        ball.vx=(dx/len)*KICK_SPD; ball.vy=(dy/len)*KICK_SPD;
        ballOwner=null; aiShootCooldown=60;
      } else {
        const dx=cp.x-rp.x, dy=cp.y-rp.y, len=Math.hypot(dx,dy)||1;
        ball.vx=(dx/len)*PASS_SPD; ball.vy=(dy/len)*PASS_SPD;
        ballOwner=null;
      }
    } else if (!ballOwner) {
      moveTo(rp, ball.x, ball.y, AI_SPEED*0.8);
    } else if (ballOwner && ballOwner.team!==playerTeam) {
      moveTo(rp, ballOwner.x, ballOwner.y, AI_SPEED*0.8);
    } else {
      moveTo(rp, mySuppX, mySupY[i], AI_SPEED*0.65);
    }
  }
}

// ── Update ──────────────────────────────────────────────────────────
function update() {
  if (gameState !== 'playing') return;

  // Spieler bewegen
  const cp = getCP();
  let mvx = 0, mvy = 0;
  if (dpad.left  || keys['ArrowLeft']  || keys['a']) mvx -= 1;
  if (dpad.right || keys['ArrowRight'] || keys['d']) mvx += 1;
  if (dpad.up    || keys['ArrowUp']    || keys['w']) mvy -= 1;
  if (dpad.down  || keys['ArrowDown']  || keys['s']) mvy += 1;
  if (keys[' ']||keys['Enter']) { doShoot();      keys[' ']=false; keys['Enter']=false; }
  if (keys['f']||keys['p'])     { doPass();       keys['f']=false; keys['p']=false; }
  if (keys['t']||keys['g'])     { doTackle();     keys['t']=false; keys['g']=false; }
  if (keys['x']||keys['Tab'])   { switchPlayer(); keys['x']=false; keys['Tab']=false; }

  const mlen=Math.sqrt(mvx*mvx+mvy*mvy)||1;
  const spd=Math.min(Math.sqrt(mvx*mvx+mvy*mvy),1)*SPEED;
  cp.vx=mvx/mlen*spd; cp.vy=mvy/mlen*spd;
  cp.x=Math.max(FL,Math.min(FR,cp.x+cp.vx));
  cp.y=Math.max(FT,Math.min(FB,cp.y+cp.vy));

  updateAI();

  // Ball
  if (ballOwner) {
    const side = ballOwner.team==='red' ? 1 : -1;
    ball.x=ballOwner.x+side*0.045; ball.y=ballOwner.y+0.055;
  } else {
    ball.x+=ball.vx; ball.y+=ball.vy;
    ball.vx*=BALL_FRIC; ball.vy*=BALL_FRIC;
    if (ball.y<FT) { ball.y=FT; ball.vy*=-0.7; }
    if (ball.y>FB) { ball.y=FB; ball.vy*=-0.7; }
    if (ball.x<FL) {
      if (ball.y>GOAL_T && ball.y<GOAL_B) { score.blue++; goalTeam='blue'; gameState='goal'; resetPositions(); return; }
      ball.x=FL; ball.vx*=-0.7;
    }
    if (ball.x>FR) {
      if (ball.y>GOAL_T && ball.y<GOAL_B) { score.red++; goalTeam='red'; gameState='goal'; resetPositions(); return; }
      ball.x=FR; ball.vx*=-0.7;
    }
    for (const p of allPlayers) {
      if (Math.hypot(p.x-ball.x, p.y-ball.y)<PICKUP_DIST) { ballOwner=p; break; }
    }
  }
}

// ── UI ──────────────────────────────────────────────────────────────
function drawUI() {
  const w=W(), h=H();

  // Ergebnis oben
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.55)';
  roundRect(w/2-110,5,220,42,21);
  ctx.fill();
  ctx.font='bold 13px system-ui';
  ctx.textBaseline='middle';
  ctx.fillStyle=KOELN.light;   ctx.textAlign='right';  ctx.fillText(KOELN.short,  w/2-38, 18);
  ctx.fillStyle=SCHALKE.light; ctx.textAlign='left';   ctx.fillText(SCHALKE.short,w/2+38, 18);
  ctx.font='bold 26px system-ui';
  ctx.fillStyle=KOELN.light;   ctx.textAlign='right';  ctx.fillText(score.red,  w/2-14, 34);
  ctx.fillStyle='#fff';        ctx.textAlign='center'; ctx.fillText(':',        w/2,    34);
  ctx.fillStyle=SCHALKE.light; ctx.textAlign='left';   ctx.fillText(score.blue, w/2+14, 34);
  ctx.restore();

  // D-Pad zeichnen
  const dp=getDpad(), arrows={up:'▲',down:'▼',left:'◀',right:'▶'};
  for(const dir of ['up','down','left','right']){
    const b=dp[dir], pressed=dpad[dir];
    ctx.save();
    ctx.fillStyle=pressed?'rgba(255,255,255,0.9)':'rgba(0,0,0,0.5)';
    roundRect(b.x-b.s/2, b.y-b.s/2, b.s, b.s, b.s*0.2);
    ctx.fill();
    ctx.strokeStyle=pressed?'#fff':'rgba(255,255,255,0.7)';
    ctx.lineWidth=3; ctx.stroke();
    ctx.fillStyle=pressed?'#222':'#fff';
    ctx.font=`bold ${b.s*0.52}px system-ui`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(arrows[dir], b.x, b.y);
    ctx.restore();
  }

  // Aktions-Buttons
  // Pfeil über dem kontrollierten Spieler
  const cp2 = getCP();
  const pulse = Math.abs(Math.sin(Date.now()*0.006));
  ctx.save();
  ctx.fillStyle = `rgba(255,230,0,${0.6+pulse*0.4})`;
  ctx.font = `bold ${Math.min(w,h)*0.045}px system-ui`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('▼', cp2.x*w, cp2.y*h - Math.min(w,h)*0.12 - pulse*4);
  ctx.restore();

  const bs=getActionBtns();
  const infos={
    shoot:  {emoji:'⚽', label:'Schuss',    color:'#c0392b'},
    pass:   {emoji:'→',  label:'Passen',   color:'#d35400'},
    tackle: {emoji:'💪', label:'Zweikampf', color:'#27ae60'},
    switch: {emoji:'🔄', label:'Wechsel',   color:'#7d3c98'},
  };
  for (const [k,b] of Object.entries(bs)) {
    if(!b) continue;
    const inf=infos[k], pressed=btnActive[k];
    ctx.save();
    ctx.globalAlpha=pressed?0.97:0.78;
    ctx.fillStyle=inf.color;
    ctx.shadowColor=inf.color; ctx.shadowBlur=pressed?18:6;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r*(pressed?1.08:1),0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=2.5;
    ctx.stroke();
    ctx.globalAlpha=1;
    ctx.font=`${b.r*0.72}px system-ui`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(inf.emoji, b.x, b.y-b.r*0.12);
    ctx.font=`bold ${b.r*0.29}px system-ui`;
    ctx.fillStyle='#fff';
    ctx.fillText(inf.label, b.x, b.y+b.r*0.58);
    ctx.restore();
  }

  // Hauptmenü mit Teamauswahl
  if (gameState === 'menu') {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, w, h);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    // DFB Wappen
    const crestSize = Math.min(w, h) * 0.16;
    drawDFBCrest(w/2, h*0.17, crestSize);

    // Titel
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.min(w*0.11, 48)}px system-ui`;
    ctx.shadowColor = '#27ae60'; ctx.shadowBlur = 25;
    ctx.fillText('⚽ FUSSBALL', w/2, h*0.35);
    ctx.shadowBlur = 0;

    ctx.font = `bold ${Math.min(w*0.05, 22)}px system-ui`;
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillText('Wählt euer Team:', w/2, h*0.43);

    // Zwei Spalten mit Wappen + Buttons
    const col=w*0.27, crestS=Math.min(w,h)*0.13;
    const bw=w*0.4, bh=h*0.09;

    drawKoelnCrest(  w/2-col, h*0.55, crestS);
    drawSchalkeCrest(w/2+col, h*0.55, crestS);

    const redChosen  = teamChosen && playerTeam==='red';
    const blueChosen = teamChosen && playerTeam==='blue';
    ctx.font=`bold ${Math.min(w*0.052,21)}px system-ui`;

    // Köln-Button
    ctx.fillStyle=redChosen?KOELN.light:KOELN.color;
    ctx.shadowColor=redChosen?KOELN.light:'transparent'; ctx.shadowBlur=redChosen?18:0;
    roundRect(w/2-col-bw/2, h*0.69, bw, bh, bh*0.3); ctx.fill(); ctx.shadowBlur=0;
    ctx.strokeStyle=redChosen?'#fff':'rgba(255,255,255,0.5)'; ctx.lineWidth=redChosen?3:2; ctx.stroke();
    ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(redChosen?'✅ Köln':'1. FC Köln', w/2-col, h*0.69+bh/2);

    // Schalke-Button
    ctx.fillStyle=blueChosen?SCHALKE.light:SCHALKE.color;
    ctx.shadowColor=blueChosen?SCHALKE.light:'transparent'; ctx.shadowBlur=blueChosen?18:0;
    roundRect(w/2+col-bw/2, h*0.69, bw, bh, bh*0.3); ctx.fill(); ctx.shadowBlur=0;
    ctx.strokeStyle=blueChosen?'#fff':'rgba(255,255,255,0.5)'; ctx.lineWidth=blueChosen?3:2; ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.fillText(blueChosen?'✅ S04':'Schalke 04', w/2+col, h*0.69+bh/2);

    // Jetzt starten
    if (teamChosen) {
      const sbw=w*0.55, sby=h*0.81;
      ctx.fillStyle='#27ae60'; ctx.shadowColor='#27ae60'; ctx.shadowBlur=20;
      roundRect(w/2-sbw/2, sby, sbw, bh, bh*0.3); ctx.fill(); ctx.shadowBlur=0;
      ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.stroke();
      ctx.fillStyle='#fff'; ctx.font=`bold ${Math.min(w*0.058,23)}px system-ui`;
      ctx.fillText('▶  Jetzt starten!', w/2, sby+bh/2);
    }

    ctx.restore();
    return;
  }

  // Tor-Bildschirm
  if (gameState === 'goal') {
    const team = goalTeam==='red' ? KOELN : SCHALKE;
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,w,h);
    ctx.fillStyle=team.light;
    ctx.font=`bold ${Math.min(w*0.18,90)}px system-ui`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowColor=team.light; ctx.shadowBlur=40;
    ctx.fillText('TOR! ⚽', w/2, h*0.38);
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff';
    ctx.font=`bold ${Math.min(w*0.06,26)}px system-ui`;
    ctx.fillText(`Tor für ${team.name}!`, w/2, h*0.52);
    const blink = Math.sin(Date.now()*0.004) > 0;
    if (blink) {
      ctx.fillStyle='#feca57';
      ctx.font=`bold ${Math.min(w*0.05,22)}px system-ui`;
      ctx.fillText('Drückt eine Taste zum Weiterspielen', w/2, h*0.63);
    }
    ctx.restore();
  }
}

// ── Schleife ────────────────────────────────────────────────────────
function loop() {
  if (resizeFrames < 60) { resize(); resizeFrames++; }
  const w=W(), h=H();
  ctx.clearRect(0,0,w,h);
  drawField();

  const goalH=h*0.35, goalY=(h-goalH)/2, padX=w*0.04;
  drawGoal(0,       goalY, padX, goalH, true);
  drawGoal(w-padX,  goalY, padX, goalH, false);

  update();

  const ps=Math.min(w,h)*0.07;
  for (const p of allPlayers) {
    const club = p.team==='red' ? KOELN : SCHALKE;
    const cel = gameState==='goal' && goalTeam===p.team;
    const px=p.x*w, py=p.y*h-ps*1.5;
    drawPlayer(px, py, ps, club.color, p.num, cel);
    if (p.name) {
      ctx.save();
      ctx.fillStyle='rgba(0,0,0,0.55)';
      const nameW=ctx.measureText(p.name).width+8;
      roundRect(px-nameW/2, py+ps*2.0, nameW, ps*0.42, ps*0.1);
      ctx.font=`bold ${ps*0.3}px system-ui`;
      ctx.measureText(p.name); // ensure font set before measure
      ctx.fill();
      ctx.fillStyle='#fff';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(p.name, px, py+ps*2.21);
      ctx.restore();
    }
  }

  const ballR=Math.min(w,h)*0.022;
  drawBall(ball.x*w, ball.y*h, ballR);

  drawUI();
  requestAnimationFrame(loop);
}

loop();
</script>
